# Race registry overlay for the 2026 general election.
#
# The SOS feed supplies every contest, candidate and party; this file adds what the feed does not know: the
# firm report's framing (which races are competitive, which are open seats, the region they belong to, the
# report section their table sits in) and, later, the baselines the dashboard compares against. Keys are the
# short race keys from election/sos.py (us-senate, governor, sd-9, hd-26, cd-15, scotx-chief, ...). Any race the
# feed carries but this file does not mention is still tracked, with defaults.
#
# Sources: Texas General Election Report 2026 (Grey Havens Strategies, Nov 4, 2026 draft) for the competitive
# lists, open seats and regions; Texas SOS ENR for contests and candidates.

defaults:
  track_sections: [Federal, StateWide, Districted]   # feed sections to keep (district judges/DAs are keyed out)

# The `baseline:` figures below were entered from memory on election night as placeholders for the comparison
# view. Verify every one against the SOS canvass (elections.sos.state.tx.us/elchist) before any client sees
# them, then flip this to true. The dashboard shows them as "unverified" until it is.
baselines_verified: false

races:
  # --- federal and statewide -------------------------------------------------------------------------------
  us-senate:
    title: U.S. Senate
    report_section: Federal
    competitive: true
    open_seat: true
    note: Paxton beat Cornyn in the May 26 runoff; Talarico beat Crockett in the March primary. Closest Senate race benchmark is Cruz–O'Rourke 2018 (R+2.6).
    baseline: {"2018": {"R": 50.9, "D": 48.3, "margin": 2.6, "label": "Cruz vs O'Rourke"}, "2024": {"R": 53.1, "D": 44.6, "margin": 8.5, "label": "Cruz vs Allred"}}
  governor:
    title: Governor
    report_section: Statewide
    competitive: true
    note: Abbott seeking a fourth term vs State Rep. Gina Hinojosa. Abbott $148M+ spent Jul 2025–Sep 2026; Hinojosa ~$17.7M.
    baseline: {"2022": {"R": 54.8, "D": 43.8, "margin": 11.0, "label": "Abbott vs O'Rourke"}, "2018": {"R": 55.8, "D": 42.5, "margin": 13.3, "label": "Abbott vs Valdez"}}
  lt-governor:
    title: Lieutenant Governor
    report_section: Statewide
    competitive: true
    note: Patrick seeking a fourth term vs State Rep. Vikki Goodwin. ~$14.5M vs ~$26K in ads as of mid-October.
    baseline: {"2022": {"R": 53.6, "D": 43.4, "margin": 10.2, "label": "Patrick vs Collier"}, "2018": {"R": 51.3, "D": 46.5, "margin": 4.8, "label": "Patrick vs Collier"}}
  comptroller:
    title: Comptroller of Public Accounts
    report_section: Statewide
    competitive: true
    note: Huffines (appointed Aug 2026 after Hancock resigned) vs Sen. Sarah Eckhardt.
    baseline: {"2022": {"R": 56.4, "D": 41.1, "margin": 15.3, "label": "Hegar vs Dudding"}}
  attorney-general:
    title: Attorney General
    report_section: Statewide
    competitive: true
    open_seat: true
    note: Open seat (Paxton ran for Senate). Sen. Mayes Middleton vs Sen. Nathan Johnson.
    baseline: {"2022": {"R": 53.4, "D": 43.7, "margin": 9.7, "label": "Paxton vs Garza"}}
  ag-commissioner:
    title: Commissioner of Agriculture
    report_section: Statewide
    open_seat: true
    note: Open seat; Nate Sheets beat incumbent Sid Miller in the primary. Vs Clayton Tucker.
  railroad-commissioner:
    title: Railroad Commissioner
    report_section: Statewide
    open_seat: true
    note: Bo French beat incumbent Jim Wright in the May runoff. Vs State Rep. Jon Rosenthal.
  land-commissioner:
    title: Land Commissioner
    report_section: Statewide
    note: Buckingham (I) vs Bay City council member Benjamin Flores.
  scotx-chief:
    title: Texas Supreme Court, Chief Justice (Place 1)
    report_section: Statewide
    note: Blacklock (I) vs Maggie Ellis.
  scotx-2:
    title: Texas Supreme Court, Place 2 (unexpired term)
    report_section: Statewide
    note: Sullivan (I, appointed 2025) vs Chari Kelly.
  scotx-7:
    title: Texas Supreme Court, Place 7
    report_section: Statewide
    note: Kyle Hawkins (I, appointed 2025) vs Kristen Hawkins.
  scotx-8:
    title: Texas Supreme Court, Place 8
    report_section: Statewide
    note: Busby (I) vs Gisela Triana.

  # --- Texas Senate (16 of 31 seats) ------------------------------------------------------------------------
