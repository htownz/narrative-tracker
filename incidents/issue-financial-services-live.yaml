# Live issue tracker: financial services policy in Texas — the anti-ESG and anti-boycott laws (energy, firearms), the Comptroller's lists, bank regulation and state banking law, and the Texas Stock Exchange. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-financial-services-live
title: "Banking, ESG and financial regulation, {days} days of posts"
subject: "financial services policy in Texas — the anti-ESG and anti-boycott laws covering energy and firearms, the Comptroller's lists of boycotting firms, state banking and lending law, the Department of Banking, the Texas Stock Exchange and Texas as a financial center, and bank fees and consumer finance rules"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas banking, ESG and financial regulation, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - 'Texas "anti-ESG"'
  - 'Texas Comptroller boycott list'
  - 'Texas banks firearms law'
  - '"Texas Stock Exchange"'
  - 'Texas banking regulation'
  - 'Texas "SB 13" OR "SB 19" banks'
  - 'Texas "financial services" Hegar'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about woke capital versus free markets, the boycott laws as protecting Texas industries or as costing taxpayers, Texas as the new Wall Street, bank fees and consumers, and the Comptroller's enforcement. Posts about financial regulation with no Texas angle are off-topic.

lanes:
- key: hq_relocation_exodus
  label: Companies fleeing NY for Texas
  description: Corporate headquarters, capital and financial talent are relocating from New York and California
    to Dallas, Austin and Houston, so Texas is pulling the financial center of gravity away from Wall
    Street.
  keywords:
  - headquarters relocations
  - dallas-fort worth
  - wall street
  - new york
  - cbre
  - financial hub
  - moving to texas
  - lone star state
- key: tse_wall_street_rival
  label: Texas Stock Exchange as rival
  description: The Dallas-based Texas Stock Exchange is a credible challenger to the NYSE and Nasdaq,
    built to give companies a business-friendly listing venue and cement Texas as a financial center.
  keywords:
  - texas stock exchange
  - tse
  - nyse
  - nasdaq
  - dallas
  - listings
  - exchange
  - rival
- key: anti_esg_woke_capital
  label: Woke capital vs free markets
  description: Anti-ESG and anti-boycott laws stop woke banks and asset managers from using ESG, climate
    and gun-control agendas to punish Texas oil, gas and firearms industries.
  keywords:
  - woke
  - esg
  - boycott
  - energy
  - firearms
  - oil and gas
  - blackrock
  - free market
- key: comptroller_enforcement_lists
  label: Comptroller's boycott blacklist enforcement
  description: The Comptroller's lists of boycotting financial firms are an accountability tool that bars
    named firms from state contracts, and critics say they are arbitrary or politically motivated.
  keywords:
  - comptroller
  - boycott list
  - blacklist
  - divest
  - state contracts
  - hegar
  - kelly hancock
  - enforcement
- key: boycott_laws_taxpayer_cost
  label: Boycott laws raise costs
  description: Critics argue that excluding banks under the boycott laws raises borrowing costs for Texas
    cities and taxpayers, shrinks competition for municipal bonds and hurts the state's financial standing.
  keywords:
  - taxpayers
  - municipal bonds
  - borrowing costs
  - cost
  - cities
  - bond underwriters
  - sb 13
  - sb 19
- key: bank_fees_consumer_finance
  label: Bank fees and consumer protections
  description: Posts about bank fees, lending rules and Department of Banking oversight argue over whether
    Texas law protects or fails consumers, including debanking, overdraft and junk fees.
  keywords:
  - bank fees
  - overdraft
  - department of banking
  - consumers
  - debanking
  - lending
  - payday
  - fair access
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
