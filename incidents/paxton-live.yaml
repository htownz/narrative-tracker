# Live tracker: Ken Paxton on X, Oct 6 through election day (U.S. Senate race vs. James Talarico).
# Runs daily from .github/workflows/daily.yml alongside the other *-live incidents.

slug: paxton-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "Paxton, {days} days of posts"
subject: "Ken Paxton (R, Texas Attorney General), running for U.S. Senate against James Talarico (D), election Nov 3, 2026"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views mentioning Paxton, plus every post
  repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-09-01"   # backfilled to Labor Day on Oct 14; days before Oct 6 were pulled after the fact
  end: today
timezone: America/Chicago
refresh_days: 2

queries:
  - '"Ken Paxton"'
  - '@KenPaxtonTX'
  - 'Paxton Talarico'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  These lanes will be used unchanged for the rest of the race, so prefer durable narratives (a line of attack
  or defense that will recur) over one-day events. Fold single-day stories into the durable narrative they serve.
  Cover both sides: narratives pushed against Paxton and narratives pushed for Paxton or against Talarico.

lanes:
- key: talarico_missing_hiding
  label: Talarico missing, flu cover story
  description: Pro-Paxton posts claim Talarico vanished from the trail for about two weeks, that the 'flu'
    explanation is a lie covering a mental-health breakdown or hospitalization, and that this makes him
    unfit or ought to force him out.
  keywords:
  - missing
  - proof of life
  - flu
  - mental hospital
  - drop out
  - unfit
  - last seen
  - tala-freak-out
- key: talarico_radical_extremist
  label: Talarico as radical, weird, socialist
  description: Attacks portray Talarico as a far-left, weird or socialist figure with extreme positions
    on trans issues, race, border security, religion and 'six sexes', so Texans must vote Paxton to stop
    him.
  keywords:
  - talafreako
  - socialist
  - weirdo
  - transgender
  - mutilate
  - border security
  - apostate
  - drag queens
  - 6 sexes
- key: paxton_cowardice_debate
  label: Paxton ducking debates, coward
  description: Anti-Paxton posts say he has refused every debate invitation, is hiding behind attack ads
    and surrogates, and is a coward, with Talarico's 'clinical cowardice' jab as the signature line.
  keywords:
  - debate
  - cowardice
  - skipped
  - declined
  - proof of spine
  - hiding
  - 85 days
  - ready willing and able
- key: paxton_corrupt_self_serving
  label: Paxton corruption and personal scandals
  description: 'Attacks say Paxton is corrupt and self-serving: he enriched himself, took luxury and out-of-state
    trips on the taxpayer''s dime, partied in Dubai with a fugitive donor, travelled with his mistress
    and sold Texas out to data centers.'
  keywords:
  - corruption
  - mistress
  - dubai
  - fugitive
  - 15 homes
  - net worth
  - data centers
  - trips
  - skipped workdays
  - fraud
- key: paxton_cuts_and_campaign_woes
  label: 'Paxton leaked audio: cuts, campaign troubles'
  description: Posts amplify leaked private Paxton recordings showing him backing cuts to Social Security
    and Medicare ('suck it up'), blaming the war and gas prices, feuding with Cornyn and admitting that
    Abbott and his own campaign are struggling.
  keywords:
  - leaked audio
  - suck it up
  - social security
  - medicare
  - cornyn
  - gas prices
  - iran war
  - fundraiser
  - mandatory spending
- key: race_polls_momentum
  label: Polls, odds and who's winning
  description: Posts frame the race through polls, prediction-market odds and demographic crosstabs, arguing
    either that Talarico is surging toward an upset or that Paxton is holding or catching up, including
    GOP alarm over losing Texas.
  keywords:
  - poll
  - leads
  - tied
  - kalshi
  - odds
  - crosstabs
  - hispanic
  - yougov
  - quantus
  - trafalgar
markets:
  - label: "Paxton wins — Kalshi"
    series: SENATETX
    ticker: SENATETX-26-R

pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant narratives.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
