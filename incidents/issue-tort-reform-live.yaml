# Live issue tracker: civil justice in Texas — tort reform and Texans for Lawsuit Reform, nuclear verdicts, trucking litigation, the business courts, insurance costs, and lawsuit abuse claims. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-tort-reform-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "Lawsuits, nuclear verdicts and civil justice, {days} days of posts"
subject: "civil justice and tort reform in Texas — Texans for Lawsuit Reform and its opponents, nuclear verdicts and damages caps, trucking and commercial litigation rules, the business courts and the Fifteenth Court of Appeals, insurance rates and litigation costs, and claims of lawsuit abuse"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas lawsuits, nuclear verdicts and civil justice, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"Texans for Lawsuit Reform"'
  - '"nuclear verdict" Texas'
  - '"tort reform" Texas'
  - '"lawsuit abuse" Texas'
  - 'Texas "business courts"'
  - 'Texas trial lawyers lege'
  - 'Texas verdict million jury'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about greedy trial lawyers versus corporations escaping accountability, verdicts driving up insurance, the business courts as fairness or favoritism, and specific verdicts that become stories. Posts about lawsuits in other states with no Texas angle are off-topic.

lanes:
- key: lawsuit_abuse_hidden_tax
  label: Lawsuit abuse as hidden tax
  description: Frivolous suits and billboard-lawyer litigation add thousands of dollars in hidden costs
    to every Texas family, so lawmakers should rein in lawsuit abuse.
  keywords:
  - lawsuit abuse
  - hidden tax
  - billboard lawyers
  - frivolous lawsuits
  - cost to families
  - litigation costs
  - legal system abuse
- key: nuclear_verdicts_insurance
  label: Nuclear verdicts drive up premiums
  description: Outsized jury awards against trucking and commercial defendants inflate insurance rates
    and consumer prices, justifying damages caps and tighter litigation rules.
  keywords:
  - nuclear verdicts
  - insurance rates
  - premiums
  - damages caps
  - trucking
  - jury awards
  - commercial litigation
- key: tlr_political_power
  label: TLR as a political power broker
  description: Texans for Lawsuit Reform is a donor-funded machine that buys influence in Texas politics,
    and is attacked as insincere, insider-driven, or hostile to particular candidates, sometimes from
    within the right.
  keywords:
  - texans for lawsuit reform
  - tlr
  - donors
  - paxton
  - fake conservative
  - dunn
  - political money
- key: corporate_accountability
  label: Tort reform shields corporations
  description: Caps and litigation limits let corporations and insurers escape accountability and leave
    injured Texans, workers, and families without remedy while trial lawyers defend access to the courts.
  keywords:
  - accountability
  - injured victims
  - trial lawyers
  - right to sue
  - jury trial
  - corporate greed
  - caps hurt victims
- key: specialty_courts_fairness
  label: Business courts and Fifteenth Court
  description: The Texas business courts and Fifteenth Court of Appeals are argued over as either efficient,
    expert forums or tilted venues that favor corporations and the state's political leadership.
  keywords:
  - business court
  - fifteenth court of appeals
  - 15th court
  - specialized courts
  - appointed judges
  - favoritism
  - venue
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
