# Live issue tracker: Texas's fight over hemp-derived THC (the ban, the special sessions, the regulatory alternative), and beverage alcohol regulation (TABC, distribution, alcohol-to-go, excise). Long-term tracker through the 2027 session.
# Runs every six hours with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-hemp-thc-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "Hemp, THC and alcohol rules, {days} days of posts"
subject: "the regulation of hemp-derived THC products and beverage alcohol in Texas — the THC ban and its alternatives, Lt. Gov. Patrick's push and the industry's response, TABC rules, beer and spirits distribution, alcohol-to-go and alcohol taxes"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas THC, hemp and alcohol regulation, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - 'Texas THC'
  - '"THC ban" Texas'
  - 'Texas hemp ban'
  - '"hemp" Texas Patrick'
  - '"SB 3" THC'
  - 'TABC'
  - '"Texas Alcoholic Beverage Commission"'
  - '"alcohol to-go" Texas'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about the THC ban as protecting kids versus killing small businesses and jobs, veterans and patients who use hemp, Patrick as the driver, regulation versus prohibition, the beer and spirits industry's interests, alcohol taxes and distribution rules. Posts about THC or alcohol in other states with no Texas angle are off-topic.

lanes:
- key: ban_feeds_black_market
  label: Ban feeds cartels, black market
  description: Prohibiting hemp THC won't end demand; it pushes Texans from licensed local shops to cartels
    and unregulated dealers, so Texas should regulate rather than prohibit.
  keywords:
  - black market
  - cartels
  - prohibition
  - regulate not ban
  - demand doesn't go away
  - unregulated
  - nanny state
- key: small_business_jobs
  label: Ban kills small businesses, jobs
  description: The THC ban and new licensing fees destroy Texas hemp shops, farmers and manufacturers,
    costing jobs and tax revenue and leaving billions on the table.
  keywords:
  - small business
  - jobs
  - hemp shops
  - licensing fees
  - billions
  - industry
  - lose livelihoods
- key: veterans_freedom_patients
  label: Veterans, patients, and personal freedom
  description: Adults, veterans and patients rely on hemp products for relief and have a right to choose,
    so the ban is government overreach into personal liberty.
  keywords:
  - veterans
  - freedom
  - liberty
  - patients
  - adults
  - adhd
  - overreach
- key: patrick_ballot_box
  label: Patrick's ban as electoral liability
  description: Dan Patrick and Republicans drove the ban (SB3, Abbott's order), and Democrats and hemp
    advocates use it to mobilize voters against them in the 2026 elections.
  keywords:
  - dan patrick
  - sb3
  - vikki goodwin
  - talarico
  - vote
  - voting bloc
  - campaign
  - midterms
- key: courts_rules_enforcement
  label: Lawsuits, TABC rules, and enforcement
  description: The fight over THC rules is playing out in the courts and enforcement, including smokable/THCA
    bans, TABC and DSHS rules, appeals, lab/COA disputes, smoke shop raids and the federal deadline.
  keywords:
  - lawsuit
  - appeals court
  - thca
  - smokable
  - raids
  - tabc
  - federal ban deadline
  - coa
- key: public_safety_kids
  label: Protecting kids and public safety
  description: Restricting hemp THC is needed to protect children and communities from unregulated, potent
    or contaminated products, illicit shops and drug-linked crime.
  keywords:
  - kids
  - children
  - fentanyl
  - illegal products
  - thc-laced
  - public safety
  - seized
  - crackdown
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
