# Live issue tracker: Texas's fight over hemp-derived THC (the ban, the special sessions, the regulatory alternative), and beverage alcohol regulation (TABC, distribution, alcohol-to-go, excise). Long-term tracker through the 2027 session.
# Runs every six hours with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-hemp-thc-live
title: "Hemp, THC and alcohol rules, {days} days of posts"
subject: "the regulation of hemp-derived THC products and beverage alcohol in Texas — the THC ban and its alternatives, Lt. Gov. Patrick's push and the industry's response, TABC rules, beer and spirits distribution, alcohol-to-go and alcohol taxes"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas THC, hemp and alcohol regulation, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - 'Texas THC'
  - '"THC ban" Texas'
  - 'Texas hemp ban'
  - '"hemp" Texas Patrick'
  - '"SB 3" THC'
  - 'TABC'
  - '"Texas Alcoholic Beverage Commission"'
  - '"alcohol to-go" Texas'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about the THC ban as protecting kids versus killing small businesses and jobs, veterans and patients who use hemp, Patrick as the driver, regulation versus prohibition, the beer and spirits industry's interests, alcohol taxes and distribution rules. Posts about THC or alcohol in other states with no Texas angle are off-topic.

lanes: []
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
