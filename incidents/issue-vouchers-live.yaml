# Live issue tracker: school vouchers / education savings accounts in Texas. Runs daily with the other *-live incidents.

slug: issue-vouchers-live
title: "Texas school vouchers, {days} days of posts"
subject: "Texas school vouchers and education savings accounts (ESAs) — the state program, its rollout, costs and effect on public schools"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas school vouchers, plus every post
  repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-06"
  end: today
timezone: America/Chicago
refresh_days: 2

queries:
  - 'Texas vouchers'
  - '"school choice" Texas'
  - '"education savings account" Texas'
  - 'Texas ESA school'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Posts about other states with no Texas angle are off-topic.
  Expect frames about public school funding, rural schools, private school tuition, accountability, and who benefits.

lanes:
- key: voucher_political_liability
  label: Vouchers are a GOP electoral liability
  description: Vouchers and school funding fights are costing Republicans suburban and rural voters and
    could help Democrats win Texas races, including the governor's race.
  keywords:
  - liability
  - gop
  - suburban voters
  - flipped
  - democrats
  - governor
  - election
  - abbott
  - talarico
- key: rural_district_financial_pain
  label: Vouchers drain rural and public schools
  description: Vouchers and school funding cuts are squeezing public school districts, especially rural
    ones where the district is the biggest employer, and are hurting staff and budgets.
  keywords:
  - rural
  - isd
  - public school funding
  - budget cuts
  - layoffs
  - employees
  - district
  - financial pressure
- key: tefa_success_stories
  label: TEFA is working for families
  description: The Texas Education Freedom Accounts (TEFA) program is delivering on its promises, helping
    over 100,000 kids including special-needs students, and mostly serving middle- and lower-income families.
  keywords:
  - tefa
  - promises kept
  - blessing
  - dyslexia
  - education freedom accounts
  - 100,000 kids
  - working as intended
  - mother
- key: choice_funding_separate
  label: Choice funded separately, not from schools
  description: Pro-voucher voices say school choice takes no money from public schools because TEFA is
    funded by a separate General Revenue appropriation, and credit GOP leaders for parental rights and
    school choice.
  keywords:
  - doesn't take a dollar
  - general revenue
  - separate appropriation
  - parental rights
  - sb2
  - fear-mongering
  - misinformation
  - passed school choice
- key: giveaway_to_wealthy_religious
  label: Taxpayer giveaway to rich and religious
  description: Vouchers redistribute taxpayer money to wealthy families and private religious schools
    that can discriminate, rather than serving ordinary Texas students.
  keywords:
  - giveaway
  - wealthy
  - religious schools
  - subsidize
  - discriminate
  - redistribute
  - rich
  - taxpayers
- key: accountability_outcomes_first
  label: Focus on learning outcomes and accountability
  description: Voters care more about whether kids read and do math at grade level than about the school
    choice fight, so accountability and proficiency should drive education policy.
  keywords:
  - grade level
  - proficiency
  - reading
  - math
  - accountability
  - voters
  - outcomes
  - superintendent salary
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
