# Live issue tracker: family violence and crime victims' services in Texas — VOCA funding cuts, HHSC family violence programs, shelters and the Houston Area Women's Center, victims' compensation, and children of incarcerated parents. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-victim-services-live
title: "Family violence, victims' services and funding, {days} days of posts"
subject: "family violence, sexual assault and crime victims' services in Texas — federal VOCA funding and state backfill, HHSC family violence program funding, shelters and service providers including the Houston Area Women's Center, crime victims' compensation, protective orders, and support for children of incarcerated parents"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas family violence and victims' services, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"domestic violence" Texas funding'
  - 'VOCA Texas'
  - '"family violence" Texas'
  - '"Houston Area Women''s Center"'
  - 'Texas "crime victims" compensation'
  - '"sexual assault" Texas funding'
  - 'Texas "protective order"'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about funding cuts and who fills the gap, shelters turning people away, victims' rights versus defendants' rights, the state's responsibility, and specific cases that become stories. Posts about domestic violence policy in other states with no Texas angle are off-topic.

lanes:
- key: funding_cuts_gap
  label: Funding cuts and who fills gap
  description: Federal VOCA and other cuts are draining Texas victim services, and the state, donors or
    counties must backfill or programs will close.
  keywords:
  - voca
  - funding cuts
  - backfill
  - hhsc
  - grant
  - budget
  - legislature
  - nonprofit
- key: shelters_strained
  label: Shelters strained, survivors turned away
  description: Shelters, hotlines and rape crisis centers are at capacity and cutting staff, so survivors
    and children are left without beds, counseling or advocates.
  keywords:
  - shelter
  - turned away
  - waitlist
  - hotline
  - houston area women's center
  - capacity
  - survivors
  - advocates
- key: lenient_justice
  label: Abusers get lenient deals
  description: Prosecutors, judges and officials go easy on offenders through plea deals, light sentences
    and dropped charges, failing victims and favoring the powerful.
  keywords:
  - plea deal
  - misdemeanor
  - reduced charges
  - sentence
  - paxton
  - sex offender registry
  - judge
  - prosecutor
- key: abuse_by_power
  label: Abuse by police and agents
  description: Officers, agents and others with state power commit abuse, stalking or assault and face
    weak oversight, showing institutional failure to protect victims.
  keywords:
  - officer
  - police
  - ice
  - cbp
  - stalking
  - oversight
  - complaints
  - misconduct
- key: protective_order_cases
  label: Protective orders and high-profile cases
  description: Individual family-violence cases and protective orders become stories about whether courts
    and law enforcement actually protect victims and enforce orders.
  keywords:
  - protective order
  - stay away
  - family violence case
  - arrest
  - court
  - restraining order
  - charged
  - celebrity
- key: grant_misuse_scrutiny
  label: Grant misuse and waste scrutiny
  description: Federal and state grants meant for victims or vulnerable groups are misspent or go to favored
    organizations, which justifies audits and cuts.
  keywords:
  - misused grants
  - audit
  - fraud
  - hhs review
  - taxpayer
  - accountability
  - federal funds
  - waste
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
