# News outlets the trackers meet, with an approximate lean so a claim's press coverage can be read by side.
# Leans follow the AllSides / Ad Fontes conventions as of 2026 (left, lean-left, center, lean-right, right) and
# are a judgment, not a measurement — edit freely. Unknown domains are labelled "unrated" and never dropped.
# `texas: true` marks state and local outlets; the insights page separates Texas press from national press.

