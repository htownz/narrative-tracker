# Live issue tracker: Texas public school funding and the teaching profession — school finance and the basic allotment, teacher pay and certification, the TEA budget and riders, Teach for America and alternative certification, and A-F accountability. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-k12-live
title: "K-12 funding, teachers and TEA, {days} days of posts"
subject: "K-12 public education funding and the teaching profession in Texas — school finance and the basic allotment, teacher pay and retention, certification and alternative certification including Teach for America, the TEA budget and its riders, academic competition funding, A-F accountability ratings, and school district budget deficits"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas K-12 funding, teachers and TEA, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"teacher pay" Texas'
  - 'Texas "basic allotment"'
  - 'Texas "school finance"'
  - '"Teach for America" Texas'
  - 'Texas teacher certification'
  - 'TEA budget rider'
  - 'Texas school district deficit'
  - 'Texas "A-F" ratings'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about underfunding versus accountability, teacher pay and the exodus, uncertified teachers, districts' deficits and closures, vouchers' effect on public schools, and TEA's role. Posts about school funding in other states with no Texas angle are off-topic.

lanes: []
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
