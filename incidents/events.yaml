# Things that happen off X: hearings, votes, filings, rulings, debates, ad buys, rallies, poll releases,
# endorsements, news. The chart marks them, analysis.html shows how each lane moved in the 12 hours after
# versus the 12 before, claims that first appear within 6 hours after one are tagged with it, and a burst
# that follows one is not counted against a lane's control score.
#
# Fields: at (local time in `timezone`, "YYYY-MM-DD HH:MM", or a date only for an all-day event), label, type,
# trackers (slugs, or all), source (where the time comes from — a first post on X is a lower bound, not the moment).
# Types: poll | rally | debate | hearing | vote | filing | ruling | ad | endorsement | campaign | news | calendar

timezone: America/Chicago

