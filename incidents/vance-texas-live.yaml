# Live tracker: Vice President Vance's footprint in Texas politics on X — rallies and surrogate work for the
# Texas GOP ticket (Paxton in Tyler, Oct 13), attacks on Texas Democrats, and how he is invoked in the state
# races. Scoped to Texas on purpose, like trump-texas-live. Runs with the other *-live incidents.

slug: vance-texas-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "Vance in Texas, {days} days of posts"
subject: "Vice President JD Vance's role in Texas politics — rallies and surrogate appearances for Ken Paxton and the Texas GOP ticket, attacks on James Talarico and Texas Democrats, and how Texas voters and candidates invoke him before the Nov 3, 2026 election"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Vance and Texas, plus every post
  repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-06"
  end: today
timezone: America/Chicago
refresh_days: 2

queries:
  - 'Vance Texas'
  - 'Vance Paxton'
  - 'Vance Talarico'
  - 'Vance Tyler'
  - '@JDVance Texas'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  These lanes will be used unchanged through the election, so prefer durable narratives (a line of attack
  or defense that will recur) over one-day events. Fold single-day stories into the durable narrative they
  serve. Cover both sides: narratives that Vance's involvement helps the Texas GOP ticket, narratives that it
  hurts it or signals GOP alarm about Texas, and narratives about his own statements made in Texas.
  Posts about Vance with no Texas angle are off-topic.

lanes:
- key: talarico_freak_smear
  label: Vance mocks Talarico as freak
  description: Posts celebrating or amplifying Vance's rally attacks on Talarico as a 'freak' or 'weirdo'
    obsessed with trans kids and drag queens, with the 'search history' jab, the 'freaky paws' line, and
    the race and sex-ed quotes, as a winning case against the Democrat.
  keywords:
  - freak
  - search history
  - talarico
  - trans children
  - drag queens
  - freaky paws
  - talafreako
  - racism is a virus
- key: vance_homophobic_smear
  label: Vance's insinuations called smears
  description: Posts condemning Vance's 'platonic, I'm not James Talarico' joke and search-history remarks
    as gay-baiting, pedophile insinuation, or a desperate smear, evidence that Republicans would rather
    attack a person than defend their policies.
  keywords:
  - implies gay
  - pedophile
  - smear
  - insinuating
  - baselessly
  - platonic
  - sexuality
  - no limits
- key: paxton_scandal_contrast
  label: Vance backs scandal-hit Paxton
  description: Posts arguing that Vance is campaigning for a compromised Paxton, citing the Dubai trip,
    the donor accused of fraud, the mistress, and the refusal to debate or answer questions, and mocking
    Vance's 'direct answer' line.
  keywords:
  - paxton
  - dubai
  - mistress
  - fraud
  - won't debate
  - direct answer
  - caught partying
  - hypocrisy
- key: rally_strength_paxton_boost
  label: Vance rally energizes Texas GOP
  description: Posts presenting Vance's Tyler rally as a huge, enthusiastic show of force that boosts
    Ken Paxton and the Texas GOP ticket, with crowd videos, 'don't mess with Texas' lines, endorsements
    from Texas Republicans, and Paxton-record praise.
  keywords:
  - tyler
  - massive crowd
  - standing room only
  - don't mess with texas
  - keep texas red
  - air force two
  - elect ken paxton
  - paxton
- key: texas_deliverables_affordability
  label: Vance touts Texas administration wins
  description: Posts presenting Vance's Texas appearance as delivering concrete administration wins, such
    as the Defense Production Act refinery expansion in Tyler, jobs, tax cuts and investment, to lower
    prices and argue Republicans deliver for Texans.
  keywords:
  - defense production act
  - refinery
  - delek
  - lower prices
  - fuel
  - affordability
  - jobs
  - tax cuts
- key: gop_alarm_tight_race
  label: Vance visit signals GOP Texas worry
  description: Posts arguing that Vance's repeated Texas trips and his admission that Paxton is in a 'tight
    race' show Republican alarm about losing Texas, with thin-crowd mockery, protesters, and Democratic
    spending as signs of a competitive Senate race.
  keywords:
  - tight race
  - third visit
  - only 257
  - protesters
  - competitive
  - democrats spending
  - alarm
  - talarico campaign statement
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant narratives.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
