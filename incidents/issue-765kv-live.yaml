# Live issue tracker: the 765-kV transmission build-out in Texas — the PUC/ERCOT extra-high-voltage backbone
# (Permian Basin reliability plan and the statewide 765-kV network), routing fights, landowner and eminent-domain
# objections, cost allocation to ratepayers, and who the lines are for (data centers, oil and gas, West Texas load).
# Runs daily with the other *-live incidents.

slug: issue-765kv-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "765-kV transmission lines, {days} days of posts"
subject: "the 765-kilovolt transmission line build-out in Texas — the PUC and ERCOT extra-high-voltage backbone (Permian Basin reliability plan and statewide 765-kV network), line routing, landowner and eminent-domain objections, cost to ratepayers, and whether the lines serve data centers and industry or everyday reliability"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas's 765-kV transmission lines, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-06"
  end: today
timezone: America/Chicago
refresh_days: 2

queries:
  - '"765 kV"'
  - '"765-kV"'
  - '765kV Texas'
  - '"765 kilovolt"'
  - '"transmission line" Texas'
  - '"transmission lines" Texas'
  - 'ERCOT transmission'
  - '"Permian Basin" transmission'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Posts about transmission lines in other states with no Texas angle, or
  about power lines in general, are off-topic. Expect frames about landowners and eminent domain, routing
  through specific counties, cost to ratepayers, data centers and oil-and-gas load as the beneficiaries,
  reliability and the Permian plan, and the PUC's and ERCOT's handling of it.

lanes:
- key: data_centers_beneficiary
  label: Lines built for data centers
  description: The 765-kV lines are being driven through private land mainly to serve data centers and
    big industrial load, not everyday Texans.
  keywords:
  - data centers
  - 765-kv
  - private property
  - big tech
  - nanny state
  - who benefits
  - ratepayers pay
- key: large_load_planning_strain
  label: ERCOT large-load queue overwhelms planning
  description: Gigawatt-scale load requests are swamping ERCOT's transmission planning, so the grid is
    the real bottleneck for AI and growth.
  keywords:
  - large load queue
  - ercot
  - gw
  - interconnection
  - planning process
  - bottleneck
  - load growth
  - powered data centers
- key: build_it_power_growth
  label: Build grid to power growth
  description: Expanding transmission and power capacity is needed to power American industry, AI and
    jobs, and the buildout should move quickly.
  keywords:
  - build it here
  - power it here
  - jobs
  - american industry
  - grid buildout
  - ai race
  - energy dominance
- key: political_opposition_campaign
  label: Candidates campaign against 765-kV
  description: Texas candidates and officials use opposition to the 765-kV lines as a campaign and legislative
    issue to win rural and landowner votes.
  keywords:
  - txlege
  - campaign ad
  - opposes 765
  - state house
  - vote them out
  - legislature
  - hd54
  - candidate
- key: permian_reliability_oil_gas
  label: Permian plan and oil-gas load
  description: The Permian Basin reliability plan and the West Texas grid are framed around oil-and-gas
    electrification, congestion and curtailed power, with industry seeking exemptions or benefits.
  keywords:
  - permian
  - west texas
  - oil and gas
  - curtailment
  - pipeline companies
  - reliability plan
  - congestion
  - puc
- key: eminent_domain_landowners
  label: Landowners vs eminent domain
  description: Residents and landowners are fighting the lines, and the government taking their land by
    eminent domain, on property-rights grounds.
  keywords:
  - eminent domain
  - landowners
  - property rights
  - taking land
  - route
  - counties
  - hill country
  - residents fighting
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
