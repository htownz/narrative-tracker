# Live issue tracker: school district governance in Texas — HISD under its board of managers, Fort Worth ISD's intervention, TEA takeovers, Mike Miles, the return to elected boards, SB 1882 partnerships, and the messaging campaign around 'the largest turnaround in Texas history'. Long-term tracker through the 2027 session.
# Runs every six hours with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-school-governance-live
title: "HISD, Fort Worth ISD and state takeovers, {days} days of posts"
subject: "school district governance and state intervention in Texas — HISD under the TEA-appointed board of managers and Superintendent Mike Miles, Fort Worth ISD and other TEA takeovers, the return to elected boards, trustee redistricting, SB 1882 partnerships, A-F ratings used as justification, and the campaign for and against the reforms"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about HISD, Fort Worth ISD and Texas school takeovers, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - 'HISD'
  - '"Houston ISD"'
  - '"Mike Miles"'
  - '"board of managers" Texas'
  - '"Fort Worth ISD"'
  - '"TEA takeover"'
  - 'Morath HISD'
  - '"largest turnaround"'
  - '"SB 1882"'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about the takeover as a turnaround that works versus an undemocratic power grab, test scores and A-F ratings, teacher exodus and discipline, the return to an elected board and whether reforms survive it, Abbott and TEA as drivers, and Fort Worth as the next HISD. The anchor phrases of the pro-reform campaign ('largest turnaround in Texas history', 'no student attends a failing school', 'regardless of zip code') should land in one lane. Posts about school districts outside Texas are off-topic.

lanes:
- key: takeover_works_turnaround
  label: Takeover is a proven turnaround
  description: The state takeover and Miles' reforms are working, citing improved A-F ratings, rising
    achievement, 'largest turnaround in Texas history', 'no student attends a failing school', and a financially
    sustainable model.
  keywords:
  - turnaround
  - a or b ratings
  - failing school
  - regardless of zip code
  - miles
  - improved ratings
  - academic gains
  - sustainable
- key: undemocratic_power_grab
  label: Undemocratic state power grab
  description: The takeover strips local voters and parents of control, with Abbott, Morath and TEA hand-picking
    unaccountable managers and a commission report offering a counternarrative to the state's account;
    the fix is returning to an elected board.
  keywords:
  - abbott
  - morath
  - tea
  - unelected
  - board of managers
  - elected board
  - power grab
  - democracy
  - counternarrative
- key: classroom_cost_scripted
  label: Harm to classrooms and staff
  description: Reforms have damaged schools through scripted lessons, narrowed curriculum, cut arts programs,
    teacher turnover, harsh discipline, school closures and bus hub changes, as voiced by students and
    parents.
  keywords:
  - scripted
  - teacher exodus
  - cut programs
  - choir
  - narrowed curriculum
  - open letter
  - students
  - discipline
  - bus hubs
- key: money_enrollment_vouchers
  label: Money, enrollment and vouchers
  description: Funding and enrollment losses, voucher diversion, surplus spending and school closures
    show the state's priorities hurting neighborhood schools and costing taxpayers.
  keywords:
  - enrollment decline
  - vouchers
  - funding
  - budget
  - tax dollars
  - surplus
  - closures
  - million
- key: fort_worth_next_hisd
  label: Fort Worth as the next HISD
  description: Fort Worth ISD's takeover is repeating the Houston model, with Board of Managers meetings,
    student pushback and a warning that other districts are next.
  keywords:
  - fort worth isd
  - fwisd
  - next hisd
  - takeover
  - board of managers
  - meacham
  - students letter
  - other districts
- key: edtech_privatization_politics
  label: Privatization, edtech and election politics
  description: The takeover is framed as serving tech and private interests (Alpha School, TimeBack, SB
    1882 partners) and as a campaign issue for the governor's race and November ballot.
  keywords:
  - alpha school
  - timeback
  - ai
  - privatization
  - tech giant
  - governor
  - ballot
  - november
  - campaign
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
