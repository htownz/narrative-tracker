# Live issue tracker: maternal health policy in Texas — maternal mortality, Medicaid coverage and doula reimbursement, HHSC and DSHS programs, and county maternal-health funding. Long-term tracker through the 2027 session.
# Runs every six hours with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-maternal-health-live
title: "Maternal health and doulas, {days} days of posts"
subject: "maternal health policy in Texas — maternal mortality and morbidity, Medicaid postpartum coverage and doula reimbursement, the definition and certification of doulas, HHSC and DSHS maternal programs, the maternal mortality review committee, and county maternal-health funding in Houston, Austin and San Antonio"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas maternal health and doula policy, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - 'doula Texas'
  - '"doulas" Texas'
  - '"maternal mortality" Texas'
  - '"maternal health" Texas'
  - 'Texas Medicaid doula'
  - '"postpartum" Texas Medicaid'
  - 'HHSC maternal'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about maternal mortality and the abortion ban, Medicaid expansion and postpartum coverage, doulas as a solution and who pays, rural hospital closures, Black maternal health, and the state's programs. Posts about maternal health in other states with no Texas angle are off-topic.

lanes:
- key: abortion_ban_killing_mothers
  label: Abortion ban is killing mothers
  description: Texas's abortion ban (SB 8, post-Dobbs near-total ban) is causally driving higher maternal
    deaths, citing rising mortality figures and comparisons with ban versus non-ban states.
  keywords:
  - abortion ban
  - sb 8
  - dobbs
  - roe
  - maternal mortality rose
  - ban states
  - killing women
  - sepsis
- key: report_delay_coverup
  label: Mortality report delay is cover-up
  description: The state is delaying or withholding the maternal mortality review committee report and
    2022-2023 data for political reasons, such as the midterms, to hide the ban's harms.
  keywords:
  - maternal mortality report
  - review committee
  - cover-up
  - delay
  - midterms
  - withholding data
  - 2022 and 2023
  - dshs
- key: black_maternal_health_crisis
  label: Black maternal health disparity crisis
  description: Black women in Texas, especially in Harris County, face far higher maternal death rates,
    and candidates and advocates must fix this racial disparity.
  keywords:
  - black women
  - three times
  - harris county
  - deadliest place
  - black maternal health
  - disparity
  - talarico
  - racial
- key: ban_blame_is_misleading
  label: Ban-blame claims are misleading
  description: Claims linking Texas's abortion laws to rising maternal mortality are misleading or false,
    with statistics misread and politicians accused of lying.
  keywords:
  - lying
  - correct her
  - misleading
  - not due to abortion law
  - statistics
  - data shows
  - fact check
  - misinformation
- key: coverage_doulas_funding_solutions
  label: Medicaid, doulas and funding solutions
  description: Texas should expand postpartum Medicaid, reimburse and certify doulas, and fund county
    and rural maternal-health programs to improve outcomes.
  keywords:
  - medicaid
  - postpartum coverage
  - doula
  - reimbursement
  - medicaid expansion
  - rural hospital
  - hhsc
  - county funding
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
