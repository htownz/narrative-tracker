# Live issue tracker: broadband and rural telecom in Texas — BEAD and the Broadband Development Office, the Texas Universal Service Fund, rural cooperatives and small telcos, pole attachments, and the politics of connectivity. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-broadband-live
title: "Rural broadband and telecom, {days} days of posts"
subject: "broadband and rural telecommunications policy in Texas — the BEAD program and the Broadband Development Office, the Texas Universal Service Fund and its funding, rural telephone cooperatives and small carriers, pole attachment and right-of-way rules, satellite versus fiber, and who gets connected"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas rural broadband and telecom, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - 'Texas broadband BEAD'
  - '"Broadband Development Office"'
  - '"Texas Universal Service Fund"'
  - '"rural broadband" Texas'
  - 'Texas broadband Starlink fiber'
  - 'Texas "pole attachment"'
  - 'Texas telephone cooperative'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about fiber versus satellite, federal money and how the state spends it, the Universal Service Fund and who pays, rural areas left behind, and the small carriers' role. Posts about broadband in other states with no Texas angle are off-topic.

lanes: []
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
