# Live issue tracker: Waymo, Tesla robotaxi and other autonomous vehicles on Texas streets — incidents, city council reactions, state permitting and liability rules. Long-term tracker through the 2027 session.
# Weekly client tracker for Waymo (pulled Sunday night for the Monday social scan email); lanes are frozen.

slug: issue-av-live
title: "Autonomous vehicles in Texas, {days} days of posts"
subject: "autonomous vehicles and robotaxis in Texas — Waymo and Tesla robotaxi operations in Austin, Houston, Dallas and San Antonio, incidents and safety stories, city council and legislative reactions, state permitting at the DMV, and liability and insurance rules"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about autonomous vehicles and robotaxis in Texas, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated weekly.

window:
  rolling_days: 14
  end: today
timezone: America/Chicago
refresh_days: 8   # weekly run: re-pull the past 8 days
live: true

queries:
  - 'Waymo Texas'
  - 'Waymo Austin'
  - 'Waymo Houston'
  - 'Waymo Dallas'
  - 'Waymo "San Antonio"'
  - '"robotaxi" (Texas OR Austin OR Houston OR Dallas OR "San Antonio")'
  - 'Tesla robotaxi Austin'
  - '("self-driving" OR driverless OR "autonomous vehicle" OR "autonomous vehicles") (Texas OR Austin OR Houston OR Dallas OR "San Antonio")'
  - '("Waymo" OR robotaxi OR "autonomous vehicle") ("city council" OR TxDMV OR "SB 2807" OR legislature OR txlege)'
min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 500
fetch_referenced: false

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about safety incidents and who is accountable, jobs for drivers, technology and Texas as the proving ground, cities wanting control versus state preemption, Tesla and Musk, and insurance and liability. Posts about AVs in other states with no Texas angle are off-topic.

lanes:
- key: tesla_scaling_hype
  label: Cybercab scaling proves Tesla winning
  description: Tesla's fast Cybercab ramp in Austin (300+ cars, 8x in a month, Dallas next) is shown as
    proof that Tesla's robotaxi is scaling faster than anyone and is the future of transport.
  keywords:
  - cybercab
  - 300+
  - 8x
  - scaling
  - fleet
  - flooded austin
  - registered
  - dallas next
- key: tesla_vs_waymo_duel
  label: Tesla overtakes Waymo in Austin
  description: Head-to-head claims that Waymo is losing ground, shut down, or outnumbered in Austin, and
    that Tesla's vertical integration and Texas factory give it the edge.
  keywords:
  - waymo
  - overtaken
  - passed waymo
  - sightings
  - tracker
  - vertical integration
  - uber
  - waymo is done
- key: camera_vs_lidar_weather
  label: Cameras vs lidar in storms
  description: 'Austin''s rainstorms and night operations are used as a test of sensor strategy: Tesla''s
    camera-only system kept running while Waymo''s lidar fleet paused, versus arguments that lidar is
    needed for edge cases like dark roads.'
  keywords:
  - lidar
  - rain
  - storm
  - camera-only
  - night
  - 11pm
  - suspended operations
  - grey kittens
- key: safety_first_accountability
  label: Safety incidents and who answers
  description: Safety stories and incident reports (NHTSA crashes, stuck or misrouted robotaxis, Waymo
    blunders, Cybercab crash photos) raise questions of accountability, remote assistance and whether
    rollouts are careful enough.
  keywords:
  - incident
  - nhtsa
  - crash
  - stuck
  - safety
  - no injuries
  - remote assist
  - blocked ambulance
- key: texas_proving_ground
  label: Texas as the AV proving ground
  description: Texas is framed as the place where autonomy, manufacturing and the economy get built, with
    the Texas DMV registration and light regulation letting robotaxis expand across the Texas Triangle.
  keywords:
  - texas triangle
  - texas dmv
  - giga texas
  - austin
  - houston
  - san antonio
  - no income tax
  - permit
- key: rider_economics_experience
  label: Rider experience, pricing and waits
  description: First-hand ride reports and price and wait-time comparisons between Cybercab, Model Y robotaxi,
    Waymo and Uber, treated as evidence of whether robotaxis are really replacing human-driven rides.
  keywords:
  - first ride
  - wait time
  - price
  - uberx
  - surge
  - no steering wheel
  - ride quality
  - tip
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

# weekly client tracker: no claim extraction, fact-checks or emerging-story alerts (the costly Claude steps)
claims: { per_run: 0 }
verify: { per_run: 0 }
alerts: { min_posts: 100000 }

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
