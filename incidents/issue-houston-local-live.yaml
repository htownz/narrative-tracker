# Live issue tracker: Harris County Commissioners Court, Houston City Council and the Montgomery County Commissioners Court — budgets, bonds, development rules, leadership fights. Long-term tracker through the 2027 session.
# Runs every six hours with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-houston-local-live
title: "Houston-region local government, {days} days of posts"
subject: "local government in the Houston region — Harris County Commissioners Court and Judge Lina Hidalgo, Houston City Council and Mayor John Whitmire, Montgomery County Commissioners Court, county and city budgets, bonds, development regulations, and the fights among them"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Houston-region local government, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"Harris County Commissioners"'
  - '"Commissioners Court" Harris'
  - '"Montgomery County" commissioners'
  - '"Houston City Council"'
  - 'Whitmire Houston'
  - '"Lina Hidalgo"'
  - '"Harris County" budget'
  - 'Houston "city budget"'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about county budget fights and the tax rate, Hidalgo versus the commissioners, Whitmire's agenda and the city budget gap, development rules and growth in Montgomery County, flood and infrastructure spending, and partisan control of the county. Posts about other cities' local government are off-topic.

lanes: []
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
