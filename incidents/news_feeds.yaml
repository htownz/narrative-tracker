# RSS feeds pulled every run into data/news.sqlite (tracker/newsfeeds.py): the Texas political press plus the
# national desks that cover Texas races. A feed that does not answer is skipped and logged; the store keeps
# every article it has ever seen, so unlike the 7-day Google News window, coverage of a claim can be measured
# however long ago it first appeared on X. Leans come from incidents/outlets.yaml by domain.
#
# Fields: name, url, kind (press | wire | tv | radio | party | advocacy | newsletter), optional note.

feeds:
  - {name: Texas Tribune,              url: "https://www.texastribune.org/feeds/sections/politics/", kind: press}
