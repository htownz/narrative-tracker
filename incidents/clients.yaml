        legislation: SB 3-style THC ban and its special-session sequels; TABC rules; beer distribution and franchise law; alcohol excise in the budget
        voices: [DanPatrick, GregAbbott_TX, TexasTABC, Texas House Licensing & Administrative Procedures, Senate State Affairs]

