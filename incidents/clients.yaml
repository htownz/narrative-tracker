# Grey Havens Strategies: clients and prospects, the policy areas each one lives or dies on, and the trackers
# that watch those areas. This is the long-term map — the race trackers end Nov 3; these run through the 2027
# session. Edit freely; the clients page (/clients/) and the hub's "By client" grouping are built from it.
#
# Fields per client: name, status (client | prospect | pro-bono | former), lead (firm), practice, areas: a list of
#   - area:        a policy area the client cares about
#     trackers:    slugs of trackers that watch it (incidents/<slug>.yaml)
#     why:         one line on what the client needs from it
#     legislation: bills, riders, agencies, rulemakings, committees to watch (free text; session mode reads this)
#     voices:      elected officials and institutions whose rhetoric on the area matters (X handles or names)
# Keep client-confidential detail out of here: the repo is public.

firm_practices: [energy and electricity, transportation and infrastructure, appropriations and tax, local and municipal government]

clients:
  - name: Grey Havens Strategies (firm watch)
    status: client
    practice: all
    areas:
      - area: Election integrity, the "rigged midterms" narrative and post-election stability
        trackers: [issue-election-integrity-live]
        why: Whether the midterm result is accepted decides the political weather every client works in through January; the Texas side (Harris County, the SOS, Paxton's prosecutions) is where election bills come from
        legislation: Election Code changes in 2027 (certification, mail ballots, voter roll maintenance, poll watchers); SOS and AG election-integrity units; Harris County election administration
        voices: [GregAbbott_TX, KenPaxtonTX, TXsecofstate, Harris County Clerk, Sen. Bryan Hughes, Rep. Briscoe Cain, Senate State Affairs, House Elections]
      - area: The 2027 legislative session
        trackers: [issue-property-tax-live, issue-vouchers-live, issue-grid-live, issue-data-centers-live]
        why: The firm's practice areas, watched continuously so the session starts with a baseline
        legislation: Interim charges; the Governor's emergency items; Patrick's priority list; the budget
        voices: [GregAbbott_TX, DanPatrick, SpeakerBurrows, Texas House and Senate leadership]

