# Live issue tracker: Texas water and flood policy — the Texas Water Fund, Harris County Flood Control, flood bonds, post-Hill Country-flood policy including youth camp safety and the DSHS Sunset review, and disaster recovery. Long-term tracker through the 2027 session.
# Runs every six hours with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-water-flood-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "Water, flood control and disaster policy, {days} days of posts"
subject: "water, flood control and disaster policy in Texas — the Texas Water Fund and water supply projects, Harris County Flood Control District and flood bonds, the Hill Country floods and Camp Mystic, youth camp safety rules and the DSHS Sunset review, flood warning systems, and disaster recovery funding"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Texas water, flood control and disaster policy, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"Harris County Flood Control"'
  - 'HCFCD'
  - '"Texas Water Fund"'
  - 'Texas flood bond'
  - '"Camp Mystic"'
  - '"camp safety" Texas'
  - 'Texas "flood warning"'
  - 'TWDB water'
  - '"Hill Country" flood'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about who failed before the Hill Country floods, warning systems and camp rules, state versus local responsibility, water supply and the Water Fund as a long-term fix, Harris County bond spending and equity, and disaster money. Posts about floods or water in other states with no Texas angle are off-topic.

lanes:
- key: warning_forecast_alerts
  label: Warnings and forecasts worked
  description: Posts relay live flash flood warnings, river rises and forecasts as proof that the warning
    system works, and urge people to turn around rather than drive into floodwater, sometimes defending
    forecasters against 'fear mongering' claims.
  keywords:
  - flash flood warning
  - llano river
  - forecast
  - turn around don't drown
  - flood watch
  - low-water crossings
  - nws
- key: honor_victims_act_now
  label: Honor victims with new laws
  description: Officials and advocates say the July 4, 2025 Hill Country deaths demand concrete action,
    such as camp safety rules, warning systems and flood funding, so a repeat never happens.
  keywords:
  - july 4
  - 139 lives
  - take action
  - prevent
  - camp safety
  - legislation
  - honor their memories
- key: camp_mystic_remembrance
  label: Camp Mystic grief and healing
  description: Human-interest posts about bereaved families, survivors and public figures remembering
    the girls lost at Camp Mystic, focused on mourning and resilience rather than blame.
  keywords:
  - kellyanne
  - lost his daughter
  - bracelet
  - pray
  - little girls
  - healing
  - camp mystic
- key: harris_county_flood_failure
  label: Harris County flood money failures
  description: Harris County Flood Control District is accused of failing to deliver projects despite
    Harvey relief and bond money, with state and federal officials pressing it on deadlines and oversight.
  keywords:
  - harris county
  - flood control district
  - harvey
  - relief
  - lack of deliverables
  - glo
  - bond
- key: left_mocked_victims
  label: Left mocked Christian flood victims
  description: Partisan claim that liberals cheered or mocked the Camp Mystic deaths because the victims
    were Christian or conservative, grouped with reactions to Charlie Kirk's killing.
  keywords:
  - leftists
  - rejoiced
  - mocked
  - christian
  - trump supporters
  - charlie kirk
  - never forget
- key: camp_owner_accountability
  label: Preventable deaths, no accountability
  description: Argues the Camp Mystic deaths were preventable and blames camp owners and local politicians,
    for example for refusing aid or warnings, while noting nobody has been charged and that investigations
    are ongoing.
  keywords:
  - nobody has been charged
  - manslaughter
  - owners
  - preventable
  - 15 months
  - guadalupe river
  - county politicians
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
