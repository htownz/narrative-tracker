# Live tracker: the Texas governor's race on X, Oct 6 through election day.
# window.end = today makes the window grow each run; the last `refresh_days` days are re-pulled every run.
# Runs daily from .github/workflows/daily.yml. Lanes are fixed once discovered so days stay comparable;
# `python run.py report incidents/governor-race-live.yaml` shows what is falling outside them.

slug: governor-race-live
title: "Texas governor's race, {days} days of posts"
subject: "the Texas governor's race — Gov. Greg Abbott (R) vs. Rep. Gina Hinojosa (D), election Nov 3, 2026"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Abbott or Hinojosa, plus every post
  repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-06"
  end: today
timezone: America/Chicago
refresh_days: 2

queries:
  - '"Greg Abbott"'
  - '"Gov. Abbott"'
  - '@GregAbbott_TX'
  - 'Abbott Hinojosa'
  - 'Abbott Texas governor'
  - '"Gina Hinojosa"'
  - '@GinaHinojosaTX'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  These lanes will be used unchanged for the rest of the race, so prefer durable narratives (a line of attack
  or defense that will recur) over one-day events. Fold single-day stories into the durable narrative they serve.
  Cover both sides: narratives pushed against Abbott and narratives pushed against Hinojosa or for Abbott.

lanes: []

pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant narratives.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
