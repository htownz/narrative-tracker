# Live tracker: the Texas governor's race on X, Oct 6 through election day.
# window.end = today makes the window grow each run; the last `refresh_days` days are re-pulled every run.
# Runs daily from .github/workflows/daily.yml. Lanes are fixed once discovered so days stay comparable;
# `python run.py report incidents/governor-race-live.yaml` shows what is falling outside them.

slug: governor-race-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "Texas governor's race, {days} days of posts"
subject: "the Texas governor's race — Gov. Greg Abbott (R) vs. Rep. Gina Hinojosa (D), election Nov 3, 2026"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about Abbott or Hinojosa, plus every post
  repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-09-01"   # backfilled to Labor Day on Oct 14; days before Oct 6 were pulled after the fact
  end: today
timezone: America/Chicago
refresh_days: 2

queries:
  - '"Greg Abbott"'
  - '"Gov. Abbott"'
  - '@GregAbbott_TX'
  - 'Abbott Hinojosa'
  - 'Abbott Texas governor'
  - '"Gina Hinojosa"'
  - '@GinaHinojosaTX'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  These lanes will be used unchanged for the rest of the race, so prefer durable narratives (a line of attack
  or defense that will recur) over one-day events. Fold single-day stories into the durable narrative they serve.
  Cover both sides: narratives pushed against Abbott and narratives pushed against Hinojosa or for Abbott.

lanes:
- key: abbott_vulnerable_momentum
  label: Abbott in trouble, Hinojosa surging
  description: Abbott is struggling and out of touch, with Hinojosa surging in polls, markets, money and
    endorsements, so Texas is genuinely flippable.
  keywords:
  - surging
  - poll
  - struggling
  - toss-up
  - kalshi
  - pritzker
  - dga
  - endorsed
  - flip texas
  - hiding
- key: abbott_failing_texans
  label: Abbott fails schools, costs, donors
  description: Abbott has failed ordinary Texans by underfunding public schools, pushing vouchers, favoring
    megadonors and data centers, and leaving costs and healthcare unaffordable.
  keywords:
  - public schools
  - vouchers
  - megadonors
  - data centers
  - affordable
  - american dream
  - teachers
  - property taxes
  - pto
  - billionaires
- key: abbott_priorities_hypocrisy
  label: Abbott's skewed priorities and extremism
  description: Abbott's actions show misplaced priorities and hypocrisy, such as honoring Israel over
    Uvalde victims, Muslim-bashing, and corruption alongside Paxton.
  keywords:
  - uvalde
  - half-staff
  - flags
  - corrupt
  - paxton
  - muslims
  - mini me
  - ice
  - no-bid contracts
  - trump
- key: hinojosa_radical_liberal
  label: Hinojosa is a radical liberal
  description: Hinojosa is the most liberal member of the Texas House who would turn Texas into California,
    backed by out-of-state elites, and is soft on police, border, trans issues and Islam.
  keywords:
  - most liberal
  - defund
  - california
  - sanctuary
  - radical
  - trans
  - woke
  - islam
  - sharia
  - far-left
- key: hinojosa_income_tax_lie
  label: Hinojosa's income tax record
  description: Hinojosa voted against the constitutional ban on a state income tax and lies about it,
    versus her claim that she opposes an income tax and Abbott is the one who is performative.
  keywords:
  - income tax
  - high tax
  - voted no
  - constitution
  - lying
  - ban
  - performative
  - property taxes
  - fool the voters
- key: abbott_safe_gop_defense
  label: Abbott is solid and will win
  description: Abbott is a strong, pro-business, pro-law-enforcement governor and the polls are noise
    or shifting back, so he will win reelection.
  keywords:
  - abbott will win
  - not losing
  - polls shifting
  - marist
  - law enforcement
  - jobs
  - business
  - incorporate
  - texas strong
  - vote red
markets:
  - label: "Abbott wins — Kalshi"
    series: GOVPARTYTX
    ticker: GOVPARTYTX-26-R

pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant narratives.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
