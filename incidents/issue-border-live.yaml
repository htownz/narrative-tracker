# Live issue tracker: the Texas border — Operation Lone Star, Eagle Pass and Shelby Park, state border spending, federal-state conflict, trade and the bridges, and border-county politics. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-border-live
title: "The border and Eagle Pass, {days} days of posts"
subject: "the Texas–Mexico border as a policy issue — Operation Lone Star and state border spending, Eagle Pass and Shelby Park, the buoys and the wall, state versus federal authority, immigration enforcement, cross-border trade and the ports of entry, and the politics of the border counties"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about the Texas border and Eagle Pass, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"Eagle Pass"'
  - '"Operation Lone Star"'
  - '"Shelby Park"'
  - 'Texas border Abbott'
  - 'Texas "border wall"'
  - '"border security" Texas funding'
  - 'Texas "ports of entry" trade'
  - 'Maverick County'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about invasion and state sovereignty versus federal authority and humanitarian concerns, the cost of Operation Lone Star, Eagle Pass as a stage, trade and the bridges, and border-county voters. Posts about the border in Arizona or California with no Texas angle are off-topic.

lanes: []
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
