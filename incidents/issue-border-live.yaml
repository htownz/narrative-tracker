# Live issue tracker: the Texas border — Operation Lone Star, Eagle Pass and Shelby Park, state border spending, federal-state conflict, trade and the bridges, and border-county politics. Long-term tracker through the 2027 session.
# Runs with the other *-live incidents; lanes are discovered on the first run and then frozen.

slug: issue-border-live
paused: true   # Oct 19, 2026: scheduled runs narrowed to the Montera trackers while costs are tuned; delete this line to resume
title: "The border and Eagle Pass, {days} days of posts"
subject: "the Texas–Mexico border as a policy issue — Operation Lone Star and state border spending, Eagle Pass and Shelby Park, the buoys and the wall, state versus federal authority, immigration enforcement, cross-border trade and the ports of entry, and the politics of the border counties"
subtitle: >
  {start} to {end}, 2026. Each dot is one post with 1K+ views about the Texas border and Eagle Pass, plus
  every post repeating an earlier one, in the lane for what it argues. Higher and bigger means more views.
  White means 90% or more the same words as an earlier post, with a white line back to it.
  Coloured lines link a post to the post it quoted or replied to. Updated daily.

window:
  start: "2026-10-01"
  end: today
timezone: America/Chicago
refresh_days: 2
live: true

queries:
  - '"Eagle Pass"'
  - '"Operation Lone Star"'
  - '"Shelby Park"'
  - 'Texas border Abbott'
  - 'Texas "border wall"'
  - '"border security" Texas funding'
  - 'Texas "ports of entry" trade'
  - 'Maverick County'
  - 'Texas "detention center"'
  - 'ICE detention Texas'

min_faves_hint: 10
exclude_retweets: true
query_type: Latest
min_views: 1000
fetch_referenced: true

discover_hint: >
  This is a policy issue, not a candidate. Lanes are the durable arguments people make about it — for and
  against, and the frames each side uses — and will be reused unchanged for months, so prefer arguments that
  will recur over one-day events. Expect frames about invasion and state sovereignty versus federal authority and humanitarian concerns, the cost of Operation Lone Star, Eagle Pass as a stage, trade and the bridges, and border-county voters. Posts about the border in Arizona or California with no Texas angle are off-topic.

lanes:
- key: activist_judges_block_wall
  label: Activist judges are blocking the wall
  description: The Big Bend injunction is framed as lawless judicial obstruction of Trump's border wall,
    with judge Cardone and leftist groups accused of keeping the border open to invaders.
  keywords:
  - activist judge
  - cardone
  - blocked
  - big bend
  - border wall
  - outrageous
  - invaders
  - injunction
- key: big_bend_wall_win
  label: Big Bend wall halt is a victory
  description: The ruling is celebrated as a win for landowners, river guides, conservationists and border-county
    locals who oppose the wall's cost, its environmental waivers and its seizure of land and park.
  keywords:
  - landowners
  - conservationists
  - national park
  - dodged a bullet
  - environmental laws
  - waived
  - win
  - wildlife
- key: abbott_emergency_overreach
  label: Abbott's border emergency and spending
  description: Abbott's repeated emergency declarations, no-bid contracts and billions in Operation Lone
    Star spending are cast as unaccountable power, with the border called secure and the emergency unjustified.
  keywords:
  - 69 times
  - emergency proclamation
  - no-bid contracts
  - legislature
  - powers
  - border is secure
  - spent billions
  - abbott
- key: lone_star_vindicated_reimbursement
  label: Lone Star vindicated by $7.5B reimbursement
  description: The $7.5 billion federal reimbursement is presented as proof that Texas was right to act
    when Biden failed, and Operation Lone Star as a model of state border security that is now paying
    off.
  keywords:
  - $7.5 billion
  - reimburse
  - operation lone star
  - property tax relief
  - biden's border
  - abbott stepped up
  - check
  - dps
- key: eagle_pass_biden_invasion
  label: Eagle Pass as Biden-era invasion
  description: Eagle Pass footage and crime stories are used to argue that Democrats opened the border,
    that migrants are criminals and cartels, and that voters must stay Republican to avoid a return.
  keywords:
  - eagle pass
  - illegal alien
  - cartel
  - razor wire
  - democrats opened the border
  - invasion
  - border patrol
  - vote republican
- key: border_counties_midterm_politics
  label: Border counties and the Texas midterms
  description: The border is treated as an electoral battleground, with border counties, the Rio Grande
    Valley and Hispanic voters as swing blocs in the Abbott–Hinojosa and Cruz–Talarico races and in the
    legislature.
  keywords:
  - maverick county
  - rio grande valley
  - talarico
  - hinojosa
  - hispanic
  - hd-74
  - border seat
  - november
pushback:
  label: Pushback
  description: Posts doubting, mocking, fact-checking or arguing against the dominant framings.

classifier:
  provider: claude
  model: claude-sonnet-5-5
  batch_size: 40

dedup:
  shingle_size: 3
  similarity: 0.90
