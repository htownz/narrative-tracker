very process through which an economy relieves price pressure. Logan instead treats stronger production as evidence that demand is overheating.\n\nHer assertion that “without any policy restriction, inflation will likely continue its above-target trend” simply assumes the point at issue. Inflation can remain above target while tariffs, higher energy costs, and other negative supply shocks pass through the economy. That does not establish excess demand. Nor does it demonstrate that rate hikes will improve the real adjustment.\n\nThis is classic Keynesian demand-management dogma, observe healthy output and spending, presume excessive demand, and prescribe tighter money. But rate hikes cannot create energy, undo a tariff, rebuild a supply chain, or expand productive capacity. They cannot speed the adjustment to a tariff shock or a negative energy shock.\n\nThey can only suppress demand, and, worse, raise the cost of the capital investment, inventories, logistics, factories, and energy infrastructure needed to adapt to those shocks. Higher rates risk delaying the supply response while weakening the economy that is generating it.\n\nLogan wants to burn down the house to roast the pig, use broad demand destruction to attack inflation that may largely reflect supply-side disruptions already working their way through the system. Growth alongside easing inflation is not proof of overheating. It may be evidence that supply is recovering. Her error is to see that recovery, call it inflationary, and then threaten to choke it off.\n\nOpening remarks for moderated conversation at Voices of the Eleventh District https://t.co/EA2j8J8dIx via @DallasFed", "url": "https://x.com/DrJStrategy/status/2105955894315954438", "lane": "tariff_costs_economic_strain", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106014985046348256", "t": "2026-10-02T13:34:34+00:00", "views": 2074, "likes": 14, "reposts": 2, "handle": "OwenGregorian", "name": "Owen Gregorian", "avatar": "data:imag xRt03LxlD4lUVNBzxdxqy2DV7AkzKqiurRdRCQ3Ftz7KDyaWDBT8cehF2JVxIq1GzmSVb5yy+oqQeoJk94BD6F6XHHyQ9klLDkPEtGlob9Zd0BF5rcsDe3m/5AQHcNrP15L4l7QsC/Jqg8RtAzI1w+247uVHkGpni/L7H85KcqY+JyyiIYNmI0uy+UuWW1E0A3VGXJSflPqJDdabmHQ6an/9oADAMBAAIAAwAAABBnQXpwaSKf/8QAHxEBAAEEAQUAAAAAAAAAAAAAAQARITFBUWGBkaHw/9oACAEDAQE/EFW24gVWJPCD9bJb6TFoKxx6lG9e0WcT/8QAHREBAAICAgMAAAAAAAAAAAAAAQARITEQQVGhwf/aAAgBAgEBPxAEz1BkKqGF3v5wAyCCr8+51TRmf//EAB8QAQACAgIDAQEAAAAAAAAAAAEAESExQYFRYXGRsf/aAAgBAQABPxBaoAVA5dwyZPb8A+tzBah2W2KJuuIXEwQs7PT8nIzuXWliLoqCpb+QrWRPObMs6gGh7ZnORF4mCkAUcRLoYNVLj8VjmvBuUSBF6E0Q4KCClgDpIohBgqyolbj4AKQN68v2JZKHcHpNQFyoDOgj65gpm0nQdMpXHa0CTjomTd25dlHcGISDSc9pe5jeoXWf5BtIrVA5AV8uD9tcwKCOObgM+CqM6q3ihmwSnHd/TGiViSCgi7oviFoA2eW6YxCKuVl1opt6Znjh0cDy8zItCIgvjy9x54ZOGJArSXTqJ8zECQoQfYHF/Vi3JM2p2sH82NuP/9kgICAgICAgICAgICAgICAgICAgICAgICAgICA=", "followers": 170533, "text": "How a Gen Zer built a $3.7 billion defense tech startup backed by Sequoia | Preston Fore, Fortune\n\nEarlier this month, defense tech firm Mach Industries raised $600 million in a Series C extension at a $3.7 billion valuation.\n\nThat’s more than double the $1.8 billion valuation Mach reached just three months earlier when it raised its initial $300 million Series C led by Ribbit Capital, Infinite Capital, Bedrock Capital, and Sequoia Capital. But perhaps more striking than the pace of the raises is who’s leading them: Mach, which builds autonomous defense systems, is run by a 22-year-old.\n\nFounder and CEO Ethan Thornton launched Mach in 2023 at 19, after developing an interest in defense as a teenager. Since then, he’s built the company around a willingness to move quickly, take risks, and adapt as its technology and the broader defense industry evolve.\n\n“You’re never going to know everything, especially when you’re starting young, and you shouldn’t expect to,” Thornton told Fortune. “If you wait until you have all the answers, you’ll probably never start.”\n\nBy 2024, Mach landed a deal with the Army Applications Laboratory to develop a vertical-takeoff precision cruise missile—and the company’s momentum has only accelerated since.\n\nToday, the Gen Zer is running a company with six weapons programs, a 115,000-square-foot headquarters and manufacturing facility in Huntington Beach, California, and ambitions to build everything from airframes and jet engines to solid rocket motors, energetic systems, and autonomous technologies.\n\nThe company’s rapid growth comes amid a broader boom in defense tech. Allie reported earlier this year that a record $19.8 billion was deployed into the sector in the first quarter of 2026 alone. Thornton, however, is betting that Mach can do more than simply ride that wave. After several years spent developing and testing its technology, the company is now shifting its focus toward production.\n\n“For a company like Mach, private capital lets us take risk earlier. We can build before there’s a massive program behind something, test it, learn from it and change it quickly,” Thornton told Fortune. “And because we think about manufacturing from the beginning, we’re not designing something and figuring out how to produce it years later. We’re building the product and the production capability at the same time.”\n\nTurning teenage military interests into a defense tech unicorn\n\nThornton’s interest in defense started well before Mach—and before he was old enough to drive a car.\n\nGrowing up in a military family in Texas, Thornton increasingly became concerned about China’s rise and what he described as an “impending great power conflict.” By 16, he was already prototyping defense applications on his parents’ property, experimenting with hydrogen-powered weapons using materials sourced from Home Depot and Amazon.\n\nHe took that interest to MIT, where he studied aerospace (and even made the football roster) while working with the school’s federally funded defense research center, Lincoln Laboratory. Before finishing his first year, Thornton received a Thiel Fellowship and left MIT to focus full-time on his company.\n\nMach quickly caught the attention of Silicon Valley. In June 2023, Sequoia Capital led a $5.7 million funding round in Mach—the VC’s first investment in a hardware defense technology company. Stephanie Zhan, a Sequoia partner who led the investment, summed up Thornton’s ambitions at the time:\n\n“Ethan is a force of nature: from his technical depth and genuine obsession with the problem to his bias for action and maturity beyond his years,” Zhan said. “Defense technology is central to our safety and security, and Mach is a step-function advancement to the state of the industry.”\n\nFor Thornton, however, the lessons from building Mach so young have been less about having all the answers than about knowing who to surround himself with.\n\n“Find people who are better than you at the things you don’t know, who will challenge you and who believe in what you’re trying to build,” he said.\n\nThornton’s core advice for other young people with ambitious ideas is similarly straightforward: Don’t be afraid to fail.\n\n“You have to be willing to learn as you go, make mistakes and keep moving. Have conviction in the problem you’re trying to solve, and then surround yourself with people who can help you solve it.”\n\nhttps://t.co/229RSQ14Ix", "url": "https://x.com/OwenGregorian/status/2106014985046348256", "lane": "defense_tech_buildout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106026281288495315", "t": "2026-10-02T14:19:28+00:00", "views": 45210, "likes": 2772, "reposts": 865, "handle": "GuntherEagleman", "name": "Gunther Eagleman™", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFl firm. (WSJ)    \n\nThe Houthis said they launched missile and drone attacks against Riyadh’s airport, Aramco’s Rabigh refinery and Saudi military installations in response to the offensive. Their spokesman warned airlines that Saudi airspace had become a theatre for their operations. (WSJ)  \n\nFars published footage claiming a fire at an Aramco facility in Jeddah following a Yemeni attack. The facility’s identity, damage and operational impact remain unconfirmed. (Fars)  \n\nThe U.S. withdrew 12 B-1 bombers from RAF Fairford over an IRGC-linked drone threat, U.S. and European officials told WSJ. Officials described a broader plot against aircraft and American pilots; British officials cautioned there was no evidence Tehran could execute an operation of that complexity. (WSJ)  \n\nGulf oil flows excluding Iran surged to over 81% of pre-war levels in September, data showed, led by a recovery in Saudi exports, while Iranian exports fell to zero due to a US blockade. (RTRS)\n\nAt least 50 tankers carrying Iranian oil remain backed up near Iran under the US blockade, according to United Against Nuclear Iran. Bloomberg’s preliminary tracking estimates show Iran loaded no crude onto tankers in September, the first zero-loading month since the war began. (BBG)  \n\nIranian Interior Minister Momeni said talks in Doha addressed Qatar and Pakistan’s mediation efforts, with proposals discussed aimed at reducing regional tensions and averting further war. (IRNA)\n\nUN Secretary-General António Guterres arrived in Islamabad for a three-day visit, with Iran-US mediation among the subjects for talks with Pakistan’s political and military leadership. No breakthrough was announced. (IRNA)  \n\nRecovering Hormuz crude flows aren’t resolving the diesel shortage: crude shipments reached 76% of prewar levels, but refined products accounted for just 11% of total oil flows versus over 20% before the war. Damaged refineries mean a full recovery could take well into 2027, analysts told WSJ. (WSJ)  \n\nTrump signed an order allowing wider on-road use of tax-exempt red diesel, effectively offering a 24-cent-a-gallon federal tax saving. The IRS will waive penalties on highway sales through year-end; energy specialists warned limited distribution could constrain the benefit. (BBG)  \n\nThe World Bank warned that Asian governments’ energy subsidies may prove unsustainable, forecasting Middle East oil exports would not regain pre-war levels until mid-2027. It nevertheless raised its 2026 East Asia and Pacific growth forecast to 4.5%, citing AI investment and exports. (BBG)  \n\nMACRO:\n\nUS borrowing costs for companies rated CCC or below reached 17%, the highest since May 2020, as the Treasury sell-off spreads into corporate credit. BofA cut its forecast for this month’s investment-grade issuance to $110bn from roughly $160bn. (FT)  \n\nCommercial-property buyers are demanding price cuts or threatening to abandon deals as financing costs rise, WSJ reports. The share of CMBS mortgages in special servicing reached 11.42% in August, its highest since February 2013, according to Trepp. (WSJ) \n\nFT’s Unhedged column flags a potential dollar vulnerability: huge foreign inflows into US AI assets and falling currency hedging have left investors heavily exposed to USD. An AI reversal or renewed hedging could trigger substantial dollar selling, drawing on Nomura and BNY analysis. (FT)  \n\nAn OECD survey of 8,000 employers found just 1% of firms adopting AI were cutting headcount mainly because of the technology. FT reports economists remain sceptical of predictions of mass job losses, despite slowing entry-level tech hiring. (FT)  \n\nHSBC maintains its call for further steepening in the U.S. 5s30s Treasury curve. Strategist Dhiraj Narula said volatility and the lack of clear technical resistance are keeping investors sidelined despite increasingly attractive long-end yields. (WSJ) \n\nThe BoJ may signal this month that underlying inflation has roughly hit its 2% target, according to Reuters sources, highlighting its readiness to raise interest rates again in the coming months. Many in the central bank are cautious about delivering another hike this month. (RTRS)\n\nBoJ Governor Ueda said on Tuesday it was becoming more important to anchor underlying inflation around the central bank's 2% target, signalling readiness to keep raising interest rates to blunt the risk of too-high inflation. (RTRS)\n\nJapan’s 10-year auction was well received, where it attracted a bid-to-cover of 3.76, versus 3.29 previously and a 12-month average of 3.21; the tail narrowed to 0.02 from 0.12. JGB futures pared losses as yields above 3% brought buyers back. (BBG)  \n\nCiti’s Tomohisa Fujiki said JGB yields are approaching their peaks, with 2.5–3% fair value for the 10-year if inflation stabilises near 2%. Citi expects curve flattening and warned crowded long-bank/short-property positioning could reverse. (BBG)  \n\nUS VP Vance told reporters that the $54bn Alaska LNG project with South Korea would proceed, despite Seoul making participation conditional on commercial viability and Trump threatening trade retaliation. South Korea said it transferred the first $2.4bn of investment funding under the US trade deal last week. (BBG)\n\nSocGen remains neutral on Korean equities and prefers Taiwan as memory-chip earnings momentum fades and buyers disappear. Foreign investors sold $25bn of Korean stocks in August–September, while turnover has fallen around 75% from June’s peak; strategists described an “absence of marginal buyers.” (WSJ)    \n\nSouth Korea’s President Lee said there were signs AI was used in attacks exposing customer data at seven financial firms. Hackers appear to have targeted third-party systems rather than core payment networks; no stolen funds have been reported. (FT)  \n\nAustralia’s Westpac consumer sentiment index fell 4.7% to 80.4 following the RBA hike and continued fuel-price pressure. Responses collected after the rate decision registered just 67.2; Westpac expects another hike in November. (BBG) \n\nAustralian Treasurer Jim Chalmers told Bloomberg TV that higher bond yields would squeeze the budget as cheap debt is refinanced. He will incorporate the impact into the year-end budget update; RBC estimates current market yields could add about A$6bn to four-year costs. (BBG)   \n\nNew Zealand’s NZIER survey showed a net 43% of firms expecting economic improvement, with seasonally adjusted confidence the strongest since 2014. Actual demand remained weak, while fewer businesses planned price rises, suggesting limited pass-through of higher costs. (BBG) \n\nNew Zealand’s governing National Party fell to 25.9%, its weakest polling result since 2020, in an RNZ-Reid Research survey ahead of November’s election. Neither main bloc would command a majority, leaving the centrist Opportunity Party potentially holding the balance of power. (BBG)   \n\nGermany’s coalition is struggling to agree tax measures worth more than €4bn annually, with disputes over sugar, plastics and crypto gains threatening the budget deal. One official told Bloomberg that November approval of the 2027 budget could no longer be assumed. (BBG)  \n\nGerman factory orders fell 10.6% M/M in August versus -1% expected, following July’s 3.2% rise. Large orders drove the decline: excluding them, orders slipped just 0.1%, while the three-month measure remained up 1.3%. (BBG)  \n\nGermany’s AfD is expected to secure its first regional parliament presidency in Saxony-Anhalt on Tuesday with support from the hard-left BSW. The party is separately seeking enough votes to install its first state premier. (FT)  \n\nFrench far-right presidential candidate Marine Le Pen presents plans on Tuesday to cut government spending by €25 billion ($28 billion) a year, seeking to establish her fiscal credibility in the face of a growing bond market crisis. (RTRS)\n\nFrance’s 10-year borrowing costs have approached 5%, with its spread over Bunds widening by almost two-thirds in a month to around 140bp. FT reports growing investor concern that political resistance to budget cuts could turn the sell-off into a broader Eurozone crisis. (FT)  \n\nFrance faces more than $1tn of debt maturities by 2030 and plans roughly $380bn of issuance next year, as traditional buyers retreat and borrowing costs approach 5%. WSJ reports debt-servicing costs are projected to rise 59% by 2030, with political paralysis undermining efforts to contain spending. (WSJ)  \n\nFrench teachers are joining nationwide student protests demanding more education spending, adding pressure as the government seeks budget restraint. National Rally said it wants to avoid worsening the bond crisis and acknowledged that toppling the government could contribute to an escalation. (BBG)  \n\nCzech inflation accelerated more than expected last month after the central bank warned that tighter monetary policy may be warranted to tame price growth. (BBG)\n\nPhilippine September CPI accelerated to 7.2% Y/Y versus 6.8% expected, ending four months of slowing inflation. Food and fuel drove the upside surprise, strengthening the case for further BSP tightening at its October 22 meeting. (BBG)\n\nThai September CPI rose 2.82% Y/Y versus 3.1% expected and 2.53% previously. The Commerce Ministry expects further acceleration in Q4 as fuel costs feed through, with flooding estimated to add around 0.1 percentage point to inflation. (BBG)  \n\nEQUITIES:\n\nOpenAI is discussing a $30bn funding round with UAE investors including MGX and with BlackRock, according to Bloomberg sources. The UAE syndicate could contribute up to $10bn; OpenAI is pitching a roughly $1.4tn pre-money valuation. (BBG)  \n\nWall Street banks have launched a record $60bn financing tied to Broadcom chips for Anthropic, according to the FT. (FT)  \n\nNvidia-backed Reflection launched its first open-weight model, Beam, targeting Chinese rivals in coding and agentic tasks. Reflection says it competes with https://t.co/da7jebtExB’s GLM-5.2 and is approaching Qwen3.8-Max; the model activates 23bn of its 501bn parameters per task. (RTRS)  \n\nSemiAnalysis estimates Claude subscriptions offer roughly five times the API-equivalent value of comparable mid-tier ChatGPT plans following OpenAI’s limit reductions. Its analysis highlights subscription subsidies as a significant drag on AI-lab inference margins. (SemiAnalysis)  \n\nGoogle is nearing a multiyear nuclear-power agreement worth at least $1bn with Constellation, according to Bloomberg sources. An announcement could come this week; the capacity and location have not been established. (BBG) \n\nAMD’s Lisa Su said demand still exceeds supply across CPUs, GPUs and AI products, and AMD will increase its previously announced $10bn Taiwan supply-chain investment. Supply should rise substantially in 2027, but customers could absorb more; planning now extends three to five years ahead. (China Times) \n\nOpenAI and Anthropic told Australian parliament on Tuesday they would welcome laws requiring them to report data breaches carried out by their AI agents, acknowledging the decision to notify authorities was currently at their discretion. (RTRS)\n\nOracle’s 2025 healthcare breach affected nearly 20 million people, according to newly reported disclosures from the Texas attorney general. The compromised information included Social Security numbers and medical records; the scale had not previously been disclosed. (BBG)   \n\nBanks are expanding into Asian GPU lending, broadening funding for the AI buildout despite uncertainty over chip depreciation. Citi, JPMorgan, Barclays, Deutsche Bank, Santander and SMBC are evaluating GPU-linked loans, according to Bloomberg sources. (BBG)  \n\nKKR’s retail private-credit fund K-FITS will exceed its 5% quarterly redemption cap to meet all requests, after withdrawals reached 5.06% of shares versus 3.43% previously. The fund cited sufficient liquidity to fulfil the requests in full. (BBG)  \n\nDayOne Data Centers publicly filed for a US IPO after previously exploring a raise of up to $5bn at around $20bn valuation. Its filing showed first-half revenue rising to $512m from $151.5m, while its net loss widened to $81.9m. (BBG)  \n\nNextEra’s $67bn Dominion takeover faces growing political opposition in Virginia, with Governor Abigail Spanberger seeking concessions on electricity bills, jobs and investment. FT reports the backlash is raising pressure for tougher approval conditions despite improved customer credits and employment guarantees. (FT)  \n\nKorean memory suppliers are quoting sharply higher HBM4 long-term contract prices for 2027, according to DIGITIMES supply-chain reporting: approximately $1,400–1,600 versus $500–550 in 2026. (DIGITIMES)  \n\nSeagate and Toshiba are competing for TDK’s hard-drive magnetic-heads business in a potential multibillion-dollar deal, Bloomberg sources said. TDK is the only independent supplier of the component; its shares jumped 7.3% as the bidders seek to secure AI storage supply. (BBG)  \n\nDeepSeek is close to raising at least 80bn yuan ($12bn), exceeding its original 50bn-yuan target, according to Bloomberg sources. Tencent and CATL are among the largest backers, with signed term sheets potentially taking the round toward 100bn yuan ahead of an early-2027 IPO. (BBG)  \n\nMoonshot AI completed its final private funding round at roughly $50bn valuation and is targeting a Hong Kong IPO in Q1 2027, according to Bloomberg sources. Early investor meetings could begin this month; the company has considered raising up to $5bn. (BBG)  \n\nGrab and GoTo face mounting pressure from driver protests, high fuel costs and tighter commission rules across south-east Asia. Their long-running merger talks remain on hold because of Indonesian policy uncertainty, according to FT sources. (FT)  \n\nCVC increased its Recordati offer to €53 per share from €51.29, valuing the pharmaceutical company at €10.5bn. The revised bid remains below the €60 sought by shareholder Palliser; Recordati closed Monday at €52.20. (BBG)  \n\nBPCE acquired roughly 7% of Banco Sabadell, will receive board representation and committed to keeping its stake below 10%. The banks described the investment as friendly and will explore cooperation across investment banking, leasing and consumer credit. (BBG)  \n\nDATA RECAP (Newsquawk):\n\nAustralian Westpac Consumer Confidence Change (Oct) -4.7% (Prev. -5.2%)\nAustralian Westpac Consumer Confidence Index (Oct) 80.4 (Prev. 84.4)\nEU S&P Global Construction PMI (Sep) 43.4 (Prev. 43.0)\nFrench Industrial Production M/M (Aug) -0.3% vs. Exp. 0.3% (Prev. -0.6%)\nFrench S&P Global Construction PMI (Sep) 39.8 (Prev. 37.3)\nGerman S&P Global Construction PMI (Sep) 43.5 (Prev. 48.7)\nHong Kong S&P Global PMI (Sep) 49.2 (Prev. 49.5)\nIndian HSBC Composite PMI Final (Sep) 55.9 vs. Exp. 56.5 (Prev. 54.3)\nIndian HSBC Services PMI Final (Sep) 55.2 vs. Exp. 56.2 (Prev. 54.1)\nItalian S&P Global Construction PMI (Sep) 46.5 (Prev. 41.7)\nPhilippine Core CPI Y/Y (Sep) 4.7% vs. Exp. 4.4% (Prev. 4.1%)\nPhilippine CPI M/M (Sep) 1.0% vs. Exp. 0.6% (Prev. 0.6%)\nPhilippine CPI Y/Y (Sep) 7.2% vs. Exp. 6.6% (Prev. 6.1%)\nSpanish Industrial Production Y/Y (Aug) 1.5% (Prev. 2.5%)\nSwiss Unemployment Rate (Sep) 3.0% (Prev. 3.0%)\nThai Core CPI Y/Y (Sep) 1.50% vs. Exp. 1.54% (Prev. 1.44%)\nThai CPI Y/Y (Sep) 2.82% vs. Exp. 3.1% (Prev. 2.53%)", "url": "https://x.com/ZackEiseman/status/2107379291851735335", "lane": "tariff_costs_economic_strain", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107552189090775496", "t": "2026-10-06T19:22:52+00:00", "views": 40986, "likes": 209, "reposts": 73, "handle": "MehekCooke", "name": "Mehek Cooke🇺🇸", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZ  IMMEDIATE RELEASE\n\nPresident Donald J. Trump is delivering on his promise to the American worker: build it here, power it here, and put paychecks back in the communities Washington left behind. In a matter of weeks, President Trump has locked in a run of steel, nuclear, gas, shipbuilding, and medical manufacturing commitments that will hire American workers and strengthen American security.\n• President Trump announced that Mesabi Metallics will build a $15 billion steel complex in Iowa the largest steel plant ever built in the United States. Fed by American iron ore and driven by the Trump Administration’s steel tariffs, the fully integrated mine-to-mill complex will create 1,750 new, permanent jobs, support up to 6,000 construction jobs, and generate an estimated $95 billion in economic output.\n\n• President Trump and Anduril announced Arsenal-2, the biggest new American shipyard push since World War II, now moving forward in Maryland. The yard will produce critical Virginia-class components and large assemblies, create about 3,100 direct jobs, and support more than 11,000 indirect jobs. Anduril is investing $3.7 billion in private capital; the Navy is putting up to $2.9 billion behind it as part of the Trump Administration’s push to reshore America’s defense industrial base.\n\n• President Trump unveiled a South Korean energy investment package of up to $200 billion in the United States. The package includes as much as $120 billion to build eight large-scale nuclear plants, $54 billion tied to the Alaska LNG pipeline, and $22.3 billion for a six-gigawatt natural gas power facility in Texas.\n\n• Vice President Vance announced that the Department of Energy will invest $150 million to advance a major new transmission line in Alaska. The project includes 223 miles linking the Beluga power station on the southern coast with Healy in the Interior, a corridor serving ports and nearly three-quarters of the state’s population.\n\n• Becton Dickinson announced a $19 bi   const isMobile = window.innerWidth < 560;
  const isVideo = /[?&]video=1/.test(location.search) || document.body.classList.contains('video');
  if (isVideo) document.body.classList.add('video');

  // ---- derived ------------------------------------------------------------
  posts.forEach(p => { p.ts = +new Date(p.t); p.isCopy = !!p.copy_origin; });
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  // range: ?days=N shows the last N days of the window; long windows default to 14 so the dots stay readable
  const allMax = d3.max(posts, p => p.ts) || Date.now(), allMin = d3.min(posts, p => p.ts) || allMax;
  const windowDays = (allMax - allMin) / 864e5;
  const daysParam = (location.search.match(/[?&]days=(\d+|all)/) || [])[1];
  const rangeDays = daysParam === 'all' ? 0 : daysParam ? +daysParam : windowDays > 21 ? 14 : 0;
  const rangeStart = rangeDays ? allMax - rangeDays * 864e5 : -Infinity;
  const drawn = posts.filter(p => laneByKey[p.lane] && p.ts >= rangeStart);           // 'other' lane is not drawn
  if (!drawn.length) {
    const a = d3.select('#app');
    a.append('h1').text(meta.title);
    a.append('p').attr('class', 'sub').text(lanes.length > 1 ? 'No posts in any lane yet — run classify, then export and render again.' : 'No lanes yet — run discover (or write lanes into the incident YAML), then classify, export, render.');
    return;
  }
  const drawnIds = new Set(drawn.map(p => p.id));
  const links = edges.filter(e => drawnIds.has(e.src) && drawnIds.has(e.dst));
  const tMin = d3.min(drawn, p => p.ts), tMax = d3.max(drawn, p => p.ts);
  const span = Math.max(1, tMax - tMin);
  const vMin = Math.max(1, Math.min(meta.min_views || 1, d3.max(drawn, p => p.views) || 1)), vMax = Math.max(vMin + 1, d3.max(drawn, p => p.views) || 1);   // copies under the threshold sit at the lane floor

  const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtAxis = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);
  hl.append('p').attr('class', 'sub').text(meta.subtitle);
  if (windowDays > 10 && !isVideo) {
    const r = hl.append('p').attr('class', 'range');
    r.append('span').text('Showing ');
    [[7, 'last 7 days'], [14, 'last 14 days'], [30, 'last 30 days'], [0, 'the whole window']].filter(([d]) => !d || d < windowDays + 1).forEach(([d, label], i, arr) => {
      const on = rangeDays === d;
      r.append('a').attr('href', '?days=' + (d || 'all')).attr('class', on ? 'on' : '').text(label);
      if (i < arr.length - 1) r.append('span').text(' · ');
    });
  }
  const clock = head.append('div').attr('class', 'clock');
  const clockDate = clock.append('div').attr('class', 'date');
  const clockTime = clock.append('div').attr('class', 'time');
  const clockSpeed = clock.append('div').attr('class', 'speed');

  const statsEl = app.append('div').attr('class', 'stats');
  const stat = (cls, label) => { const s = statsEl.append('div').attr('class', 'stat ' + cls); const n = s.append('div').attr('class', 'n'); s.append('div').attr('class', 'l').text(label); return n; };
  const sPush = stat('push', 'posts pushing the story');
  const sRep = stat('rep', 'repeated posts');
  const sBack = stat('back', 'posts pushing back');

  const ctl = app.append('div').attr('class', 'controls');
  const playBtn = ctl.append('button').attr('aria-label', 'Play').text('▶');
  const slider = ctl.append('input').attr('type', 'range').attr('min', 0).attr('max', 1000).attr('value', 1000);
  const spd = ctl.append('div').attr('class', 'spd');
  spd.append('span').text(isMobile ? '' : 'speed');
  const speeds = [20, 40, 80];      // seconds for the whole window
  let speedIdx = 1;
  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.
  const band = isMobile ? 30 : isVideo ? 28 : 42;
  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;
  const stripH = markets.length ? (isMobile ? 54 : isVideo ? 62 : 72) : 0;
  // events (incidents/events.yaml) inside the drawn span, grouped when they share a moment; they get a band under the axis
  const evMap = new Map();
  (DATA.events || []).forEach(e => { const t = Date.parse(e.at); if (!(t >= tMin - span * 0.015 && t <= tMax + span * 0.02)) return; const g = evMap.get(t) || { t, labels: [], types: [] }; g.labels.push(e.label + (e.all_day ? ' (all day)' : '')); g.types.push(e.type); evMap.set(t, g); });
  const events = [...evMap.values()].sort((a, b) => a.t - b.t);
  const evBand = events.length && !isMobile ? 26 : events.length ? 10 : 0;
  const top = 22 + stripH + evBand, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : t === 'trump' ? '#ff6b6b' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
