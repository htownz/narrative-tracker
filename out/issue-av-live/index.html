s://x.com/ThomasAlxDmy/status/2108993361482809523", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108993862425313711", "t": "2026-10-10T18:51:34+00:00", "views": 1538, "likes": 26, "reposts": 1, "handle": "OndrejBacina", "name": "Ondrej Bacina ⚡️🔋🚗 🤖🇨🇿🇺🇦", "avatar": "", "followers": 6717, "text": "@robotaxi Cybercab Chief Engineering Eric Early \n\nSedalo a dveře jsou vytvořeny pro lidi na vozíku.\n\nCele vozidlo je vyrobené pro maximální bezpečnost a future design co vyvolá WOW speciálně u dětí.\n \nAsi jste si všimli že se zvýšil počet Cybercab v Austin zvedl. To je teprve začátek! Počkejte budete šokováni jak to rozjedem!\n\nSorry @Kicom21 to není dobrá zpráva …", "url": "https://x.com/OndrejBacina/status/2108993862425313711", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108995346143875370", "t": "2026-10-10T18:57:28+00:00", "views": 2576, "likes": 151, "reposts": 12, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "300+ Cybercabs officially confirmed in the Austin, TX fleet 📈\n\nGlad to see Tesla giving some visibility into the progress of the Robotaxi service ✅", "url": "https://x.com/RobotaxiRadar/status/2108995346143875370", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108998751150911923", "t": "2026-10-10T19:11:00+00:00", "views": 1865, "likes": 12, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "A Vegas rider tried Waymo and Zoox. Here’s his takeaways vs. Robotaxi 📝\n\n🔴 Very few pickup/dropoff points\n 🔴 Little time to reach pickup (@wholemarsblog had the same complaint about Robotaxi in Austin yesterday)\n 🟡 Pickup spots weren't clearly shown, so the exact location was confusing\n 🟡 Zoox dropoff led to a long walk to his actual destination\n 🟡 Waymo steering felt indecisive, like Tesla FSD a couple years ago\n 🔴 Another Zoox kept backing into his Zoox. Going around it pushed his car partway into the next lane, too close to a fast-moving semi 😬\n 🟢 Still preferred Zoox for its nice little touches\n\nPickup/dropoff is an industry-wide problem. The ride comfort issues seem to be a bigger issue with the other AV services, not Robotaxi ✍️", "url": "https://x.com/RobotaxiRadar/status/2108998751150911923", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109000964623761610", "t": "2026-10-10T19:19:47+00:00", "views": 13852, "likes": 127, "reposts": 3, "handle": "OndrejBacina", "name": "Ondrej Bacina ⚡️🔋🚗 🤖🇨🇿🇺🇦", "avatar": "", "followers": 6718, "text": "Došel jsem se zeptat osobně jak je to s počtem @robotaxi v Austin kvůli @Kicom21 a když jsem mu řekl o té sázce tak se smál a říkal že právě oznámili 300+ já mu říkám že na to bude komentář že si to @tesla vymýšlí.\n\nOn se zasmál a řekl že máš přiletět a podívat se sám :) Jakube. https://t.co/qrDObsuQ0s", "url": "https://x.com/OndrejBacina/status/2109000964623761610", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109010715424239693", "t": "2026-10-10T19:58:32+00:00", "views": 6229, "likes": 46, "reposts": 2, "handle": "NotATeslaApp", "name": "Not a Tesla App", "avatar": "", "followers": 58610, "text": "Tesla Now Has 300+ Cybercabs in Austin, Dallas Rides Next\n\nTesla says its Austin Cybercab fleet grew 8x in its first month, and VP of AI Ashok Elluswamy says Dallas is the next city to get the purpose-built robotaxi.\n\nFull Story:\nhttps://t.co/hPuPtnc2sG", "url": "https://x.com/NotATeslaApp/status/2109010715424239693", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109012340691615869", "t": "2026-10-10T20:05:00+00:00", "views": 1279, "likes": 15, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Visitors from Sweden are experiencing the future of transportation in Austin while the Swedish Transport Agency can’t even approve FSD supervised 🤨", "url": "https://x.com/RobotaxiRadar/status/2109012340691615869", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109013499397685617", "t": "2026-10-10T20:09:36+00:00", "views": 58544, "likes": 1132, "reposts": 54, "handle": "wholemars", "name": "Whole Mars Catalog", "avatar": "", "followers": 2191945, "text": "I wonder how many cars they’ll have 30 days from now?", "url": "https://x.com/wholemars/status/2109013499397685617", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109015803593114081", "t": "2026-10-10T20:18:45+00:00", "views": 4230, "likes": 56, "reposts": 0, "handle": "joeamacek", "name": "Joe Macek", "avatar": "", "followers": 364, "text": "@robotaxi Just was in Austin \n\nSaw 10 Cybercabs for every Waymo I saw", "url": "https://x.com/joeamacek/status/2109015803593114081", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109038287205654649", "t": "2026-10-10T21:48:06+00:00", "views": 2625, "likes": 18, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during a busy Saturday evening with ACL to Zilker Park in Austin. Looking good! https://t.co/tP1PO3pJZY", "url": "https://x.com/WorldlyReviewer/status/2109038287205654649", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109042180568580156", "t": "2026-10-10T22:03:34+00:00", "views": 4923, "likes": 19, "reposts": 2, "handle": "Sam_Badawi", "name": "Sam Badawi", "avatar": "", "followers": 56016, "text": "Tesla $TSLA reportedly expanded its autonomous robotaxi fleet in Austin eightfold in just 30 days, reaching approximately 300 vehicles. https://t.co/rG06764CPg", "url": "https://x.com/Sam_Badawi/status/2109042180568580156", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109046026934137276", "t": "2026-10-10T22:18:51+00:00", "views": 1516, "likes": 16, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Uber vs. Robotaxi Afternoon Update - ACL Weekend 2 / @theXtakeover edition:\n\n🚕 Model Y - $20.10 - 18 min wait ⏱️ 🚕 Cybercab - $21.75 - 9 min wait ⏱️ 🚙 Uber Comfort Electric - $26.99 - 7 min wait ⏱️ 🚙 UberX - $19.94 - 6 min wait ⏱️\n\n🟢 Model Y undercuts Comfort Electric by 26%, $20.10 vs $26.99, the widest gap I've seen against Uber's EV tier\n 🟢 Robotaxi fares came DOWN from yesterday into Zilker. Model Y $29.48 ➡️ $20.10, Cybercab $32.78 ➡️ $21.75\n 🟡 UberX is cheapest by $0.16 and 12 min quicker than Model Y\n 🟢 Cybercab is the faster Tesla at 9 min, second straight check\n\nYesterday Robotaxi was $10 above Uber into Zilker. Today it's level. Supply caught up to the festival ✍️", "url": "https://x.com/RobotaxiRadar/status/2109046026934137276", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109052472803418512", "t": "2026-10-10T22:44:28+00:00", "views": 13902, "likes": 350, "reposts": 20, "handle": "GrindeOptions", "name": "Cole Grinde", "avatar": "", "followers": 57508, "text": "Dallas is the ninth-most populous city in the United States and the third-most populous city in Texas, with about 1.3 million residents.\n\nI think $TSLA is going to do well with the Robotaxi service there.\n\nWe could see Dallas scale as fast as we seen Austin scale.\n\nHundreds and eventually thousands of cybercabs will roam their streets.", "url": "https://x.com/GrindeOptions/status/2109052472803418512", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109058619480387918", "t": "2026-10-10T23:08:53+00:00", "views": 4009, "likes": 101, "reposts": 11, "handle": "muskonomy", "name": "Muskonomy", "avatar": "", "followers": 88295, "text": "NEWS: Tesla's Cybercab fleet in Austin has passed 300 vehicles.\n\nThat is an 8 times increase in 30 days.\n\nThe milestone comes one month after launch.\n\nSource: Tesla Robotaxi https://t.co/LKlf8JxLd6", "url": "https://x.com/muskonomy/status/2109058619480387918", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109067803240050980", "t": "2026-10-10T23:45:23+00:00", "views": 47931, "likes": 576, "reposts": 41, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8935, "text": "Big jump today for Cybercab, closing the gap with Waymo. \n\nFactor in Model Y Robotaxis and there are more Tesla Robotaxis than Waymos being spotted on the road in Austin today https://t.co/2kWsAkz5l9", "url": "https://x.com/ethanmckanna/status/2109067803240050980", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109074374384853080", "t": "2026-10-11T00:11:30+00:00", "views": 7651, "likes": 31, "reposts": 1, "handle": "mylifeonmystyle", "name": "Shawn", "avatar": "", "followers": 9321, "text": "Elon系日报 20261010\n\n1. 🚕 Tesla：Cybercab即将进入Dallas！\n\nTesla VP Ashok Elluswamy在X上表示，Cybercab已遍布Austin，Dallas很快也将加入。这是Tesla高管对Dallas部署Cybercab的明确预告，但正式运营日期尚未公布。\n\n2. 🚗 Tesla上海工厂：出口暴增58%，国内零售下降9%！\n\nCPCA数据显示，9月上海工厂批发95,366辆，同比+5%，创2026年单月新高。其中，出口30,529辆，同比+58%；中国国内零售64,837辆，同比-9%。\n\n上海工厂增长主要由出口推动，国内市场仍面临竞争压力。\n\n3. 🗺️ Tesla：北美地图两个月内再次更新！\n\nTesla开始推送北美地图版本NA-2026.38，距离上次更新仅约两个月。新版地图更新街道、限速及车道数据，有望改善导航质量，为FSD提供更准确的路线信息。\n\n4. 🚗 Tesla FSD v13.4.12开始小范围推送！\n\nTesla开始向少量用户推送FSD v13.4.12，目前尚未全面铺开。更新说明与上个版本相同。\n\n5. 🤖 Tesla × xAI：Digital Optimus取得新进展！\n\nElon表示，Digital Optimus仅通过观察屏幕，就能完成《Diablo》约一半的游戏流程，在《Counter-Strike》中也取得不错表现，目前正在训练《League of Legends》。\n\n目标是让AI掌握不同游戏和数字环境中的操作能力。目前属于Elon披露的研发进展，尚缺少独立测试验证。\n\n6. 🚕 Cybercab：Grok Bot即将进入车内！\n\nTesla AI高级工程师Yun-Ta Tsai在X上回复称，Cybercab车内Grok访问用户个人Grok Bots的功能即将更新，他本人每天都在测试。\n\n这意味着Cybercab未来不仅是无人驾驶汽车，还可能成为乘客使用AI数字员工的入口。\n\n7. 🚀 SpaceX：21颗美国军用卫星成功入轨！\n\n10月10日凌晨，Falcon 9从加州范登堡基地发射21颗美国太空发展局SDA卫星，一级助推器成功返回陆地。\n\n这批卫星将进一步建设美国低轨军事数据传输网络，增强军事通信能力。\n\n8. 🇮🇳 Starlink：Elon与印度首富的争端继续升级！\n\nElon在X上分享两篇历史调查报道，涉及Reliance关联企业支持印度执政党BJP的政治广告及捐款。这是继Elon公开质疑Mukesh Ambani之后的进一步施压。\n\n争端正在从Starlink市场准入，延伸至印度政商关系与市场竞争。\n\n9. 🌎 Starlink：委内瑞拉正式批准运营！\n\n委内瑞拉政府宣布正式授权Starlink在该国运营。有利于Starlink进一步扩大当地商业服务。\n\n10. ⭐ X Takeover：Nicki Minaj公开力挺Grok！\n\n10月10日，X Takeover在Tesla得州超级工厂举行。歌手Nicki Minaj现场表示，Grok改变了她的生活，并谈到利用AI建立数字助手团队。\n\nElon被列为线上采访嘉宾，其母亲Maye Musk也参与活动。\n\n11. 🚕 Cybercab：乘客或可实时查看车辆摄像头！\n\nTesla社区消息称，Cybercab正在准备让乘客通过车内屏幕查看后方和侧方摄像头画面。\n\n这可能改善无人驾驶乘客的安全感和乘坐体验，但Tesla尚未确认正式推出时间。", "url": "https://x.com/mylifeonmystyle/status/2109074374384853080", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109142316669607970", "t": "2026-10-11T04:41:28+00:00", "views": 9643, "likes": 167, "reposts": 6, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8935, "text": "Night 2 of stress testing Cybercab through crazy ACL traffic\n\nVery impressed. Handled lots of wild pedestrians running into the road, terrible drivers, cones, hand signaling, closures, and insane traffic very well\n\nOne spot the car wasn’t aggressive enough when merging and so a couple people took advantage of that which probably added 5 mins to the eta. Otherwise nothing notable", "url": "https://x.com/ethanmckanna/status/2109142316669607970", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109163728830636490", "t": "2026-10-11T06:06:33+00:00", "views": 3161, "likes": 183, "reposts": 5, "handle": "xdNiBoR", "name": "Robin", "avatar": "", "followers": 21102, "text": "Holy shit. It's finally here! \nWe can now say with high confidence there are more Robotaxis than Waymo's in Austin. 2 years ofter the We Robot event, Waymo lost its lead. \n\nSlowly at first...", "url": "https://x.com/xdNiBoR/status/2109163728830636490", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109171893500854644", "t": "2026-10-11T06:39:00+00:00", "views": 75152, "likes": 1293, "reposts": 134, "handle": "aakashgupta", "name": "Aakash Gupta", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAZAAEBAAMBAAAAAAAAAAAAAAAGBQIDBwT/xAAZAQEBAQADAAAAAAAAAAAAAAAEBQEAAgP/2gAMAwEAAhADEAAAAei45HuaBoaWI3q94tqgU6RU83fOX2oVsdK+1OoPUcowRKuLdueO3KrIk3KK9OV//8QAIBAAAQUAAgMBAQAAAAAAAAAAAwABAgQFEhQGERM0Nf/aAAgBAQABBQJkcwq4bu7euFz9TUqyrlGcKZeT/wAaiCMGDFuOaSVfWUVuDctBuwI5e7A1IZJX1FaP4Hsv9iXCzbLl93UV5FsRoV65PTdjiLEsCaHtaGvaIzikYox8w54Ixlow6+jQ0SMP/8QAHREAAgIDAAMAAAAAAAAAAAAAAAIBEQMSIQQiMf/aAAgBAwEBPwEXxY16Ous0L9FjlGetyGuaEsbL7zZ//8QAGxEAAgMBAQEAAAAAAAAAAAAAAAECAxESMSH/2gAIAQIBAT8BJXvr4Rl0tH4T30p3klW4rWTaFRsE0f/EACYQAAIBAwIGAgMAAAAAAAAAAAECAwAREiExBBATQVFhIlIzY3H/2gAIAQEABj8CozTMFRdzTJwilEB+OO9KeJjkli73pZYmyVtucoG5IFYqK2o8MPwyjIDweeP7FNWQm1/NKqsfdqheTcX5zaXst6usdz4pGePE3090ZrY46W59OMK879vr/aAluuWoIrpI7SSE2tTcMdJVbX3yIVump+tW1LUARQwjGR8VLH3PyrEnLHsa/8QAHxABAAMAAgIDAQAAAAAAAAAAAQARIVFhMUFxkdEQ/9oACAEBAAE/IZJSmk3Y53K9t1GRF3pDpghBWj+23CD07ZkGHUy9ZsrOF8P/AGMUqZoEPFMX35kpAl+SiAceM3tV75jFLrFlA+GZ4KktDiZT6PDL0yB+UWKVbagtBz+I98AYEAFNRbFDGtuPqMcDbeX3AQtll+2EXueElRHPGsuH0DuyWIW0reT/2gAMAwEAAgADAAAAEDDEe186adP/xAAaEQEBAQEBAQEAAAAAAAAAAAABABExIVGB/9oACAEDAQE/EA1k7Tsru47ELTlyH7EQgTN8+xA8a+3/xAAbEQEBAAMAAwAAAAAAAAAAAAABABEhMUFhgf/aAAgBAgEBPxB1GwGoBFqmyJgXQzmOrHyfy8Ne7//EACIQAQACAgIBBQEBAAAAAAAAAAEAESExQVFhEHGBobGRwf/aAAgBAQABPxAy8yzR8B2vBHGFVcWVbOqgM6DfMZMnlz9y7X+v6PSaTiVHOTdWBr/Ifw8LyZVE6BWPmURBowIVOqb9oqL9AwZDuCZ+4huqKWLui7xn/YnqcicaGncoOkBs5HBXzwR4mQg+QaAH8uL6YRBe77fqV4d3qW8WnGHhl9WGOBFufAV6GUJYkvZS0kc5oW52oueQ11XUCofC87o+7gGZVwC8urCvmAQW5KGRHnZm1sAt3V7sCC13qTCeEmr+u094FsEcNXAW/ciIJZRPBFzr8n//2SAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA==", "followers": 334859, "text": "Waymo took a year and a half to get 300 robotaxis on the road in Austin. Tesla just did it in 5 weeks.\n\nThe whole difference is a car factory in Texas.\n\nEvery Waymo starts out as somebody else's car. A Jaguar I-Pace gets built in Austria, shipped across the ocean, then hand-fitted with lidar, radar, and computers that analysts peg at over $100,000 per vehicle. After 15 years of doing it that way, Waymo's entire worldwide fleet is around 4,000 cars.\n\nThe Cybercab just rolls off a line at Giga Texas.\n\nTwo seats, no steering wheel or pedals, not even side mirrors. People look at that and see a bold design. A factory sees fewer parts, and fewer parts means the line moves faster and each car costs less to build.\n\nTesla designed the whole thing around its unboxed assembly process, where chunks of the car get built in parallel and come together at the end. Elon says the target is 2 million Cybercabs a year out of one factory. You can't get anywhere near that retrofitting luxury SUVs by hand.\n\nThe sticker price is the wild part. Tesla's target is under $30,000 per Cybercab. That's Toyota Camry money. So for what Waymo spends putting one car on the road, Tesla can put out four or five.\n\nTo be fair, Tesla ran Model Ys around Austin for 15 months before the first Cybercab picked anyone up, and 300 cars in one city doesn't prove the business works yet.\n\nBut look at the growth rates. For ten years the hard part of robotaxis was teaching a car to drive itself. Once that's solved, the hard part becomes building cars fast and cheap. And one company in this race spent the last 20 years getting good at exactly that.\n\nWaymo builds robotaxis the way NASA builds satellites, one at a time, by hand. Tesla builds them the way it builds cars. Because they are cars.", "url": "https://x.com/aakashgupta/status/2109171893500854644", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109197832410563036", "t": "2026-10-11T08:22:04+00:00", "views": 4092, "likes": 27, "reposts": 0, "handle": "JasonZX", "name": "Jason Z", "avatar": "", "followers": 28173, "text": "Tesla Cybercab在推出一个月后，在Austin一地已经扩展到300多辆Cybercab上路，在30天内猛增了了8倍！！这个数字已经超过robotaxitracker网站上记录的在Austin运行的所有Robotaxi的总数。LFG！！让金色浪潮淹没Austin！！ https://t.co/HxWgJEiyMR", "url": "https://x.com/JasonZX/status/2109197832410563036", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109206118039986540", "t": "2026-10-11T08:55:00+00:00", "views": 8580, "likes": 157, "reposts": 15, "handle": "tslaming", "name": "Ming", "avatar": "", "followers": 46053, "text": "Every Robotaxi and Optimus bot needs memory to turn AI models into real-world action. As Tesla scales production, locking down that memory supply is becoming a critical pillar of its manufacturing strategy—and that’s precisely why Terafab matters.\n\nAccording to Counterpoint Research, DRAM demand for humanoid robot \"brains\" is projected to surge roughly twentyfold between 2026 and 2030, reaching 21,500 TB (21.5 petabytes). As robots grow more capable and production ramps up, robotics will emerge as another major demand driver for memory makers.\n\nAutonomous driving adds even more pressure. Micron notes that Level 4 and higher autonomous vehicles typically require over 200 GB of memory—more than ten times what today’s Level 2+ and Level 3 vehicles use. Meanwhile, Goldman Sachs estimates the global commercial robotaxi fleet could reach roughly 1 million vehicles by 2030 and 6 million by 2035.\n\nAt an estimated 200 GB per vehicle, those fleets would represent about 200 petabytes and 1.2 exabytes of cumulative onboard memory, respectively. While that reflects total installed memory across active fleets rather than annual chip demand, it underscores the staggering hardware footprint underpinning autonomous driving.\n\nLeading DRAM suppliers already operate at massive scale. SemiAnalysis estimates that Samsung, SK hynix, and Micron will close out 2026 with monthly wafer capacities of roughly 720,000, 595,000, and 385,000, respectively. Combined, that comes out to about 1.7 million wafers per month—or roughly 20.4 million a year.\n\nYet those same fabs must also supply AI data centers, smartphones, PCs, and the broader automotive market. Because High-Bandwidth Memory (HBM) consumes significantly more wafer capacity per bit than standard DRAM, competition for cleanroom space and production lines is fiercer than ever. Even with planned capex expansions, Micron expects memory supply to tighten further through 2027 and 2028.\n\nTesla’s internal targets illustrate just how high the stakes are. Its Q2 2026 update pegs installed Cybercab capacity at over 125,000 vehicles annually. For Optimus, Tesla has outlined an initial Fremont line slated for 1 million units per year, with a second-generation line in Texas targeting a long-term run rate of 10 million. \n\nDelivering on those ambitions will demand a silicon supply chain capable of feeding millions of autonomous systems every year.\n\nTerafab is engineered for that scale. \n\nWith a stated target of 1 terawatt of compute output annually, the project is designed to power both terrestrial and orbital workloads—explicitly earmarking AI5 for FSD and Optimus, AI6 for next-gen Optimus, and D3 for space-based computing.\n\nBy co-locating logic, memory, and advanced packaging under a single roof, Terafab would hand Tesla end-to-end control over the hardware stack powering its autonomous future. \n\nRather than competing with Big Tech for external fab allocation and packaging lines, Tesla could synchronize processor yields, memory procurement, and packaging directly with vehicle and bot production schedules—all while shrinking design-to-silicon iteration cycles.\n\nIf Tesla pulls this off, the payoff is clear: more Robotaxis on the road, more Optimus units on factory floors, and a vertically integrated silicon engine built to sustain them both.", "url": "https://x.com/tslaming/status/2109206118039986540", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109230096619839593", "t": "2026-10-11T10:30:17+00:00", "views": 18594, "likes": 286, "reposts": 24, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1643, "text": "New record: 912 Cybercab sightings in Austin yesterday, with 766 driverless\n\n#cybercab #tesla #robotaxi https://t.co/elt8JEPv2I", "url": "https://x.com/CybercabSpotter/status/2109230096619839593", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109252184240013333", "t": "2026-10-11T11:58:03+00:00", "views": 1067, "likes": 34, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Tesla robotaxi wait times and pricing on a early Sunday morning in Austin https://t.co/nPoHRD9VDa", "url": "https://x.com/WorldlyReviewer/status/2109252184240013333", "lane": "rider_economics_experienc ext": "Cybercab sightings hit ANOTHER new all-time high in Austin! 😯🥳\n\n✏️ Driverless = 766 ✏️ Total = 912\n\n✅ Total 912, a new record. The previous record was 868 on Oct 3\n\n✅ Driverless 766, beating the old record of 670 by nearly 100\n\n✅ Driverless share 84%, a new high by a wide margin\n\n✅ Saturday vs Saturday with ACL both weekends: total +5%, driverless +14%\n\nMatched festival days, so the crowd size is roughly the same. The difference is increase in Cybercab registrations this week showed up on Austin streets - more of the fleet is running driverless and serving customers 📈", "url": "https://x.com/RobotaxiRadar/status/2109263073097797636", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109263758124253349", "t": "2026-10-11T12:44:02+00:00", "views": 9778, "likes": 77, "reposts": 11, "handle": "AsFoundX", "name": "As Found", "avatar": "", "followers": 308853, "text": "🚨 TESLA CYBERCABS HIT 300 IN AUSTIN\n\nOne month after launch, Tesla has scaled to more than 300 Cybercabs serving Austin.\n\nThat is an 8x increase in just 30 days.\nThe fleet is growing fast as more people get access to autonomous rides in the city.\n https://t.co/hMvyWCJIPl", "url": "https://x.com/AsFoundX/status/2109263758124253349", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109266108356112504", "t": "2026-10-11T12:53:23+00:00", "views": 1253, "likes": 21, "reposts": 1, "handle": "thepowerfulHRV", "name": "Mark Harvey", "avatar": "", "followers": 23648, "text": "Despite an eight-year head start, $TSLA’s Robotaxi fleet will soon surpass Waymo in Austin.\n\nTesla’s Robotaxis cost half as much and look way cooler.\n\nUnless Waymo can close that gap, $TSLA will continue taking market share. https://t.co/qVYoBl8SR1", "url": "https://x.com/thepowerfulHRV/status/2109266108356112504", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109267744462078243", "t": "2026-10-11T12:59:53+00:00", "views": 1947, "likes": 28, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Rider stress testing Cybercab in Austin City Limits traffic says it held up well 👍🏻\n\n✅ Pedestrians running into the road ✅ Cones blocking lanes ✅ People hand-waving the cab through ✅ Lane and road closures ✅ Heavy festival traffic\n\nAll handled cleanly 👌🏻", "url": "https://x.com/RobotaxiRadar/status/2109267744462078243", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109269785918021866", "t": "2026-10-11T13:07:59+00:00", "views": 1924, "likes": 57, "reposts": 4, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24288, "text": "Tesla Cybercab Sets Another Record in Austin! 🚕🔥\n\nOn October 10, Cybercab sightings in Austin, Texas, hit a new all-time high of 912!\n\n1️⃣ Total sightings: 912 (New record!)\n2️⃣ Driverless sightings: 766\n3️⃣ Driverless share: 84.0%\n\nIn mid-September, daily sightings were around 100–200. Now they’ve surpassed 900!\n\nEven more impressive, 84% of sightings involved vehicles operating without a driver.\n\nAt this pace, 1,000 daily sightings could be just around the corner!\n\nTesla’s Robotaxi expansion is accelerating rapidly!", "url": "https://x.com/TeslaZoa/status/2109269785918021866", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109272471815782496", "t": "2026-10-11T13:18:40+00:00", "views": 6821, "likes": 224, "reposts": 13, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10580, "text": "The gap between Waymo and Cybercab presence in Austin closed yesterday 📈\n\nAdd in Model Ys, and Robotaxi has the active fleet to overtake Waymo in Austin - and they're only just starting to scale 🚕 https://t.co/L2kSz3er5y", "url": "https://x.com/RobotaxiRadar/status/2109272471815782496", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109274355599372325", "t": "2026-10-11T13:26:09+00:00", "views": 55099, "likes": 581, "reposts": 50, "handle": "StockSavvyShay", "name": "Shay Boloor", "avatar": "", "followers": 458281, "text": "$TSLA says its Austin Cybercab fleet has grown 8x to over 300 vehicles in just 30 days\n\nTesla’s biggest advantage is owning entire stack from manufacturing to software &amp; chips allowing it to scale robotaxi supply without relying on third party automakers https://t.co/fThhHPEYLE", "url": "https://x.com/StockSavvyShay/status/2109274355599372325", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109297638650585497", "t": "2026-10-11T14:58:40+00:00", "views": 14462, "likes": 31, "reposts": 3, "handle": "Teslainvestor88", "name": "Tesla 💯 investor", "avatar": "", "followers": 5859, "text": "真正的自动驾驶革命，从来不是先跑起来再道歉，而是连一只灰色小猫都不敢碰。\n\n马斯克刚说了两句极关键的话：\n\n1. Robotaxi推出时安全是第一位的，因为一次伤害就会成全球头条，监管可能直接关掉项目；\n2.waymo已经撞死了很多宠物，特斯拉不想重蹈覆辙。\n\n这不是技术短板，而是故意把夜跑窗口卡在11点一专门攻克“灰色小猫+灰色柏油路”这种最低对比度边缘案例。\n\nWaymo早有KitKat、Austin本地Tommy等公开宠物事故记录，却继续24小时跑；特斯拉选择先把记录做成“零伤害”再扩规模。\n\n结果就是Cybercab一个月内在Austin从几十台狂飙到300+台（8倍），Model Y数量几乎停增，全在往无方向盘、无踏板的专用车倾斜。\n\n安全哲学换来的是监管和公众信任的通行证，而不是短期跑得最晚的虚荣。\n\nCybercab不是在追waymo的夜班，是在建一个别人已经破功的“零事故”护城河。 https://t.co/YjLY9V9hFL", "url": "https://x.com/Teslainvestor88/status/2109297638650585497", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109308981122367662", "t": "2026-10-11T15:43:44+00:00", "views": 1551, "likes": 23, "reposts": 1, "handle": "SusanZheng18", "name": "Susan to Mars🚀", "avatar": "", "followers": 207, "text": "My last Cybercab ride before heading to the airport! \nI had total of 15 Cybercab rides during my 4 days stay in Austin. Cybercab is safer, more comfortable, more cleaner, and cheaper than Uber. I enjoyed every single ride here. \n\nEven I will miss the Cybercab after I get back to Virginia. But the memories of the Cybercab, the Giga factory, the Tesla employees and the Tesla community will stay with me❤️❤️❤️\n\n Wish Cybercab will come to Washington DC area soon 🚀🚀🚀\n@teslaownersSV @theXtakeover @Tesla @robotaxi", "url": "https://x.com/SusanZheng18/status/2109308981122367662", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109310967293083819", "t": "2026-10-11T15:51:38+00:00", "views": 2003, "likes": 27, "reposts": 0, "handle": "OverlyTrev", "name": "Overly Trev’s Future", "avatar": "", "followers": 6898, "text": "$10.43 for a Cybercab it was 7 min away and it is taking us 1.1 miles to a Coffee shop. \n\nWill report on how much it is on the way back https://t.co/wgfrXKYc9L", "url": "https://x.com/OverlyTrev/status/2109310967293083819", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109312623015563452", "t": "2026-10-11T15:58:13+00:00", "views": 16334, "likes": 229, "reposts": 18, "handle": "AlexanderKr", "name": "Alexander Kristensen", "avatar": "", "followers": 12437, "text": "Tesla is eating Wyamos lunch in Austin. \n\nObserving the amount of Waymos I see in Austin going around town in the Cybercab. They don't seem to be that prevalent as they where last year I was here. It's not that hard to reach the conclusion that Tesla is the majority of the AV rides in Austin rn.", "url": "https://x.com/AlexanderKr/status/2109312623015563452", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109313500950429944", "t": "2026-10-11T16:01:42+00:00", "views": 1029, "likes": 16, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 11\n\nWaymo: 1185\nTesla: 739\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2109313500950429944", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2109313978568704281", "t": "2026-10-11T16:03:36+00:00", "views": 1190, "likes": 9, "reposts": 0, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18760, "text": "For those on the ground, is Waymo slipping its lead in Austin?", "url": "https://x.com/teslayoda/status/2109313978568704281", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109315435686773239", "t": "2026-10-11T16:09:23+00:00", "views": 4983, "likes": 106, "reposts": 6, "handle": "RandyWKirk1", "name": "Randy Kirk", "avatar": "", "followers": 17954, "text": "The other day I posted about Robotaxis and Elon's desire to be able to avoid hitting grey kittens. Here is the update. \n\nElon says the night-time pet problem is solved. In his X Takeover interview, he said Tesla \"actually did solve\" spotting gray kittens on dark pavement at night. \n\nHe had called that the main thing keeping Robotaxi from running 24 hours, so watch for overnight service next. \n\nAustin still shuts down at 11 PM, and there's no date for FSD v15 or 24/7 rides. \n\nHe also called Waymo \"pet destroyers.\"", "url": "https://x.com/RandyWKirk1/status/2109315435686773239", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109317958908399877", "t": "2026-10-11T16:19:25+00:00", "views": 1027, "likes": 14, "reposts": 0, "handle": "BeardedTesla", "name": "Bearded Tesla", "avatar": "", "followers": 19860, "text": "@grok So if just Austin is the equivalent of 7% of the entire Waymo fleet, at the 30 day ramp rate claimed, how long would it take Tesla to match Waymo fleet size?", "url": "https://x.com/BeardedTesla/status/2109317958908399877", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109319788791222581", "t": "2026-10-11T16:26:41+00:00", "views": 3108, "likes": 11, "reposts": 2, "handle": "OverlyTrev", "name": "Overly Trev’s Future", "avatar": "", "followers": 6898, "text": "Cybercab 12 minutes on the way back about the same price $10.52\n\nTaking Model Y @robotaxi it’s a little cheaper $9.45 and only 6 minutes \n\nStill fantastic wait times here in Austin Texas. https://t.co/gFqFSdc3wa", "url": "https://x.com/OverlyTrev/status/2109319788791222581", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109328030791323669", "t": "2026-10-11T16:59:26+00:00", "views": 6811, "likes": 227, "reposts": 13, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10580, "text": "Robotaxis may be the majority of AV rides in Austin, TX 🤔\n\nCybercab riders noticing that Waymos are starting to be less prevalent in Austin, TX ✍️\n\nThey’re also stopping for small animals on the road as Elon promised 🐿️👇🏻\n https://t.co/MQEuHhXTsV", "url": "https://x.com/RobotaxiRadar/status/2109328030791323669", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109341106299089247", "t": "2026-10-11T17:51:24+00:00", "views": 1131, "likes": 27, "reposts": 4, "handle": "TeslaHype", "name": "Tesla Hype", "avatar": "", "followers": 25935, "text": "Tesla Self-Driving on my way to Starbase allows me to be safe while enjoying the beauty of Texas https://t.co/tVykquTpLv", "url": "https://x.com/TeslaHype/status/2109341106299089247", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109344573193396620", "t": "2026-10-11T18:05:10+00:00", "views": 2264, "likes": 59, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Wait times in Austin continue to outperform this weekend ⏱️\n\nCybercab pricing still shows high demand while prices and wait times for both Robotaxi options are dropping  📉👍🏻\n https://t.co/MNrs3NiCOJ", "url": "https://x.com/RobotaxiRadar/status/2109344573193396620", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109345908370338002", "t": "2026-10-11T18:10:28+00:00", "views": 1134, "likes": 12, "reposts": 3, "handle": "Chansoo", "name": "Chansoo Byeon", "avatar": "", "followers": 15659, "text": "Tesla's Cybercab fleet in Austin grew 8x in 30 days.\n\n@robotaxi says 300+ Cybercabs are now serving Austin one month after launch. Texas DMV lists 739 Tesla robotaxis (319 Cybercab + 420 Model Y).\n\nWaymo is at ~4,000 vehicles across 15 cities, up from ~1,500 in May 2025. That's about 6% per month, doubling roughly once a year.\n\nIf Giga Texas reaches its stated 125K+/yr Cybercab capacity, Tesla's fleet could pass Waymo's around the turn of the year. Dashed lines are estimates, not forecasts.\n\nPossible implications:\n\n• The race shifts from who has the best driver to who can build cars fastest\n• Waymo's Hyundai (50K order) and Zeekr ramp becomes its key lever\n• Tesla's bottleneck moves to regulators (NHTSA audit) and ops, not hardware\n\n@elonmusk @robotaxi\n$TSLA", "url": "https://x.com/Chansoo/status/2109345908370338002", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109346094564131276", "t": "2026-10-11T18:11:13+00:00", "views": 1466, "likes": 34, "reposts": 2, "handle": "jeremyjudkins_", "name": "Jeremy Judkins", "avatar": "", "followers": 48713, "text": "I’m meeting my cousin for dinner in Austin while I am in town and he asked if this was part of the event I was attending. \n\nNope just a really cool advertisement featuring @cybertruck and @robotaxi https://t.co/dDuhEomamb", "url": "https://x.com/jeremyjudkins_/status/2109346094564131276", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109347464872436094", "t": "2026-10-11T18:16:40+00:00", "views": 4789, "likes": 14, "reposts": 1, "handle": "Newsforce", "name": "NewsForce", "avatar": "", "followers": 668454, "text": "🇺🇸BREAKING: @Tesla’s @Robotaxi fleet just hit 300+ Cybercabs serving Austin, only 1 month after launch—an 8x surge in merely 30 days.\n\nThe gold 2-seaters are rolling off the line as the company races to flood city streets with fully autonomous rides.\nhttps://t.co/wkJnLEB1rY", "url": "https://x.com/Newsforce/status/2109347464872436094", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109352066628133043", "t": "2026-10-11T18:34:57+00:00", "views": 38233, "likes": 170, "reposts": 9, "handle": "briandstone", "name": "Brian Stone", "avatar": "", "followers": 5147, "text": "Combined, Jeremy and I have spent a total of $820.76 on @robotaxi rides 😳 https://t.co/jmJ1J7ziap", "url": "https://x.com/briandstone/status/2109352066628133043", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109359296710357239", "t": "2026-10-11T19:03:40+00:00", "views": 4168, "likes": 22, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi on the last day of ACL on a Sunday afternoon in Austin. Wait times are looking good as the ACL rush is starting https://t.co/rHvST1fyMu", "url": "https://x.com/WorldlyReviewer/status/2109359296710357239", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109364388595400978", "t": "2026-10-11T19:23:54+00:00", "views": 3209, "likes": 52, "reposts": 7, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Final day of Austin City Limits weekend 2 and Robotaxi fares have dropped every single day of the festival 🎸\n\n🚕 Model Y - $18.94 - 20 min wait ⏱️\n🚕 Cybercab - $21.19 - 15 min wait ⏱️ 🚙 Uber Comfort Electric - $22.99 - 7 min wait ⏱️ 🚙 UberX - $17.96 - 7 min wait ⏱️\n\n🟢 Model Y undercuts Comfort Electric by 18%, $18.94 vs $22.99. Fourth straight day beating Uber's EV tier\n 🟢 Robotaxi fares to Zilker have fallen every day of this festival weekend. Model Y $29.48 Fri ➡️ $20.10 Sat ➡️ $18.94 today\n 🟡 UberX is cheapest at $17.96, just $0.98 under Model Y\n 🔴 Uber is still much quicker to the curb, 7 min vs 20 for Model Y. Might mean demand for Robotaxi is still higher 🤔\n\nThree days into ACL and Robotaxi's price gap to Uber has closed from $10 to under a dollar. Robotaxi continues to gain on Uber in Austin ✍️", "url": "https://x.com/RobotaxiRadar/status/2109364388595400978", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109366679511659006", "t": "2026-10-11T19:33:01+00:00", "views": 3172, "likes": 24, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "It seems Robotaxi isn’t afraid of driving over ALL railroad crossings 🧐\n\nTesla may still be iterating on all of the currently restricted sections of the Austin geofence that cause rerouting\n https://t.co/RXAF35EUJi https://t.co/xMvTFXEsL4", "url": "https://x.com/RobotaxiRadar/status/2109366679511659006", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109371968608969013", "t": "2026-10-11T19:54:02+00:00", "views": 22342, "likes": 121, "reposts": 5, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8940, "text": "Per hour comparison of Waymo v Cybercab over the last 48hrs\n\n4 hour period where Cybercab was ahead, otherwise Waymo iPace remains the most seen AV on the road https://t.co/s6Q2ot7Yjy", "url": "https://x.com/ethanmckanna/status/2109371968608969013", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109372203330330722", "t": "2026-10-11T19:54:58+00:00", "views": 153054, "likes": 76, "reposts": 4, "handle": "JeebsTX", "name": "JeebsTX 🇺🇸", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAA K/YH9RcJ2qv5Di8cL7n/9kgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg", "followers": 7747, "text": "“Hold on to your Tesla stock. It’s going to be worth a lot, I think. That’s my bet.”\n— Elon Musk\n\nTesla’s current market cap is barely $1.5 trillion. Robotaxi/Autonomy has $5 trillion potential on its own.\n\nAfter experiencing Cybercabs in Austin I feel good about the long-term and remain forever bullish on Tesla’s upside via FSD/Robotaxi and Optimus.\n\nGiddy up fellow TSLA longs 🤠", "url": "https://x.com/JeebsTX/status/2109423322299576634", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109426268060213383", "t": "2026-10-11T23:29:48+00:00", "views": 4239, "likes": 12, "reposts": 0, "handle": "mylifeonmystyle", "name": "Shawn", "avatar": "", "followers": 9089, "text": "Elon系日报 20261011\n\n1. 🚀 Elon亲自招募Terafab芯片工程师\n\nElon公开邀请全球顶尖芯片设计与制造工程师加入Tesla或SpaceX，参与Terafab项目。\n\n目标是大幅加快芯片设计、制造与测试的迭代速度，推动AI芯片研发进入更快周期。Tesla正在尝试突破对外部芯片制造能力的依赖，为Optimus、Cybercab及未来AI计算建立长期优势。\n\n2. 🚕 Elon确认Cybercab正在规模化扩张\n\nElon转发Robotaxi车队数据，并表示：“Cybercab is scaling.”\n\nTesla此前公布，Austin已有超过300辆Cybercab，30天内规模增长约8倍。Tesla正加快扩大单一市场的车队规模，而不仅仅是进入更多城市。\n\n3. 🇮🇳 印度议员以国家安全为由反击Elon\n\n印度执政党议员Nishikant Dubey公开回应Elon关于Starlink市场准入的批评，强调印度国家安全机构的担忧不能被忽视。\n\n此前Elon指责印度电信市场受到既得利益集团保护，消费者缺乏充分竞争。Starlink进入印度的争议，正从商业竞争延伸至国家安全与监管领域。\n\n目前这属于议员的公开表态，并非印度政府宣布新的禁令。\n\n4. 🚀 SpaceX：Starlink 15-25发射推迟\n\n原计划10月10日进行的Starlink 15-25任务，现推迟至10月12日19:00（美东）。\n\n发射地点：加州范登堡太空军基地SLC-4E。\n\n执行任务：Falcon 9，助推器B1088第20次飞行，计划部署27颗Starlink卫星。\n\n5. 👩‍🦳 Maye Musk：74岁时差点拒绝泳装封面\n\n10月11日，Elon母亲Maye Musk接受Fox News Digital专访，宣传新书《Timeless》。她回忆，2022年受邀登上《Sports Illustrated》泳装特刊封面时，因为担心自己的皱纹和橘皮组织，差点拒绝。\n\n但当她告诉女儿拍摄地点是伯利兹时，女儿立即鼓励她前往。最终，74岁的Maye成为当时该杂志史上最年长的泳装封面模特。\n\n如今78岁的她仍活跃在时尚界。Maye的经历展示了年龄并不必然限制职业发展。她也成为Musk家族中独立拥有公众影响力的人物。\n\n6. ✨ Giga Texas上演Cybercab无人机灯光秀\n\nX Takeover活动期间，Giga Texas上空出现Cybercab造型的无人机灯光表演，并与现场Tesla车辆灯光秀配合。现场视频随后在X传播。\n\nCybercab正在从一款新车型逐渐成为Tesla未来自动驾驶业务的品牌象征。\n\n#ElonDaily https://t.co/UelmCitl6y", "url": "https://x.com/mylifeonmystyle/status/2109426268060213383", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109427345962721755", "t": "2026-10-11T23:34:05+00:00", "views": 32630, "likes": 354, "reposts": 25, "handle": "OwenSparks", "name": "Owen Sparks", "avatar": "", "followers": 32585, "text": "So true, it's like Cybercab is on every street in Austin. I've taken multiple rides where I don't see a Waymo, but have seen a Cybercab every single time. https://t.co/gcr2hTdOtd", "url": "https://x.com/OwenSparks/status/2109427345962721755", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109448799567397109", "t": "2026-10-12T00:59:20+00:00", "views": 1481, "likes": 10, "reposts": 1, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "CONGRESS AVE · AUSTIN · TX https://t.co/eY1wdiEaSY", "url": "https://x.com/CybercabSpotter/status/2109448799567397109", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109452344811295027", "t": "2026-10-12T01:13:25+00:00", "views": 121862, "likes": 2227, "reposts": 216, "handle": "TitaniumTomP", "name": "Tom⚡️", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H/ botaxi in Austin alone 🤫⚡️", "url": "https://x.com/Gfilche/status/2109538654553289170", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109539886005211338", "t": "2026-10-12T07:01:16+00:00", "views": 56749, "likes": 1457, "reposts": 116, "handle": "Gfilche", "name": "Gali", "avatar": "", "followers": 197313, "text": "Cybercab is the iPhone of transport  ⚡️\n\nTesla hitting $100B in @Robotaxi revenue is going to happen sooner than people realize 📈\n\nBeing in Austin for 4 days and Cybercabing everywhere has totally shifted my perspective\n\nThe city was FLOODED, almost overnight in Tesla gold 🌊", "url": "https://x.com/Gfilche/status/2109539886005211338", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109568353916407933", "t": "2026-10-12T08:54:24+00:00", "views": 39417, "likes": 705, "reposts": 39, "handle": "alex_avoigt", "name": "Alex", "avatar": "", "followers": 168039, "text": "Waymo is done in Austin!\n\nThey may still try to deny it but its over for them and just a question of time until they accept defeat.\n\nThe same will happen in other cities ones Tesla deploys Cybercabs in large numbers.", "url": "https://x.com/alex_avoigt/status/2109568353916407933", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109592481872388575", "t": "2026-10-12T10:30:16+00:00", "views": 4928, "likes": 67, "reposts": 8, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1659, "text": "757 Cybercab sightings in Austin yesterday, with 591 driverless\n\n#cybercab #tesla #robotaxi https://t.co/UKbU1rCUwD", "url": "https://x.com/CybercabSpotter/status/2109592481872388575", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109609132936307155", "t": "2026-10-12T11:36:26+00:00", "views": 1043, "likes": 12, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "ACL weekend 2 wraps with the driverless share still climbing in Austin 📈\n\n✏️ Driverless = 591 ✏️ Total = 757\n\n✅ Driverless share 78%, up from 74% on the matched Sunday\n\n✅ Sat + Sun combined: 81% driverless, up from 75%\n\n✅ Weekend driverless up 6% (1,357 vs 1,275)\n\n✅ Sunday total came in 8% below last Sunday, though weekend volume was nearly flat overall (down 1% - 1,669 vs 1,689)\n\nBoth festival weekends were nearly identical in total volume, while the driverless share increased ✍️", "url": "https://x.com/RobotaxiRadar/status/2109609132936307155", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109610007922622821", "t": "2026-10-12T11:39:55+00:00", "views": 1316, "likes": 24, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Cybercab density in Austin is starting to surpass Waymo in certain times of day 📈\n\nSaturday & Sunday 2pm-5pm saw more Cybercab activity than Waymo 📝\n\nAustin City Limits may be the cause of increased Cybercab supply in the city. We’ll see if similar results are present during the week ✍️", "url": "https://x.com/RobotaxiRadar/status/2109610007922622821", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109612216203010364", "t": "2026-10-12T11:48:41+00:00", "views": 54448, "likes": 144, "reposts": 6, "handle": "MatthewDR", "name": "Matthew Donegan-Ryan", "avatar": "", "followers": 25052, "text": "If Robotaxi eats Waymo’s lunch in Austin then Google might try to outbid SpaceX and acquire Tesla…", "url": "https://x.com/MatthewDR/status/2109612216203010364", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109613515178967315", "t": "2026-10-12T11:53:51+00:00", "views": 5347, "likes": 28, "reposts": 5, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3865, "text": "Tesla robotaxi wait times and pricing on a early Monday morning in Austin https://t.co/6hEYU2YGsR", "url": "https://x.com/WorldlyReviewer/status/2109613515178967315", "lane": "rider_economics_experience", "copy_origin": "2105989391143620795", "in_dataset": 1, "copies": 0}, {"id": "2109613828400914654", "t": "2026-10-12T11:55:06+00:00", "views": 1193, "likes": 39, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Seeing multiple Cybercabs at a traffic light is starting to get more common in Austin🚦🚕🚕 https://t.co/XX13JuSiGq", "url": "https://x.com/RobotaxiRadar/status/2109613828400914654", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109620515656581345", "t": "2026-10-12T12:21:40+00:00", "views": 24820, "likes": 34, "reposts": 1, "handle": "mylifeonmystyle", "name": "Shawn", "avatar": "", "followers": 9553, "text": "重大突发：🚨 Cybercab发生交通事故，事情可能并非表面看起来那么简单！\n\n10月12日，一张Cybercab事故照片在网上引发关注。照片显示，一辆Cybercab前舱盖严重变形，前方皮卡尾部受损，现场散落着车辆碎片。\n\n最初，不少人认为这是一起Cybercab追尾事故。但随着更多网友评论出现更多信息，事情可能发生反转。\n\n① 事故地点可能是田纳西州Memphis，而非Robotaxi主要运营城市Austin。\n\n② 有网友转述事故现场的另一种说法：第三辆车先撞击皮卡，导致皮卡向后移动，随后与Cybercab发生碰撞。\n\n③ 涉事Cybercab可能是一辆原型测试车，而非正式投入无人驾驶运营的车辆。\n\n目前尚无法确认Cybercab是否处于自动驾驶状态，更没有证据证明FSD存在驾驶失误。\n\n这起事故再次说明：一张照片可以告诉我们发生了碰撞，却无法告诉我们事故责任属于谁。\n\n随着Cybercab测试和运营规模扩大，类似事件会越来越受到关注。我们需要的是完整事实，而不是根据照片提前下结论。\n\n⚠️ 以上事故经过仍主要来自社交媒体讨论，尚待官方确认。这是疑似cybercab第二次卷入交通事故。", "url": "https://x.com/mylifeonmystyle/status/2109620515656581345", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109630424926339558", "t": "2026-10-12T13:01:02+00:00", "views": 1016, "likes": 21, "reposts": 2, "handle": "billykyle", "name": "Billy", "avatar": "", "followers": 11226, "text": "First day back from Austin and I saw a Cybercab on the highway - traveling west on I76 👀 \n\nLooks like the window is rolled down further than the Robotaxi software allows. https://t.co/2Q3yi85VaH", "url": "https://x.com/billykyle/status/2109630424926339558", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109632504952983585", "t": "2026-10-12T13:09:18+00:00", "views": 1521, "likes": 49, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "I’m genuinely surprised Cybercab caught up to Waymo this fast in Austin. Obviously Waymo as a whole is still miles ahead (literally millions) but great to see Tesla nailing the Cybercab in Austin like this. Now we just need those updated unsupervised miles during the earnings call", "url": "https://x.com/WorldlyReviewer/status/2109632504952983585", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109632840870645821", "t": "2026-10-12T13:10:39+00:00", "views": 3944, "likes": 64, "reposts": 3, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Austin Robotaxi Monday Early Morning Update:\n\n🚕 Model Y - $8.51 - 8 min wait ⏱️ 🚕 Cybercab - $9.93 - 13 min wait ⏱️\n\n🟢 Model Y is 14% cheaper and 5 min quicker\n 🟢 $8.51 is identical to Thursday's early morning Model Y quote to the cent\n 🟢 Early morning holds as the cheapest window. Last week ran $7.00, $7.71, $8.51 and today lands right back on that line\n 🟡 Cybercab is the slower Tesla for a fifth straight check, going back to Wednesday evening\n\n🧐 Pretty standard weekday readings for Robotaxi post-ACL✍️\n https://t.co/1Ehn9m8KUp", "url": "https://x.com/RobotaxiRadar/status/2109632840870645821", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109637715067314436", "t": "2026-10-12T13:30:01+00:00", "views": 1354, "likes": 10, "reposts": 1, "handle": "TCLA_Omar", "name": "TeslaClubLA", "avatar": "", "followers": 3793, "text": "1 of 4\nJust wrapped XTakeOver in Austin and ran a real-world comparison of 9 ride shares and 4 options :\n\nUber (Human driver + Human & FSD + Waymo) vs Tesla (CyberTaxi + CyberCab).\n\nTesla Vision-only rides were excellent — smooth, personalized, and they actually enforced seatbelts (wouldn’t start until buckled).\n\nOperational kinks remain but solid platform launch. Full feature and price comparisons next post. \n \n@teslaownersSV @theXtakeover", "url": "https://x.com/TCLA_Omar/status/2109637715067314436", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109641552041484574", "t": "2026-10-12T13:45:15+00:00", "views": 2604, "likes": 7, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Monday morning rush hour in Austin https://t.co/Cww1xcHF7l", "url": "https://x.com/WorldlyReviewer/status/2109641552041484574", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109644239092990021", "t": "2026-10-12T13:55:56+00:00", "views": 1488, "likes": 30, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Monday Morning Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $9.98 - 15 min wait ⏱️ 🚕 Cybercab - $11.27 - 13 min wait ⏱️ 🚙 Uber Comfort Electric - $9.99 - 8 min wait ⏱️ 🚙 UberX - $7.93 - 8 min wait ⏱️\n\n🟢 Model Y ties Comfort Electric, $9.98 vs $9.99. Fifth straight day it's matched or beaten Uber's EV tier\n 🟢 Model Y's rush hour step was only $1.47 today, $8.51 at 7am to $9.98 now. Last Wednesday it jumped by $4.27\n 🟡 UberX is cheapest at $7.93, a $2.05 gap\n 🟡 Cybercab beats Model Y on wait by 2 min, first time in six checks\n\nRobotaxi's morning surge is flattening out. The gap between early morning and rush hour keeps shrinking ✍️", "url": "https://x.com/RobotaxiRadar/status/2109644239092990021", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109645261698171177", "t": "2026-10-12T14:00:00+00:00", "views": 14255, "likes": 474, "reposts": 24, "handle": "szuchans", "name": "Sam Szuchan", "avatar": "", "followers": 9323, "text": "Earlier this month, as Tesla's robotaxi fleet in Austin extended its hours to 11pm, Elon Musk talked about his fear of the night: \"Literally trying to avoid grey kittens on grey tarmac in the dark.\" That's the use case for lidar, the laser sensor that most autonomous-driving companies use. Musk called it \"a fool's errand\" in 2019, when a ubiquitous Velodyne lidar cost around $75,000, and doubled down on cameras alone.\n\nSo far, the bet looks good. Tesla's FSD is the best of its kind, and by many measures ahead of Waymo's. It has sold 1.48 million FSD subscriptions, and when a Chinese car media company pitted 36 cars against highway obstacles, Tesla's camera-only Model 3 and X achieved the best score, beating several lidars. Even Waymo co-CEO Dmitri Dolgov agrees that \"Humans of course can drive with just eyes.\"\n\nBut lidars have come down in price dramatically. BYD, China's biggest automaker, includes lidar as a $1,700 upgrade on all its cars, even its budget Seagull, and its chairman Wang Chuanfu says that's \"already at cost\". Pony AI, a Chinese robotaxi company, says its total robotaxi cost, including lidars, is around $33,000, \"cheaper than the lowest-spec Tesla Model 3\". Not every Chinese automaker is a fan; Xpeng chairman He Xiaopeng has dropped lidars on his newer cars, saying \"in cars it is no longer needed\". But Chinese rules for the most advanced autonomous cars require more than one kind of sensor, and as of this spring, Baidu's lidar-equipped robotaxis had driven around 137 million driverless miles.\n\nThe cat problem is a rebuttal, too. In October 2025, a Waymo with lasers hit and killed KitKat, a gray tabby cat who lived at a corner store in San Francisco's Mission District. And Musk told Electrek privately in 2021 that \"vision with high-res radar would be better than pure vision.\" Cameras alone are good enough for most driving. And now that lidars may cost $200, the question is whether they're unnecessary ballast or cheap insurance for that once-in-a-while emergency on a dark night when you really need it (if vision alone can't figure it out).\n\nImages (cropped and graded), via Wikimedia Commons: Waymo Jaguar I-Pace — 9yz, CC BY 4.0; Apollo Go RT6 — S5A-0043, CC BY 4.0; Velodyne lidar — Steve Jurvetson, CC BY 2.0; Tesla cameras — Votpuske, CC BY 4.0; Dmitri Dolgov — Collision Conf, CC BY 2.0; Wang Chuanfu — Alexander-93, CC BY-SA 4.0.", "url": "https://x.com/szuchans/status/2109645261698171177", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109666958853738616", "t": "2026-10-12T15:26:13+00:00", "views": 16778, "likes": 363, "reposts": 29, "handle": "pbeisel", "name": "phil beisel", "avatar": "", "followers": 34275, "text": "Waymo thought 'Keep Austin Weird' meant this. \n\nThere are moments when the future comes into clear view. And what's past is past. \n\nHaving spent a week in Austin, its clear Tesla Cybercab is the future of transportation, not this science project on wheels.\n\nNot sure how Waymo competes.", "url": "https://x.com/pbeisel/status/2109666958853738616", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109670916192092590", "t": "2026-10-12T15:41:56+00:00", "views": 10800, "likes": 252, "reposts": 19, "handle": "GrindeOptions", "name": "Cole Grinde", "avatar": "", "followers": 57533, "text": "As of right now, $TSLA has reportedly been producing 250+ cybercabs per week at Giga Texas.\n\nI think just based on what’s happening at the factory right now, we are likely going to see production increasing WoW. \n\nIn 2027 we could definitely see a potential for 100,000 cybercabs and model Ys in the Robotaxi fleet. \n\nThat’s $8 billion per year in revenue and HIGH MARGIN revenue too. \n\nThe limiting factor is getting enough batteries and regulatory approval.", "url": "https://x.com/Gr tration algorithms \n– Trunk now opens automatically at end of ride if utilized \n– Grok @bot now available in Cybercab", "url": "https://x.com/robotaxi/status/2109742678435119540", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109770806607888407", "t": "2026-10-12T22:18:52+00:00", "views": 1920, "likes": 17, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Monday evening rush hour in Austin https://t.co/1GJsYmqJz1", "url": "https://x.com/WorldlyReviewer/status/2109770806607888407", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2109774234109296760", "t": "2026-10-12T22:32:29+00:00", "views": 1146, "likes": 18, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Monday Afternoon Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $8.91 - 15 min wait ⏱️ 🚕 Cybercab - $10.33 - 18 min wait ⏱️ 🚙 Uber Comfort Electric - $10.98 - 7 min wait ⏱️ 🚙 UberX - $6.93 - 8 min wait ⏱️\n\n🟢 Model Y undercuts Comfort Electric by 19%, $8.91 vs $10.98. Sixth straight day winning Uber's EV tier\n 🟢 Model Y came DOWN from this morning's rush. $9.98 at 9am to $8.91 now, the first day I've logged afternoon cheaper than morning\n 🟡 UberX is cheapest at $6.93, a $1.98 gap\n 🔴 Both Teslas are the slowest on the board, 15 and 18 min vs 7 and 8 for Uber\n\nRobotaxi's whole Monday ran in a $1.47 band: $8.51, $9.98, $8.91. Last Wednesday the same route swung $4.27 before lunch ✍️", "url": "https://x.com/RobotaxiRadar/status/2109774234109296760", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109791824709812466", "t": "2026-10-12T23:42:23+00:00", "views": 17739, "likes": 76, "reposts": 0, "handle": "ijkandco", "name": "iVan", "avatar": "", "followers": 455, "text": "@robotaxi @bot Rode one Sunday in Austin. Next update request: let us actually leave a tip 😂 https://t.co/mrFK8XQDYP", "url": "https://x.com/ijkandco/status/2109791824709812466", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109904746916249856", "t": "2026-10-13T07:11:06+00:00", "views": 2028, "likes": 58, "reposts": 1, "handle": "Scobleizer", "name": "Robert Scoble", "avatar": "", "followers": 607888, "text": "@SawyerMerritt They probably will.\n\nBut will be caught with pants down again as sales in cities stall due to Waymo and Robotaxi.\n\nThe consumer will change faster than they are expecting. Saw it in Austin this weekend.", "url": "https://x.com/Scobleizer/status/2109904746916249856", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109921079573799285", "t": "2026-10-13T08:16:00+00:00", "views": 61595, "likes": 516, "reposts": 37, "handle": "aakashgupta", "name": "Aakash Gupta", "avatar": "", "followers": 334877, "text": "People kept standing behind driverless Teslas holding their luggage, waiting for a trunk that nobody was there to open.\n\nSo Tesla wrote the fix and pushed it to the whole fleet at once. A problem discovered in Austin on a Tuesday became standard behavior across seven cities by Friday. A taxi company would spend years retraining drivers to change less than that.\n\nAnd the trunk is the smallest item on this list. The other bullets are where the money is.\n\nStart with the hours. 6am to 11pm is a 17 hour shift no human driver can work, and hours decide everything in this business because a robotaxi's cost per mile is mostly amortization. The car costs what it costs whether it's moving or parked, so every extra hour on the road spreads that fixed cost across more paid miles. Morgan Stanley pegs Tesla's operating cost at 81 cents a mile against $1.36 to $1.43 for Waymo. Longer hours widen that gap without building a single new car.\n\nThen there's the orchestration line, which reads like filler and is the hardest problem in the entire business.\n\nWait times don't drop the way you'd guess. Pickup distance scales with the square root of idle-car density, so cutting waits in half the brute force way takes roughly four times the cars. The affordable way is prediction. Lean empty cars toward downtown at 5pm, toward the stadium when the game ends, toward the airport when flights land. Studies of Uber and Lyft found around 40% of miles get driven with nobody in the back seat. Every dead mile an algorithm turns into a positioned car is a shorter wait Tesla didn't have to buy a vehicle for.\n\nWhich leaves Grok in the Cybercab, the early version of the real prize. Strip out the driver and a ride becomes 20 minutes of someone's full attention inside a cabin one company completely controls. Nobody has ever owned that surface before. It always belonged to the driver.\n\nUber spent a decade and thousands of engineers learning this curriculum the expensive way. Tesla is running it at fleet speed, where one car's lesson becomes every car's behavior by morning.", "url": "https://x.com/aakashgupta/status/2109921079573799285", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109954871000547555", "t": "2026-10-13T10:30:16+00:00", "views": 2999, "likes": 60, "reposts": 4, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "740 Cybercab sightings in Austin yesterday, with 505 driverless\n\n#cybercab #tesla #robotaxi https://t.co/PRHSrZYT2c", "url": "https://x.com/CybercabSpotter/status/2109954871000547555", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109957741502488942", "t": "2026-10-13T10:41:41+00:00", "views": 5690, "likes": 103, "reposts": 8, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Cybercab sightings remain strong post-Austin City Limit 110017094758621305", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110038048268337316", "t": "2026-10-13T16:00:47+00:00", "views": 1314, "likes": 28, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 13\n\nWaymo: 1185\nTesla: 739\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2110038048268337316", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2110048528084980110", "t": "2026-10-13T16:42:26+00:00", "views": 15044, "likes": 423, "reposts": 40, "handle": "KRoelandschap", "name": "Kees Roelandschap", "avatar": "", "followers": 11240, "text": "This thing deserves to be on every magazine and newspaper cover\n\nCybercab just looks like it belongs in the city, it's their natural habitat\n\n15 Robotaxi rides in Austin\n 13 in Cybercab, 2 in Model Y\n 100+ miles\n 6+ hours without a driver\n 0 interventions\n 0 remote assists\n\nNever before have I felt this safe, so comfortable and so relaxed during a taxi drive\n\nI've experienced about 20,000 miles of FSD in the US over multiple years and versions, took tens of Waymo rides and drove back and forth from Austin-Starbase on the latest FSD build\n\nBut this thing is on a another level\n\nHuge respect to every engineer at Tesla who made this possible! \n\nYou guys are building the future and yet still most people don't even realize it", "url": "https://x.com/KRoelandschap/status/2110048528084980110", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110050326900261197", "t": "2026-10-13T16:49:35+00:00", "views": 5097, "likes": 220, "reposts": 17, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Stellar review of the Austin Robotaxi service by @KRoelandschap \n\n☑️ 15 Robotaxi rides in Austin\n ☑️ 13 in Cybercab, 2 in Model Y\n ☑️ 100+ miles\n ☑️ 6+ hours without a driver\n ✅ 0 interventions\n ✅ 0 remote assists\n\n✅ Better than his 20,000 FSD miles driven before", "url": "https://x.com/RobotaxiRadar/status/2110050326900261197", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110069266062127529", "t": "2026-10-13T18:04:50+00:00", "views": 24788, "likes": 1788, "reposts": 162, "handle": "BLKMDL3", "name": "Zack", "avatar": "", "followers": 95596, "text": "I’ve now ridden in at least 30+ Cybercabs and in all my time riding in them it has NEVER once done a single awkward or weird maneuver while driving. \n\nTesla @robotaxi is so dialed in, great UI, and makes every other rideshare seem dumb, not smooth, and so antiquated. https://t.co/2AxD5yN1Gd", "url": "https://x.com/BLKMDL3/status/2110069266062127529", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110077465242615952", "t": "2026-10-13T18:37:25+00:00", "views": 2375, "likes": 125, "reposts": 15, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Rave reviews of the Cybercab continue to pile in after @theXtakeover event last week in Austin (@BLKMDL3):\n\n✅ 30+ rides\n✅ 0 awkward maneuvers while driving\n\nCybercab is the future 📈 https://t.co/7BLWswSNuS", "url": "https://x.com/RobotaxiRadar/status/2110077465242615952", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110085945252798768", "t": "2026-10-13T19:11:07+00:00", "views": 6142, "likes": 62, "reposts": 3, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Per @RtaxiTracker - Waymo density in Austin is currently ~85% higher than Cybercab density:\n\n🚙 Waymo: 3.03 per 1,000 vehicles\n🚕 Cybercab: 1.64 per 1,000 vehicles\n\  "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110132017253794036", "t": "2026-10-13T22:14:11+00:00", "views": 1945, "likes": 15, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Tuesday evening rush hour in Austin https://t.co/QM35S8pkXu", "url": "https://x.com/WorldlyReviewer/status/2110132017253794036", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2110154869285994910", "t": "2026-10-13T23:45:00+00:00", "views": 2835, "likes": 66, "reposts": 4, "handle": "DBurkland", "name": "Dan Burkland", "avatar": "", "followers": 11666, "text": "After countless @Robotaxi rides since it launched last year, I finally got the opportunity to ride in Cybercab this past week in Austin during @theXTakeover. What stood out most was how refined it all was. Hardware, software, UI, app: everything seamlessly worked together. I've ridden Waymo back to back with it, and Zoox just the week before. Neither compares to what Tesla has built. It's truly astonishing, and I'm excited to see the fleet size continue to ramp. Can't wait for Cybercab and Robotaxi in more US cities soon.\n\nUntil next time, Cybercab ✌️\n\n@Tesla @TeslaSI @aelluswamy @EricETesla @CarCoder", "url": "https://x.com/DBurkland/status/2110154869285994910", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110155237160018132", "t": "2026-10-13T23:46:27+00:00", "views": 6052, "likes": 215, "reposts": 18, "handle": "GrindeOptions", "name": "Cole Grinde", "avatar": "", "followers": 57533, "text": "The $TSLA FSD V15 should be going live this month or in November if teslas timeline holds true. \n\nThat’ll enable 24/7 Robotaxi in Texas and in Florida.\n\nThe technology is getting really freaking good.\n\nRapid growth in vehicles in the Robotaxi fleet will then follow suit because the level of safety would have dramatically improved and that’s the critical factor.", "url": "https://x.com/GrindeOptions/status/2110155237160018132", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110166910520401990", "t": "2026-10-14T00:32:51+00:00", "views": 1567, "likes": 9, "reposts": 0, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "5TH ST · AUSTIN · TX https://t.co/Tvv5x3FnLV", "url": "https://x.com/CybercabSpotter/status/2110166910520401990", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110317259155546510", "t": "2026-10-14T10:30:17+00:00", "views": 2322, "likes": 32, "reposts": 1, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "682 Cybercab sightings in Austin yesterday, with 490 driverless\n\n#cybercab #tesla #robotaxi https://t.co/scBQK6B9sc", "url": "https://x.com/CybercabSpotter/status/2110317259155546510", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110322616615551300", "t": "2026-10-14T10:51:34+00:00", "views": 2057, "likes": 81, "reposts": 4, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "The weekday floor for Cybercab sightings in Austin has moved up again 📈\n\n✏️ Driverless = 490 ✏️ Total = 682\n\n✅ Total up 22% vs last Tuesday (557)\n\n✅ Driverless up 18% vs last Tuesday (416)\n\n✅ Two weekdays at 740 and 682, both well above last week's 529-566 band\n\n🧐 Driverless share recovered to 72% from Monday's 68%, but both are below the 78-84% stretch during ACL\n\nThe weekday volume has increased this week, though driverless share has stayed in the low 70s ✍️", "url": "https://x.com/RobotaxiRadar/status/2110322616615551300", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110325925300621430", "t": "2026-10-14T11:04:43+00:00", "views": 4390, "likes": 28, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3865, "text": "Tesla robotaxi wait times and pricing on a early Wednesday morning as service has just started https://t.co/3XAQlasp9g", "url": "https://x.com/WorldlyReviewer/status/2110325925300621430", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110331415317320166", "t": "2026-10-14T11:26:32+00:00", "views": 2826, "likes": 61, "reposts": 4, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi Wednesday Early Morning Update:\n\n🚕 Model Y - $8.06 - 23 min wait ⏱️ 🚕 Cybercab - $9.09 - 20 min wait ⏱️\n\n🔴 20+ min waits at 6:23am. Every other pre-7am check I've seen ran 4 to 16 min\n 🟢 Fares didn't move with the waits. $8.06 is in the usual early morning band of $7.00 to $8.51\n 🟡 Model Y is 11% cheaper, Cybercab is 3 min quicker. That split has now held six of the last seven checks\n Cheapest window of the day, slowest pickups of the week? The service just started, so Robotaxis must just be leaving their depots ✍️\n https://t.co/1BZt8YqyIv", "url": "https://x.com/RobotaxiRadar/status/2110331415317320166", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110352420987720136", "t": "2026-10-14T12:50:00+00:00", "views": 26747, "likes": 681, "reposts": 63, "handle": "herbertong", "name": "Herbert Ong", "avatar": "", "followers": 107679, "text": "Texas now has 2,285 registered robotaxis. Waymo leads with 1,185, but Tesla's 739 is growing faster.\n\nOver the last 30 days, Tesla added 300 and Waymo added 197, per @ethanmckanna's Robotaxi Tracker. \n\nThat's Tesla up about 68% in a month against Waymo's roughly 20%. 319 of Tesla's cars are Cybercabs, all 2026 model year.\n\nAt these rates, Tesla passes Waymo in Texas in about four and a half months. \n\n$TSLA", "url": "https://x.com/herbertong/status/2110352420987720136", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110363696690237580", "t": "2026-10-14T13:34:48+00:00", "views": 2301, "likes": 19, "reposts": 3, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Wednesday morning rush hour in Austin https://t.co/qQhwVPnKe6", "url": "https://x.com/WorldlyReviewer/status/2110363696690237580", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2110366262098366553", "t": "2026-10-14T13:45:00+00:00", "views": 1418, "likes": 17, "reposts": 1, "handle": "NotAnFSDTracker", "name": "Not an FSD Tracker 🇬🇧 🇪🇺", "avatar": "", "followers": 6777, "text": "Waymo started trials in the 🇬🇧 UK ahead of Tesla Cybercab but\nThis is also true in Texas.\nLook at the growth of Tesla though.\n\nOnce Tesla have the production line going in Berlin 🇩🇪, anything is possible https://t.co/aZ3l5xeoEu", "url": "https://x.com/NotAnFSDTracker/status/2110366262098366553", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110373363436880002", "t": "2026-10-14T14:13:13+00:00", "views": 1343, "likes": 69, "reposts": 3, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Plenty of traffic cameras spotting at least 3 Cybercabs in any one intersection in Austin 🚕📸\n\nIf pictures like this don’t prove Cybercab is ramping, I don’t know what will 🤔 https://t.co/jg57kc1clO", "url": "https://x.com/RobotaxiRadar/status/2110373363436880002", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110376215194300672", "t": "2026-10-14T14:24:33+00:00", "views": 1141, "likes": 21, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Wednesday Morning Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $12.78 - 16 min wait ⏱️ 🚕 Cybercab - $14.47 - 8 min wait ⏱️ 🚙 Uber Comfort Electric - $11.97 - 9 min wait ⏱️ 🚙 UberX - $7.96 - 9 min wait ⏱️\n\n🔴 Comfort Electric takes the EV tier back at $11.97 vs $12.78, ending Robotaxi's seven day run\n 🟢 Cybercab's 8 min is the fastest Tesla pickup I've seen at morning rush on this route\n 🟡 UberX cheapest at $7.96, a $4.82 gap and its fourth check in a row at $7.93-$7.96\n 🟡 Model Y climbed $4.72 from 6:23am's $8.06. Steepest morning ramp since last Wednesday\n\nRobotaxi's morning rush is pricier than Monday or Tuesday, while Uber hasn't moved a cent ✍️", "url": "https://x.com/RobotaxiRadar/status/2110376215194300672", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110389182464209311", "t": "2026-10-14T15:16:04+00:00", "views": 6859, "likes": 137, "reposts": 9, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8944, "text": "Waymo Ojai has launched in Texas!!! https://t.co/632Ku9SUDT", "url": "https://x.com/ethanmckanna/status/2110389182464209311", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110394126877577566", "t": "2026-10-14T15:35:43+00:00", "views": 2898, "likes": 51, "reposts": 4, "handle": "TeslaJigsaw", "name": "Will", "avatar": "", "followers": 6373, "text": "My last Cybercab ride in Austin with surprise guest. \n\nHow'd it do? Could it be improved? Much to discuss! \n\nLink in thread to full video 👇\n\n#Cybercab #Robotaxi https://t.co/R12QwjUOnk", "url": "https://x.com/TeslaJigsaw/status/2110394126877577566", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110400511463641100", "t": "2026-10-14T16:01:05+00:00", "views": 897, "likes": 34, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 14\n\nWaymo: 1185\nTesla: 739\nAvride: 344\nZoox: 63\n\nFor more ": 0}, {"id": "2110438454295433666", "t": "2026-10-14T18:31:52+00:00", "views": 16135, "likes": 255, "reposts": 8, "handle": "AlexanderKr", "name": "Alexander Kristensen", "avatar": "", "followers": 12431, "text": "Just standing still in down town Austin for 1 min https://t.co/BwpnnLJE84", "url": "https://x.com/AlexanderKr/status/2110438454295433666", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110445085842092458", "t": "2026-10-14T18:58:13+00:00", "views": 2594, "likes": 45, "reposts": 1, "handle": "NickGibbsIAG", "name": "NicholasGibbs", "avatar": "", "followers": 14537, "text": "One month after launch: 300+ Cybercabs serving Austin, an 8x increase in 30 days. I would not be shocked if Tesla has more on the road than Waymo by year end.\n\nFull video: https://t.co/Bb5L9sB4tf https://t.co/Dy962P21SS", "url": "https://x.com/NickGibbsIAG/status/2110445085842092458", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110446640385720626", "t": "2026-10-14T19:04:23+00:00", "views": 3557, "likes": 141, "reposts": 7, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Want a glimpse into the future of transportation? Just stand on a corner in downtown Austin 🎥🚕\n https://t.co/I00tgxEWKY", "url": "https://x.com/RobotaxiRadar/status/2110446640385720626", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110446729363693909", "t": "2026-10-14T19:04:45+00:00", "views": 1602, "likes": 6, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi for a 14 mile ride on a Wednesday afternoon in Austin https://t.co/eGR9yOZO5I", "url": "https://x.com/WorldlyReviewer/status/2110446729363693909", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110449031495213227", "t": "2026-10-14T19:13:54+0
