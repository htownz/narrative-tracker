berX is before tip 🟡 Model Y at 5 min nearly matches Uber on pickup. Cybercab at 18 is the outlier 🔴 Both Robotaxi options add a 12 min walk at the end. Uber drops you at the park\n\nOn longer trips, Robotaxi is competitive on price. The 12 minute walk would need to be tightened up. Cybercab is still the premium option right now ✍️", "url": "https://x.com/RobotaxiRadar/status/2106048015332987331", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106057621543227429", "t": "2026-10-02T16:24:00+00:00", "views": 12481, "likes": 194, "reposts": 16, "handle": "herbertong", "name": "Herbert Ong", "avatar": "", "followers": 107259, "text": "Robotaxi in California by mid-2027? Maybe.\n\nNevada and Florida look closer, with cars reportedly already in place.\n\nTesla is hiring Robotaxi operators in 55 cities worldwide. Some think that points to launches in six to nine months.\n\nHiring isn't launching, though. Austin gets cleaned up first.\n\n$TSLA \n\n----------\n\nCyberbulls E210 🐂\n\nThe Bulls: \nAlexandra @teslaboomermama \nJeff @thejefflutz \nCern @cernbasher", "url": "https://x.com/herbertong/status/2106057621543227429", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106065856631316884", "t": "2026-10-02T16:56:43+00:00", "views": 6413, "likes": 143, "reposts": 5, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "The Cybercab has a neat solution for rain clouding up the camera lens 🧐\n\nA rider noticed air being blown across the B-pillar camera. It seems to kick in at stop lights, where there's no airflow to clear the lens 🚦\n\nThe rider also noted it's a bit loud, since there are no rear speakers to mask the noise 🔊\n\nThis might’ve been the one piece of tech keeping the Cybercab in operation through this week’s rainy weather in Austin ✍️", "url": "https://x.com/RobotaxiRadar/status/2106065856631316884", "lane": "camera_vs_lidar_weather", "cop py_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106094710100050168", "t": "2026-10-02T18:51:22+00:00", "views": 5241, "likes": 283, "reposts": 7, "handle": "CuriousPejjy", "name": "Pejjy", "avatar": "", "followers": 32538, "text": "$TSLA just added another 11 Cybercabs to their Robotaxi fleet!\n\nMaking it 169 Cybercabs operational in Austin! https://t.co/FpEhHHiSO8", "url": "https://x.com/CuriousPejjy/status/2106094710100050168", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106097822978261124", "t": "2026-10-02T19:03:45+00:00", "views": 7127, "likes": 83, "reposts": 3, "handle": "RtaxiTracker", "name": "Robotaxi Tracker", "avatar": "", "followers": 9221, "text": "Tesla just registered 11 more autonomous vehicles with the Texas DMV—589 now on the state registry, up from 578.\n\n11 × 2026 Tesla Cybercab\n\nTrack the fleet: https://t.co/wz21v3FJn5 https://t.co/LK5xh1dV5v", "url": "https://x.com/RtaxiTracker/status/2106097822978261124", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106100896677626053", "t": "2026-10-02T19:15:57+00:00", "views": 7013, "likes": 272, "reposts": 19, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Driverless Cybercab roaming around Austin in heavy rain today 🌧️ \n\nWait, I thought you needed LIDAR for that??? 🤔😂\n https://t.co/JBNWHmM4yz", "url": "https://x.com/RobotaxiRadar/status/2106100896677626053", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106101672615579808", "t": "2026-10-02T19:19:02+00:00", "views": 3476, "likes": 89, "reposts": 2, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8928, "text": "Let's hope they are adding them to the active fleet! \n\nTesla is currently sitting at 1.1 Cybercabs per 1k vehicles in Austin (with a portion of that being test vehicles) and I'll be closely watching that number and reporting as it changes. For context Waymo is around 3x that.", "url": "https://x.com/ethanmckanna/status/2106101672615579808", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106105745208930404", "t": "2026-10-02T19:35:13+00:00", "views": 4753, "likes": 30, "reposts": 4, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi on Friday afternoon to go to the ACL festival in Austin. It is very expensive rn. Robotaxi is actually competitive and taking you to the festival. Excited for festival goers to experience Cybercab https://t.co/AMwrINaAZc", "url": "https://x.com/WorldlyReviewer/status/2106105745208930404", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106109483097182312", "t": "2026-10-02T19:50:05+00:00", "views": 1847, "likes": 16, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "So idk why @robotaxi isn’t smart enough to do this. What Uber is doing is serving places like Cava that I usually go to at very low prices but as soon as I select Zilker Park the price triples because of the ACL festival in Austin. That makes sense. Robotaxi is inflating the prices everywhere. They need to be smarter", "url": "https://x.com/WorldlyReviewer/status/2106109483097182312", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106116955245609394", "t": "2026-10-02T20:19:46+00:00", "views": 1862, "likes": 12, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi vs. Uber Friday Afternoon Austin City Limits Update 🎸\n\n🗺️ New route ➡️ Zilker Park (ACL Day 1)\n\n🚕 Cybercab - $23.89 - 9 min ⏱️ 🚕 Model Y - $23.93 - 9 min ⏱️ 🚙 UberX - $22.96 - 11 min ⏱️ 🚙 Comfort - $28.97 - 11 min ⏱️\n\n🟡 UberX is cheapest by just $0.93 (4%), but Robotaxi picks up 2 min sooner\n 🟢 Robotaxi is 18% cheaper than Comfort\n 🟡 Cybercab and Model Y priced 4 cents apart with the same wait\n\nFactoring in an Uber tip, fares are pretty similar ✍️", "url": "https://x.com/RobotaxiRadar/status/2106116955245609394", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106117895348420711", "t": "2026-10-02T20:23:30+00:00", "views": 19840, "likes": 635, "reposts": 56, "handle": "niccruzpatane", "name": "Nic Cruz Patane", "avatar": "", "followers": 134510, "text": "In the last 32 days, Tesla has added 275 Robotaxis to its Texas fleet, for a total of 589 cars. \n\nCybercabs now comprise 29% of the Texas Robotaxi fleet:\n\n• Model Y: 420 (71%)\n• Cybercab: 169 (29%)\n\nTesla is adding about 5.3 Cybercabs/day on average since launch. https://t.co/RfCZ5onD6S", "url": "https://x.com/niccruzpatane/status/2106117895348420711", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106130397939556848", "t": "2026-10-02T21:13:11+00:00", "views": 8850, "likes": 49, "reposts": 3, "handle": "TeslaNewswire", "name": "The Tesla Newswire", "avatar": "", "followers": 58155, "text": "Tesla just added 11 more Cybercabs to its official Austin Robotaxi fleet!\n\n✅ 169 Cybercabs now listed, and the fleet keeps growing! https://t.co/FVuB1m4yXs", "url": "https://x.com/TeslaNewswire/status/2106130397939556848", "lane": "tesla_scaling_hype", "copy_origin": "2105895049904955589", "in_dataset": 1, "copies": 0}, {"id": "2106131691601555670", "t": "2026-10-02T21:18:19+00:00", "views": 1896, "likes": 22, "reposts": 0, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18760, "text": "🧮 Tesla's Texas robotaxi fleet: 169 Cybercabs, 420 Model Ys. About 29% Cybercab.\n\nMost rides are 1–2 people. An 80/20 mix fits that better.\n\nKeeping 420 Model Ys, that's 1,680 Cybercabs. 1,511 to go.\n\nNah, probably nothing.", "url": "https://x.com/teslayoda/status/2106131691601555670", "lane": "pushback", "copy_o he Taiwan foundry is looking at a role in the Texas project. Terafab is backed by Tesla and SpaceX. \n\nThe aim is about 1 terawatt of AI compute a year for Optimus robots, self-driving cars, and space systems.\n\nPhase one is in Grimes County. First spend is $16.8 billion. A full build could run well past $100 billion. Intel joined in April 2026 to bring process skill and advanced packaging. Musk has said the site plans to use its 14A node once that process is ready.\n\nThe TSMC talks look separate. \n\nSources say it is weighing owning and running a Texas fab, with Terafab as the anchor buyer through equity, purchase promises, or both. \nNo deal is signed. \nIt has not commented. \nReports also say the Intel side has made limited progress so far.\n\nFor Intel, a TSMC path adds pressure on the foundry pitch. It does not erase the existing tie. \n\nThe scale is so large that two suppliers are still possible. It would exceed today’s global AI chip output by a wide margin.\n$INTC $TSM", "url": "https://x.com/SemiconductorsX/status/2106345300998955320", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106347647149760831", "t": "2026-10-03T11:36:27+00:00", "views": 2201, "likes": 66, "reposts": 6, "handle": "joehansen", "name": "Joe Hansen", "avatar": "", "followers": 22745, "text": "Tesla Robotaxi fleet in Texas, 2 Oct 2026\n\n• Registered: 589\n• Model Y: 420\n• Cybercab: 169\n• Last 7 days: +43\n• Last 30 days: +169\n\nEvery new car on 2 Oct was a Cybercab. Eleven of them. \n\nThe Model Y count (of course) never left 420.", "url": "https://x.com/joehansen/status/2106347647149760831", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106355655636623624", "t": "2026-10-03T12:08:17+00:00", "views": 2120, "likes": 46, "reposts": 5, "handle": "StanphylCap", "name": "Stanphyl Capital 🇺🇸 🇮🇱 🇺🇦", "avatar": "", "followers": 44914, "text": "Sunset today in Austin: 7:14 PM\nRobotaxi shutdown time moved from 10PM to 11PM because “trying to avoid kittens in the dark.”\n\nThis guy spews so much bullshit he doesn’t even TRY to make it make sense any more, lol.", "url": "https://x.com/StanphylCap/status/2106355655636623624", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106358856599372038", "t": "2026-10-03T12:21:00+00:00", "views": 7909, "likes": 178, "reposts": 10, "handle": "GrindeOptions", "name": "Cole Grinde", "avatar": "", "followers": 57417, "text": "The $TSLA Robotaxi service in Austin Texas is available 17 hours per day from 6am to 11pm.\n\nThis means it can service more customers and help alleviate late night travel demand at bars and restaurants. \n\nAlso, Elon said the limiting factor is figuring out how to navigate the streets at night without hitting animals like cats who are the same color as the road.\n\nThey have not hit any animals as far as I’m aware. \n\nThe Robotaxi network is working like a well oiled machine and is starting to become ubiquitous across the city. \n\nMore to come.", "url": "https://x.com/GrindeOptions/status/2106358856599372038", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106373587598733744", "t": "2026-10-03T13:19:32+00:00", "views": 2091, "likes": 26, "reposts": 1, "handle": "Franz_huemer", "name": "Franz Huemer", "avatar": "", "followers": 515, "text": "Tesla Robotaxi in Austin fährt jetzt bis 23 Uhr.\n\nElon: Der Engpass sind nicht die Nachtschwärmer – sondern graue Kätzchen auf grauem Asphalt im Dunkeln. Kamera + KI lernt das Stück für Stück.\n\nWährend Diesel Dieter noch streitet, ob sein Auto überhaupt eine anständige Rückfahrkamera braucht, schiebt Tesla die Betriebszeiten hoch, weil die Software besser wird – nicht weil jemand neue Sensoren anschraubt.\n\nWann trauen wir uns in Europa, so etwas nachts zuzulassen – oder warten wir erst auf den nächsten Lidar-Workshop?", "url": "https://x.com/Franz_huemer/status/2106373587598733744", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106375567574475092", "t": "2026-10-03T13:27:24+00:00", "views": 1820, "likes": 29, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "@DavidMoss rode Cybercab exclusively from the outskirts of the Austin geofence to test real availability outside downtown 🚕\n\n⏱️ Out: $13.79, 7 min wait ⏱️ Back: $15.72, 12-13 min wait\n\n✅ The B-pillar air blower is confirmed. It fired 4 times at the start of the ride and a few more throughout, loud enough to hear from right behind the headrest\n ✅ Cybercab drove confidently in the rain\n ✅ Dropoff was right in front of the hotel. Pickup and dropoff are improving\n 🟡 The \"driver's side\" wiper doesn't reach the top of the windshield. Some occlusion for a passenger looking out, but the cameras see fine\n ❌ Trunk did not auto-open at dropoff, even after being used at pickup. Waymo still has the edge there\n ❌ Grok says it doesn't have Grok Bots access yet\n\n~$30 round trip for a 5 minute ride to Target. Still a novelty price. More supply should bring it down 📈\n https://t.co/FAvY6G2ayB", "url": "https://x.com/RobotaxiRadar/status/2106375567574475092", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106378498504069467", "t": "2026-10-03T13:39:03+00:00", "views": 125531, "likes": 1950, "reposts": 166, "handle": "MarioNawfal", "name": "Mario Nawfal", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiA jwQs41jGpH9wwRMgYG0irXtDmUn3HS8aB6jQPEc0jQRLQBEABrtc2qBCFuJeC6e6YH0xaZ66FwfaN+Bp/lDAqVfA3w492SNVar3vB/JR21UZ0imV67AfJc9y/cp8AYeJaeyPuOkRtqt1B8WF9ZUXd7mCEdWZbLBKByPhv6Yq9dhtKnsN9MvnJ0eQF5LHfjItQhTsv4GIy3BWymo1/nI5sJPwovsJ8xrMRafDQLWkn7j8DEGjk7FkpvnP//ZICAgIA==", "followers": 3954233, "text": "🇺🇸 For years, Waymo’s approach was the safe bet: cameras, LiDAR, radar, the likes. \n\nTesla made the opposite bet. Understand the world visually, much closer to the way humans actually drive.\n\nOne rainstorm settles that argument.\n\nWhile Waymo suspended operations in Austin, Tesla is cruising along 😎🌧️\n\nWriter: Oliver\nhttps://t.co/iH5xZcGrY3", "url": "https://x.com/MarioNawfal/status/2106378498504069467", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106383831674847252", "t": "2026-10-03T14:00:14+00:00", "views": 42557, "likes": 332, "reposts": 16, "handle": "herbertong", "name": "Herbert Ong", "avatar": "", "followers": 107259, "text": "Tesla's Q3 report said nothing about Robotaxi, so @CernBasher did the math himself!\n\nAt 17% weekly growth in paid miles and about 100 miles a day per car, the fleet needs around 450 cars right now. Texas already has 578 registered, including 158 Cybercabs.\n\nThe catch is that this need doubles every month: about 1,500 cars by the end of November and 3,000 by the end of December.\n\nWatch the registrations. October 21 gives us the next data point.\n\n$TSLA", "url": "https://x.com/herbertong/status/2106383831674847252", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106386797785756090", "t": "2026-10-03T14:12:02+00:00", "views": 27368, "likes": 348, "reposts": 35, "handle": "CernBasher", "name": "Cern Basher", "avatar": "", "followers": 56367, "text": "Robotaxi Fleet Growth to Sustain 17% Growth\n\nIf Tesla is going to sustain the 17% week-over-week growth in paid autonomous miles, here's the number of vehicles they need (assuming 100 paid miles per day) until the end of the year.\n\nThis table also shows the number of vehicles they need to add each week.\n\nCurrently in Texas (not including Florida) they have 589 vehicles registered - so it appears that they are about two weeks ahead of the number of vehicles they need to maintain the 17% growth trajectory.\n\nOf course, they could always grow faster than 17% for a period of time.\n\nThe revenue numbers in the table assume $2.50 per mile.", "url": "https://x.com/CernBasher/status/2106386797785756090", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106392784622031195", "t": "2026-10-03T14:35:49+00:00", "views": 9841, "likes": 189, "reposts": 24, "handle": "EvaFox", "name": "Eva Fo𝕏 🦊 Claudius Nero's Legion", "avatar": "", "followers": 364759, "text": "Austin, Texas, has become a true technology capital, where cutting-edge technologies are created and made available to residents before anywhere else in the world.\n\nTesla's Cybercab fleet in Texas nearly quadruples to 169!\n\nA month after its commercial launch in Austin, Tesla has 169 driverless Cybercabs authorized for commercial use in Texas, up from 45 at the unveiling. Tesla's robotaxi fleet in the state also includes 420 Model Ys. Austin remains the only city offering Cybercab rides, and Tesla is looking to expand across Texas and into Nevada and Florida.", "url": "https://x.com/EvaFox/status/2106392784622031195", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106393082119811382", "t": "2026-10-03T14:37:00+00:00", "views": 97310, "likes": 185, "reposts": 22, "handle": "ElectrekCo", "name": "Electrek.co", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFk is video by Waymo because they still don't seem to grasp how the multi sensor approach deals with this. https://t.co/cIVbQmZqLJ", "url": "https://x.com/itsjustyasir/status/2106405577324732783", "lane": "pushback", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2106413983494209761", "t": "2026-10-03T16:00:03+00:00", "views": 7450, "likes": 23, "reposts": 2, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 3\n\nTesla: 589\nWaymo: 1154\nZoox: 63\nAvride: 344\n\nFor more detailed info see link to live tracker in bio.", "url": "https://x.com/texasavtracker/status/2106413983494209761", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 5}, {"id": "2106424475046785474", "t": "2026-10-03T16:41:44+00:00", "views": 1841, "likes": 85, "reposts": 14, "handle": "Cicily_aura", "name": "Cicily", "avatar": "", "followers": 7045, "text": "Robotaxi in Austin just got pushed to 11pm, and that update feels bigger than it looks. Elon said the real problem is spotting pets at night, especially a grey kitten on grey tarmac. That is the kind of detail most companies would never say out loud. It shows they are extending hours only as the system actually gets safer!", "url": "https://x.com/Cicily_aura/status/2106424475046785474", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106428693925208269", "t": "2026-10-03T16:58:30+00:00", "views": 1218, "likes": 59, "reposts": 0, "handle": "BillSabo11", "name": "BillSabo11", "avatar": "", "followers": 1285, "text": "@ElectrekCo @FredLambert Funny how Waymo has a million different kinds of sensors on its vehicles, however when it started to rain hard this week in Austin they shut their service down, however Tesla Robotaxi’s continued operation, explain that one Fred Einstein.", "url": "https://x.com/BillSabo11/status/2106428693925208269", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106441374023467301", "t": "2026-10-03T17:48:54+00:00", "views": 1561, "likes": 23, "reposts": 4, "handle": "Cyber_Trailer", "name": "No Safe Words", "avatar": "", "followers": 12197, "text": "Austin, TX (OCT.03.2026)-\nReports indicate that Waymo has shut down or paused service in Austin due to heavy rains while the Cybercab and Y Robotaxis continue to operate.  \n\nAnyone with additional information please let us know. \n\n#SunsetProject\n🎥 richmargin on TT https://t.co/deaIZBYKgb", "url": "https://x.com/Cyber_Trailer/status/2106441374023467301", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106451250422440313", "t": "2026-10-03T18:28:08+00:00", "views": 1224, "likes": 16, "reposts": 0, "handle": "Ledge_Andary", "name": "Ledge Andary", "avatar": "", "followers": 1147, "text": "@itsjustyasir @stevenmarkryan made a video analyzing this. Waymo altered video settings and data to paint a false picture of the truth.\n\nThe video footage they showed reduced the color palette to 32 bits to make it seem more grainy, less defined, and less capable. They also seem to have lowered the brightness of the camera footage.\n\nIt's not a totally honest marketing message from Waymo, as they obviously have to justify their approach somehow, even if that means bending the truth.\n\nCurrently in Texas, Tesla Robotaxi vehicles are operating in the rain while Waymos are off the road because they cannot safely operate in these weather conditions.\n\nAt the end of the day, I'm rooting for Waymo too, but Tesla has obviously come up with a much better and much more scalable solution to the problem.", "url": "https://x.com/Ledge_Andary/status/2106451250422440313", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106460502968631529", "t": "2026-10-03T19:04:54+00:00", "views": 1723, "likes": 31, "reposts": 1, "handle": "MoveResiliently", "name": t": "@sspencer_smb Waymo still have much more cars in Austin. This is because Austin had severe whether and Waymo stopped working, while Tesla didn't", "url": "https://x.com/Yuva1s/status/2106798583840157837", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106807763024400506", "t": "2026-10-04T18:04:47+00:00", "views": 10679, "likes": 375, "reposts": 32, "handle": "BogusThought", "name": "BogusThought", "avatar": "", "followers": 14699, "text": "Austin just doubled its Cybercab record.\n\n868 sightings yesterday. 670 of them driverless. That is 2x the old total record and 2.5x the old driverless record. Driverless share hit 77%.\n\nTesla also added 111 Cybercabs in Austin and stretched the hours. Fleet there is now 169, pointed at 24/7.\n\nSame weekend: Elon is cutting AI5/AI6 memory so a RAM shortage does not delay Optimus volume production.\n\nCars already beat Q3 consensus at 486,532 deliveries. The robotaxi fleet is scaling in public. Optimus is being protected from a chip delay.\n\nThis is what the ramp looks like before the market prices it!!!\n\n🚀🚀🚀\n\n$TSLA", "url": "https://x.com/BogusThought/status/2106807763024400506", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106808168743637433", "t": "2026-10-04T18:06:24+00:00", "views": 4444, "likes": 188, "reposts": 12, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Tesla keeps showing that driverless Robotaxis don't need lidar to handle rain 🌧️\n\nAnother strong Cybercab ride review from a rainy day in Austin ✅", "url": "https://x.com/RobotaxiRadar/status/2106808168743637433", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106809425088692346", "t": "2026-10-04T18:11:24+00:00", "views": 2279, "likes": 73, "reposts": 2, "handle": "elis", "name": "Elis", "avatar": "", "followers": 880, "text": "Kiddo says Cybercab is “not even L3.” 🤣🤣 A car with NO steering wheel and NO pedals.\n\nL3 requires a human ready to take over when the system asks. There’s nobody to take over. It literally can’t be L3.\n\n“No liability sharing”: yeah kiddo, there’s no driver to share it with. Tesla carries all of it. That’s L4.\n\n“They aren’t for sale”: neither are Waymos. Is Waymo not L4 either? Retard\n\nIt’s been driving paying passengers around Austin with nobody inside since September. \n\nYou’d know that if your feed showed you anything besides anti-Tesla headlines.\n\nEDS is real folks. I genuinely feel bad for these kids. Read SAE J3016 before calling anyone stupid, you absolute RETARD 🤣", "url": "https://x.com/elis/status/2106809425088692346", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106820371551023466", "t": "2026-10-04T18:54:54+00:00", "views": 5412, "likes": 107, "reposts": 6, "handle": "kick_clips", "name": "Kick Clips 🎬", "avatar": "", "followers": 102472, "text": "FULL: Streamer Nick White got SWATTED while riding in a SELF DRIVING Waymo as Austin PD surrounded the vehicle with WEAPONS DRAWN 😳🚨 https://t.co/mSEeJtoxwN", "url": "https://x.com/kick_clips/status/2106820371551023466", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106823145113960844", "t": "2026-10-04T19:05:55+00:00", "views": 2621, "likes": 22, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi on a rainy Sunday afternoon in Austin to Zilker Park as the ACL crowd has started going there https://t.co/ZmZmyUFTqf", "url": "https://x.com/WorldlyReviewer/status/2106823145113960844", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106825789031190912", "t": "2026-10-04T19:16:25+00:00", "views": 2651, "likes": 29, "reposts": 0, "handle": "Livestreamclipx", "name": "livestreamclips", "avatar": "", "followers": 11136, "text": "Streamer Nick White SWATTED in Austin while riding in a Waymo. 😳\n\n“I don’t care if you’re live streaming, step out of the car!” https://t.co/fT4GlmjXkK", "url": "https://x.com/Livestreamclipx/status/2106825789031190912", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106838346097975456", "t": "2026-10-04T20:06:19+00:00", "views": 12021, "likes": 110, "reposts": 12, "handle": "JOBhakdi", "name": "Jo Bhakdi", "avatar": "", "followers": 40945, "text": "Compare the two $TSLA launches, month one each.\n\nRobotaxi, June 2025: started at 10 in Austin, reached roughly 20 after 30 days. A disappointment, and the pace barely improved for a year.\n\nCybercab, September 2026: launched with 45. One month in, 169 registered, 43 of them in the last week alone.\n\nConfirmed deployed on our tracker: 55. That's a floor, since it only counts vehicles photographed and submitted. My estimate of the real number is closer to 80.\n\n80 versus 20. Roughly 4x faster.\n\nProduction is moving even faster. VIN sequences passed 2,400 at launch. My estimate is around 4,000 built by end of October and 10,000 by year end. Whether they're all deployed is a separate question.\n\nThe number I'm watching is 1,800 fully autonomous vehicles on the road. That's where I expect the market to reprice Tesla.\n\nTrack it live at https://t.co/SJzj0fsvVH", "url": "https://x.com/JOBhakdi/status/2106838346097975456", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106869685220229306", "t": "2026-10-04T22:10:51+00:00", "views": 5418, "likes": 22, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during evening ACL rush on a Sunday in Austin https://t.co/dNWHpdGqhL", "url": "https://x.com/WorldlyReviewer/status/2106869685220229306", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106883433385640186", "t": "2026-10-04T23:05:29+00:00", "views": 3659, "likes": 41, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Sunday Evening Uber vs. Robotaxi Update - Austin City Limits Edition 🎸\n\n🚕 Model Y - $21.64 - 9 min wait ⏱️ 🚕 Cybercab - $22.74 - 24 min wait ⏱️ 🚙 Uber Comfort Electric - $24.99 - 10 min wait ⏱️ 🚙 UberX - $18.95 - 6 min wait ⏱️\n\n🟢 Model Y beats Comfort Electric on both counts: 13% cheaper and a minute quicker, going head to head with Uber's EV tier on festival night\n 🟢 Keep in mind Robotaxi is doing this with fewer cars in Austin. Uber has thousands of drivers who can all converge on ACL at once\n 🟡 UberX is cheapest tonight at $18.95, a $2.69 edge over Model Y\n 🟡 Cybercab's 24 min reflects a fleet that's still currently smaller than Uber, and those wait times have been progressively shrinking WoW\n\nA smaller fleet holding price parity with Uber during a stress test like ACL in light rain means the service is efficient for its size, and still serving customers rain or shine ✍️", "url": "https://x.com/RobotaxiRadar/status/2106883433385640186", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106883848986644792", "t": "2026-10-04T23:07:08+00:00", "views": 228212, "likes": 3491, "reposts": 153, "handle": "yunta_tsai", "name": "Yun-Ta Tsai", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAg 0.\n\nThe key isn’t just that more Cybercabs are appearing — it’s that driverless Cybercabs are rapidly becoming more common on public roads.\n\nThis looks like a clear sign Tesla is scaling its Robotaxi fleet in Austin.", "url": "https://x.com/TeslaZoa/status/2107059538470080657", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107060410515947733", "t": "2026-10-05T10:48:43+00:00", "views": 6839, "likes": 196, "reposts": 18, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Yesterday's sightings confirm Cybercab presence is holding at a new level in Austin 📈\n\n✏️ Driverless = 605\n✏️ Total = 821\n\n✅ Total within 5% of Saturday's record 868\n\n✅ Driverless at 605, second highest ever behind Saturday's 670\n\n✅ Two straight days above 800, after no day ever topped 440 before this weekend\n\n✅ Driverless share 74%, second only to Saturday's 77%\n\nThis confirms Saturday wasn't a one-off event. The step up is holding ✍️", "url": "https://x.com/RobotaxiRadar/status/2107060410515947733", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107065060619428290", "t": "2026-10-05T11:07:12+00:00", "views": 2205, "likes": 26, "reposts": 3, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24287, "text": "Tesla Cybercab sightings are spreading fast across America. 🤖🚕\n\nAs of Oct. 4, reported Cybercab sighting locations jumped:\n\n180 ➡️ 203 locations\n\nThat’s 23 new locations in just one week.\n\nZoom out:\n• Sep. 13: 136 locations\n• Oct. 4: 203 locations\n• +49% in roughly three weeks\n\nSeveral previously text-only sightings were also upgraded this week with photographic evidence.\n\nAnd the fleet itself is growing fast. As of Oct. 2, Texas AV registration data showed 158 Cybercabs, bringing Tesla’s total registered Robotaxi fleet, including Model Ys, to 578 vehicles.\n\nThe bigger story isn’t simply that more Cybercabs are being spotted.\n\nTesla appears to be testing Cybercab across an increasingly diverse range of real-world roads and environments nationwide.\n\nThe gold wave is spreading across the U.S. map. 🇺🇸", "url": "https://x.com/TeslaZoa/status/2107065060619428290", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107099174420562082", "t": "2026-10-05T13:22:45+00:00", "views": 2235, "likes": 63, "reposts": 0, "handle": "TMSP85", "name": "Matt A", "avatar": "", "followers": 1370, "text": "@binarybits People like you still don’t understand. \nTesla is solving the general case while Wayne is not,\nWaymo can’t drop a car into any city and expect it to work\nYou misidentify Teslas validation process with a requirement to do city by city validation.\nNo, the refinements in Austin are refinements in every city.\nThe model works across continents.", "url": "https://x.com/TMSP85/status/2107099174420562082", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107103190500196599", "t": "2026-10-05T13:38:43+00:00", "views": 4639, "likes": 16, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Uber vs Tesla robotaxi during Monday morning rush hour in Austin https://t.co/KeSxwpcvEd", "url": "https://x.com/WorldlyReviewer/status/2107103190500196599", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2107106573650657660", "t": "2026-10-05T13:52:09+00:00", "views": 2861, "likes": 88, "reposts": 5, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi vs. Uber Monday Morning Rush Hour Update:\n\nIs Cybercab becoming the fastest pickup in Austin? 🤔\n\n🚕 Cybercab - $10.55 - 8 min wait ⏱️ 🚕 Model Y - $10.53 - 18 min wait ⏱️ 🚙 Comfort Electric - $9.98 - 11 min wait ⏱️ 🚙 UberX - $8.93 - 11 min wait ⏱️\n\n🟢 Cybercab is the fastest ride at 8 min, beating every Uber tier by 3 minutes\n 🟢 Both Robotaxi fares are nearly identical, but Cybercab arrives 10 min sooner\n 🟡 UberX is cheapest at $8.93, a $1.60 difference over Robotaxi\n 🟡 Model Y's 18 min is its slowest morning rush hour quote since Sep 8\n\nCybercab is the fastest option in Austin on a weekday morning right now. We'll see if it holds ✍️", "url": "https://x.com/RobotaxiRadar/status/2107106573650657660", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107133119304265952", "t": "2026-10-05T15:37:38+00:00", "views": 5197, "likes": 173, "reposts": 10, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "New drone footage from @JoeTegtmeyer shows good Cybercab movement at Giga Texas to start the week 🎥🧐\n\n✏️ 7 of the 19 staged for shipment have the \"Cybercab\" branding, which typically marks the production-spec cars that end up in the driverless fleet\n ✏️ The top floor of the parking deck shows a similar count to last week. No way to tell whether these are new units, test units, or the same ones still waiting on transit\n\nOverall count at Giga Texas looks lower (most likely since it’s the start of the week), but branded cars heading out is a good sign ✍️", "url": "https://x.com/RobotaxiRadar/status/2107133119304265952", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107137595914223805", "t": "2026-10-05T15:55:26+00:00", "views": 4134, "likes": 71, "reposts": 3, "handle": "CuriousPejjy", "name": "Pejjy", "avatar": "", "followers": 32537, "text": "$TSLA has quadrupled operational Cybercabs in Austin Texas in their first month of deployment and climbing. Signs and signals show that Dallas rollout is imminent and FSD is spreading worldwide with new EU countries approving every other week and many job listings in many other countries to not only collect data to get FSD approved but for Robotaxi too! \n\nTwo birds with one stone is looking to be strategy for Tesla in those markets! \n\nDetails below.", "url": "https://x.com/CuriousPejjy/status/2107137595914223805", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107138987114561571", "t": "2026-10-05T16:00:57+00:00", "views": 955, "likes": 17, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 5\n\nTesla: 589\nWaymo: 1154\nZoox: 63\nAvride: 344\n\nFor more detailed info see link to live tracker in bio.", "url": "https://x.com/texasavtracker/status/2107138987114561571", "lane": "texas_proving_ground", "copy_origin": "2106413983494209761", "in_dataset": 1, "copies": 0}, {"id": "2107140749577891955", "t": "2026-10-05T16:07:58+00:00", "views": 2887, "likes": 18, "reposts": 0, "handle": "mylifeonmystyle", "name": "Shawn", "avatar": "", "followers": 9089, "text": "Tesla正在标准化Robotaxi基础设施\n\nDallas Tesla Service Center 出现新的私人车队 Supercharger。据现场追踪及此前发现的许可，该项目规划 3套预制充电单元、共24个充电位，主要面向 Tesla 测试车辆和 Robotaxi。\n\n单看一个充电站没什么特别，但和其他 Robotaxi 基础设施放在一起就有意思了。\n\n此前 Austin 已经出现专门的 Robotaxi Hub，设施涉及充电、自动清洁、车辆检测；另一个 Ridgepoint Robotaxi 项目同样规划了 24个V4充电位。\n\n现在 Dallas 又出现 24个车队专用充电位。\n\n而 Tesla 自己也已经披露，随着 Robotaxi 扩张，公司正在建设专用基础设施，包括 Charging、Cleaning & Maintenance、Security、Teleoperations 和 Fleet Management。\n\n这越来越像一套可以复制到不同城市的标准化系统：Robotaxi → 充电 → 清洁 → 检测/维护 → 再次出车\n\nAustin → Dallas，未来再复制到更多城市。\n\nTesla规模化的可能不仅是Robotaxi本身，也包括Robotaxi背后的整套运营基础设施。\n\n这一点很重要：车可以从工厂批量生产，城市运营体系如果也能模块化、标准化，Robotaxi扩张速度才可能真正加快。 https://t.co/BYfLWlW6wt", "url": "https://x.com/mylifeonmystyle/status/2107140749577891955", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107143249634721871", "t": "2026-10-05T16:17:54+00:00", "views": 1269, "likes": 22, "reposts": 0, "handle": "paveliakovenko", "name": "Pavel Iakovenko", "avatar": "", "followers": 175, "text": "@yunta_tsai @wholemars I worked in self driving startup and I can support that 👍\nEven if you have lidar clouds you still need to actually understand the “semantics” and what’s going on there. \n\nLidar was just a shortcut for self driving industry when people didn’t have enough data , computational resources on board and good nn models. \nIf you saw a bunch of dots in front of the car very close, you need to stop, that’s simple.\n\nBut lidars also bring challenges with it. For instance, Waymo stopped operations last week in Austin because of the rain, as Waymo still has problems with puddles — and lidar actually makes it worse.\n\nTesla showed that you don’t need lidar for self driving — several autonomous Cybercabs just passed me while I was writing this post", "url": "https://x.com/paveliakovenko/status/2107143249634721871", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107145994756624569", "t": "2026-10-05T16:28:48+00:00", "views": 10572, "likes": 162, "reposts": 12, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18760, "text": "🔥 Tesla is hiring Robotaxi Fleet Support in 5 new Texas cities: El Paso, Lubbock, Corpus Christi, Tyler and Olmito. Robotaxi Incoming. https://t.co/YGfygWttn4", "url": "https://x.com/teslayoda/status/2107145994756624569", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107147720922435707", "t": "2026-10-05T16:35:40+00:00", "views": 27480, "likes": 253, "reposts": 7, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8928, "text": "Cybercabs per 1,000 vehicles in frame is up significantly, hitting a new high of 2.2 yesterday.\n\nFor comparison, Waymo is typically ~3-3.4 https://t.co/siyUhKMH86", "url": "https://x.com/ethanmckanna/status/2107147720922435707", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2107150178327068880", "t": "2026-10-05T16:45:26+00:00", "views": 3722, "likes": 121, "reposts": 5, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Cybercab is clearly scaling. I’m telling you guys they are everywhere in Austin. Just like Waymo", "url": "https://x.com/WorldlyReviewer/status/2107150178327068880", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107152375681110192", "t": "2026-10-05T16:54:10+00:00", "views": 5445, "likes": 125, "reposts": 11, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "We’re hitting new levels of Cybercab density in Austin, TX 😳\n\n@ethanmckanna reports that the number of Cybercabs spotted per 1,000 vehicles just hit a new high of 2.2/1,000 yesterday 📝\n\nThis means Cybercabs are seen much more frequently around town - last week, this metric was at about 1.3, a 69% jump in about a week 😯\n\nWaymo’s Austin density is still at around 3-3.4, but the 2.2/1,000 metric is just the density of Cybercabs, not Robotaxis as a whole. Robotaxi seems to be closing fast on Waymo in Austin 📈", "url": "https://x.com/RobotaxiRadar/status/2107152375681110192", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107159204889071881", "t": "2026-10-05T17:21:18+00:00", "views": 7918, "likes": 229, "reposts": 18, "handle": "DavidMoss", "name": "David Moss", "avatar": "", "followers": 18310, "text": "Day 4 of my Cybercab experiment is up!\n\nI’m spending a week in Austin using only Tesla Cybercab and walking to get everywhere. No Uber, no Waymo, and no driving myself. If Cybercab can’t get me there, I’m walking.\n\nI’m documenting each day to show what it’s like to build everyday life around a robotaxi, including everything that happens between the rides.\n\nWould you try a week like this?", "url": "https://x.com/DavidMoss/status/2107159204889071881", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107184795960713402" 458070380618", "t": "2026-10-05T22:16:21+00:00", "views": 2427, "likes": 22, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Uber vs Tesla robotaxi during Monday evening rush hour in Austin https://t.co/PQCxzc99hJ", "url": "https://x.com/WorldlyReviewer/status/2107233458070380618", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2107234761571701033", "t": "2026-10-05T22:21:32+00:00", "views": 1528, "likes": 27, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Uber vs. Robotaxi Monday Afternoon Rush Hour Update:\n\n🚕 Model Y - $10.08 - 12 min wait ⏱️ 🚕 Cybercab - $10.29 - 13 min wait ⏱️ 🚙 Uber Comfort Electric - $10.99 - 7 min wait ⏱️ 🚙 UberX - $8.94 - 8 min wait ⏱️\n\n🟢 Model Y undercuts Comfort Electric by 8% on Uber's own EV tier\n 🟢 Cybercab and Model Y Robotaxi are within a dollar and 1 minute of each other\n\nRobotaxi has gone from a 2 to 3x premium over UberX to within $1.14 of it in two weeks - Huge progress in pricing and wait times for Tesla ✍️", "url": "https://x.com/RobotaxiRadar/status/2107234761571701033", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107237106083131787", "t": "2026-10-05T22:30:51+00:00", "views": 5338, "likes": 243, "reposts": 21, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Tesla is ramping up Robotaxi operations across Texas 📈\n\nNow hiring Robotaxi Fleet Support in 10 Texas cities:\n\n📍 El Paso 📍 Tyler 📍 Lubbock 📍 Corpus Christi 📍 Olmito 📍 Dallas 📍 San Antonio 📍 Fort Worth 📍 Houston 📍 Austin", "url": "https://x.com/RobotaxiRadar/status/2107237106083131787", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107237646020104544", "t": "2026-10-05T22:33:00+00:00", "views": 2264, "likes": 12, "reposts": 0, "handle": "GrindeOptions", "name": "Cole Grinde", "avatar": "", "followers": 57417, "text": "More Texas cities should come online for the $TSLA Robotaxi in the not so distant future.", "url": "https://x.com/GrindeOptions/status/2107237646020104544", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107238150661701687", "t": "2026-10-05T22:35:00+00:00", "views": 3712, "likes": 53, "reposts": 5, "handle": "DavidMoss", "name": "David Moss", "avatar": "", "followers": 18311, "text": "Day 4 of my Cybercab experiment is now on YouTube!\n\nI’m spending a week getting around Austin with just Tesla Cybercab and my own two feet. No backup rides from Uber or Waymo, and no driving myself.\n\nI’m taking you along each day to see how this works in everyday life, from booking rides to figuring out the walking in between.\n\nCould you see yourself getting around like this for a week?\n\nWatch Day 4 here 👇\nhttps://t.co/UYfKedf6t5", "url": "https://x.com/DavidMoss/status/2107238150661701687", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107245189006004406", "t": "2026-10-05T23:02:58+00:00", "views": 2238, "likes": 13, "reposts": 0, "handle": "AustinsStocks", "name": "AustinFindsAlpha", "avatar": "", "followers": 2361, "text": "I’m going to ask a provocative question: What percentage of $TSLA influencers took an $UBER to get to their flight to get to the Austin Robotaxi Event l, last month?", "url": "https://x.com/AustinsStocks/status/2107245189006004406", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107251702663631139", "t": "2026-10-05T23:28:51+00:00", "views": 31447, "likes": 165, "reposts": 32, "handle": "teslaownersSV", "name": "Tesla Owners Silicon Valley", "avatar": "", "followers": 1445629, "text": "From empty Texas land to the most advanced car factory on Earth 👇\n\n\"We went through deep freeze, rain, quicksand, incredibly fast build. It was very difficult, but it's done.\" ― @elonmusk\n\nConstruction on Giga Texas started in July 2020. Today it builds Model Y and Cybertruck, and Cybercab is now in production there.\n\nWhat do you want to see at Giga Texas on 10/10?\n\n5 days to the 10/10 𝕏 Takeover at Giga Texas.\n\n🎥 @Tesla @robotaxi", "url": "https://x.com/teslaownersSV/status/2107251702663631139", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107254840514531412", "t": "2026-10-05T23:41:19+00:00", "views": 2547, "likes": 37, "reposts": 0, "handle": "RtaxiTracker", "name": "Robotaxi Tracker", "avatar": "", "followers": 9221, "text": "Waymo just registered 14 more autonomous vehicles with the Texas DMV—1,168 now on the state registry, up from 1,154.\n\n14 × 2026 Zeekr RT\n\nTrack the fleet: https://t.co/wz21v3FJn5 https://t.co/aevKYCJR9f", "url": "https://x.com/RtaxiTracker/status/2107254840514531412", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107378937802158558", "t": "2026-10-06T07:54:26+00:00", "views": 1220, "likes": 38, "reposts": 0, "handle": "RonnyGolisch", "name": "Ronny ツ", "avatar": "", "followers": 4372, "text": "🚨🚕 Tesla skaliert die Cybercab-Flotte in Texas ordentlich hoch!\n\nZum Start am 3. September waren 45 Cybercabs für den kommerziellen Einsatz registriert, inzwischen sind es bereits 169 Fahrzeuge. 🤯\n\nDamit hat Tesla die Flotte innerhalb von gut einem Monat fast vervierfacht. 📈\n\nJetzt wird spannend, wie schnell Tesla weiter hochskaliert und wann die nächsten Städte folgen. 👀\n\nDas Robotaxi-Zeitalter nimmt langsam richtig Fahrt auf! 🔥\n\nQuelle:\nhttps://t.co/TAUiHihhYk", "url": "https://x.com/RonnyGolisch/status/2107378937802158558", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107418157413511206", "t": "2026-10-06T10:30:17+00:00", "views": 5321, "likes": 99, "reposts": 5, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "566 Cybercab sightings in Austin yesterday, with 389 driverless\n\n#cybercab #tesla #robotaxi https://t.co/PnhdL0imI2", "url": "https://x.com/CybercabSpotter/status/2107418157413511206", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107422265251860496", "t": "2026-10-06T10:46:36+00:00", "views": 2470, "likes": 66, "reposts": 5, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Cybercab sightings pulled back Monday as Austin City Limits weekend 1 wrapped up 🧐\n\n✏️ Driverless = 389\n✏️ Total = 566\n\n✅ Total up 46% vs last Monday (388)\n\n✅ Driverless up 65% vs last Monday (236)\n\n✅ Down 31% from Sunday, the steepest weekend-to-Monday drop in the series\n\n✅ Driverless share 69%, third highest ever\n\nTesla may be deploying more Cybercabs than normal for the festival. ACL runs two weekends, so Oct 9-11 will have a festival too. The weekday numbers in between are the cleaner read until then ✍️", "url": "https://x.com/RobotaxiRadar/status/2107422265251860496", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107429228706734401", "t": "2026-10-06T11:14:16+00:00", "views": 2805, "likes": 20, "reposts": 1, "handle": "DavidMoss", "name": "David Moss", "avatar": "", "followers": 18311, "text": "I got matched with a car about 5min later, overall 45min wait https://t.co/YIYtQJOyDY", "url": "https://x.com/DavidMoss/status/2107429228706734401", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2107432535575687275", "t": "2026-10-06T11:27:25+00:00", "views": 1510, "likes": 26, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "It took ~45 minutes for @DavidMoss to locate and hail a Cybercab in the northern part of the Austin geofence at opening time ⏰\n\nCybercabs might still be leaving their depot during early morning operations. Hopefully early morning wait times will improve as we move to 24/7 service ✍️", "url": "https://x.com/RobotaxiRadar/status/2107432535575687275", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107441123539202180", "t": "2026-10-06T12:01:32+00:00", "views": 2479, "likes": 34, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Tesla robotaxi wait times and pricing on a early Tuesday morning in Austin https://t.co/wpxc2DD4nn", "url": "https://x.com/WorldlyReviewer/status/2107441123539202180", "lane": "rider_economics_experience", "copy_origin": "2105989391143620795", "in_dataset": 1, "copies": 0}, {"id": "2107453787413627199", "t": "2026-10-06T12:51:52+00:00", "views": 1318, "likes": 18, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi Early Morning Update:\n\n🚕 Model Y - $7.00 - 7 min wait ⏱️ 🚕 Cybercab - $7.91 - $8.21 - 13 min wait ⏱️\n\n🟢 $7.00 is one of the cheapest Model Y fares I've seen. The previous low was $8.94 on Sunday\n 🟢 Model Y takes both columns: 15% cheaper and 6 min quicker than Cybercab\n 🟢 Fares keep getting lower. Model Y went $20.18 two weeks ago to $10.08 at Monday rush to $7.00 this early morning\n 🟡 Cybercab's cheap-weekday-morning pattern inverted this morning. It used to run 27-35% below Model Y before 10am, now it's ~17% above\n\nA $7 Robotaxi at 7am? Two weeks ago this same ride was $20 ✍️\n https://t.co/PRonLOzwHv", "url": "https://x.com/RobotaxiRadar/status/2107453787413627199", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107455839585845429", "t": "2026-10-06T13:00:01+00:00", "views": 6612, "likes": 184, "reposts": 17, "handle": "DavidMoss", "name": "David Moss", "avatar": "", "followers": 18311, "text": "Five days without driving myself. Just Tesla Cybercab and walking around Austin.\n\nI’m doing this for a full week. \n\nNo Uber, no Waymo, and no Model Y Robotaxi's. If Cybercab can’t get me there, I’m walking. Every day, I’m filming how that works while I go about my life.\n\nDay 5 started with a 6 AM booking for sunrise and a Cybercab showing 38 minutes away. That first ride encountered a closed single lane road, and I filmed eight minutes of it looping around and figuring things out.\n\nLater, I got out of one Cybercab, finished my camera store shopping, and was back in another in just 11 minutes. \n\nAfter I got stuck for 14 min in a parking lot too! Interesting day of edge cases.\n\nDefinitely my favorite day yet.\n\nAnything you guys would like to see me test more specifically?", "url": "https://x.com/DavidMoss/status/2107455839585845429", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107469069351870560", "t": "2026-10-06T13:52:35+00:00", "views": 1939, "likes": 11, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Uber vs Tesla robotaxi during Tuesday morning rush hour in Austin https://t.co/VZRXO7Y8Au", "url": "https://x.com/WorldlyReviewer/status/2107469069351870560", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2107470016354668630", "t": "2026-10-06T13:56:21+00:00", "views": 3757, "likes": 15, "reposts": 1, "handle": "binarybits", "name": "Timothy B. Lee", "avatar": "", "followers": 53067, "text": "Lining things up this way makes it look like Tesla is gaining ground on Waymo, though I don't know how big Tesla's non-Austin services are. https://t.co/w9dhLVoe7Z", "url": "https://x.com/binarybits/status/2107470016354668630", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107493426363044100", "t": "2026-10-06T15:29:22+00:00", "views": 17002, "likes": 269, "reposts": 8, "handle": "DavidMoss", "name": "David Moss", "avatar": "", "followers": 18310, "text": "51 Minutes Cybercab Route\n30 Minutes Apple Maps No Highways Selected \n\nMaybe Apple Maps has a route that would take the vehicle out of Geofence but another interesting development here in Austin \n\nI feel like I’ve been ragging on Tesla Robotaxi way too much when in all honesty I’ve having a lot of fun & overall each ride is better than the last. I just want to be transparent & the experience to be best for all.", "url": "https://x.com/DavidMoss/status/2107493426363044100", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107496618966806601", "t": "2026-10-06T15:42:04+00:00", "views": 10455, "likes": 237, "reposts": 11, "handle": "niccruzpatane", "name": "Nic Cruz Patane", "avatar": "", "followers": 134518, "text": "Tesla Robotaxi offers a much more optimized experience versus Waymo. \n\nThe Waymo Zeekr is made in China, while Cybercab is made in Austin, Texas. https://t.co/sF1lFANqJ5", "url": "https://x.com/niccruzpatane/status/2107496618966806601", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107501314645053794", "t": "2026-10-06T16:00:43+00:00", "views": 860, "likes": 19, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 6\n\nTesla: 589\nWaymo: 1168\nZoox: 63\nAvride: 344\n\nFor more detailed info see link to live tracker in bio.", "url": "https://x.com/texasavtracker/status/2107501314645053794", "lane": "texas_proving_ground", "copy_origin": "2106413983494209761", "in_dataset": 1, "copies": 0}, {"id": "2107580623242055934", "t": "2026-10-06T21:15:52+00:00", "views": 594818, "likes": 4524, "reposts": 603, "handle": "JohnLeFevre", "name": "John LeFevre", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAH4gAHABAAEwAHAABhY3NwQVBQTA
