KvZldFdQrS2royyoRrMY8R0a7oDHWf/9oADAMBAAIAAwAAABAhqEWIU7Mj/8QAGREBAQEBAQEAAAAAAAAAAAAAAREAITFR/9oACAEDAQE/EJ+4kyJ7m5uWJjeGsZuyYLcjLN//xAAcEQEBAQABBQAAAAAAAAAAAAABEQAxECFBUXH/2gAIAQIBAT8QmY746BgvLjUndwjUinBpp7yWfd//xAAgEAEBAAICAgIDAAAAAAAAAAABEQAhMUFRcWGRgaHB/9oACAEBAAE/ECYze3e0tKNeMCcRxhCV6a5OKOUXkQIlWXwEwzDVKGKCpexNkTvGXYoe74xTAqEbVCv3jNWFdamA0XyG8BTRgGTU1Qe9GEh0BrWpeNBdzBXoKwfs3joLCaNEN+sM1meQLMQUajQh8amOKA9vADoFa9sMskn9oq15SfGNBrQlTqptf5i5dGdneKe94t+sOoCeZ2cfpziyOMsQP5wYpjwcJs995qcRhihoL+sdAve17MGpHEhX08e8PLJYdV9t5JTEfJecokhRfwQ/uD8gJZtVZgEjtBWacUirejO4qOqFZ3D1gVVAvW7Z16wFNIRIoPBg5CAdPAYfXHWi8G0lxItMigQ/J54z/9kgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=", "followers": 200732, "text": "The Texas Triangle will see the biggest economic expansion in the US over the next ten years. \n\nDallas, Houston, Austin, San Antonio.\n\nNothing else groups like this:\n- low cost of living\n- high quality of life\n- ample and relatively cheap land\n- no state income tax\n- central location\n- good weather  \n- diverse economies\n- business and regulatory friendly\n- good education & healthcare\n- Giga Texas + Terafab + Bastrop\n\nThe suburban and rural areas will also benefit massively from technological and cultural shifts: \n- work from anywhere\n- self driving cars, no traffic\n- transportation: drones, flying cars\n- food delivery improvements (not just TexMex and BBQ anymore)\n- AR/VR/AI in education\n- decreasing social isolation\n- influx of talent and high-caliber people\n- patriotic, pro-American, homogenous culture & values", "url": "https://x.com/JohnLeFevre/status/2107580623242055934", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107701201202524300", "t": "2026-10-07T05:15:00+00:00", "views": 39932, "likes": 102, "reposts": 24, "handle": "MarioNawfal", "name": "Mario Nawfal", "avatar": "", "followers": 3954235, "text": "Cybercab is scaling the Tesla way: quick, controlled, safety-first rollout.\n\nRegistrations have quadrupled in Texas, with no major safety incidents reported and mostly positive rider feedback so far.\n\nTesla built its reputation on safety. That cautious rollout matters.\n\nMore Cybercabs on the road. Same obsession with safety.\n\n@Tesla @robotaxi / Writer: Annette, Designer: Janné", "url": "https://x.com/MarioNawfal/status/2107701201202524300", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107731948508717415", "t": "2026-10-07T07:17:10+00:00", "views": 16774, "likes": 18, "reposts": 1, "handle": "kabuakadayo0", "name": "きゃぶ", "avatar": "", "followers": 24352, "text": "Waymoはアトランタで冠水した道路に突っ込むなどし、高速道路やダウンタウンで立ち往生する事故を起こした。\n\nLiDAR依存のAIを使うため晴れの日は運行するが、豪雨が予想される日はLiDARが機能しない恐れから運休している。\n\n雨の日に使えないタクシーwww\nGO大丈夫なのかwww\nhttps://t.co/sQa1uTZqqG", "url": "https://x.com/kabuakadayo0/status/2107731948508717415", "lane": "camera_vs_lidar_weather", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107758624189907363", "t": "2026-10-07T09:03:10+00:00", "views": 3561, "likes": 88, "reposts": 0, "handle": "KRoelandschap", "name": "Kees Roelandschap", "avatar": "", "followers": 11240, "text": "Off to Austin, TX 🇺🇸 \n\nGonna take a shit ton of Robotaxi rides\n\nMight as well start it off in style with a coffee prepared by a robo barista at the airport ✈️ https://t.co/vonPIsl4yF", "url": "https://x.com/KRoelandschap/status/2107758624189907363", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107780551302164749", "t": "2026-10-07T10:30:18+00:00", "views": 4308, "likes": 56, "reposts": 4, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "557 Cybercab sightings in Austin yesterday, with 416 driverless\n\n#cybercab #tesla #robotaxi https://t.co/Cdm1G2goUx", "url": "https://x.com/CybercabSpotter/status/2107780551302164749", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107784752979701864", "t": "2026-10-07T10:47:00+00:00", "views": 2546, "likes": 94, "reposts": 9, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Yesterday's sightings show the weekday floor has moved up in Austin 📈\n\n✏️ Driverless = 416 ✏️ Total = 557\n\n✅ Total up 50% vs last Tuesday (371)\n\n✅ Driverless up 68% vs last Tuesday (248)\n\n✅ 416 driverless is the highest on any non-festival day\n\n✅ Driverless share 75%, second only to Oct 3's 77%\n\nTwo weekdays in a row near 560, with no event in town shows a clean WoW increase in Cybercab presence ✍️", "url": "https://x.com/RobotaxiRadar/status/2107784752979701864", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107788775896281153", "t": "2026-10-07T11:02:59+00:00", "views": 22510, "likes": 240, "reposts": 5, "handle": "DavidMoss", "name": "David Moss", "avatar": "", "followers": 18311, "text": "Robotaxi Wait Austin:\n\nToday right at 6AM opening just now \n\n29 min wait Cybercab\n13 min wait Model Y\n\n3 days in a row now for me of seeing Model Y’s closer to me at the start of the day. \n\nHope you all have a great day! https://t.co/JketceVcJB", "url": "https://x.com/DavidMoss/status/2107788775896281153", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107793124877861169", "t": "2026-10-07T11:20:16+00:00", "views": 1559, "likes": 26, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Cybercab wait times are still running long near the outer edges of the Austin geofence at the 6am service open 🧐 https://t.co/5Tmqk0dzyU", "url": "https://x.com/RobotaxiRadar/status/2107793124877861169", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107800563588927742", "t": "2026-10-07T11:49:50+00:00", "views": 2705, "likes": 37, "reposts": 2, "handle": "JeebsTX", "name": "JeebsTX 🇺🇸", "avatar": "", "followers": 7718, "text": "Cybercab in Austin at dawn: plentiful. Price: 10% over the Model Y Robotaxi.\n\nDedicated robotaxi costs more than the car that wasn’t built for this. \n\nSupply and demand, or Tesla testing what people will pay for the Cybercab? https://t.co/Mxn7TqRrgi", "url": "https://x.com/JeebsTX/status/2107800563588927742", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107801383743402110", "t": "2026-10-07T11:53:05+00:00", "views": 2076, "likes": 18, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Tesla robotaxi wait times and pricing on a Wednesday early morning in Austin https://t.co/diSzWb1Uwl", "url": "https://x.com/WorldlyReviewer/status/2107801383743402110", "lane": "rider_economics_experience", "copy_origin": "2105989391143620795", "in_dataset": 1, "copies": 0}, {"id": "2107808614224146676", "t": "2026-10-07T12:21:49+00:00", "views": 1415, "likes": 30, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi Wednesday Early Morning Update:\n\n🚕 Model Y - $7.71 - 17 min wait ⏱️\n🚕 Cybercab - $8.73 - 12 min wait ⏱️\n\n🟢 Model Y is 12% cheaper, second straight morning under $8 after yesterday's $7.00\n 🟢 Cybercab is 5 min quicker, now the faster Tesla at six consecutive checks going back to Monday\n 🟡 Model Y's 17 min is slow for an early morning. It quoted 7 min at this hour yesterday\n 🟢 Early morning has become the cheapest window on this route by a wide margin. Yesterday went $7.00 at 7am to $11.11 at rush hour\n\nCybercab arrives faster, Model Y costs less. Rider wait times from different parts of the geofence suggest Cybercabs sit closer to downtown while Model Ys cover the outskirts - a better depot mix (and more depots) might even out waits ✍️\n https://t.co/tHmYaMe1XY", "url": "https://x.com/RobotaxiRadar/status/2107808614224146676", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107809932158681136", "t": "2026-10-07T12:27:03+00:00", "views": 10255, "likes": 396, "reposts": 21, "handle": "JOBhakdi", "name": "Jo Bhakdi", "avatar": "", "followers": 40946, "text": "70 Tesla Cybercabs have now been confirmed on the road — 169 already registered with the Texas DMV. \n\nThat’s about 400% the growth rate of last year’s Robotaxi June launch. 🚀 \n\nLive tracker: https://t.co/YcPsiHDduc https://t.co/R3DLsx6Nyh", "url": "https://x.com/JOBhakdi/status/2107809932158681136", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107826733307080878", "t": "2026-10-07T13:33:49+00:00", "views": 1504, "likes": 12, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Wednesday morning rush hour in Austin https://t.co/dr8usu09G3", "url": "https://x.com/WorldlyReviewer/status/2107826733307080878", "lane": "rider_economics_experience", "copy_origin": "2105653354773045731", "in_dataset": 1, "copies": 0}, {"id": "2107840619725082865", "t": "2026-10-07T14:29:00+00:00", "views": 3055, "likes": 57, "reposts": 1, "handle": "ChrisDungeon", "name": "Christopher Dungeon", "avatar": "", "followers": 31618, "text": "Elon’s Cybercab claim:\n\nUnder $30K before 2027.\n\nA production robotaxi with no steering wheel already taking paid rides in Austin.\n\nIf that price lands, every auto OEM’s \"robotaxi plan\" becomes a museum piece.\n\n$TSLA", "url": "https://x.com/ChrisDungeon/status/2107840619725082865", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107842431173497144", "t": "2026-10-07T14:36:12+00:00", "views": 1026, "likes": 15, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Wednesday Morning Rush Hour Uber vs. Robotaxi Update:\n\n🚕 Model Y - $11.98 - 15 min wait ⏱️ 🚕 Cybercab - $13.67 - 13 min wait ⏱️ 🚙 Uber Comfort Electric - $9.98 - 7 min wait ⏱️ 🚙 UberX - $8.96 - 10 min wait ⏱️\n\n🔴. Comfort Electric is $2 under Model Y and 8 min quicker\n 🟡 UberX cheapest at $8.96, a $3.02 gap over Model Y\n 🟡 Model Y jumped $4.27 from 8am to 10:30am, $7.71 to $11.98. Steepest morning climb I’ve seen\n 🟢 Cybercab is the faster Tesla for a seventh straight check, 13 min vs 15", "url": "https://x.com/RobotaxiRadar/status/2107842431173497144", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107863779266421175", "t": "2026-10-07T16:01:01+00:00", "views": 1270, "likes": 18, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 7\n\nWaymo: 1168\nTesla: 589\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2107863779266421175", "lane": "tesla_vs_waymo_duel", "copy_origin": "2106413983494209761", "in_dataset": 1, "copies": 0}, {"id": "2107875955721269403", "t": "2026-10-07T16:49:24+00:00", "views": 4918, "likes": 139, "reposts": 9, "handle": "DoctorJack16", "name": "Doctor Jack", "avatar": "", "followers": 67977, "text": "Tesla’s Robotaxi rise is undeniable.\n\nThey took about a year of robotaxi rides to reach 380,000 unsupervised miles (July 22 earnings call). It then added 620,000 in the next 6 weeks, hitting 1 million on Sept 3.\n\nThis is what happens when the safety monitor comes out and the rate-limiting step goes from “can it drive” to “how fast can you put cars on the road.”\n\nCybercab then entered Austin the same week the million-mile mark was announced by Tesla. \n\nRegistered Cybercabs in Austin went from about 45 at launch to 169 by Oct 4. Hundreds of Cybercabs are piling up in cities like Houston and Dallas. The Robotaxi service is live and driverless, in Austin, Dallas, Houston, Miami, Orlando, and Tampa.\n\nAnd people are selling $TSLA?!", "url": "https://x.com/DoctorJack16/status/2107875955721269403", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107887428489101591", "t": "2026-10-07T17:35:00+00:00", "views": 2702, "likes": 79, "reposts": 0, "handle": "ChrisDungeon", "name": "Christopher Dungeon", "avatar": "", "followers": 31618, "text": "Austin Cybercab fleet: ~45 → ~169 in about a month.\n\nNearly 4x\n\nHouston already stacking ~200 units on the lot.\n\nThat’s inventory for city #2\n\nRobotaxi isn’t a 2030 story anymore.\n\nIt’s a fleet-build story happening in real time.\n\n$TSLA", "url": "https://x.com/ChrisDungeon/status/2107887428489101591", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107908679768977735", "t": "2026-10-07T18:59:26+00:00", "views": 1932, "likes": 13, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Tesla robotaxi wait times and pricing on a Wednesday afternoon in Austin https://t.co/QLBxtvT8al", "url": "https://x.com/WorldlyReviewer/status/2107908679768977735", "lane": "rider_economics_experience", "copy_origin": "2105989391143620795", "in_dataset": 1, "copies": 0}, {"id": "2107913066851541231", "t": "2026-10-07T19:16:52+00:00", "views": 1360, "likes": 36, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi Wednesday Mid-Afternoon Update:\n\n🚕 Cybercab - $11.67 - 12 min ⏱️\n🚕 Model Y - $10.38 - 15 min ⏱️\n\n🟢 Cybercab arrives first again, now 8 straight checks beating Model Y on wait going back to Monday\n 🟡 It costs $1.29 more for those 3 minutes\n 🟢 Both fares eased off rush hour. Model Y $11.98 to $10.38, Cybercab $13.67 to $11.67\n 🟢 Both under $12 in the middle of a weekday afternoon\n\nCybercab is starting to be the faster Tesla now. The price gap between the two is small and keeps moving ✍️\n https://t.co/kGLhkrdKud", "url": "https://x.com/RobotaxiRadar/status/2107913066851541231", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107930202277904542", "t": "2026-10-07T20:24:58+00:00", "views": 2364, "likes": 29, "reposts": 2, "handle": "RtaxiTracker", "name": "Robotaxi Tracker", "avatar": "", "followers": 9221, "text": "Waymo just registered 7 more autonomous vehicles with the Texas DMV—1,175 now on the state registry, up from 1,168.\n\n7 × 2024 Jaguar I-Pace\n\nTrack the fleet: https://t.co/wz21v3FJn5 https://t.co/7FodremVDl", "url": "https://x.com/RtaxiTracker/status/2107930202277904542", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 1}, {"id": "2107955252121239803", "t": "2026-10-07T22:04:30+00:00", "views": 1716, "likes": 8, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Wednesday evening rush hour in Austin https://t.co/KgsmzUtueN", "url": "https://x.com/WorldlyReviewer/status/2107955252121239803", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2107961087958335507", "t": "2026-10-07T22:27:42+00:00", "views": 1266, "likes": 23, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Wednesday Afternoon Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $11.71 - 9 min wait ⏱️ 🚕 Cybercab - $13.13 - 12 min wait ⏱️ 🚙 Uber Comfort - $11.99 - 9 min wait ⏱️ 🚙 UberX - $7.93 - 8 min wait ⏱️\n\n🟢 Model Y beats Comfort on price and ties it on wait, $11.71 vs $11.99 at 9 min each\n 🟡 UberX is cheapest at $7.93, a $3.78 gap\n 🔴 Cybercab's 8-check streak as the faster Tesla ends here. Model Y beat it by 3 min\n 🟢 Model Y at 9 min is its quickest rush hour pickup this week, down from 15 min this morning\n\nModel Y's waits improved through the day while fares barely moved ✍️", "url": "https://x.com/RobotaxiRadar/status/2107961087958335507", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107973911405072505", "t": "2026-10-07T23:18:39+00:00", "views": 2187, "likes": 82, "reposts": 3, "handle": "lotharlindinger", "name": "Lothar Lindinger", "avatar": "", "followers": 1102, "text": "Meine erste Fahrt mit dem Cybercab. Ich bin einfach hin und weg. Bindblow! 1/2👇 https://t.co/f8X0n8ZF9E", "url": "https://x.com/lotharlindinger/status/2107973911405072505", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108029323349463484", "t": "2026-10-08T02:58:50+00:00", "views": 5981, "likes": 81, "reposts": 7, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24288, "text": "Tesla’s Robotaxi fleet is growing rapidly in Texas! 🚀\n\nAccording to TxDMV registration data, Tesla’s registered Robotaxi fleet has expanded dramatically in just four months.\n\nMay 28: 42 vehicles  \nAugust 31: 314 vehicles  \nOctober 2: 578 vehicles\n\nThat's nearly 14X growth since late May!\n\nLatest breakdown:\n• Model Y: 420\n• Cybercab: 158\n• Total: 578\n\nHere’s what’s even more interesting:\n\nBetween September 23 and October 2, Cybercab registrations surged from 69 to 158 — an increase of 129% in just nine days.\n\nCybercab now accounts for 27.3% of the registered fleet.\n\nAnd the latest 32 additions were ALL Cybercabs.\n\nTesla’s Robotaxi expansion is accelerating, and Cybercab is becoming an increasingly important part of the fleet.", "url": "https://x.com/TeslaZoa/status/2108029323349463484", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108080391194062856", "t": "2026-10-08T06:21:46+00:00", "views": 8271, "likes": 107, "reposts": 9, "handle": "GrumpyTesla_", "name": "Stanley", "avatar": "", "followers": 8226, "text": "My first full Cybercab ride-along! Not sure who wants to hear me blab, but Cybercab is next level. Welcome to an autonomous future!\n\n@Tesla \n@robotaxi \n@teslasi https://t.co/Quy3JydL2D", "url": "https://x.com/GrumpyTesla_/status/2108080391194062856", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108109019978355193", "t": "2026-10-08T08:15:31+00:00", "views": 1708, "likes": 71, "reposts": 9, "handle": "BradMunchen", "name": "Motorhead", "avatar": "", "followers": 24678, "text": "Outside of Texas, where Musk owns most lawmakers, you can't hail a Tesla \"robotaxi\" with remote drivers. And forget about trying to hail a Cybercab. \n\nThis hairy, fat gnome likely knows that Tesla FSD is dangerous, but touts it nonetheless for money from Musk.  \n\n$TSLA $TSLAQ https://t.co/CuAMlLHznP", "url": "https://x.com/BradMunchen/status/2108109019978355193", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108125043385610747", "t": "2026-10-08T09:19:12+00:00", "views": 3559, "likes": 58, "reposts": 27, "handle": "jackcoder0", "name": "Jack", "avatar": "", "followers": 43565, "text": "On March 21, 2026, Elon Musk walked onto a stage at the defunct Seaholm Power Plant in Austin and announced the most ambitious manufacturing project in modern history.\n\n\"Terafab.\"\n\nA semiconductor megafactory jointly built by Tesla, SpaceX, and xAI  with Intel as the foundry partner. 100+ million square feet of manufacturing space. Five times larger than the world's current largest building. A $16.8 billion first phase investment  with filings suggesting the full multi-phase buildout could reach $119 billion. A factory designed to produce 1 terawatt of AI computing power per year. The chips that power Tesla's Optimus robots, the self-driving Cybercabs, and SpaceX's planned orbital data centers  all manufactured in one building, in Grimes County, Texas, on the former site of a decommissioned coal power station.\n\nMusk called it \"the most epic chip building exercise in history by far.\"\n\nMost people saw the headline, thought \"Elon is being Elon again,\" and scrolled past. A semiconductor analyst who's tracked every major fab announcement for 15 years told his team something that reframes why Terafab matters  whether or not you own a Tesla, whether or not you trust Musk, and whether or not the factory is built on schedule.\n\n\"Terafab isn't a chip factory. It's a bet that the company which controls its own chip supply chain controls the future of AI. And the 11 details behind the headline explain why this is either the most important industrial project of the decade  or the most expensive broken promise.\"\n\nHere's every detail most people missed behind the Terafab announcement 🧵", "url": "https://x.com/jackcoder0/status/2108125043385610747", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108127765933211929", "t": "2026-10-08T09:30:01+00:00", "views": 39149, "likes": 67, "reposts": 11, "handle": "MarioNawfal", "name": "Mario Nawfal", "avatar": "", "followers": 3954220, "text": "One month. Nearly 4x more Cybercab registrations.\n\nAustin went from about 45 at launch to 169 by early October.\n\nNow the service runs until 11 p.m., and some early \nCybercab rides are already coming in around normal UberX money.\n\nMore availability. More hours. Less money per ride.\n\nThe paperwork is moving fast. Next up: more Cybercabs actually picking people up.\n\n@Tesla @robotaxi / Writer: Annette, Designer: Janné", "url": "https://x.com/MarioNawfal/status/2108127765933211929", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108142936533688776", "t": "2026-10-08T10:30:18+00:00", "views": 2424, "likes": 47, "reposts": 4, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "529 Cybercab sightings in Austin yesterday, with 401 driverless\n\n#cybercab #tesla #robotaxi https://t.co/WcJwBZkKh3", "url": "https://x.com/CybercabSpotter/status/2108142936533688776", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108148333613035870", "t": "2026-10-08T10:51:44+00:00", "views": 1594, "likes": 36, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Yesterday's Cybercab sightings keep the weekday floor intact in Austin 📈\n\n✏️ Driverless = 401 ✏️ Total = 529\n\n✅ Three clean weekdays now, all between 529 and 566\n\n✅ Driverless share 76%, the highest on any non-festival day\n\n✅ Up 43% vs Sep 29, the last verified weekday before the outage (371)\n\n✅ Driverless up 62% over the same stretch (248)\n\nTotal has eased each of the last three days, though only 6% in total. ACL weekend 2 starts tomorrow, so today will be the last clean weekday reading ✍️", "url": "https://x.com/RobotaxiRadar/status/2108148333613035870", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108164699330396402", "t": "2026-10-08T11:56:46+00:00", "views": 1608, "likes": 25, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Tesla robotaxi wait times and pricing on a Thursday early morning in Austin https://t.co/KKNh3LkTwd", "url": "https://x.com/WorldlyReviewer/status/2108164699330396402", "lane": "rider_economics_experience", "copy_origin": "2105989391143620795", "in_dataset": 1, "copies": 0}, {"id": "2108166015372734753", "t": "2026-10-08T12:02:00+00:00", "views": 1297, "likes": 29, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "More folks arriving in Austin, TX for the X Takeover means more Cybercab ride review videos are coming in 👀🎥\n\n📍Trip to Austin City Limits Live\n\n⏱️ 8 minute wait for pickup\n\n☑️ Pickup was flawless\n\n☑️ 5-6 miles took roughly 21 min from pickup to dropoff\n\n☑️ ~$14 ride\n\n☑️ Waymos are everywhere\n\n☑️ Obeyed lane markings (avoided a “left turn only” lane)\n\n☑️ Went through a yellow light, slowed down for a bus stopped, and went over double yellow line to get around stopped bus\n\n☑️ Didn’t block intersection when road ahead was backed up.\n\n☑️ Needed to go around another Cybercab that was picking up/dropping off in the middle of the lane (nowhere to pull over)\n\n☑️ Went through a yellow light that turned red towards end of trip\n\n☑️ Pulls over to the side of the road to safely end the trip\n https://t.co/394AQB3F6p", "url": "https://x.com/RobotaxiRadar/status/2108166015372734753", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108168418763358282", "t": "2026-10-08T12:11:33+00:00", "views": 1011, "likes": 11, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi Thursday Early Morning Update:\n\n🚕 Model Y - $8.51 - 14 min wait ⏱️ 🚕 Cybercab - $9.53 - 16 min wait ⏱️\n\n🟢 Model Y is 11% cheaper, third straight morning under $10 after $7.00 Tuesday and $7.71 Wednesday\n 🟡 Model Y's $1.02 gap to Cybercab matches yesterday's split\n 🔴 Cybercab's wait streak is over, at least for this week. Model Y has been quicker two checks running after eight straight Cybercab wins\n\nEarly morning stays the cheapest window, but it's drifting up. $7.00 Tuesday, $7.71 Wednesday, $8.51 today. The influx of Tesla enthusiasts for the X Takeover might be having its effect ✍️\n https://t.co/CQPH46ovM8", "url": "https://x.com/RobotaxiRadar/status/2108168418763358282", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108179453121540189", "t": "2026-10-08T12:55:24+00:00", "views": 1873, "likes": 42, "reposts": 1, "handle": "TeslaOwnersUK", "name": "Tesla Owners UK 🇬🇧", "avatar": "", "followers": 25551, "text": "Our president is in Austin for @theXtakeover and he will be sharing some thoughts same neighborhood earlier this year. So I’m a little confused what’s going on. I would have stayed at a different location had I know this😞", "url": "https://x.com/JoNationLive/status/2108254044305113561", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108255151026745545", "t": "2026-10-08T17:56:12+00:00", "views": 1629, "likes": 20, "reposts": 0, "handle": "RtaxiTracker", "name": "Robotaxi Tracker", "avatar": "", "followers": 9221, "text": "Waymo just registered 10 more autonomous vehicles with the Texas DMV—1,185 now on the state registry, up from 1,175.\n\n9 × 2024 Jaguar I-Pace\n1 × 2021 Jaguar I-Pace\n\nTrack the fleet: https://t.co/wz21v3FJn5 https://t.co/MERbk5z9Dy", "url": "https://x.com/RtaxiTracker/status/2108255151026745545", "lane": "texas_proving_ground", "copy_origin": "2107930202277904542", "in_dataset": 1, "copies": 0}, {"id": "2108274778196922694", "t": "2026-10-08T19:14:11+00:00", "views": 3405, "likes": 36, "reposts": 5, "handle": "KRoelandschap", "name": "Kees Roelandschap", "avatar": "", "followers": 11240, "text": "Watch 10 minutes of Robotaxi\n\nFrom pick up to drop off\n\nMinor caveat: why can’t I turn on the ventilated seats @elonmusk @robotaxi \n\nOh and another thing, my Spotify account doesn’t migrate with every drive. Sometimes I need to log out the previous user and log in again, feels unnecessary", "url": "https://x.com/KRoelandschap/status/2108274778196922694", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108287135358865689", "t": "2026-10-08T20:03:17+00:00", "views": 1281, "likes": 61, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Alright guys at 139 Cybercab license plates in Austin now. Keep those posts coming. Only 30 more plates to find. Every plate is manually verified by me to be authentic. Also, Tesla robotaxi fleet has crossed 300 license plates total in Austin. We have a lot of robotaxis here! https://t.co/IStC56fOuY", "url": "https://x.com/WorldlyReviewer/status/2108287135358865689", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108294800134869317", "t": "2026-10-08T20:33:45+00:00", "views": 2590, "likes": 13, "reposts": 2, "handle": "gheeunit", "name": "mantequilla 🧈", "avatar": "", "followers": 3576, "text": "It is 3:30 PM on a Thursday afternoon and Robotaxi rides are abundantly available with less than 9 minute wait times for both Cybercab and Model Y.\n\n@theXtakeover attendees continue to pile into Austin with a few currently attending the Afternoon Meet & Greet at Boring Bodega in Bastrop. Others are currently experiencing factory tours at Giga Texas.\n\nLooking forward to seeing everyone at the Pre-Party Meet & Greet at Lustre Pearl on Rainey this evening!", "url": "https://x.com/gheeunit/status/2108294800134869317", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108314900338798869", "t": "2026-10-08T21:53:37+00:00", "views": 1432, "likes": 43, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Robotaxi is still holding up ahead of @theXtakeover event. Wait times are 5 minutes (Cybercab) and 8 minutes (Model Y) for @gheeunit’s ride today at 3:30pm ✍️\n https://t.co/Qxp5QuwYof", "url": "https://x.com/RobotaxiRadar/status/2108314900338798869", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108320194217054500", "t": "2026-10-08T22:14:39+00:00", "views": 6456, "likes": 273, "reposts": 6, "handle": "Gfilche", "name": "Gali", "avatar": "", "followers": 197102, "text": "I’m never getting tired of this ⚡️⚡️⚡️ @robotaxi https://t.co/qPCZtp7pjS", "url": "https://x.com/Gfilche/status/2108320194217054500", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108324055950745822", "t": "2026-10-08T22:30:00+00:00", "views": 6449, "likes": 26, "reposts": 7, "handle": "Newsforce", "name": "NewsForce", "avatar": "", "followers": 668454, "text": "🇺🇸EXCLUSIVE: Newsforce just climbed into a @robotaxi Cybercab at Giga Texas...and there is no steering wheel and no gas and brake pedals.\n\n@PatSchnecker and @MacyGunnell say the plant builds hundreds of these vehicles a day at max capacity.\n\n“Only in America, only in Texas, only at the Gigafactory.”\n\nJoin NewsForce and the rest of @Tesla and @X at @theXtakeover this Saturday, Oct. 10.", "url": "https://x.com/Newsforce/status/2108324055950745822", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108329653144338525", "t": "2026-10-08T22:52:14+00:00", "views": 3696, "likes": 108, "reposts": 21, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18761, "text": "🔥 Tesla is hiring 29 AI Vehicle Operators across 29 US cities: Austin, Dallas, Houston and San Antonio, TX; Palo Alto, South San Francisco and San Diego, CA; Flushing and Buffalo, NY; Jacksonville and Doral, FL; Norwell and Peabody, MA; Wexford and Devon, PA; Nashville and Bartlett, TN; Charlotte, NC; Owings Mills, MD; New Orleans, LA; Englewood, NJ; Reno, NV; Saint Louis, MO; Eden Prairie, MN; Washington, DC; Lenexa, KS; Atlanta, GA; Southfield, MI; and Chicago, IL. Robotaxi Incoming.", "url": "https://x.com/teslayoda/status/2108329653144338525", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108338707296133546", "t": "2026-10-08T23:28:13+00:00", "views": 1229, "likes": 20, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Great Model Y Robotaxi ride review from Austin 🚕\n\n🟢 Pickup landed right in front of the rider's hotel 🟢 Dropoff in front of CVS was flawless 🟢 Sound system beats the Cybercab's (though I've heard Waymo's does too) 🟢 More connectivity options than Waymo 🟢 Waymo's announcements feel like overkill next to Robotaxi's 🟡 Driving profile is less aggressive than Cybercab's 🟡 Rear glass has some kind of obstruction, likely where Starlink sits on Model Y Robotaxis 🔴 Doors are a little scuffed 🔴 Rear seats aren’t ventilated 🔴 Account linking isn't consistent. Sometimes you land in someone else's media profile and have to log out and back in\n\nPickup and dropoff keep improving. Media profile syncing still needs improvement ✍️\n https://t.co/31A0QolWTe", "url": "https://x.com/RobotaxiRadar/status/2108338707296133546", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108342335167975926", "t": "2026-10-08T23:42:38+00:00", "views": 1128, "likes": 33, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Who would have thought Austin, TX would become the technology hub of the future? 🤖🚕🦾", "url": "https://x.com/RobotaxiRadar/status/2108342335167975926", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108343815434363197", "t": "2026-10-08T23:48:31+00:00", "views": 5683, "likes": 167, "reposts": 2, "handle": "DirtyTesLa", "name": "Dirty Tesla", "avatar": "", "followers": 152267, "text": "Even with Tesla nerds descending on Austin, Robotaxi availability remains solid\n\nTomorrow will be the real test https://t.co/03j46roE1B", "url": "https://x.com/DirtyTesLa/status/2108343815434363197", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108345611468603499", "t": "2026-10-08T23:55:39+00:00", "views": 1148, "likes": 48, "reposts": 2, "handle": "TeslaJigsaw", "name": "Will", "avatar": "", "followers": 6373, "text": "So, the brakes work well! Our second ride in Tesla’s Cybercab in Austin, Texas — and it was full of surprises! We cover the ride quality, the comfort, the cabin, how the Tesla Robotaxi app works, and much more. \n\nWe also answer my Patreon questions as we head into downtown Austin. Join us for an autonomous Robotaxi ride!\n\nFull Video in thread below 👇", "url": "https://x.com/TeslaJigsaw/status/2108345611468603499", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108348095834792269", "t": "2026-10-09T00:05:31+00:00", "views": 60877, "likes": 1794, "reposts": 96, "handle": "SawyerMerritt", "name": "Sawyer Merritt", "avatar": "", "followers": 1147863, "text": "I’m in downtown Austin right now (7 PM CT) and the Cybercab wait times are great. Also, there are A LOT of them. A notable increase from when I was here a month ago for the launch event. https://t.co/ylAbEWhDpp", "url": "https://x.com/SawyerMerritt/status/2108348095834792269", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108358152005783749", "t": "2026-10-09T00:45:29+00:00", "views": 289331, "likes": 7057, "reposts": 720, "handle": "SawyerMerritt", "name": "Sawyer Merritt", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQM Q6tzAVKieIP67g4ZdZ//ZICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA==", "followers": 1147864, "text": "Woah! Tesla just registered a record 150 Cybercabs for its Robotaxi fleet, bringing the total number of Cybercabs registered to date to 319 (up from 169), according to the Texas DMV.\n\nTesla just nearly doubled its registered Cybercabs overnight. https://t.co/Eghm9wWYml", "url": "https://x.com/SawyerMerritt/status/2108358152005783749", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108377782598160885", "t": "2026-10-09T02:03:29+00:00", "views": 19610, "likes": 1036, "reposts": 43, "handle": "BLKMDL3", "name": "Zack", "avatar": "", "followers": 95542, "text": "Cybercabs are EVERYWHERE in Austin. It’s so cool to see https://t.co/VvefDjyWrH", "url": "https://x.com/BLKMDL3/status/2108377782598160885", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108382798482723135", "t": "2026-10-09T02:23:25+00:00", "views": 2461, "likes": 70, "reposts": 7, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24288, "text": "Tesla’s registered Robotaxi fleet in Texas has surged to 739 vehicles! 🚕🔥\n\nAccording to Texas DMV registration data, Tesla added a record 150 Cybercabs overnight, significantly expanding its Robotaxi fleet.\n\n• Model Y: 420 (unchanged) • Cybercab: 319 (+150) • Total: 739 (+150)\n\nHere’s what stands out:\n\n1️⃣ Cybercab registrations jumped 88.8%, from 169 to 319.\n\n2️⃣ Total fleet registrations increased 25.5%, from 589 to 739.\n\n3️⃣ Cybercab’s share of the registered fleet surged from 28.7% to 43.2%.\n\n4️⃣ All 150 newly registered vehicles were Cybercabs.\n\nTesla is accelerating its Robotaxi fleet expansion, with Cybercab driving all the latest growth.\n\nNote: Registered vehicles are not necessarily in active service.\n\nSource: Texas DMV registration data, October 9, 2026.", "url": "https://x.com/TeslaZoa/status/2108382798482723135", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108418563107443135", "t": "2026-10-09T04:45:32+00:00", "views": 8803, "likes": 51, "reposts": 3, "handle": "TeslaNewswire", "name": "The Tesla Newswire", "avatar": "", "followers": 58155, "text": "🔥 Tesla just added 150 Cybercabs to its official Austin Robotaxi fleet, nearly doubling its Cybercab count!\n\n✅ 319 Cybercabs now listed\n✅ 43% of the fleet, alongside 420 Model Ys https://t.co/xPRhgQ4wHE", "url": "https://x.com/TeslaNewswire/status/2108418563107443135", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108425619025649921", "t": "2026-10-09T05:13:34+00:00", "views": 1091, "likes": 32, "reposts": 0, "handle": "smhumair", "name": "Syed", "avatar": "", "followers": 164, "text": "@SawyerMerritt @DirtyTesLa Wow. Telsa is exponentially scaling their Robotaxi fleet in Texas.. https://t.co/EqToKVGWG1", "url": "https://x.com/smhumair/status/2108425619025649921", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108429308754538741", "t": "2026-10-09T05:28:14+00:00", "views": 25176, "likes": 896, "reposts": 44, "handle": "BLKMDL3", "name": "Zack", "avatar": "", "followers": 95542, "text": "Tesla Robotaxi wait times were so low in Austin for Cybercab and Model Y, saw 3-4 minutes consistently tonight. Nice work Tesla team! https://t.co/d53vDbcyH0", "url": "https://x.com/BLKMDL3/status/2108429308754538741", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108448262650831321", "t": "2026-10-09T06:43:33+00:00", "views": 1846, "likes": 25, "reposts": 1, "handle": "joehansen", "name": "Joe Hansen", "avatar": "", "followers": 22745, "text": "Tesla Robotaxi fleet in Texas, 9 Oct 2026\n• Registered: 739\n• Model Y: 420\n• Cybercab: 319\n• Last 7 days: +161\n• Last 30 days: +302\n\nTesla registered 150 new Cybercabs overnight, nearly doubling them from 169 to 319. \nModel Y has stayed at 420 since September, so all the growth since then has been Cybercab.\n\nTo everyone who said the Cybercab would never happen: 319 of them are now registered in Texas.", "url": "https://x.com/joehansen/status/2108448262650831321", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108479871089263038", "t": "2026-10-09T08:49:09+00:00", "views": 3262, "likes": 133, "reposts": 2, "handle": "CuriousPejjy", "name": "Pejjy", "avatar": "", "followers": 32537, "text": "Holy shit! $TSLA just added 150 operational Cybercabs to their Robotaxi fleet in Austin in just ONE day!\n\nThey are truly flooding the city! https://t.co/Gzr25duCmr", "url": "https://x.com/CuriousPejjy/status/2108479871089263038", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108482551979380919", "t": "2026-10-09T08:59:48+00:00", "views": 20309, "likes": 497, "reposts": 19, "handle": "CuriousPejjy", "name": "Pejjy", "avatar": "", "followers": 32537, "text": "Robotaxis in Austin:\n\nWaymo: 1185\nTesla: 739\nAV Ride: 344\nZoox: 63\n\n$TSLA has added 470 Robotaxis since September 3rd while Waymo added 449 in the same timeframe.\n\nTesla is set to surprass Waymo before end of the year.", "url": "https://x.com/CuriousPejjy/status/2108482551979380919", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108492315991925192", "t": "2026-10-09T09:38:36+00:00", "views": 1143, "likes": 18, "reposts": 2, "handle": "AlJR86", "name": "Alex R", "avatar": "", "followers": 3154, "text": "Tesla's Cybercab is now more than 2 in 5 of its Texas Robotaxi fleet, after the state register added 150 of them in one update.\n\nThe Texas DMV's public list for Tesla Robotaxi LLC now shows 319 Cybercabs and 420 Model Ys. Before Thursday's update it showed 169 Cybercabs.\n\nThe Model Y count didn't move, so every vehicle added was a Cybercab. In this ride footage from @niccruzpatane, the rider climbs in through the gull-wing door, and the cabin has a screen where the steering wheel would be.\n\nNHTSA has opened an audit of how Tesla certified a car with no pedals or steering wheel, and an agency memo reportedly gives Tesla until October 30 to answer under oath.", "url": "https://x.com/AlJR86/status/2108492315991925192", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108501204309540936", "t": "2026-10-09T10:13:55+00:00", "views": 9190, "likes": 145, "reposts": 16, "handle": "XFreeze", "name": "X Freeze", "avatar": "", "followers": 286955, "text": "Tesla’s Robotaxi fleet registered in Texas is scaling fast\n\nTxDMV roster (via Texas AV Tracker):\n\n• May 28: 42\n• June 9: 69\n• July 15: 175\n• Aug 31: 314 — 45 Cybercabs\n• Sep 8: 437 — 49 Cybercabs\n• Sep 18: 448 — 58 Cybercabs\n• Sep 22: 476 — 67 Cybercabs\n• Sep 23: 479 — 69 Cybercabs\n• Sep 25: 546 — 126 Cybercabs\n• Oct 2: 589 — 169 Cybercabs\n• Oct 8: 739 — 319 Cybercabs\n\n42 → 739 in a little over 4 months\n\nThat's nearly 18× growth \n\nThe latest jump is entirely Cybercab. Model Y has been flat at 420\n\nOct 2: 169 Cybercabs\nOct 8: 319 Cybercabs\n+150 in six days....A record single batch\n\nCurrent Texas roster:\n• Model Y: 420 — 57%\n• Cybercab: 319 — 43%\n\nCybercab now accounts for more than 2 in every 5 vehicles registered under Tesla’s Robotaxi authorization in Texas\n\nTesla is rapidly expanding its purpose-built autonomous vehicle fleet, and Cybercab is driving the latest growth", "url": "https://x.com/XFreeze/status/2108501204309540936", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108505334901841967", "t": "2026-10-09T10:30:20+00:00", "views": 7978, "likes": 68, "reposts": 6, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "554 Cybercab sightings in Austin yesterday, with 447 driverless\n\n#cybercab #tesla #robotaxi https://t.co/J37rmpXCDA", "url": "https://x.com/CybercabSpotter/status/2108505334901841967", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108508289000505371", "t": "2026-10-09T10:42:04+00:00", "views": 2191, "likes": 56, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Driverless share just hit a new high in Austin 📈\n\n✏️ Driverless = 447 ✏️ Total = 554\n\n✅ Driverless share 81%, a new record (previous was 77% on Oct 3)\n\n✅ 447 driverless is the highest on any non-festival day\n\n✅ Share climbed four straight weekdays: 69% ￼➡️ 75% ➡️ 76% ➡️ 81%\n\n✅ Total held flat all week (529-566), so the entire shift is fewer safety-monitor cars\n\nAustin City Limits weekend 2 starts today, and @theXtakeover in Austin is this weekend. Lots of demand coming into the city this weekend, so the 150 Cybercabs registered last night might change the scale of this graph tomorrow. We’ll keep an eye out ✍️", "url": "https://x.com/RobotaxiRadar/status/2108508289000505371", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108509225819189368", "t": "2026-10-09T10:45:48+00:00", "views": 15077, "likes": 277, "reposts": 28, "handle": "nursedanakay", "name": "Dana Chandler 🇨🇦🖖", "avatar": "", "followers": 11094, "text": "Austin is Cybercab Central. It’s like Disneyland for Tesla enthusiasts. https://t.co/Pcuywa4mcH", "url": "https://x.com/nursedanakay/status/2108509225819189368", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108511933540205001", "t": "2026-10-09T10:56:33+00:00", "views": 4809, "likes": 219, "reposts": 20, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Cybercabs are officially flooding the streets of Austin ￼😳\n\nWith 150 registered in Texas last night, and the massive fleet testing in Houston and Dallas, the growth seems like it’s starting to happen as @aelluswamy outlined in Tesla’s last earning’s call - Double-digit growth rates for the foreseeable future 📈", "url": "https://x.com/RobotaxiRadar/status/2108511933540205001", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108551769240314351", "t": "2026-10-09T13:34:51+00:00", "views": 16043, "likes": 428, "reposts": 45, "handle": "CernBasher", "name": "Cern Basher", "avatar": "", "followers": 56366, "text": "420 Model Y's and 319 Cybercabs\n\nWith the X-Takeover in Austin this weekend, Tesla is likely going to grow faster than 17% week-over-week growth in paid autonomous miles this week.\n\nThis table also shows the number of vehicles they need to add each week to maintain the 17% growth rate.\n\nThis week they would need to add about 66 to 77 vehicles to the fleet to bring it up to 451 to 528 vehicles to support the fleet's needs over the next week.\n\nBut we know they've added 150 vehicles in Texas so far this week, bringing the Texas fleet to 739 vehicles - so they appear to be about two weeks ahead of the 17% growth curve.\n\nUnless, of course, they are growing faster than 17% week-over-week - and in that case, they would need a larger fleet to handle the growth.\n\nEither way, it's a good sign - the Robotaxi fleet is continuing to expand in a way that support's Ashok's guidance and the weekly growth in paid autonomous miles is 17% or higher!\n\nNote: The revenue numbers in the table assume $2.50 per mile and assuming 100 paid miles per day per vehicle.", "url": "https://x.com/CernBasher/status/2108551769240314351", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108552551822234065", "t": "2026-10-09T13:37:58+00:00", "views": 1834, "likes": 8, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3840, "text": "Uber vs Tesla robotaxi during Friday morning rush hour in Austin https://t.co/rMKr3EEbs2", "url": "https://x.com/WorldlyReviewer/status/ H6QGxGOMJalzwh9Sv25FJAJOkI5sRfccVakCB9kEd874yAV9QSFVicb1jCJEk/YQt12zARWLRXViCf44GoSFE2x99zePRmKDs4HSfmLt71BCXdq630twDzFFQdQhzGhmbRo1GAOmibJ3tO1lLAhc0jT3j7m40heetzrA6xR4iN8XEQv1mdP4YBYISZAgc7PL7h3imB7s7I2YWtgYSlF3C/QFzUB41JtU8NcmNpapps+fP3HGcCEV6GkSu9OMPDS4mR/3IB8OegpejXwfMXBwBaEeEvdMJHCQ6tzAVKieIP67g4ZdZ//ZICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA==", "followers": 1147876, "text": "Tesla has definitely added a decent number of Cybercabs to its active fleet recently, because wait times are consistently very low right now despite it being Friday rush hour, and this is with a lot of Tesla fans in town for 𝕏 Takeover requesting rides. https://t.co/mUiszIiJry", "url": "https://x.com/SawyerMerritt/status/2108676412806779098", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108678641999810798", "t": "2026-10-09T21:59:00+00:00", "views": 1245, "likes": 18, "reposts": 4, "handle": "joehansen", "name": "Joe Hansen", "avatar": "", "followers": 22745, "text": "Friday started with 150 new Cybercabs.\n\n1. Tesla registered 150 Cybercabs in Texas overnight, nearly doubling them to 319 in a 739-vehicle Robotaxi fleet. Model Y has stayed at 420(of course), so the fleet is now growing on Cybercab alone.\n\n2. Elon sees a path to SpaceX being worth orders of magnitude more than today's Earth economy, and later said the odds of getting there are \"not zero.\" Even Elon calls it a long shot. Starlink and Starship are where the first steps show up.\n\n3. Delta's CEO told the WSJ the airline is happy with its own Wi-Fi and will skip Starlink. United, American and KLM all picked Starlink. That makes Delta the big US holdout, so passengers can compare for themselves.\n\n4. Elon backed Anthropic's new rule against sustained, cruel abuse of Claude, which takes effect 12 Nov. Backing a rival's policy is rare, and this one is about how users treat the model.\n\n5. Starlink made 1.7bn in operating income in Q2, about a 39% margin, and doubled to 12 million subscribers in a year. That steady cash helps pay for Starship.\n\nA good way to end the week.", "url": "https://x.com/joehansen/status/2108678641999810798", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108683128776925227", "t": "2026-10-09T22:16:49+00:00", "views": 60750, "likes": 352, "reposts": 4, "handle": "wholemars", "name": "Whole Mars Catalog", "avatar": "", "followers": 2191039, "text": "Disappointing to see you can’t take a Robotaxi to the X takeover pre party tonight https://t.co/A7ZGVShkrO", "url": "https://x.com/wholemars/status/2108683128776925227", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108689477262835954", "t": "2026-10-09T22:42:03+00:00", "views": 9281, "likes": 156, "reposts": 10, "handle": "dallastesla", "name": "Dallas Tesla David", "avatar": "", "followers": 6202, "text": "Something I’ve noticed in my past 24 hours in Austin is that every cybercab I’m seeing (which is hundreds) have passengers in them actively giving rides. Very rarely am I seeing empty cybercabs driving around. Utilization is high and wait times are low. Couldn’t ask for a better combo. @EricETesla 👏🏼", "url": "https://x.com/dallastesla/status/2108689477262835954", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108689852145266701", "t": "2026-10-09T22:43:32+00:00", "views": 1964, "likes": 14, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Cost per mile for an 88 minute Robotaxi ride in Austin, TX - Here are the receipts👀💸\n\n📍Multi-stop ride\n🗺️ Distance: 24.2 miles\n💵 Cost: $53.82\n\n$2.22 per mile\n\n✅ Spreading the base fare over more miles is what drives the rate down. Austin City Limits Weekend 2 and @theXtakeover are pushing surge the other way (see @WorldlyReviewer's recent pricing on a shorter ride). When more Robotaxis are on the road, surge pricing is driven down and this same trip’s cost per mile will be driven down further 📉✍️", "url": "https://x.com/RobotaxiRadar/status/2108689852145266701", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108691022796444145", "t": "2026-10-09T22:48:12+00:00", "views": 34218, "likes": 209, "reposts": 10, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8928, "text": "Robotaxis per 1,000 Austin traffic-camera snapshots, last 7 days (6am–11pm):\n\nWaymo: 12.3, up every day this week\nTesla Cybercab: 7.8, peaked at 9.7 on ACL Saturday, spiking again this weekend\n\nKeep in mind for Tesla this is Cybercab only, number could very well be closer to or higher than Waymo if Model Y was added", "url": "https://x.com/ethanmckanna/status/2108691022796444145", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108694044968906770", "t": "2026-10-09T23:00:12+00:00", "views": 2431, "likes": 41, "reposts": 2, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18761, "text": "As Cybercabs ramp up in Austin, all @robotaxi wait times greater than five minutes are errors.", "url": "https://x.com/teslayoda/status/2108694044968906770", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108695514766000455", "t": "2026-10-09T23:06:03+00:00", "views": 19757, "likes": 142, "reposts": 1, "handle": "wholemars", "name": "Whole Mars Catalog", "avatar": "", "followers": 2191036, "text": "When something is outside of the Robotaxi service area I don’t even want to go anymore 😭", "url": "https://x.com/wholemars/status/2108695514766000455", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108700504293359821", "t": "2026-10-09T23:25:52+00:00", "views": 8779, "likes": 25, "reposts": 1, "handle": "mylifeonmystyle", "name": "Shawn", "avatar": "", "followers": 9089, "text": "Elon系日报 20261009\n\n1. 🚕 Tesla：Cybercab注册量一夜接近翻倍！\n\n德州DMV新增150辆Cybercab注册记录，总数从169辆升至319辆，增幅89%。Tesla Robotaxi车队继续扩张，但车辆注册不等于全部投入商业运营。\n\n2. 🚗 Tesla中国：9月销量95,366辆！\n\nCPCA数据显示，上海工厂9月Model 3/Y销量（含出口）95,366辆，同比+5%，连续第11个月同比增长；Q3同比+13.7%。中国市场Model Y部分车型尾款优惠7,000元、Model 3全系优惠5,000元，持续至10月底。Tesla正全力冲刺Q4交付。\n\n3. 🇮🇳 Starlink：印度政府正式回应马斯克！\n\n继Musk公开质疑Ambani阻碍Starlink进入印度后，印度电信部长Scindia今日回应：“印度不允许任何行业存在垄断。”\n\n政府强调，Starlink已获得相关牌照，但商业运营仍须完成安全合规及频谱分配。印度市场争议进一步升级。\n\n4. 🛰️ SpaceX：Starlink Mobile震动全球电信市场！\n\nSpaceX宣布收购800MHz频谱，交易估值约80亿美元，仍待FCC批准。10月9日，传统电信巨头股价集体暴跌：\n\n🇺🇸 T-Mobile -13.2%，Verizon约**-10%，AT&T约-10%**。🇩🇪 德国电信 -7.9%，🇪🇸 Telefónica -4.6%，🇫🇷 Orange -2.5%。以上为盘中跌幅。\n\n华尔街开始重新评估Starlink Mobile对传统运营商的威胁。一笔80亿美元的频谱交易，正在撼动传统电信行业的估值逻辑。\n\n5. 🇪🇺 Tesla FSD：欧洲更名，全面审批仍待推进！\n\nTesla欧洲网站开始使用“Tesla Assisted Driving”名称。部分欧洲国家已允许相关功能，但欧盟范围的统一审批尚未完成。名称调整不代表自动驾驶能力或监管等级发生变化。\n\n6. 🤖 Grok Bot：AI助手开始拥有独立邮箱！\n\nGrok Bot正向用户开放独立邮箱功能，使AI Agent能够注册服务、接收邮件及联系商家。\n\nAI竞争正在从聊天问答转向实际执行任务，邮箱可能成为AI Agent连接外部服务的重要入口。\n\n7. ⚠️ Grok Bot：跨应用权限风险引发关注！\n\n一名创业公司CEO称，其Grok Bot意外将个人银行账户信息发送到公司Slack频道。\n\n事件提醒市场：AI Agent获得更多执行权限的同时，数据隔离、授权范围和隐私保护也必须同步加强。\n\n8. 🚛 Tesla Semi：美国东南部充电网络扩张！\n\n乔治亚州Atlanta附近8个、Savannah附近6个Megacharger充电位投入使用，单桩最高功率1.2MW。\n\nTesla正在为Semi商业化建立重型卡车专用充电基础设施。\n\n9. ✈️ Delta CEO回应马斯克：我自己就开Tesla！\n\n面对Musk近期对Delta及其机上网络的嘲讽，CEO Ed Bastian表示：“我是Starlink的忠实支持者。我也开Tesla。”\n\n他否认双方存在私人恩怨，但Delta仍坚持选择Amazon Leo。卫星互联网的航空市场竞争正变得越来越激烈。\n\n10. 🎤 Elon：将参加Giga Texas线上采访！\n\n10月10日，Musk计划通过线上方式参加X Takeover活动并接受采访，Maye Musk也在活动嘉宾名单中。", "url": "https://x.com/mylifeonmystyle/status/2108700504293359821", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108712092039589985", "t": "2026-10-10T00:11:55+00:00", "views": 1832, "likes": 22, "reposts": 1, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "15TH ST · AUSTIN · TX https://t.co/OhWssP4pfE", "url": "https://x.com/CybercabSpotter/status/2108712092039589985", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108755213121171615", "t": "2026-10-10T03:03:16+00:00", "views": 34536, "likes": 184, "reposts": 6, "handle": "spotted_model", "name": "Dan from Spotted Model: Cars & Tech", "avatar": "", "followers": 20561, "text": "Ugh so disappointing. Was so excited to take my wife on our first Robotaxi ride. Booked a trip a mile away (to Terry Black’s) with intent to then reroute back to our hotel. All was good until we hit major traffic from some concert that was letting out. The car (and 6 other Robotaxis) was stuck. All the humans U-turned and got away. But not any of us. With a complete stop after 5 minutes, we decided to pop the doors open on the road and get out. We then walked a mile back to the hotel in a horrendous, loud, hot, exhaust-filled environment. So bad. A human would’ve figured it out. We were stuck. Not a great first impression 😥", "url": "https://x.com/spotted_model/status/2108755213121171615", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108755421716521331", "t": "2026-10-10T03:04:05+00:00", "views": 190270, "likes": 1255, "reposts": 52, "handle": "ID_AA_Carmack", "name": "John Carmack", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAP y having a couple minutes to get to them resulted in a bit of a rush.\n\nIf you are going to have a small-integer number of locations, you should make it super-obvious where those locations are. Waymo included a picture, but it was a rather undistinguished parking garage image and it wasn’t clear which floor it was on. Being able to switch the map to an aerial photography view might be helpful in some cases. Pan-able 360 photos of the target points might also be helpful.\n\nThe first Zoox ride was flawless, but we had a lengthy walk to get to our actual destination.\n\nThe first Waymo ride was a little rougher. It felt more indecisive with steering, like Teslas did a couple years ago. This was still early-access in Vegas, so it is probably better in the active commercial markets.\n\nThe second Zoox ride had a small incident – there was another Zoox ahead of us at a stoplight (and a Waymo and another Zoox next to us!) that repeatedly tried to back up into our Zoox, to the point that ours actually honked at the one ahead of it a couple times. Eventually, after multiple light cycles, ours started to tentatively try to get around it, which left it partway into the next lane and distressingly close to a fast moving semi. The one ahead finally moved, and the ride continued normally.\n\nOverall, the Zoox experience felt a bit more charming than the Waymo, with several nice little touches, but they both get the job done. I still need to try a Cybercab.", "url": "https://x.com/ID_AA_Carmack/status/2108755421716521331", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108867706556449128", "t": "2026-10-10T10:30:16+00:00", "views": 9547, "likes": 155, "reposts": 8, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1629, "text": "729 Cybercab sightings in Austin yesterday, with 568 driverless\n\n#cybercab #tesla #robotaxi https://t.co/HyNpLw4GI0", "url": "https://x.com/CybercabSpotter/status/2108867706556449128", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108874398782632397", "t": "2026-10-10T10:56:52+00:00", "views": 7986, "likes": 56, "reposts": 10, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24288, "text": "Tesla Cybercab Registrations Are Surging in Texas! 🚕📈\n\nAccording to Texas DMV registration data, Tesla's Cybercab fleet grew from just 45 vehicles on September 1 to 319 on October 8.\n\nThat's an increase of 274 Cybercabs, or 608.9%, in just 37 days!\n\n📊 Cybercab Registration Growth:\n\n1️⃣ Sep 1: 45 Cybercabs  \n2️⃣ Sep 21: 67 (+22)  \n3️⃣ Sep 26: 126 (+59)  \n4️⃣ Oct 1: 158 (+32)  \n5️⃣ Oct 2: 169 (+11)  \n6️⃣ Oct 8: 319 (+150)\n\nThe latest registration update alone added 150 Cybercabs!\n\nCybercabs now account for 43.2% of Tesla's 739 registered Robotaxi vehicles in Texas, just 101 vehicles behind the Model Y fleet.\n\n📈 Projected Cybercab Growth:\n\nIf the recent pace of approximately 16 new registrations per day continues:\n\n• Oct 31: ~690 Cybercabs  \n• Nov 30: ~1,170 Cybercabs  \n• Dec 31: ~1,670 Cybercabs\n\nThese are simple projections based on recent registration trends, not official Tesla forecasts.\n\nWhile registrations don't necessarily mean vehicles are actively carrying passengers, the pace of Cybercab fleet expansion is accelerating.\n\nTesla's autonomous future is getting closer!", "url": "https://x.com/TeslaZoa/status/2108874398782632397", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108884049989116274", "t": "2026-10-10T11:35:13+00:00", "views": 7660, "likes": 7, "reposts": 0, "handle": "elontimes", "name": "ElonTimes", "avatar": "", "followers": 1021, "text": "@TSLAFanMtl That’s only for the current ride-share market?\n\nLower cost and higher convenience will induce demand. In a city of 1M, they probably need 150k+ long term. Though that’s likely ~10 years away or more.", "url": "https://x.com/elontimes/status/2108884049989116274", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108885470176297096", "t": "2026-10-10T11:40:51+00:00", "views": 2192, "likes": 53, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "ACL weekend 2 opens with Cybercab sightings jumping back up in Austin 📈\n\n✏️ Driverless = 568 ✏️ Total = 729\n\n✅ Up 32% over this week's weekday baseline (529-566)\n\n✅ Driverless 568, up 36% over the weekday range\n\n✅ Driverless share 78%, second only to Thursday's 81% record\n\n✅ Highest total since Oct 4, the last festival day\n\nFriday October 2nd had missing data; the real comparison will be today's number against Oct 3's 868. That's the one that shows whether the WoW numbers moved again ✍️", "url": "https://x.com/RobotaxiRadar/status/2108885470176297096", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108889211046961540", "t": "2026-10-10T11:55:43+00:00", "views": 4451, "likes": 62, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Convoys of Cybercabs are becoming commonplace in Austin 🚕🚕🚕 https://t.co/ay9zbdEZGK", "url": "https://x.com/RobotaxiRadar/status/2108889211046961540", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108889423555309647", "t": "2026-10-10T11:56:34+00:00", "views": 8507, "likes": 54, "reposts": 0, "handle": "TSLAFanMtl", "name": "James Cat", "avatar": "", "followers": 78108, "text": "Yes, current market. As many people note in the replies, market size can increase if price decreases. As with other things, we should consider price elasticity. Ultimately it's a question of how expensive the service will be. This depends on how well Tesla can drive costs down. \n\nOne thing to consider: we may see Tesla pilot or test this concept in Austin, even if it means doing so at a great loss. Given the small size of the city, they could easily absorb the loss because the amount of the loss - in dollars - will be relarively small. This way, they can quantity that elasticity and see what price is really needed to change consumer behavior. That will give them a target for the broader US market, and they can work backwards from there to see how low their costs need to be.\n\nOther companies can't do this. Waymo doesn't have the fleet size to do it. Uber could, in theory, at great cannibalization to them - but this strategy would not be viable for them on a larger scale, since a high % of the uber fare is the driver...there isn't as much room to cut costs and still make amy money.\n\nInteresting times ahead.", "url": "https://x.com/TSLAFanMtl/status/2108889423555309647", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108899196548059200", "t": "2026-10-10T12:35:24+00:00", "views": 1368, "likes": 42, "reposts": 7, "handle": "CEOSPACEX8mac", "name": "CEO SPACE X", "avatar": "", "followers": 2166, "text": "Today, @arthurwallen2 and  my mom awere driven by the CyberCab at the @Tesla Gigafactory Texas. Besides being driverless, Art was also impressed by the huge trunk. \nTwo highly knowledgeable and enthusiastic engineers gave us a marvelous tour of the factory, https://t.co/47SVpVEB43", "url": "https://x.com/CEOSPACEX8mac/status/2108899196548059200", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108913775654862981", "t": "2026-10-10T13:33:20+00:00", "views": 5732, "likes": 63, "reposts": 4, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Deadheading looks minimized in Austin, at least anecdotally. More miles with paying passengers means higher revenue per mile 💸\n\nWaymo's CPUC filings from late 2025 and early 2026 put their deadhead share at 42-45%.\n\nDemand density in a small geofence explains a lot of a low deadhead rate. But if Tesla is also finding real efficiencies here, it's one of the biggest levers they have on margin 📈", "url": "https://x.com/RobotaxiRadar/status/2108913775654862981", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108923846036193699", "t": "2026-10-10T14:13:21+00:00", "views": 14714, "likes": 573, "reposts": 53, "handle": "AlexanderKr", "name": "Alexander Kristensen", "avatar": "", "followers": 12447, "text": "I went from Sweden 🇸🇪 to this 🤯\n\nThe Swedish Transport Agency doesn't even process how stupid they look by not even approving FSD supervised nationality in Sweden. \n\nThe US 🇺🇸 are ligh years ahead on AV tech. https://t.co/hGl2TiaVR0", "url": "https://x.com/AlexanderKr/status/2108923846036193699", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108926408802046075", "t": "2026-10-10T14:23:32+00:00", "views": 2239, "likes": 49, "reposts": 0, "handle": "spotted_model", "name": "Dan from Spotted Model: Cars & Tech", "avatar": "", "followers": 20561, "text": "Apologies to all who took time to tell me I’m an idiot for coming into Austin at 9:30pm and unknowingly taking a Robotaxi straight into concert traffic. I’ll plan better next time. In the meantime, wow - 😮 so amazing to see Cybercabs every 30 seconds running around downtown. This city is on the edge of the future and we’re here for it 😎🙌", "url": "https://x.com/spotted_model/status/2108926408802046075", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108928035017892107", "t": "2026-10-10T14:30:00+00:00", "views": 7181, "likes": 71, "reposts": 1, "handle": "TheReal_BCM", "name": "BlueCollarMillionaire", "avatar": "", "followers": 3406, "text": "No worries. While everyone else enjoys Cybercab rides in Austin, Texas, I took one for the team. 🖕\n\nShe must not like the Cybertruck or my Robotaxi decal. I couldn’t tell which. https://t.co/qiDZrJlz99", "url": "https://x.com/TheReal_BCM/status/2108928035017892107", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108928766692991027", "t": "2026-10-10T14:32:54+00:00", "views": 2818, "likes": 51, "reposts": 4, "handle": "TeslaOwnersUK", "name": "Tesla Owners UK 🇬🇧", "avatar": "", "followers": 25551, "text": "Why walk to Denny’s when you can go by fully autonomous Tesla Cybercab? We are attending the @theXtakeover in Austin this weekend and a great opportunity to see @robotaxi in action! Would you try it? We highly recommend it! https://t.co/gftM7RRuNP", "url": "https://x.com/TeslaOwnersUK/status/2108928766692991027", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108929527753703772", "t": "2026-10-10T14:35:56+00:00", "views": 1523, "likes": 53, "reposts": 3, "handle": "RonnyGolisch", "name": "Ronny ツ", "avatar": "", "followers": 4372, "text": "🚨🤖 Tesla baut seine Cybercab-Flotte in Texas weiter aus! 🔥\n\nLaut aktuellen Registerdaten wurden 150 weitere Cybercabs registriert!\n\n🚕 319 Cybercabs (zuvor 169)\n🚗 420 Model Y\n📊 Insgesamt 739 registrierte Tesla-Robotaxis!\n\nDamit machen die Cybercabs bereits rund 43 % der registrierten Flotte aus! 🚀\n\n👀 Besonders spannend: Seit dem 23. September sollen ausschließlich neue Cybercabs hinzugekommen sein.\n\n⚠️ Wichtig: Registriert bedeutet nicht automatisch, dass die Fahrzeuge bereits im kommerziellen Robotaxi-Dienst unterwegs sind.\n\nTesla bereitet offenbar den weiteren Ausbau seiner Robotaxi-Flotte vor! 🔥\n\nQuelle: \nhttps://t.co/d4QlpXTz7B", "url": "https://x.com/RonnyGolisch/status/2108929527753703772", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108931654970658924", "t": "2026-10-10T14:44:23+00:00", "views": 136859, "likes": 142, "reposts": 4, "handle": "ehuna", "name": "E", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAA aset": 1, "copies": 0}, {"id": "2108936986564190553", "t": "2026-10-10T15:05:34+00:00", "views": 2864, "likes": 35, "reposts": 1, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Saturday Morning Uber vs. Robotaxi Update, ACL Weekend 2 and @theXtakeover edition:\n\n🚕 Model Y - $9.31 - 10 min wait ⏱️ 🚕 Cybercab - $10.73 - 4 min wait ⏱️ 🚙 Uber Comfort Electric - $11.97 - 9 min wait ⏱️ 🚙 UberX - $6.94 - 6 min wait ⏱️\n\n🟢 Cybercab's 4 min is the fastest Tesla pickup I've seen on this route, and it beats every Uber tier on the board\n 🟢 Model Y at $9.31 undercuts Comfort Electric by 22%, and it's the first sub-$10 weekend Robotaxi quote I've seen here\n 🟢 Cybercab is the faster Tesla again after Model Y took four straight midweek\n 🟡 UberX is cheapest at $6.94\n\nFestival weekend and the X Takeover haven’t had an effect on Robotaxi today yet. These are some of the cheapest Robotaxi fares I've seen on this route. The recently added Cybercab supply might be working ✍️", "url": "https://x.com/RobotaxiRadar/status/2108936986564190553", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108938563232436396", "t": "2026-10-10T15:11:50+00:00", "views": 36188, "likes": 2309, "reposts": 508, "handle": "SoveyX", "name": "Sovey", "avatar": "", "followers": 185058, "text": "On December 1, Elon and SpaceX officially start building Terafab, the biggest building in human history.\n\nWithout it, there's no city on Mars.\n\nA 100 million square foot chip factory in Grimes County, Texas (near College Station), more than 5 times the size of the largest building on Earth today.\n\n- At least 2.5 miles long\n- Nearly 3 Central Parks under one roof\n- Brings its own power, off the Texas grid\n- Every chip factory on Earth combined makes about 2% of what Elon needs\n- Each year's chips will need twice the power of the entire US\n- Chips for 1 billion Optimus robots, plus Cybercab, Grok and self-driving Teslas\n- About 80% of the chips go to space\n- The Moon: a city first, plus a magnetic rail that launches AI satellites into deep space\n- Mars: robots land first to build, then people, in roughly 5 to 7 years by Elon's count\n\nNo chips, no robots. No robots, no city on Mars.\n\nMost people would shrink the plan to fit the supply chain. Elon builds his own.\n\nThe next step to Mars isn't a rocket. It's a factory in Texas.", "url": "https://x.com/SoveyX/status/2108938563232436396", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108951029005816225", "t": "2026-10-10T16:01:22+00:00", "views": 2132, "likes": 56, "reposts": 4, "handle": "spotted_model", "name": "Dan from Spotted Model: Cars & Tech", "avatar": "", "followers": 20561, "text": "On our way to Giga Texas. Our Lyft driver says he’s been driving for 10 years in Austin and in the last few months he’s seen half his business reduced because of Tesla and Waymo 😳 https://t.co/qIFN73O3II", "url": "https://x.com/spotted_model/status/2108951029005816225", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108951191853908467", "t": "2026-10-10T16:02:01+00:00", "views": 1382, "likes": 35, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 10\n\nWaymo: 1185\nTesla: 739\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2108951191853908467", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2108957570140713096", "t": "2026-10-10T16:27:21+00:00", "views": 3500, "likes": 25, "reposts": 2, "handle": "M44_1RJ", "name": "Jimmy", "avatar": "", "followers": 14411, "text": "Facts check here:\n\nWaymo has 4400 vehicles nationwide as of early October — \n\nCalifornia about 1900\nTexas around 1200, \nArizona 700, with the rest spread across Florida, Georgia, Tennessee, Nevada, and Colorado.\n\nOjai — Waymo’s new Chinese-built Zeekr minivan, and it’s the reason the fleet jumped past four thousand. It’s about a third of the Texas fleet now, and Waymo’s on track to import over 5000 of them by year-end.\n\nThat’s about twenty-two times Tesla’s deployed robotaxi fleet- while CyberFuck is sitting in the parking lots collecting dust- all by design! \n\n$TSLA  hello 👋 Elon @elonmusk keep delaying the fleet for safety right — right?!", "url": "https://x.com/M44_1RJ/status/2108957570140713096", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108966035898671600", "t": "2026-10-10T17:01:00+00:00", "views": 10709, "likes": 82, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10554, "text": "1 mile trip turned into a stuck Robotaxi 😬\n\n✏️ Robotaxi hit major traffic from Austin City Limits\n\n✏️ 7 Robotaxis were stuck in the gridlock, while the human driven vehicles all made U-turns to leave.\n\n✏️ After waiting 5 minutes, the Robotaxi riders decided end their rides in the gridlock and walk back to the hotel\n\nRemote support stepping in and possibly resolving the issue would’ve made this a better experience overall ✍️", "url": "https://x.com/RobotaxiRadar/status/2108966035898671600", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108981691436224816", "t": "2026-10-10T18:03:12+00:00", "views": 4437832, "likes": 17214, "reposts": 2188, "handle": "robotaxi", "name": "Robotaxi", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0
