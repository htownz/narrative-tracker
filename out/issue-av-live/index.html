url": "https://x.com/AlexanderKr/status/2110460729786572883", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110461149141471370", "t": "2026-10-14T20:02:03+00:00", "views": 8897, "likes": 241, "reposts": 6, "handle": "reddit_lies", "name": "Reddit Lies", "avatar": "", "followers": 572521, "text": "\"Elon can't produce a Full Self Driving Car\"\n\nTesla currently operates 354 rideshare vehicles driverless robotaxis in Austin Texas right now. Of those 354, 178 do not have steering wheels.\n\nThat is, by definition, a full self driving car. https://t.co/lBtY5LwvML", "url": "https://x.com/reddit_lies/status/2110461149141471370", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110462849835233473", "t": "2026-10-14T20:08:48+00:00", "views": 14253, "likes": 243, "reposts": 6, "handle": "DirtyTesLa", "name": "Dirty Tesla", "avatar": "", "followers": 152319, "text": "Some interesting Cybercab info from my time in Austin.\n\n- 20 rides, 20 different Cybercabs.\n- I did a total of ~69 miles and ~4hr20min driving (!)\n- Surge pricing is intense, with a $13.73 ride turning into $30.98 for the trip back https://t.co/1LMFjryJ8k", "url": "https://x.com/DirtyTesLa/status/2110462849835233473", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110471958534221987", "t": "2026-10-14T20:45:00+00:00", "views": 5426, "likes": 15, "reposts": 6, "handle": "Newsforce", "name": "NewsForce", "avatar": "", "followers": 668180, "text": "“THE CYBERCAB IS THE MOST EFFICIENT VEHICLE EVER MADE!” | THE STACK\n\nJohn Stringer (@teslaownersSV) compares @Tesla's Cybercab with Waymo's Jaguar I-PACE fleet, highlighting the fundamentally different economics behind the two Robotaxi models.\n\nWith Tesla's Austin fleet approaching 170 authorised vehicles compared with Waymo's roughly 1,200 in Texas, Stringer argues that the Cybercab's efficiency could give Tesla a major long-term advantage.", "url": "https://x.com/Newsforce/status/2110471958534221987", "lane": "tesla_vs_waymo_duel", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110477904865894861", "t": "2026-10-14T21:08:37+00:00", "views": 1165, "likes": 24, "reposts": 3, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Some Cybercab ride analysis from @DirtyTesLa’s time in Austin 📝\n\n✏️ 20 total rides in Cybercabs\n✏️ 69.8 miles total\n✏️ $4.46/mi average cost\n✏️ $23.20/mi highest cost\n✏️ $1.86/mi lowest cost\n\nSurge pricing creates large swings. A $13.73 ride turned into $30.98 return trip - Supply is needed to flatten fares further", "url": "https://x.com/RobotaxiRadar/status/2110477904865894861", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110496443878510890", "t": "2026-10-14T22:22:18+00:00", "views": 2196, "likes": 7, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3841, "text": "Uber vs Tesla robotaxi during Wednesday evening rush hour with slight rain in Austin. Idk wtf is going on with this surge pricing on both platforms 😭 Is something happening in Austin?? https://t.co/BkYJIYgfQN", "url": "https://x.com/WorldlyReviewer/status/2110496443878510890", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110498291985064415", "t": "2026-10-14T22:29:38+00:00", "views": 1788, "likes": 32, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Wednesday Afternoon Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $19.31 - 14 min wait ⏱️ 🚕 Cybercab - $21.53 - 10 min wait ⏱️ 🚙 Uber Comfort - $20.98 - 10 min wait ⏱️ 🚙 UberX - $19.94 - 12 min wait ⏱️\n\n🔴 Everything is surging. Model Y more than DOUBLED from Monday's $8.91 at the same hour\n 🔴 UberX went $8.94 Monday to $19.94 now, a 123% jump\n 😳 UberX is priced ABOVE UberXL ($12.98) and above promo Premier ($13.59). Economy supply looks tapped out\n 🟢 Model Y is still the cheapest ride, overtaking UberX by $0.63\n\nBoth platforms surged roughly 2x at the same time on the same route. That points to a city-wide demand spike, not an operator pricing change. Light rain might be a factor affecting all ride-hail options ✍️", "url": "https://x.com/RobotaxiRadar/status/2110498291985064415", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110499035043737700", "t": "2026-10-14T22:32:35+00:00", "views": 2507, "likes": 27, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "A pickup issue occurred in Austin, TX 🤠\n\nThe Model Y Robotaxi missed the pickup location the first time due to traffic cones, but was able to pull over before the cones on the 2nd try 🔁\n\nSome drivers need to circle around a few times for a pickup, so Robotaxi seemed to handle it well ✅\n https://t.co/pI3ndpnYcK", "url": "https://x.com/RobotaxiRadar/status/2110499035043737700", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110504603821408573", "t": "2026-10-14T22:54:43+00:00", "views": 2137, "likes": 54, "reposts": 4, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18760, "text": "🔥 Tesla is hiring a Market Lead for Robotaxi Business Operations in Palo Alto, CA, which brings the role to six cities: Austin, Dallas, Las Vegas, Miami Gardens, Phoenix and Palo Alto.\n\nhttps://t.co/pM938LfSy1 https://t.co/atN5GKvs2M", "url": "https://x.com/teslayoda/status/2110504603821408573", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110598406599049221", "t": "2026-10-15T05:07:27+00:00", "views": 7850, "likes": 54, "reposts": 6, "handle": "TeslaNewswire", "name": "The Tesla Newswire", "avatar": "", "followers": 58232, "text": "Tesla just added 30 Cybercabs to its official Austin Robotaxi fleet!\n\n✅ 349 Cybercabs now listed\n✅ 45% of the fleet, alongside 420 Model Ys https://t.co/pEkHJlnqm9", "url": "https://x.com/TeslaNewswire/status/2110598406599049221", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110605928416587839", "t": "2026-10-15T05:37:21+00:00", "views": 1016, "likes": 12, "reposts": 0, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24288, "text": "Tesla’s registered Robotaxi fleet in Texas has surged to 769 vehicles! Cybercab growth is accelerating rapidly. 🚕🔥\n\nAccording to the latest Texas DMV (TxDMV) registration data as of October 15, 2026, Tesla now has 769 registered Robotaxi vehicles in Texas.\n\nHere’s the current fleet breakdown:\n\n1️⃣ Model Y: 420 vehicles (54.6%)\n\n2️⃣ Cybercab: 349 vehicles (45.4%)\n\n3️⃣ Total fleet: 769 vehicles\n\nWhat’s even more impressive is the rapid growth of Cybercab registrations.\n\nCompared to October 9:\n\n• Cybercab: 319 → 349 (+30, +9.4%)\n\n• Total fleet: 739 → 769 (+30, +4.1%)\n\n• Model Y: 420 → 420 (unchanged)\n\nBut the bigger picture is even more remarkable!\n\nCybercab registrations have surged from 169 to 349, an increase of 106.5%.\n\nDuring that same period, Tesla’s total registered fleet grew from 589 to 769 vehicles (+30.6%).\n\nEvery single one of those 180 newly registered vehicles was a Cybercab!\n\nCybercabs now account for 45.4% of Tesla’s registered Robotaxi fleet in Texas, rapidly approaching half of the total.\n\nTesla’s Robotaxi fleet expansion is increasingly being driven by Cybercab.\n\nNote: Registered vehicles are not necessarily in active Robotaxi service.", "url": "https://x.com/TeslaZoa/status/2110605928416587839", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110607371571806610", "t": "2026-10-15T05:43:05+00:00", "views": 1507, "likes": 35, "reposts": 6, "handle": "TeslaZoa", "name": "TeslaZoa", "avatar": "", "followers": 24288, "text": "Tesla’s Robotaxi fleet in Texas has exploded from 42 to 769 registered vehicles in less than five months! 🚕🔥\n\nAccording to TxDMV registration data, Tesla’s registered Robotaxi fleet has grown more than 18X since May 28, 2026.\n\nHere’s the incredible growth:\n\n• May 28: 42 vehicles\n• August 31: 314 vehicles\n• October 2: 578 vehicles\n• October 9: 739 vehicles\n• October 15: 769 vehicles\n\nLatest fleet breakdown:\n\n1️⃣ Model Y: 420 (54.6%)\n\n2️⃣ Cybercab: 349 (45.4%)\n\n3️⃣ Total: 769 vehicles\n\nHere's what makes this even more interesting!\n\nSince October 2, Cybercab registrations have surged from 158 to 349, an increase of 120.9% in just 13 days.\n\nAll 191 vehicles added during that period were Cybercabs!\n\nMeanwhile, Model Y registrations have remained unchanged at 420 since September 29.\n\nCybercab now accounts for nearly half of Tesla’s registered Robotaxi fleet in Texas.\n\nTesla’s fleet expansion is increasingly being driven by Cybercab, and the numbers tell the story.\n\nNote: Registered vehicles are not necessarily in active Robotaxi service.\n\nSource: Texas DMV (TxDMV) registration data, October 15", "url": "https://x.com/TeslaZoa/status/2110607371571806610", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110611477862252670", "t": "2026-10-15T05:59:24+00:00", "views": 3942, "likes": 141, "reposts": 27, "handle": "joehansen", "name": "Joe Hansen", "avatar": "", "followers": 22738, "text": "Tesla Robotaxi fleet in Texas, 15 Oct 2026\n\n• Registered: 769\n• Model Y: 420\n• Cybercab: 349\n• Last 7 days: +180\n• Last 30 days: +330\n\n30 more cars registered today, and the fleet is up 75% in a month.\n\nOne rider tried a Cybercab for the first time yesterday and said \"Cybercab experience is legit!\" \n\nMore people get that ride every day.", "url": "https://x.com/joehansen/status/2110611477862252670", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110656773107655092", "t": "2026-10-15T08:59:23+00:00", "views": 8138, "likes": 188, "reposts": 32, "handle": "XFreeze", "name": "X Freeze", "avatar": "", "followers": 287707, "text": "Currently most robotaxi fleets still grow by converting cars originally built for human drivers. Tesla is taking a harder bet: building a car with no steering wheel or pedals, then scaling it to hundreds of vehicles on public roads\n\nTesla just registered 30 more Cybercabs in Texas. The purpose-built count is now 349, with 180 added in the past week. Model Y registrations stayed flat at 420.\n\nAnd more than 300 Cybercabs are already serving Austin\n\nSo this isn’t just about testing the idea anymore. Tesla is scaling a car that only works when nobody is driving", "url": "https://x.com/XFreeze/status/2110656773107655092", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110679645515358364", "t": "2026-10-15T10:30:16+00:00", "views": 2368, "likes": 47, "reposts": 4, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1631, "text": "719 Cybercab sightings in Austin yesterday, with 578 driverless\n\n#cybercab #tesla #robotaxi https://t.co/wNRDVsIAyu", "url": "https://x.com/CybercabSpotter/status/2110679645515358364", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110682969983594859", "t": "2026-10-15T10:43:29+00:00", "views": 2018, "likes": 97, "reposts": 9, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Driverless Cybercab sightings just hit a non-festival record in Austin 📈\n\n✏️ Driverless = 578 ✏️ Total = 719\n\n✅ Driverless up 44% vs last Wednesday (401), the biggest WoW gain of the three weekdays so far\n\n✅ Total up 36% vs last Wednesday (529)\n\n✅ 578 driverless is the highest on any non-festival day, beating Oct 8's 447\n\n✅ Three weekdays at 740, 682, 719, vs 529-566 last week\n\nDriverless share is back to 80% "$AUR | Volvo reaffirms Q1 2027 for driverless trucks in Texas, powered by the Aurora Driver\n\nVolvo Autonomous Solutions (V.A.S.) is holding its timeline: in Q1 2027 its trucks begin operating in Texas with nobody in the cab, no safety driver and no observer. The platform is the Volvo VNL Autonomous, with the Aurora Driver integrated during factory assembly at Volvo's New River Valley plant in Virginia, and V.A.S. runs the operation itself. According to Aurora, Volvo has already completed several Aurora Driver-powered units on its pilot line ahead of the launch.\n\nV.A.S. already hauls commercial freight in Texas with safety drivers for customers including DSV and AVI-SPL. The plan targets more than 300 autonomous trucks in operation by the end of 2027, with industrial scaling from 2028. That fleet target covers V.A.S. as a whole: Volvo also works with Waabi, whose first customer operation, hauling for Warp between Dallas and Houston, began in October.\n\nhttps://t.co/iPUw3JXCDu", "url": "https://x.com/TheFoxRadar/status/2110739712797278645", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110761678409257025", "t": "2026-10-15T15:56:14+00:00", "views": 60777, "likes": 694, "reposts": 50, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "New NHTSA Incident Report for Robotaxis just dropped. Here's what's new and notable since the last report 📝\n\nAll 9 incidents were property damage only. No injuries, no tows, no airbags.  Every at-fault contact happened at 5 mph or under 💥\n\nRobotaxis continue to have issues with chains ⛓️\n\nFirst Cybercab incident to ever appear in NHTSA data 🚕\n\n🟢 = Other driver's fault\n🟡 = Robotaxi at fault, minor contact\n🔴 = Robotaxi at fault, serious\n\n📍Dallas, TX - 5 incidents (all Model Y, all driverless)\n\n🟡 Left turn into a parking lot, hit a low-hanging chain at 3 mph (16671)\n🟢 A pickup ran a stop sign and struck its left side as it braked from 27 to 3 mph (16673)\n🟡 Left turn into an alley, clipped a guardrail at 0.25 mph (16675)\n🟡 Left turn in an alley, hit a utility meter at 0.45 mph (16677)\n🟡 Remote operator took control between a concrete mixer and a parked SUV and touched the SUV at 0.40 mph (16678)\n\n📍Austin, TX - 3 incidents\n\n🟡 Cybercab drove into a water-filled pothole in a parking lot at 5 mph, safety monitor aboard (16672)\n🟢 Model Y rear-ended by an SUV while stopped at a yield sign, three passengers aboard (16676)\n🟡 Model Y, remote operator driving through an alley, hit a dumpster at 1 mph (16679)\n\n📍Tampa, FL - 1 incident\n\n🟡 Model Y, right turn out of a lot exit into a chain with an octagonal sign hanging from it, 4 mph (16674). First Florida entry in the dataset.\n\nNo serious at-fault incidents for Robotaxi. Nothing here was the software stack doing something that put a passenger at risk - it's parking lots, alleys, and low obstacles it didn't see, all at walking speed ✍️\n\n✏️ driverless = no safety monitor noted in Tesla's narrative", "url": "https://x.com/RobotaxiRadar/status/2110761678409257025", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110762951774720287", "t": "2026-10-15T16:01:18+00:00", "views": 3112, "likes": 33, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2773, "text": "Current fleet size in Texas — Oct 15\n\nWaymo: 1185\nTesla: 769\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2110762951774720287", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2110779453630546194", "t": "2026-10-15T17:06:52+00:00", "views": 347807, "likes": 5576, "reposts": 515, "handle": "SawyerMerritt", "name": "Sawyer Merritt", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1B s 😭 https://t.co/3HNoAKed4q", "url": "https://x.com/WorldlyReviewer/status/2110856419452883443", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110857608743821601", "t": "2026-10-15T22:17:26+00:00", "views": 1370, "likes": 26, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10549, "text": "Austin Thursday Afternoon Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $16.11 - 12 min wait ⏱️ 🚕 Cybercab - $18.33 - 13 min wait ⏱️ 🚙 Uber Comfort Electric - $12.97 - 10 min wait ⏱️ 🚙 UberX - $8.94 - 10 min wait ⏱️\n\n🔴 Comfort Electric wins the EV tier again at $12.97 vs $16.11, third straight day\n 🔴 Model Y jumped $4.53 in two hours, $11.58 at 4pm to $16.11 now. Steepest afternoon climb I've seen\n 🟡 UberX cheapest at $8.94, running $7.17 under Model Y, and it hasn't moved from Monday's price\n 🟡 Both Teslas are within a minute of each other at 12 and 13 min\n\nRobotaxi swung $4.53 into rush hour. UberX hasn't moved a cent in four days. Robotaxi pricing is a little crazy right now 😬 ✍️", "url": "https://x.com/RobotaxiRadar/status/2110857608743821601", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110860708682568185", "t": "2026-10-15T22:29:45+00:00", "views": 2017, "likes": 88, "reposts": 4, "handle": "RiniSampath", "name": "Rini Sampath", "avatar": "", "followers": 3551, "text": "Exactly. Council cannot keep kicking the can down the road until autonomous vehicles never see the light of day in DC. San Francisco, Phoenix, Los Angeles and Austin already offer Waymo rides. I hope the rest of Council weighs the safety evidence and the cost of withholding those benefits from residents. It’s time to pass the legislation.", "url": "https://x.com/RiniSampath/status/2110860708682568185", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111042038548320419", "t": "2026-10-16T10:30:17+00:00", "views": 5201, "likes": 13, "reposts": 2, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1659, "text": "636 Cybercab sightings in Austin yesterday, with 538 driverless\n\n#cybercab #tesla #robotaxi https://t.co/x4DlTapoCg", "url": "https://x.com/CybercabSpotter/status/2111042038548320419", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111046255358984192", "t": "2026-10-16T10:47:03+00:00", "views": 2705, "likes": 137, "reposts": 11, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10563, "text": "Driverless share of Cybercab sightings just hit an all-time high in Austin 🚨\n\n✏️ Driverless = 538\n✏️ Total = 636\n\n✅ Driverless share 85%, a new record (previous was 84% on ACL Saturday)\n\n✅ Four straight days climbing: 68% ➡️ 72% ➡️ 80% ➡️ 85%\n\n✅ Non-driverless down to 98, from 235 on Monday\n\n✅ Four clean weekdays this week vs last: 2,777 total vs 2,206, up 26%\n\n🔴 Total eased to 636, the week's lowest weekday. Non-driverless is down 58% since Monday\n\nNo festival in town this week, so the driverless share record holds up without a caveat. The low-70s dip earlier this week was a blip, not a new level ✍️", "url": "https://x.com/RobotaxiRadar/status/2111046255358984192", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111094912091316489", "t": "2026-10-16T14:00:23+00:00", "views": 1977, "likes": 11, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3856, "text": "Uber vs Tesla robotaxi wait times on a chilly Friday morning during rush hour in Austin. But Roadster is still the fastest. Could get to you in 0.6 seconds by flying to you https://t.co/WIlIv72Iam", "url": "https://x.com/WorldlyReviewer/status/2111094912091316489", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111098920726061478", "t": "2026-10-16T14:16:19+00:00", "views": 1303, "likes": 28, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10563, "text": "Austin Friday Morning Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $10.38 - 17 min wait ⏱️ 🚕 Cybercab - $11.67 - 11 min wait ⏱️ 🚙 Uber Comfort Electric - $11.97 - 8 min wait ⏱️ 🚙 UberX - $6.95 - 5 min wait ⏱️\n\n🟢 Model Y takes the EV tier back at $10.38 vs $11.97, ending Uber's three day run\n 🟢 $10.38 is Model Y's cheapest morning rush quote since Monday\n 🟡 UberX cheapest at $6.95, running $3.43 under Model Y\n 🔴 Model Y's 17 min is the slowest on the board, more than 3x UberX\n\nRobotaxi came down $1.60 from yesterday morning while Uber's EV tier held flat at $11.97 ✍️", "url": "https://x.com/RobotaxiRadar/status/2111098920726061478", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111118831091581192", "t": "2026-10-16T15:35:26+00:00", "views": 1608, "likes": 35, "reposts": 1, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18762, "text": "NHTSA refreshed its self-driving crash data on Oct 15, and Tesla's robotaxi fleet logged 9 reports in August, its highest month so far. The reports themselves give the fuller picture. None of the 9 involved an injury, the highest contact speed was 5 mph, and 8 of the 9 had no passenger aboard. The one trip with riders was a Model Y that was rear-ended by an SUV while stopped at a yield sign. Two reports were low-hanging chains across parking-lot entrances, two were alley contacts below half a mile per hour, and the first Cybercab report was a 5 mph parking-lot pothole with a safety monitor aboard. By city, Dallas had 5, Austin 3 and Tampa 1, Tampa being the first Florida report, while Miami and Orlando have had none since unsupervised service began there in July. Most of these happened while empty cars were moving between rides in tight spaces, not during passenger trips.\n\nhttps://t.co/b62fpJUz6p", "url": "https://x.com/teslayoda/status/2111118831091581192", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111125236825411706", "t": "2026-10-16T16:00:53+00:00", "views": 1633, "likes": 37, "reposts": 1, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2794, "text": "Current fleet size in Texas — Oct 16\n\nWaymo: 1185\nTesla: 769\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2111125236825411706", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2111126964421702031", "t": "2026-10-16T16:07:45+00:00", "views": 1195, "likes": 18, "reposts": 0, "handle": "JodiesJumpsuit", "name": "jump (for my love)", "avatar": "", "followers": 6716, "text": "Initial concerns about Waymo feasibility in Toronto from my experience in Texas: \n1) inclement weather. My trip was during a sunny cloudless day in Texas. How that works out in Toronto in February during a snowstorm or August during a thunderstorm may be another matter entirely.", "url": "https://x.com/JodiesJumpsuit/status/2111126964421702031", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111184520577962329", "t": "2026-10-16T19:56:28+00:00", "views": 2396, "likes": 10, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3856, "text": "Here is Uber vs Tesla robotaxi during a Friday afternoon for a roughly 20 mile trip in Austin https://t.co/CklopYu94g", "url": "https://x.com/WorldlyReviewer/status/2111184520577962329", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111186583244153055", "t": "2026-10-16T20:04:40+00:00", "views": 1901, "likes": 65, "reposts": 5, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10563, "text": "Austin Robotaxi vs. Uber Friday Afternoon Update - ~20 mile run to Topgolf:\n\n🚕 Cybercab - $43.05 - 7 min wait ⏱️ 🚕 Model Y - $43.34 - 14 min wait ⏱️ 🚙 Uber Comfort Electric - $55.98 - 7 min wait ⏱️ 🚙 UberX - $43.94 - 7 min wait ⏱️\n\n🟢 Robotaxi undercuts UberX. Model Y by $0.60, Cybercab by $0.89.\n 🟢 Model Y is 23% under Comfort Electric, $43.34 vs $55.98\n 😳 Cybercab is CHEAPER than Model Y by $0.29. Rare on any route. Cybercab cost per mile might be having a bigger affect on this longer trip\n 🟡 $2.17 per mile for Model Y. The 14 mile Topgolf runs this week came in at $2.04, so longer didn't necessarily mean cheaper per mile for Model Y. \n\nLong distance is where Robotaxi actually beats UberX in Austin, not just Uber's EV tier. Good signs for the Robotaxi business long-term ✍️", "url": "https://x.com/RobotaxiRadar/status/2111186583244153055", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111228943227642040", "t": "2026-10-16T22:52:59+00:00", "views": 1791, "likes": 9, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3856, "text": "Uber vs Tesla robotaxi during Friday evening rush hour in Austin https://t.co/Mz57ZUCthV", "url": "https://x.com/WorldlyReviewer/status/2111228943227642040", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111237390572658814", "t": "2026-10-16T23:26:33+00:00", "views": 2917, "likes": 26, "reposts": 0, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10563, "text": "Austin Friday Evening Rush Hour Robotaxi vs. Uber Update:\n\n🚕 Model Y - $12.11 - 14 min wait ⏱️\n🚕 Cybercab - $13.13 - 4 min wait ⏱️\n🚙 UberX - $8.94 - 12 min wait ⏱️\n🚙 Uber Premier - $8.79 - 5 min wait ⏱️\n\n🟢 Cybercab at 4 min is the fastest ride, beating every Uber tier shown. One of the few times it's been quoted at 5 min or less\n 🟢 Robotaxi beat UberX on wait, which has happened in under 20% of these checks\n 🟡 UberX is cheapest at list price, $8.94, $3.17 under Model Y, but still slower than Cybercab at 12 min\n 🟡 Model Y climbed $1.73 from this morning's $10.38. One of the flatter weekday arcs this week\n\nCybercab got a 10 min head start on Model Y for $1.02 more. Quicker for more $$$ ✍️", "url": "https://x.com/RobotaxiRadar/status/2111237390572658814", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111296624731594944", "t": "2026-10-17T03:21:55+00:00", "views": 14130, "likes": 52, "reposts": 3, "handle": "aaronjcash", "name": "Aaron Cash - ABetterTheater.com", "avatar": "", "followers": 2222, "text": "Cybercab now expanded to midnight! https://t.co/n9ZV9vR8on", "url": "https://x.com/aaronjcash/status/2111296624731594944", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111309132024381625", "t": "2026-10-17T04:11:37+00:00", "views": 6119, "likes": 128, "reposts": 7, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18768, "text": "🔥Now 803. \n\nTesla just added 34 Model Ys to its Texas autonomous fleet with the Texas DMV, the first Model Y increase since the count sat at 420 from late September. The fleet now stands at 803, with 454 Model Ys and 349 Cybercabs, so after weeks of growth driven entirely by Cybercabs, the Model Y side is moving again.", "url": "https://x.com/teslayoda/status/2111309132024381625", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111335970364678220", "t": "2026-10-17T05:58:16+00:00", "views": 10888, "likes": 219, "reposts": 18, "handle": "ethanmckanna", "name": "Ethan McKanna", "avatar": "", "followers": 8940, "text": "Cybercab sightings per 1,000 Austin traffic-camera snapshots. The 7-day average has gone up every day since Oct 3, from 4.7 to 6.5\n\nFriday hit a record 8.4, above both ACL Saturdays https://t.co/3GEf2Zn4nK", "url": "https://x.com/ethanmckanna/status/2111335970364678220", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111364660767424921", "t": "2026-10-17T07:52:17+00:00", "views": 4593, "likes": 35, "reposts": 0, "handle": "TeslaNewswire", "name": "The Tesla Newswire", "avatar": "", "followers": 58212, "text": "Tesla extends Robotaxi operating hours in Austin, Texas, to midnight, up from 11 PM. https://t.co/EQNlij6epL", "url": "https://x.com/TeslaNewswire/status/2111364660767424921", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111404425247944742", "t": "2026-10-17T10:30:17+00:00", "views": 20245, "likes": 306, "reposts": 39, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1655, "text": "New record: 1072 Cybercab sightings in Austin yesterday, with 921 driverless\n\n#cybercab #tesla #robotaxi https://t.co/4hEWo7OrM9", "url": "https://x.com/CybercabSpotter/status/2111404425247944742", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111436306345763046", "t": "2026-10-17T12:36:58+00:00", "views": 1393, "likes": 15, "reposts": 5, "handle": "SpirosMargaris", "name": "Spiros Margaris", "avatar": "", "followers": 133361, "text": "Driverless trucks in Texas are showing what AI can do beyond our computers.\n\nThey can deliver goods without stopping for driver rest breaks.\n\nExciting progress, but we must also think about the people whose jobs could be affected. https://t.co/LX7o1lpNi1", "url": "https://x.com/SpirosMargaris/status/2111436306345763046", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111443189424914618", "t": "2026-10-17T13:04:19+00:00", "views": 4421, "likes": 306, "reposts": 35, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10602, "text": "Cybercab sightings cross 1,000 for the first time in Austin 🚨\n\n✏️ Driverless = 921\n✏️ Total = 1,072\n\n✅ Total 1,072, a new record (previous was 912 on ACL Saturday)\n\n✅ Driverless 921, up 20% over the old record of 766\n\n✅ Driverless share at 86%, a new high for the second day running\n\n✅ Up 69% from the drift down on Thursday, the biggest one-day move outside the October outage\n\n✅ Friday vs Friday: total +47%, driverless +62%, and last Friday was an ACL day\n\nNo festival in town this weekend. ACL ended Oct 11 and F1 at COTA isn't until Oct 23-25, so this record has no events attached. The clearest sign of more Cybercab movement on a standard Friday in Austin ✍️", "url": "https://x.com/RobotaxiRadar/status/2111443189424914618", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111446502669267324", "t": "2026-10-17T13:17:29+00:00", "views": 1391, "likes": 31, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10602, "text": "Cybercabs are taking up more of Austin's roads, and it's not an ACL fluke 📈\n\n📊 7-day rate: 4.7 ➡️ 6.5 per 1K camera snapshots since Oct 3 (+38%)\n 🟢 The weekday floor moved up: 4.5-4.9 last week, 5.4-6.0 this week\n 🟢 Friday's 8.4 beat both ACL Saturdays (7.1, 7.5) with no festival crowds\n\nFestival weekends caused spikes, but the Cybercab share of Austin traffic has risen WoW. The Robotaxi growth story continues 🚕", "url": "https://x.com/RobotaxiRadar/status/2111446502669267324", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111469453825200619", "t": "2026-10-17T14:48:41+00:00", "views": 1213, "likes": 37, "reposts": 1, "handle": "bbrooklynboss", "name": "I45_Autonomy", "avatar": "", "followers": 447, "text": "🚛 𝗧𝗛𝗘 𝗔𝗨𝗧𝗢𝗡𝗢𝗠𝗢𝗨𝗦 𝗧𝗥𝗨𝗖𝗞𝗜𝗡𝗚 𝗥𝗘𝗩𝗢𝗟𝗨𝗧𝗜𝗢𝗡 𝗜𝗦 𝗔𝗖𝗖𝗘𝗟𝗘𝗥𝗔𝗧𝗜𝗡𝗚 — 𝗔𝗡𝗗 𝗧𝗛𝗘 𝗘𝗖𝗢𝗡𝗢𝗠𝗜𝗖𝗦 𝗔𝗥𝗘 𝗛𝗔𝗥𝗗 𝗧𝗢 𝗜𝗚𝗡𝗢𝗥𝗘.\n\nThe Wall Street Journal's latest feature takes readers onto Texas highways, where 𝗔𝘂𝗿𝗼𝗿𝗮 𝗜𝗻𝗻𝗼𝘃𝗮𝘁𝗶𝗼𝗻 ($AUR) is demonstrating the future of freight transportation.\n\n🛡️ 𝗦𝗔𝗙𝗘𝗧𝗬: 𝗔𝗡 𝗘𝗡𝗖𝗢𝗨𝗥𝗔𝗚𝗜𝗡𝗚 𝗘𝗔𝗥𝗟𝗬 𝗥𝗘𝗖𝗢𝗥𝗗\n\nFrom July 2021 through August 2026, NHTSA recorded 69 reported fatal crashes involving automated-driving or driver-assistance systems. 𝗡𝗼𝗻𝗲 𝗶𝗻𝘃𝗼𝗹𝘃𝗲𝗱 𝗮 𝘁𝗿𝘂𝗰𝗸 𝗲𝗾𝘂𝗶𝗽𝗽𝗲𝗱 𝘄𝗶𝘁𝗵 𝗮𝗻 𝗮𝘂𝘁𝗼𝗺𝗮𝘁𝗲𝗱-𝗱𝗿𝗶𝘃𝗶𝗻𝗴 𝘀𝘆𝘀𝘁𝗲𝗺. Limited deployment means this isn't yet proof of superior safety.\n\nAurora's long-range LiDAR and advanced perception system detect hazards early, anticipate merging vehicles, and navigate highway traffic without aggressive braking.\n\n📊 𝗧𝗛𝗘 𝗘𝗖𝗢𝗡𝗢𝗠𝗜𝗖 𝗢𝗣𝗣𝗢𝗥𝗧𝗨𝗡𝗜𝗧𝗬\n\n• $2.34/mile — average trucking operating cost\n• 44% — driver wages and benefits\n• 21% — fuel costs\n• 10% — potential reduction in fuel consumption\n• 40% — conventional truck utilization at Detmar\n• 20 hours/day — Aurora's autonomous operations at Detmar\n\n🚀 𝗖𝗢𝗠𝗠𝗘𝗥𝗖𝗜𝗔𝗟 𝗗𝗘𝗣𝗟𝗢𝗬𝗠𝗘𝗡𝗧\n\n• 𝗔𝘂𝗿𝗼𝗿𝗮: ~30 trucks, targeting 200 by year-end 2026\n• 𝗠𝗰𝗟𝗮𝗻𝗲: Up to 10 Aurora trucks planned\n• 𝗗𝗲𝘁𝗺𝗮𝗿: Two Aurora trucks operating, ~30 more expected\n• 𝗩𝗼𝗹𝘃𝗼: 300 autonomous trucks planned with Aurora and Waabi by the end of 2027\n• 𝗜𝗞𝗘𝗔/𝗞𝗼𝗱𝗶𝗮𝗸: Preparing a 219-mile driverless Texas route\n\nThe real breakthrough isn't simply removing the driver.\n\n𝗜𝘁'𝘀 𝘂𝗻𝗹𝗼𝗰𝗸𝗶𝗻𝗴 𝘁𝗵𝗲 𝗽𝗿𝗼𝗱𝘂𝗰𝘁𝗶𝘃𝗲 𝗰𝗮𝗽𝗮𝗰𝗶𝘁𝘆 𝗼𝗳 𝗮𝗻 𝗮𝘀𝘀𝗲𝘁 𝘁𝗵𝗮𝘁 𝗵𝗶𝘀𝘁𝗼𝗿𝗶𝗰𝗮𝗹𝗹𝘆 𝘀𝗽𝗲𝗻𝗱𝘀 𝗺𝘂𝗰𝗵 𝗼𝗳 𝗶𝘁𝘀 𝗹𝗶𝗳𝗲 𝘀𝗶𝘁𝘁𝗶𝗻𝗴 𝗶𝗱𝗹𝗲.\n\nA truck operating 20 hours a day changes fleet utilization, freight capacity, and potentially the economics of long-haul transportation.\n\nThe next major unlock could come from 𝗜𝗡𝗦𝗨𝗥𝗔𝗡𝗖𝗘 𝗨𝗡𝗗𝗘𝗥𝗪𝗥𝗜𝗧𝗘𝗥𝗦. As safety data accumulates and insurers gain confidence in pricing autonomous risk, adoption barriers could fall.\n\n𝗧𝗲𝗰𝗵𝗻𝗼𝗹𝗼𝗴𝘆 → 𝗦𝗮𝗳𝗲𝘁𝘆 → 𝗜𝗻𝘀𝘂𝗿𝗮𝗻𝗰𝗲 𝗖𝗼𝗻𝗳𝗶𝗱𝗲𝗻𝗰𝗲 → 𝗖𝗼𝗺𝗺𝗲𝗿𝗰𝗶𝗮𝗹 𝗦𝗰𝗮𝗹𝗲.\n\n$AUR $KDK\n\n📰 WSJ | Esther Fung | October 16, 2026\nhttps://t.co/smogQDg3yT", "url": "https://x.com/bbrooklynboss/status/2111469453825200619", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111471209808642422", "t": "2026-10-17T14:55:40+00:00", "views": 4368, "likes": 21, "reposts": 1, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3864, "text": "Uber vs Tesla robotaxi for a 1 mile trip on a Saturday morning in Austin. The Texas Longhorn vs Florida Gators game is about to start soon. This is insane pricing. Worse than ACL or Xtakeover ever was. For both services https://t.co/uMZOtZ6iNc", "url": "https://x.com/WorldlyReviewer/status/2111471209808642422", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111481320748798143", "t": "2026-10-17T15:35:50+00:00", "views": 4187, "likes": 14, "reposts": 0, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1655, "text": "7TH ST · AUSTIN · TX https://t.co/IsByZoisEN", "url": "https://x.com/CybercabSpotter/status/2111481320748798143", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111484566812684622", "t": "2026-10-17T15:48:44+00:00", "views": 2975, "likes": 32, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10602, "text": "Austin Saturday Morning Robotaxi vs. Uber Update - Insane surge pricing for Texas vs. Florida game:\n\n🚕 Cybercab - $29.13 - 17 min wait ⏱️\n🚕 Model Y - $26.11 - 28 min wait ⏱️\n🚙 UberX - $24.96 - 8 min wait ⏱️\n🚙 Comfort Electric - $29.98 - 7 min wait ⏱️\n\n🔴 Every single tier on this screen set an all-time record for this route. Comfort Electric is the wildest at $29.98 against an old high of $12.99, and it's the priciest ride on the board. Tesla isn't even the most expensive EV today\n 🔴 10am last Saturday for the same route: Cybercab $10.73, Model Y $9.31, UberX $6.94. That's 2.7x to 3.6x in one week\n 🔴 This beats ACL. The priciest ride I logged at the Zilker gates on ACL Saturday was $22.74, and that was for a longer ride\n 🧐 Uber surged and controlled its waits. UberX went 6 min to 8 min. Tesla surged AND the wait went 4 to 17 and 10 to 28\n\nThese one mile fares are off the charts. The surge brings in more Uber drivers, but it can't deploy more Tesla cars that aren’t currently registered. Lower prices will require more Robotaxi supply 🚕🚕🚕 ✍️", "url": "https://x.com/RobotaxiRadar/status/2111484566812684622", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111487616423997684", "t": "2026-10-17T16:00:51+00:00", "views": 19529, "likes": 172, "reposts": 7, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2804, "text": "Current fleet size in Texas — Oct 17\n\nWaymo: 1185\nTesla: 803\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2111487616423997684", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2111493691009282384", "t": "2026-10-17T16:25:00+00:00", "views": 1592, "likes": 71, "reposts": 4, "handle": "teslaxander", "name": "TeslaXander", "avatar": "", "followers": 7354, "text": "2026 lief bisher sehr gut für @Tesla \n\n▪︎ Januar: Unsupervised Robotaxi in Austin gestartet\n▪︎ Februar: erstes Cybercab produziert\n▪︎ April: Unsupervised Robotaxi in Dallas & Houston \n▪︎ April: FSD (Supervised) in Holland zugelassen\n▪︎ Juli: Robotaxi in Miami/Orlando/Tampa\n▪︎ Juli: 10-millionstes Fahrzeug produziert\n▪︎ August: Megapack-3-Produktion startet\n▪︎ September: Cybercab fährt kommerziell\n▪︎ September: Semi Rollout (erste LKW-Lieferungen)\n▪︎ Oktober: Cybercab-Flotte Austin >300\n▪︎ Oktober: Vorstellung des fliegenden Roadsters\n▪︎ Oktober: 1/3 aller EU-Länder mit FSD-Zulassung", "url": "https://x.com/teslaxander/status/2111493691009282384", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111544801023946846", "t": "2026-10-17T19:48:05+00:00", "views": 8669, "likes": 161, "reposts": 14, "handle": "NotATeslaApp", "name": "Not a Tesla App", "avatar": "", "followers": 58645, "text": "Tesla Extends Robotaxi Hours Again, Now Until Midnight\n\nTesla’s Austin Robotaxi service now runs from 6 a.m. to midnight, adding another hour as Tesla works toward round-the-clock rides with FSD v15.\n\nFull Story:\nhttps://t.co/U8rMYhf3wE", "url": "https://x.com/NotATeslaApp/status/2111544801023946846", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111545540140061068", "t": "2026-10-17T19:51:02+00:00", "views": 2240, "likes": 44, "reposts": 4, "handle": "teslayoda", "name": "Yoda", "avatar": "", "followers": 18766, "text": "I wonder if this batch of Model Ys is headed to Austin or Dallas.\n\nTesla has recently been deploying only Cybercabs in Austin, likely to increase the Cybercab-to-Model Y ratio.\n\nIf these Model Ys are destined for Dallas, Unsupervised Robotaxi service could be starting this weekend.", "url": "https://x.com/teslayoda/status/2111545540140061068", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111558678688264647", "t": "2026-10-17T20:43:14+00:00", "views": 17303, "likes": 25, "reposts": 2, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3864, "text": "Uber vs Tesla robotaxi as the crowd is leaving the game on a Saturday afternoon in Austin. Uber surge is going down but robotaxi definitely lags behind in reducing that surge pricing. This is crazy 😭 https://t.co/i0H5NxPFkV", "url": "https://x.com/WorldlyReviewer/status/2111558678688264647", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111577744844669015", "t": "2026-10-17T21:59:00+00:00", "views": 1217, "likes": 20, "reposts": 3, "handle": "joehansen", "name": "Joe Hansen", "avatar": "", "followers": 22740, "text": "What caught my eye in the Elon Universe on 17 Oct.\n\n1. Robotaxi riders in Austin got an alert: rides now run 6am to midnight. The Texas registry is at 803, with 454 Model Y and 349 Cybercab. Late rides matter most for bar staff, nurses off a late shift and anyone leaving a concert.\n\n2. Elon: \"Neuralink will help millions of people,\" quoting Jake Schneider, who has ALS: \"Neuralink has given me some of the independence back that ALS has stolen from me.\" Participants have used their implants for over 50,000 hours. Hearing it from a patient says more than any demo.\n\n3. SpaceX reports Q3 on Tue 20 Oct, Tesla on Wed 21 Oct. Merger talk is all over the betting markets. Two big calls in two days. The merger stays talk until there's a filing.\n\n4. Elon says the Roadster will do the reveal stunts by itself, and Tesla will build \"a wild looping track (crazier even than Hot Wheels)\" at its Texas HQ. Stunts like that belong on a closed track, and Texas HQ will have one.\n\n5. Starlink posted a statement on India, and Elon replied \"Much appreciated\" to Reliance. No security clearance or spectrum decision yet. Villages where fiber never reached have the most to gain when it opens.\n\nEarnings week starts Tuesday.", "url": "https://x.com/joehansen/status/2111577744844669015", "lane": "texas_proving_ground", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111589707947634799", "t": "2026-10-17T22:46:32+00:00", "views": 4299, "likes": 33, "reposts": 4, "handle": "AustinTeslaClub", "name": "Tesla Austin Owners Club Official Account", "avatar": "", "followers": 7999, "text": "Tesla is bringing the Tesla Cybercab to Victory Lap in Austin TODAY!\n\nNo steering wheel. No pedals. No driver.\n\nCome check it out up close and meet Tesla representatives.\n\n📍 504 W 24th St, Austin, TX https://t.co/iGEFT43R2g", "url": "https://x.com/AustinTeslaClub/status/2111589707947634799", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111591041048498326", "t": "2026-10-17T22:51:50+00:00", "views": 16292, "likes": 85, "reposts": 4, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10602, "text": "Austin Saturday Afternoon Update. Game's over. Uber is unwinding its surge, Robotaxi is not:\n\n🚕 Cybercab - $27.10 - 19 min wait ⏱️\n🚕 Model Y - $24.48 - 15 min wait ⏱️\n🚙 UberX - $12.95 - 9 min wait ⏱️\n🚙 Comfort Electric - $16.98 - 7 min wait ⏱️\n\n🔴 Since this morning Uber gave back 43% to 48% on every tier. Tesla gave back 7% on Cybercab and 6% on Model Y. Robotaxi is way behind on unwinding the surge\n 🔴 Robotaxi is now pricier than every single Uber tier on the board. Premier SUV is a 6 seat luxury SUV and its $23.89 list is still cheaper than a Model Y\n 🔴 Cybercab at $27.10 is 2.1x UberX at $12.95 for the exact same mile\n 🟡 Today held the two highest Cybercab fares and two highest Model Y fares logged on this route. $29.13 this morning, $27.10 now\n\n🟡 Cybercab got slower while getting cheaper, 17 min to 19 min. Model Y cut its wait in half, 28 min to 15, and beat Cybercab for once\n\nUber's surge pulls drivers in, then lets them go. Tesla's fleet is the same size at 10am and 4pm, so the price has nowhere to fall to. Lower prices will require more cabs 🚕🚕🚕 ✍️", "url": "https://x.com/RobotaxiRadar/status/2111591041048498326", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111591457899589664", "t": "2026-10-17T22:53:29+00:00", "views": 2775, "likes": 113, "reposts": 3, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10602, "text": "5 Cybercabs. 1 block. A sign of the times in Austin 📈 https://t.co/p9j6uPXABX", "url": "https://x.com/RobotaxiRadar/status/2111591457899589664", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111606196004167990", "t": "2026-10-17T23:52:03+00:00", "views": 2364, "likes": 72, "reposts": 6, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10602, "text": "If you're in Austin, and want to see a Cybercab up close without booking a ride, this is your chance 🚕👀\n\n📍 Right by UT campus, inside Tesla's current Austin Robotaxi service area https://t.co/mblkBdIBXJ", "url": "https://x.com/RobotaxiRadar/status/2111606196004167990", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111766809036652873", "t": "2026-10-18T10:30:16+00:00", "views": 8796, "likes": 121, "reposts": 8, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1659, "text": "1020 Cybercab sightings in Austin yesterday, with 889 driverless\n\n#cybercab #tesla #robotaxi https://t.co/ilqILBkAke", "url": "https://x.com/CybercabSpotter/status/2111766809036652873", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111779709407113348", "t": "2026-10-18T11:21:32+00:00", "views": 3223, "likes": 157, "reposts": 14, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Driverless Cybercab sightings set another record in Austin 🚨\n\n✏️ Driverless = 889\n✏️ Total = 1,020\n\n✅ Driverless share 87%, a new high for the third straight day (85% ➡️ 86% ➡️ 87%)\n\n✅ Second consecutive day above 1,000 total\n\n✅ Saturday vs Saturday: total +12%, driverless +16%, and last Saturday was an ACL day\n\n🧐 Total eased 5% from Friday's 1,072 record, so volume is off its peak even as the mix keeps shifting\n\nStill no festival in town. F1 at COTA starts Friday, so this week's weekdays are the last clean readings before another major event. Another record day for Robotaxi ✍️", "url": "https://x.com/RobotaxiRadar/status/2111779709407113348", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111822592999145726", "t": "2026-10-18T14:11:56+00:00", "views": 59521, "likes": 244, "reposts": 10, "handle": "Cyber_Trailer", "name": "No Safe Words", "avatar": "", "followers": 12207, "text": "Austin, TX (OCT.17.2026)-\nCyberCab blocks a very popular route for Tesla Robotaxis.  \n\nBTW, those bicycle taxis are absolutely Trucking. \n\n#SunsetProject https://t.co/ciy53G2Fbh", "url": "https://x.com/Cyber_Trailer/status/2111822592999145726", "lane": "safety_first_accountability", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111842861360570593", "t": "2026-10-18T15:32:28+00:00", "views": 1076, "likes": 11, "reposts": 0, "handle": "dallastesla", "name": "Dallas Tesla David", "avatar": "", "followers": 6200, "text": "Tesla’s biggest moves in 2026 so far\n\nMay: Built the last Model S and Model X. Fremont line converted for Optimus.\n\nJuly: Model Y L (six-seat) launched in the US. FSD subscriptions hit 1.48 million in Q2, biggest quarterly add ever.\n\nSummer/Fall: Unsupervised Robotaxi expanded across Austin, Dallas, Houston, Miami, Orlando, and Tampa. Optimus ramped to hundreds a week on old S/X line.\n\nSeptember: Cybercab (no wheel, no pedals) entered paid service in Austin and scaled past 300 units. Semi high-volume production started at the dedicated Nevada plant, customer deliveries underway.\n\nOctober: Supercharger network passed 85,000 stalls with record Q3 usage. Powerwall VPP in California set a new record (85k+ homes, 600+ MW). Q3 deliveries of 486k. New flying Roadster demo.", "url": "https://x.com/dallastesla/status/2111842861360570593", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111843853439291556", "t": "2026-10-18T15:36:25+00:00", "views": 2463, "likes": 9, "reposts": 0, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3865, "text": "Uber vs Tesla robotaxi on a Sunday morning in Austin https://t.co/xKAZkGUEo9", "url": "https://x.com/WorldlyReviewer/status/2111843853439291556", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111846392561824043", "t": "2026-10-18T15:46:30+00:00", "views": 1796, "likes": 44, "reposts": 4, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Austin Robotaxi vs. Uber Sunday Morning Update:\n\n🚕 Cybercab - $9.53 - 3 min wait ⏱️\n🚕 Model Y - $8.51 - 9 min wait ⏱️\n🚙 UberX - $7.95 - 10 min wait ⏱️\n🚙 Comfort Electric - $11.98 - 11 min wait ⏱️\n\n🟢 Cybercab at 3 min is the 2nd fastest I've seen on this route. Only a 1 min quote back on Sep 7 beats it, and only ~5 of 52 checks have come in at 5 min or under\n 🟢 Both Teslas beat every Uber tier on wait. Model Y beating UberX has only happened twice recently\n 🟢 Model Y at $8.51 is $0.56 away from UberX.\n 😳 Yesterday at 10am this same mile was $29.13 Cybercab and $26.11 Model Y. Everything is down about 67% overnight ✍️", "url": "https://x.com/RobotaxiRadar/status/2111846392561824043", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111847737574453685", "t": "2026-10-18T15:51:51+00:00", "views": 1859, "likes": 4, "reposts": 0, "handle": "CybercabSpotter", "name": "Cybercab Spotter", "avatar": "", "followers": 1659, "text": "OLTORF ST · AUSTIN · TX https://t.co/qAhhyS81dq", "url": "https://x.com/CybercabSpotter/status/2111847737574453685", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111849996429472150", "t": "2026-10-18T16:00:50+00:00", "views": 942, "likes": 45, "reposts": 0, "handle": "texasavtracker", "name": "Texas Autonomous Vehicle Tracker", "avatar": "", "followers": 2806, "text": "Current fleet size in Texas — Oct 18\n\nWaymo: 1185\nTesla: 803\nAvride: 344\nZoox: 63\n\nFor more detailed info see link to live tracker in bio.\n\nTracker powered by @EVject", "url": "https://x.com/texasavtracker/status/2111849996429472150", "lane": "tesla_vs_waymo_duel", "copy_origin": "2108588610966499375", "in_dataset": 1, "copies": 0}, {"id": "2111854825163862453", "t": "2026-10-18T16:20:01+00:00", "views": 1878, "likes": 81, "reposts": 2, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "5 Cybercabs ready for riders in Austin, TX 🚕🚕🚕\n\nThese 4+ Cybercab sightings on traffic cams are starting to be pretty common 🔍 https://t.co/DTijNLHFxM", "url": "https://x.com/RobotaxiRadar/status/2111854825163862453", "lane": "tesla_scaling_hype", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111864649478029565", "t": "2026-10-18T16:59:03+00:00", "views": 10954, "likes": 69, "reposts": 5, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Cybercab blocked a popular route on the way to game day (Texas v Florida)…or did it? 🤔\n\nCameraman posts traffic being backed up by a Cybercab entering a parking lot, but if you look closer, a cyclist just passed, and there are shadows of pedestrians crossing the cab’s path that the cameraman conveniently did not record 🚶🏻‍♂️🚕\n\nSeems a lot like Robotaxi rage bait (and it worked on me)\n https://t.co/bKVXfvYUKs", "url": "https://x.com/RobotaxiRadar/status/2111864649478029565", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111870024545624500", "t": "2026-10-18T17:20:25+00:00", "views": 19984, "likes": 504, "reposts": 7, "handle": "goncy", "name": "goncy.tsx", "avatar": "", "followers": 72681, "text": "Llegué a Austin, TX (mejor ciudad del mundo) y me pedí un cybercab. Ya me había tomado Waymo pero la experiencia acá es mucho mejor y también mucho más barato. Igual le falta la magia del remis con olor a pucho de Quilmes, que vuelvan los valores tradicionales https://t.co/FCAOmHqct2", "url": "https://x.com/goncy/status/2111870024545624500", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111902850075005150", "t": "2026-10-18T19:30:51+00:00", "views": 3133, "likes": 32, "reposts": 3, "handle": "WorldlyReviewer", "name": "Abhimanyu Yadav", "avatar": "", "followers": 3865, "text": "Uber vs Tesla robotaxi on a Sunday afternoon. Those robotaxi wait times and prices are looking delicious https://t.co/4vDCWDzOks", "url": "https://x.com/WorldlyReviewer/status/2111902850075005150", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2111905259429703713", "t": "2026-10-18T19:40:25+00:00", "views": 2069, "likes": 59, "reposts": 3, "handle": "RobotaxiRadar", "name": "Robotaxi Radar", "avatar": "", "followers": 10614, "text": "Austin Sunday Afternoon Update - Some of the best Robotaxi fares + wait times I've seen:\n\n🚕 Cybercab - $9.53 - 1 min wait ⏱️\n🚕 Model Y - $8.51 - 2 min wait ⏱️\n🚙 UberX - $9.94 - 8 min wait ⏱️\n🚙 Comfort Electric - $14.98 - 9 min wait ⏱️\n\n🟢 Both Teslas are cheaper AND faster than UberX. In 30 Cybercab and 33 Model Y head to heads on this route, that has never happened once. Today both happened at the same time\n 🟢 Cybercab at 1 min ties the fastest quote I've ever seen here. Model Y at 2 min ties for 2nd fastest\n 🟢 Both Teslas beat every single Uber tier on wait. Nothing on the Uber board is under 5 min\n 😳 Uber went UP 25% since this morning. UberX $7.95 to $9.94, Comfort Electric $11.98 to $14.98. Tesla didn't move a cent, $9.53 and $8.51 both times\n 🧐 Yesterday Tesla lagged Uber on the way down and it cost riders. Today it's lagging on the way up and riders win. Same slow pricing, opposite result\n\nThis is the version of Robotaxi that wins. Under $10, under 2 min, beating the cheapest Uber on both. 🚕🚕🚕 ✍️", "url": "https://x.com/RobotaxiRadar/status/2111905259429703713", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111927502033883388", "t": "2026-10-18T21:08:48+00:00", "views": 2646, "likes": 19, "reposts": 0, "handle": "scotsrule08", "name": "Spencer", "avatar": "", "followers": 7676, "text": "30 @Waymo rides in and I have yet to be assigned an Ojai in Dallas. \n\nWhat’s a man gotta do to ride in one? 🤔 https://t.co/f40NxpMsLb", "url": "https://x.com/scotsrule08/status/2111927502033883388", "lane": "rider_economics_experience", "copy_origin": null, "in_dataset": 1, "copies": 0}], "edges": [{"src": "2105628713580704005", "dst": "210562   // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);
  hl.append('p').attr('class', 'sub').text(meta.subtitle);
  if (windowDays > 10 && !isVideo) {
    const r = hl.append('p').attr('class', 'range');
    r.append('span').text('Showing ');
    [[7, 'last 7 days'], [14, 'last 14 days'], [30, 'last 30 days'], [0, 'the whole window']].filter(([d]) => !d || d < windowDays + 1).forEach(([d, label], i, arr) => {
      const on = rangeDays === d;
      r.append('a').attr('href', '?days=' + (d || 'all')).attr('class', on ? 'on' : '').text(label);
      if (i < arr.length - 1) r.append('span').text(' · ');
    });
  }
  const clock = head.append('div').attr('class', 'clock');
  const clockDate = clock.append('div').attr('class', 'date');
  const clockTime = clock.append('div').attr('class', 'time');
  const clockSpeed = clock.append('div').attr('class', 'speed');

  const statsEl = app.append('div').attr('class', 'stats');
  const stat = (cls, label) => { const s = statsEl.append('div').attr('class', 'stat ' + cls); const n = s.append('div').attr('class', 'n'); s.append('div').attr('class', 'l').text(label); return n; };
  const sPush = stat('push', 'posts pushing the story');
  const sRep = stat('rep', 'repeated posts');
  const sBack = stat('back', 'posts pushing back');

  const ctl = app.append('div').attr('class', 'controls');
  const playBtn = ctl.append('button').attr('aria-label', 'Play').text('▶');
  const slider = ctl.append('input').attr('type', 'range').attr('min', 0).attr('max', 1000).attr('value', 1000);
  const spd = ctl.append('div').attr('class', 'spd');
  spd.append('span').text(isMobile ? '' : 'speed');
  const speeds = [20, 40, 80];      // seconds for the whole window
  let speedIdx = 1;
  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.
  const band = isMobile ? 30 : isVideo ? 28 : 42;
  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;
  const stripH = markets.length ? (isMobile ? 54 : isVideo ? 62 : 72) : 0;
  // events (incidents/events.yaml) inside the drawn span, grouped when they share a moment; they get a band under the axis
  const evMap = new Map();
  (DATA.events || []).forEach(e => { const t = Date.parse(e.at); if (!(t >= tMin - span * 0.015 && t <= tMax + span * 0.02)) return; const g = evMap.get(t) || { t, labels: [], types: [] }; g.labels.push(e.label + (e.all_day ? ' (all day)' : '')); g.types.push(e.type); evMap.set(t, g); });
  const events = [...evMap.values()].sort((a, b) => a.t - b.t);
  const evBand = events.length && !isMobile ? 26 : events.length ? 10 : 0;
  const top = 22 + stripH + evBand, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : t === 'trump' ? '#ff6b6b' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
