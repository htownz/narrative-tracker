ny funds.\n\nExisting reactors gain capacity\n\nVistra, a Texas-based power producer that operates the second-largest competitive nuclear fleet in the U.S., plans to increase electricity production at Beaver Valley, Davis-Besse and Perry without adding new transmission corridors or building equivalent new generating facilities, according to the DOE.\n\nThe investments would also support operation of the plants for an additional 20 years beyond their existing licenses. The financing package includes an option for potential future uprates at Vistra’s Comanche Peak Nuclear Power Plant in Texas.\n\n“By getting more power out of the nuclear plants we already have, we can deliver more affordable, reliable, around-the-clock energy for American families and businesses,” U.S. Energy Secretary Chris Wright said.\n\nNuclear uprates can increase the output of existing reactors through equipment upgrades and other changes to plant systems. In this case, the approach allows Vistra to add hundreds of megawatts while continuing to use existing nuclear sites and infrastructure.\n\nThe proposed investment comes as U.S. electricity demand is rising and policymakers seek additional sources of round-the-clock generation.\n\nThousands of jobs supported\n\nThe DOE estimates the planned work will support about 3,000 project-related jobs across engineering, construction and planned reactor outage work. It is also expected to preserve thousands of permanent jobs associated with the plants.\n\nThe financing advances an executive order signed by President Donald Trump in 2025 aimed at expanding U.S. nuclear generation and strengthening the domestic nuclear industry.\n\n“These investments will extend the life of existing reactors, increase nuclear generation, and deliver abundant, around-the-clock power to lower costs and power American prosperity for decades to come,” EDF Director Gregory A. Beard said.\n\nThe $4.2 billion figure represents the maximum amount available under the conditional commitment, rather than money already awarded to Vistra. The company will receive financing only if it meets the DOE’s conditions and the two sides complete final loan documents.\n\nhttps://t.co/GwhrjdrqaM", "url": "https://x.com/OwenGregorian/status/2107455708060942828", "lane": "firm_power_nuclear_gas", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107471067216527500", "t": "2026-10-06T14:00:32+00:00", "views": 39127, "likes": 217, "reposts": 45, "handle": "MarcGravely", "name": "Marc Gravely", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAYAAADAQEAAAAAAAAAAAAAAAAFBgcEAf/EABkBAQEAAwEAAAAAAAAAAAAAAAMEAAIFAf/aAAwDAQACEAMQAAABmdQQ38aTBECTC9JntQmNXMNUibUzzfVsAEhsXpq7pb8/FUpkxsVJyGVHVp53L3C//8QAHxAAAgIBBQEBAAAAAAAAAAAAAQIDBAAFBhESFBMh/9oACAEBAAEFAlXkmFUyuuOild1RD45p4X1M3IpWOxs2Y4c3EVfSsqcLYgHD25E6KVzdf7UyDq1qvKGlELCUREtuW2srYOQaUps1hYjkzUbvno/TscGaBb8 und:\n\nIn October 2008, Petrohawk announced a well in La Salle County called the STS 241 #1H. It was the discovery well that opened up the Eagle Ford Shale.\n\nLewis Energy, which has worked in La Salle County for decades, is supplying the land, the natural gas and the water.\n\nThe Governor has told data centers to bring their own generation to the grid. This one brings South Texas gas.\n\nAt peak construction, an estimated 8,400 people will work on it. That's more than 15 times the population of Encinal.\n\nThe Eagle Ford was opened up in La Salle County in 2008. Eighteen years later, the same county could turn South Texas gas into computing power.", "url": "https://x.com/MarcGravely/status/2107471067216527500", "lane": "data_centers_good", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107553473894252703", "t": "2026-10-06T19:27:59+00:00", "views": 1759, "likes": 17, "reposts": 2, "handle": "thezenbear", "name": "The Zen Bear", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFy uy powered land and mature it through interconnection. The CFO also said they can originate greenfield sites and finance them.\n\n-Tenant quality is the edge. Two AWS sites plus Fluidstack backed by Google means the bonds price strongly relative to peers.\n\n-1 GW firm is the next step. Potential customers may sign ahead of the ERCOT audit, and management expects to be firm at 1 GW after it.\n\n-2.5 GW behind-the-meter. Tenant demand is very strong for data centers with behind-the-meter generation. The pitch is connecting all the dots so tenants can decide easily.\n\n-The bonds have held up. All three project bonds priced progressively tighter, and even with spreads wider across the sector they’re trading close to par.\n\n-Capital markets favor the prepared. A huge wave of supply is coming, with lots of debt and equity being raised, and Cipher already has a financing track record.\n\n-Discipline. Each deal is underwritten to protect returns. If financing or inflation costs rise, they’ll price it in.\n\nCheers 🥂", "url": "https://x.com/datacentrebull/status/2107555371540001168", "lane": "data_centers_good", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107575316067627499", "t": "2026-10-06T20:54:46+00:00", "views": 90727, "likes": 3048, "reposts": 218, "handle": "cremieuxrecueil", "name": "Crémieux", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAA tinely spam requests across several sites, and many are speculative builds with no customer yet.\"\n\n\"Planners can't tell which are real, and they don't want ratepayers covering upgrades built for projects that never show up.\"\n\n\"Fully connecting a large data center can take 5 to 10 years... Idle GPUs cost far more than the electricity to run them, so speed matters most... That's why developers are planning to bring their own power on site.\"\n\n\"Full reliability for these power islands is very, very hard, but some labs and hyperscalers have shown that, forced to choose between reliability and speed, they'll pick speed.\"\n\n\"Every site I'm aware of intends to connect to the grid as soon as it can, chiefly because on-site power almost always costs more.\"\n\n\"AI companies have pledged to pay their way, and most would rather connect to the grid than avoid it. It seems ideal for everyone that we let them do so instead of driving that spending into private islands.\"\n\n\"Texas created the energy fast lane first; now it has the opportunity to show us a better one, and I expect it will. Power is where America finds out whether it can still build.\"\n\na16z's @rmcentush on why Texas is making data centers wait: https://t.co/TobsqsZJq9", "url": "https://x.com/a16z/status/2107859784594767982", "lane": "queue_bubble_pause", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107865249412243961", "t": "2026-10-07T16:06:52+00:00", "views": 1303, "likes": 36, "reposts": 10, "handle": "HopfJames", "name": "James Hopf", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAA  the grid cannot promise one. In the busiest regions, connecting a large new load takes five to seven years. \n\nSell-side estimates value getting power one year earlier at about $4.50 per watt. INNIO's engines sell for $0.45 to $0.70 per watt. The buyer is paying for the date, not the hardware.\n\nThe J624 is a 5 megawatt gas engine that gets trucked in on a trailer and takes load in about 15 seconds. Nothing larger takes load that fast.\n\nThe demand is already on paper.\n\nBacklog went from $1.0 billion at the end of 2024 to $6.6 billion in June. Customers have prepaid $1.4 billion. 2026 and 2027 are sold out and reservations reach into 2030 and 2031.\n\nWe traced about 8 gigawatts of Jenbacher engines to named sites. $AMZN specified 280 J620s in a Pennsylvania permit. $ORCL and OpenAI's Frontier campus runs on Jenbachers through VoltaGrid. Liberty Energy filed the first real price in an 8-K: $493 million for 100 J624s.\n\nThen there is the part nobody prices. Services were 48% of 2025 revenue and about 65% of segment profit. A data center engine runs about 8,000 hours a year against 2,000 to 4,000 on the legacy fleet, and the parts wear by the hour. The first wave hits major overhauls from 2029.\n\nSo why is it $19.20, 29% below the $27 IPO and 55% below the June high?\n\nBecause of who is selling. The IPO was 100% secondary. The sponsors still own 86% and only about 14% of the company trades. One quarter of tariff hit margins did the rest. \n\nThe lockup expires November 30.\nNow run the math. At $19.20 the market is pricing capacity that stops at about 5.7 gigawatts, short of the Austrian expansion already under construction, with the new Wisconsin line adding nothing.\n\nOur base case is $27, about 40% above today. Bear is $14.40 and bull is $38.\n\nThe risks are real. The Texas permit pause. A sponsor with 646 million shares to sell. VoltaGrid at 41% of 2025 orders. All of it is in the report, along with what would change our mind.\n\nThe dates that decide it: October 19 TCEQ's report, October 29 Enerflex earnings, mid November INNIO's Q3, November 30 the lockup, and around December 10 when ERCOT finishes its review.\n\nThe grid will get there eventually. The data center cannot wait for it. INNIO sells the time in between.", "url": "https://x.com/CVResearch_/status/2108581832048496924", "lane": "firm_power_nuclear_gas", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108589533218603149", "t": "2026-10-09T16:04:55+00:00", "views": 68816, "likes": 281, "reposts": 35, "handle": "VanquishTrader", "name": "VanquishTrader", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAaAAEAAwEBAQAAAAAAAAAAAAAAAwcIBgIE/8QAFAEBAAAAAAAAAAAAAAAAAAAAAP/aAAwDAQACEAMQAAABuUAADPWhcvGgPo5ikTurzqi2BDMIvM4A/8QAHxAAAgMAAQUBAAAAAAAAAAAAAQUDBAYTABARFTAW/9oACAEBAAEFAvro3DOu7zc0thI3Y11lRTrrHswfI61QP6FUwgWZJxfttLmQznB3MUZJjjI4Yvj/AP/EABQRAQAAAAAAAAAAAAAAAAAAADD/2gAIAQMBAT8BH//EABQRAQAAAAAAAAAAAAAAAAAAADD/2gAIAQIBAT8BH//EACkQAAIBAgMFCQAAAAAAAAAAAAECAwAEESExEDAzQWEiIzJCQ1FxcpL/2gAIAQEABj8C3t1DDeypGr5KDpVrNM5eRkzY86NxcN9V5saY32dvKdF9Osdl5keJVrPcY+DsqNWNGefH2RBoopb+/TvdY4z5ep67cTGpPxQBRcBplXDT87n/xAAhEAEAAgEDBAMAAAAAAAAAAAABABEhMWGBEDBR8EFxof/aAAgBAQABPyHu00J4gUSwnrWK5t+D4RKHU4FxryeYADRL6Pc4GxFmwr8rOCbKcHZHuYRuHgPY/Or5U1UxQPQJxAGwn6dn/9oADAMBAAIAAwAAABDjzzxBTxzz/8QAFBEBAAAAAAAAAAAAAAAAAAAAMP/aAAgBAwEBPxAf/8QAFBEBAAAAAAAAAAAAAAAAAAAAMP/aAAgBAgEBPxAf/8QAIhABAAICAAUFAAAAAAAAAAAAAREhADEQIEFRsTBhgZGh/9oACAEBAAE/EOeTuYXyOnIb6NEzgrVuTkAbMwS5HeCWSrR+XQW4UhOmvSiXqht2XSz8iDEU46cYiOsbmiVIdMkD8rQW4fCtQJlH37u18AbUBPg9A/B5a4JVmUSvupgFFRAF3BFawIAMiCj9ej//2SAgICAgICAgIA==", "followers": 10051, "text": "WHY $TE COULD BE THE NEXT AI POWER MULTIBAGGER\n\nThe reason I think T1 could become one of the more asymmetric multi bagger opportunities inside the AI buildout is that the market is still valuing it like a loss making solar manufacturer today while the real thesis is what happens once G2_Austin comes online and turns the company into a much more vertically integrated U.S. power infrastructure supplier. \n\nG1_Dallas is already showing that the operating model can scale, with Q2 revenue nearly doubling to roughly $250M and gross margin improving toward 20% but G2 is the step change because producing cells internally instead of buying them from outside suppliers should let T1 capture much more of the economics on every module it sells. \n\nManagement believes the initial 2.1 GW phase can eventually support roughly $375M to $450M of annualized adjusted EBITDA and a full 5 GW buildout could push that toward $650M to $700M which is a completely different earnings profile than the company investors are looking at today.\n\nWhat makes that opportunity much more interesting is that the demand side is increasingly being pulled by the same AI power problem driving the rest of my energy thesis. \n\nData centers need enormous amounts of new electricity and solar will not solve that problem alone, but it can become one of the fastest generation sources to deploy when paired with storage, gas and nuclear, especially in markets like ERCOT where interconnection requests are exploding and a huge percentage of the incremental load is tied to data centers. \n\nT1 already has several gigawatts of contracted module demand through customers like Clearway and Treaty Oak, while its domestic content strategy becomes more valuable as utilities and developers increasingly want U.S. sourced equipment that qualifies for incentives and avoids dependence on Chinese supply chains. \n\nIf G2 works, T1 is not simply selling another commodity solar module because it can own more of the U.S. supply chain from polysilicon and wafers through cells and finished modules, which should create a better margin structure than the current business.\n\nThe valuation is where the setup starts becoming interesting because at roughly $4 to $5 per share the market is effectively making investors pay very little for the possibility that G2 actually reaches the profitability management is targeting since consensus around $0.44 of EPS in 2028 puts the stock near roughly 10x those earnings today, which is not demanding if T1 is still growing strongly beyond 2028 and G2 proves that vertically integrated domestic solar can generate sustainable margins. \n\nThe additional optionality around Nordic data centers and battery storage makes the story even broader because T1 could eventually participate not only in supplying generation equipment to the AI buildout but also in owning pieces of the infrastructure around it which is why I think ceiling can be much higher than what a simple solar peer multiple suggests.\n\nThe risk is that none of this value exists for shareholders unless the company can actually finance the bridge between today and that future because G2 Phase 1 is expected to cost roughly $510M while unrestricted cash was only around $79M at the end of Q2, so additional debt, equity or both will almost certainly be needed before the factory reaches scale. \n\nThat means dilution and balance sheet risk are very real, and if G2 runs over budget, ramps slowly or fails to reach the expected margin structure then the stock can stay cheap for a good reason.\n\nBut if T1 can secure financing without overwhelming existing shareholders, keep G1 margins around or above 20%, bring G2 online in 2027 and convert strong domestic demand into real free cash flow then I think the market could eventually stop viewing T1 as a speculative solar manufacturer and start valuing it as a vertically integrated U.S. power infrastructure platform sitting directly in the path of the AI electricity buildout.", "url": "https://x.com/VanquishTrader/status/2108589533218603149", "lane": "data_centers_good", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108658720209268940", "t": "2026-10-09T20:39:50+00:00", "views": 2387, "likes": 24, "reposts": 0, "handle": "mathburn666", "name": "MB 🦇🔊", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR nference expands. Large training campuses remain essential, but not every computing workload requires a facility with hundreds of megawatts available from day one.\n\nThat distinction matters for Dorothy 3.\n\nAn initial 75 MW phase could allow Soluna to match construction and capital requirements more closely to contracted demand, bring capacity online in stages and expand as additional power becomes available.\n\nThis isn't confirmation that Dorothy 3 will use Crusoe-style prefabricated modules. However, its proposed phase structure is consistent with the industry's increasing emphasis on flexible capacity deployment.\n\nDorothy 3 already has an important foundation\n\nUnlike developers starting with undeveloped land and no nearby generating assets, Soluna has spent much of 2026 consolidating its position around Dorothy.\n\nThe company now owns the adjacent 150 MW Briscoe Wind Farm, has consolidated ownership of Dorothy 1 and completed the purchase of 397 acres for Dorothy 3.\n\nThe Briscoe substation sits directly across from the newly acquired property, providing an important starting point for the planned behind-the-meter development.\n\nSoluna also has approximately 98 MW of existing operating infrastructure at Dorothy 1 and 2.\n\nIn September, ERCOT conditionally classified 100 MW at the existing Dorothy campus as Base Load under Batch Zero, while a separate 50 MW interconnection request remained under study. This does not constitute approval for Dorothy 3's new phases, but it highlights the value of developing alongside an established, energized campus.\n\nThere is also an important distinction between Soluna's approach and a conventional wind-only data center.\n\nThe company's strategy involves combining renewable generation with grid access and additional power resources. Soluna has discussed evaluating onsite gas generation and clustering nearby energy assets to support larger AI campuses.\n\nThat combination could be especially valuable for a phased proj agreement, and the 433MW it supports delivers between 2031 and 2034 (chart 8).\n\nThe remaining question is whether $VST deserves a different multiple than its peers now that the sector has re-rated. On guidance-based forward EV/EBITDA, $VST is at 10.7x against a 10.65x peer average. Applying the peer-average multiple to VST's earnings gives roughly today's price (chart 2). P/E is below $CEG and above $NRG and $TLN, and trailing FCF yield is the highest in the group, though $VST's separately guided pre-growth FCF is defined differently and cannot be compared directly (chart 3).\n\nThe argument for a different multiple is credit and earnings visibility. Leverage is lower than $NRG's and $TLN's (chart 4), next year's generation is mostly hedged with coverage dropping in 2028, and about half of the nuclear fleet is under long-term contract with $META and solana:5aQcoaSyy7fnhvpRHasBUAMH2nL5tTjVrmFw6BeGmoon (chart 5). Part of that is already in guidance and in the price.\n\nPJM is the counterweight. East, which includes PJM, is the largest segment at 44% of EBITDA, so price caps or market-rule discussions can hit $VST harder than the sector average (chart 6). EV per kW sits below new-build cost and well above the Cogentrix purchase price, so it reads as cheap or expensive depending on the benchmark and is a reference only (chart 7).\n\nMany accounts credit the Pelosi household's trades for the attention on this stock. Disclosures show 50 call options in the spouse's name exercised in January 2026 into 5,000 shares. The buying decision dates from early 2025, so it was not used in this analysis.\n\nFour points for investors to watch.\n\nThis week's move was a sector factor. $VST-specific and sector variables need to be separated.\nForward EV/EBITDA is almost the same as the peer average. Whether a premium or discount is justified depends on how 2027 guidance (expected early next year) and Q3 results (expected early November, date unconfirmed) include Cogentrix and $META.\n CAgICAgICAgICAgICAgICAgICAgICAgICAg", "followers": 19622, "text": "写完核电龙头 Constellation之后，我们今天来看一下一直在list上但却没有聊过的 Vistra。\n\n它和 CEG 是天生一对镜像：CEG 是\"核电卖 AI 最领先、估值也最贵\"的那个；Vistra 则是\"比 CEG 落后一步、但也便宜一截\"的那个。 过去两年，整个电力板块都被 AI 数据中心\"缺电\"的叙事抬上了天，Vistra 2024 年是标普 500 全年涨幅第二名仅次于 Palantir，涨了 261%甚至还把英伟达都甩在后面。\n\n先简单说下它是谁：全美最大的独立发电商（IPP）之一 + 零售一体化，大本营在德州 ERCOT，总装机约 43.6 吉瓦，还有约 500 万零售客户，旗舰品牌 TXU Energy。这里有个特别关键、也特别容易被忽略的点：市场谈它的 AI 核电故事谈得很热，但它的核电只占装机的 15%，真正扛起大半收入的是那 62% 的天然气，外加 20% 的煤。 换句话说它不是一支干干净净的\"核电纯多\"，而是一个\"又脏又全\"的综合发电商。\n\n它的身世也挺传奇：前身是德州电力巨头 TXU，2007 年被 KKR、TPG、高盛用约 450 亿美元做了史上最大的杠杆收购，这里连巴菲特都掺了一脚、后来认错，结果页岩气来了、煤电算盘落空，2014 年破产，这应该是美国史上最大的非金融破产之一。Vistra 就是从这片废墟里重组、重生出来的，然后一路靠并购做大，2024 年收 Energy Harbor 拿到了四台核电。\n\n看它的财报别看 GAAP 净利润，要看\"调整后 EBITDA\"因为它用大量电价对冲，账面浮盈浮亏把净利润打得上蹿下跳，你去看2021/22 还亏二十多亿，2年之后2024 居然赚二十八亿。但如果你去看 EBITDA 就正常了，五年从约 20 亿涨到约 59 亿，稳稳向上，还刚升了投资级、疯狂回购把股本缩了 30%。\n\n那 AI 这波它吃到了多少？ \n\n坦白说 2024 年它是落后 CEG 和 Talen 的。但 2026 年它一口气补了四张大牌：Meta（PJM 核电、逾 2,600 兆瓦、20 年）、AWS（德州 Comanche Peak、至多 1,200 兆瓦、20 年）、英伟达/KKR 的 Helix 合资、以及 DOE 至多 42 亿美元的有条件贷款。所以它从\"落后但便宜\"，正在变成\"追上了、但还便宜\"。\n\n但便宜也是有原因的：\n\n一是它不干净：核电只 15%、八成是又脏又周期的气和煤，商品价格敞口大、没有受监管公用事业那种\"保证回报率\"的保护伞；而且 CEO 自己都承认，德州电价最近在走软。\n\n二是 Moss Landing 那把火：2025 年初它在加州的储能项目起火，冲销了约 4 亿、还惹上一堆官司和清理。\n\n三是它脆：2025 年初 DeepSeek 一来，它单日暴跌约 28%，是所有 AI 电力股里跌得最惨的，同天 CEG 跌 21%、英伟达跌 17%。\n\n以前大家说\"VST 杠杆是 CEG 的好几倍\"，但这个已经过时了。CEG 收了 Calpine 之后自己也背上巨债，净债涨到约 240 亿，绝对值反而超过了 Vistra 的约 195 亿。现在两家杠杆率半斤八两，VST 甚至还略低。所以 Vistra 便宜不是因为它杠杆更高，而是因为它那套\"又脏又周期\"的组合天生就该比纯核电的 CEG 有着更低的估值。\n\n我认为Vistra 是一个\"确实便宜、叙事也在追上，但绝不是'干净'故事\"的标的。它前瞻 PE 约 16 倍，CEG 要 22 倍以上、自由现金流收益率约 7.2%，而这部分CEG 才 3.8%，便宜了一大截；但你买的不是纯核电，而是一个带着三倍 EBITDA 的债、八成化石燃料、外加一桩火灾官司的综合发电商。它更适合\"看好 AI 缺电、但嫌 CEG 太贵、愿意为便宜承担更多杠杆和周期波动\"的人，而不是想买一份\"干净确定性\"的人。\n\n拐点则需要关注那些数据中心大单的 EBITDA 能不能从 2027 年起稳稳爬坡、ERCOT 电价能不能止跌、Moss Landing 官司最终花多少、去杠杆守不守得住。\n\n下一个验证点是 Q3 2026 财报，大约 11 月初。\n\n立场：中立 · 无持仓 · DYODR。\n\nhttps://t.co/OTVn2a3W63", "url": "https://x.com/cherryPayment/status/2108977129949962638", "lane": "firm_  Amazon, Google.\n➡️ Who gets hosed: the smaller neoclouds that still need financing to build.\n✅ BofA's read: the money sorts, it doesn't stop.\n😇 Zero chance of a federal pause.\n🚨 The risk: this isn't settled on election night. The Texas grid audit lands Dec 10 and the final answer is a 2027 story. If real projects get cut, the build slows.\n➡️ Bottom line: the pause squeezes the little guys and hands the giants pricing power.", "url": "https://x.com/realMeetKevin/status/2108988433519743010", "lane": "queue_bubble_pause", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109057033571893425", "t": "2026-10-10T23:02:35+00:00", "views": 2680, "likes": 36, "reposts": 2, "handle": "Colosteve2000", "name": "Steven Martin", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAaAAADAAMBAAAAAAAAAAAAAAADBAUCBgcB/8QAFgEBAQEAAAAAAAAAAAAAAAAAAwQC/9oADAMBAAIQAxAAAAG7D ion talks. Reveille and Ulysses have approved interconnections and are targeted for 2027. All figures here are gross MW, not critical IT load.\n\n𝗖𝗔𝗧𝗔𝗟𝗬𝗦𝗧𝗦 𝗜𝗡 𝗧𝗛𝗘 𝗟𝗔𝗦𝗧 𝟭𝟬 𝗗𝗔𝗬𝗦\n\nCipher appeared at the KBW Virtual AI Summit on October 6. No announcements made.\n\nA Bitfury 13D/A filed October 7 disclosed a 1.84 million share transfer to a dealer on October 5 under a previously arranged forward contract. That could add share supply, but it was not an open market sale.\n\nMorgan Stanley lowered its target to $51.50 from $54 on October 9 and kept an Overweight rating.\n\n𝗣𝗥𝗜𝗖𝗘 𝗔𝗖𝗧𝗜𝗢𝗡\n\nCIFR closed at $13.50 on October 8, down 7.28% on 57.35 million shares. It closed at $13.52 on October 9, up 0.15%. From the October 1 close of $15.46, shares were down about 12.6% through October 9.\n\nThursday’s decline came as other data center stocks fell and Treasury yields rose. Higher borrowing costs matter to companies that need large amounts of capital to build.\n\n𝗣𝗢𝗪𝗘𝗥 𝗔𝗡𝗗 𝗔𝗣𝗣𝗥𝗢𝗩𝗔𝗟𝗦\n\nCipher’s 907 gross MW of operating and contracted capacity includes 207 MW of Bitcoin mining and 700 MW under HPC leases. The additional 477 MW management described as available to lease overlaps with capacity in that broader portfolio.\n\nAnother 3.2 GW has conditional ERCOT classifications: 1.1 GW Base Load and 2.1 GW Studied Load. Of the studied load, 1.6 GW at Mikeska, Apollo, and Stingray Phase II has PCLR status, which may allow earlier operation subject to ERCOT requirements and curtailment.\n\nThe eligibility verification report is due December 10, with final inclusion or exclusion expected in December. \n\nStudied Load still needs system study and capacity allocation. Please keep in mind these are not guarentee's of approval.\n\n𝗕𝗔𝗥𝗕𝗘𝗥 𝗟𝗔𝗞𝗘\n\nThe September 25 agreement keeps the existing Fluidstack term at 10 years and adds a binding commitment from an unnamed AI lab to enter a separate 10-year lease afterward.\n\nCipher says this takes expected contracted revenue from about $3.8 billion to more than $9 billion. It adds no MW. Data halls are scheduled for delivery from Q4 2026 through Q1 2027, with rent starting as each hall becomes operational.\n\nSources: Cipher Q2 earnings call and business update, August 4; Cipher KBW Summit, October 6; Bitfury Schedule 13D/A, October 7; Cipher ERCOT update and ERCOT Batch Zero report; Barber Lake amendment, September 25; CIFR historical prices; Morgan Stanley target update, October 9.", "url": "https://x.com/Colosteve2000/status/2109057033571893425", "lane": "data_centers_good", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109273039003357303", "t": "2026-10-11T13:20:55+00:00", "views": 4482, "likes": 39, "reposts": 12, "handle": "JohnCornyn", "name": "Senator John Cornyn", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAbAAEAAgMBAQAAAAAAAAAAAAAFAwYCBAcBAP/EABgBAAMBAQAAAAAAAAAAAAAAAAACBAMB owth through 2030, which is roughly 4-6% annually in ERCOT and 2-3% in PJM driven by data centers, reshoring, electrification and population growth.\n\nThe nuclear story is even more compelling. Vistra signed 20-year agreements with Meta covering 2,609 MW across its PJM nuclear fleet, including 433 MW of new uprates. It also has a 20-year agreement with AWS for up to 1,200 MW from Comanche Peak.\n\nThe DOE has announced a conditional loan commitment of up to $4.2B to help finance nuclear uprates and modernization across Vistra's Pennsylvania and Ohio fleet. If finalized, that financing would help preserve nearly 4 GW of existing nuclear generation while adding 433 MW of new capacity.\n\nAnd the financial setup remains strong. Vistra's 2027 adjusted EBITDA midpoint opportunity is $7.4B-$7.8B and importantly, that figure excludes potential contributions from the pending Cogentrix acquisition AND the Meta PPAs. Vistra has also repurchased roughly $6.5B of stock since 2021, reducing its share count by ~30%.\n\nManagement summed up the opportunity well on the latest earnings call: “the long-term expected improvement in power market fundamentals is underway.”\n\nTLDR; Higher realized power prices. Rapid electricity demand growth. 20-year nuclear contracts. Potentially billions in federal financing. Aggressive buybacks.\n\nI really like the long-term setup for $VST.", "url": "https://x.com/KyleAdamsStocks/status/2110152180774875213", "lane": "firm_power_nuclear_gas", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110369214875754956", "t": "2026-10-14T13:56:44+00:00", "views": 2345, "likes": 49, "reposts": 5, "handle": "EvaFox", "name": "Eva Fo𝕏 🦊 Claudius Nero's Legion", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE5 <script>
(async function () {
  let DATA = window.__DATA__;
  if (!DATA) {
    try { DATA = await (await fetch('data.json')).json(); }
    catch (e) { document.getElementById('app').textContent = 'No data.json found next to this page.'; return; }
  }
  const { meta, lanes, posts, edges, stats } = DATA;
  const markets = (DATA.markets || []).filter(m => (m.points || []).length > 1);
  const TZ = (meta.window && meta.window.tz) || 'UTC';
  const laneByKey = Object.fromEntries(lanes.map(l => [l.key, l]));
  const PUSHBACK = 'pushback', OTHER = 'other';
  const isMobile = window.innerWidth < 560;
  const isVideo = /[?&]video=1/.test(location.search) || document.body.classList.contains('video');
  if (isVideo) document.body.classList.add('video');

  // ---- derived ------------------------------------------------------------
  posts.forEach(p => { p.ts = +new Date(p.t); p.isCopy = !!p.copy_origin; });
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  // range: ?days=N shows the last N days of the window; long windows default to 14 so the dots stay readable
  const allMax = d3.max(posts, p => p.ts) || Date.now(), allMin = d3.min(posts, p => p.ts) || allMax;
  const windowDays = (allMax - allMin) / 864e5;
  const daysParam = (location.search.match(/[?&]days=(\d+|all)/) || [])[1];
  const rangeDays = daysParam === 'all' ? 0 : daysParam ? +daysParam : windowDays > 21 ? 14 : 0;
  const rangeStart = rangeDays ? allMax - rangeDays * 864e5 : -Infinity;
  const drawn = posts.filter(p => laneByKey[p.lane] && p.ts >= rangeStart);           // 'other' lane is not drawn
  if (!drawn.length) {
    const a = d3.select('#app');
    a.append('h1').text(meta.title);
    a.append('p').attr('class', 'sub').text(lanes.length > 1 ? 'No posts in any lane yet — run classify, then export and render again.' : 'No lanes yet — run discover (or write lanes into the incident YAML), then classify, export, render.');
    return;
  }
  const drawnIds = new Set(drawn.map(p => p.id));
  const links = edges.filter(e => drawnIds.has(e.src) && drawnIds.has(e.dst));
  const tMin = d3.min(drawn, p => p.ts), tMax = d3.max(drawn, p => p.ts);
  const span = Math.max(1, tMax - tMin);
  const vMin = Math.max(1, Math.min(meta.min_views || 1, d3.max(drawn, p => p.views) || 1)), vMax = Math.max(vMin + 1, d3.max(drawn, p => p.views) || 1);   // copies under the threshold sit at the lane floor

  const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtAxis = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);
  hl.append('p').attr('class', 'sub').text(meta.subtitle);
  if (windowDays > 10 && !isVideo) {
    const r = hl.append('p').attr('class', 'range');
    r.append('span').text('Showing ');
    [[7, 'last 7 days'], [14, 'last 14 days'], [30, 'last 30 days'], [0, 'the whole window']].filter(([d]) => !d || d < windowDays + 1).forEach(([d, label], i, arr) => {
      const on = rangeDays === d;
      r.append('a').attr('href', '?days=' + (d || 'all')).attr('class', on ? 'on' : '').text(label);
      if (i < arr.length - 1) r.append('span').text(' · ');
    });
  }
  const clock = head.append('div').attr('class', 'clock');
  const clockDate = clock.append('div').attr('class', 'date');
  const clockTime = clock.append('div').attr('class', 'time');
  const clockSpeed = clock.append('div').attr('class', 'speed');

  const statsEl = app.append('div').attr('class', 'stats');
  const stat = (cls, label) => { const s = statsEl.append('div').attr('class', 'stat ' + cls); const n = s.append('div').attr('class', 'n'); s.append('div').attr('class', 'l').text(label); return n; };
  const sPush = stat('push', 'posts pushing the story');
  const sRep = stat('rep', 'repeated posts');
  const sBack = stat('back', 'posts pushing back');

  const ctl = app.append('div').attr('class', 'controls');
  const playBtn = ctl.append('button').attr('aria-label', 'Play').text('▶');
  const slider = ctl.append('input').attr('type', 'range').attr('min', 0).attr('max', 1000).attr('value', 1000);
  const spd = ctl.append('div').attr('class', 'spd');
  spd.append('span').text(isMobile ? '' : 'speed');
  const speeds = [20, 40, 80];      // seconds for the whole window
  let speedIdx = 1;
  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.
  const band = isMobile ? 30 : isVideo ? 28 : 42;
  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;
  const stripH = markets.length ? (isMobile ? 54 : isVideo ? 62 : 72) : 0;
  // events (incidents/events.yaml) inside the drawn span, grouped when they share a moment; they get a band under the axis
  const evMap = new Map();
  (DATA.events || []).forEach(e => { const t = Date.parse(e.at); if (!(t >= tMin - span * 0.015 && t <= tMax + span * 0.02)) return; const g = evMap.get(t) || { t, labels: [], types: [] }; g.labels.push(e.label + (e.all_day ? ' (all day)' : '')); g.types.push(e.type); evMap.set(t, g); });
  const events = [...evMap.values()].sort((a, b) => a.t - b.t);
  const evBand = events.length && !isMobile ? 26 : events.length ? 10 : 0;
  const top = 22 + stripH + evBand, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
