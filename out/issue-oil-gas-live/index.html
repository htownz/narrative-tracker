 "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107145569328050280", "t": "2026-10-05T16:27:07+00:00", "views": 1027, "likes": 42, "reposts": 23, "handle": "Jon_RosenthalTX", "name": "Jon Rosenthal", "avatar": "", "followers": 11581, "text": "Today is the deadline to register to vote in Texas! Check your status at .\n\n30 days until we elect competence to the Railroad Commission. Let’s do this, Texas. https://t.co/ugNLnVwQqu", "url": "https://x.com/Jon_RosenthalTX/status/2107145569328050280", "lane": "expertise_and_competence", "copy_origin": "at://did:plc:wtbxtihks5wsjka3gpaykpkz/app.bsky.feed.post/3mx5dgqgpct2v", "in_dataset": 1, "copies": 0}, {"id": "2107387322773696989", "t": "2026-10-06T08:27:45+00:00", "views": 3312, "likes": 31, "reposts": 7, "handle": "DissLandman", "name": "Dissident Landman", "avatar": "", "followers": 2369, "text": "Vote for Bo French for the Texas Railroad Commission.  \n\nThis is a bit in the weeds for industry outsiders, but I'm going to give it a shot anyway.  \n\nJon Rosenthal is far too ideologically compromised to be allowed at the helm of the Railroad Commission.  Allowing him to tinker with that agency will cause serious damage to the Texas economy.\n\nBelow is just ONE of a litany of destructive policies Rosenthal openly wants to pass.  We don't even know yet which policies he'll push that are too radical for him to say out loud before an election.\n\nOn to the policy:\n\nRosenthal wants to end routine flaring and venting of gas across Texas except in narrow emergencies, with continuous monitoring, strict capture rules, with extractive penalties for operators who don’t comply. That policy will damage the oil and gas industry.\n\nThat's not debatable.  It's a fact.\n\nFlaring in the Permian isn’t some optional habit. Most of those wells are drilled for oil. The gas that comes with it is a byproduct, and a lot of the time there’s nowhere for it to go, except for flaring.\n\nGathering lines, compressors, plants, and the big pipelines to the Gulf Coast don’t appear the day a well is completed. They take years and serious money. New pads, remote leases, plant turnarounds, or just plain capacity limits mean the gas has to be handled on the spot. Texas rules already push operators to burn it in a flare rather than vent it raw, and the Railroad Commission hands out temporary exceptions under Rule 32 for exactly these cases. When the pipes are full, Waha prices (spot prices at the hub near Pecos) routinely drop to nothing or go negative. Operators have had to PAY to get rid of the gas just so they can keep producing oil. The flare is what lets the well stay online while midstream catches up.\n\nShut that option down except for narrow emergencies and the choices get ugly fast. No place to put the gas and no permit to flare it means you shut the well in. Oil stops. Royalty checks stop. Severance taxes stop. The cash that was going to drill the next location dries up. Marginal wells that penciled with a temporary flare become stranded. Smaller operators who can’t write a check for miles of new line and compression feel it first; even the bigger ones slow down because they have to overbuild pipe ahead of every pad or risk curtailments. Those costs don’t vanish. They show up as fewer wells, less production, and higher prices down the line for everything that runs on those barrels.\n\nI’ve watched this for years on the land side. The pipes eventually get built when the economics support them. A hard ban doesn’t speed that up. It will idle wells, leave reserves in the ground, and pull money out of the pockets of landowners, counties, and the state at a time when commodity prices are skyrocketing.\n\nWe need responsible energy policies that take the realities of the industry into consideration.  Like it or hate it, the world runs on oil.  We need it and we do it cleaner and more safely than the foreign producers we would otherwise have to buy from.\n\nBy now, we should all have a CRYSTAL CLEAR understanding of how destructive hard left energy policies are.  For perspective, ask your favorite AI to compare the difference between a gallon of gas in California and a gallon of gas in Texas.\n\nCalifornia is an energy rich state.  The difference between CA's and TX's gas price is a CHOICE that's rooted in politics and irresponsible energy policy. \n\n#BoFrench #TexasRRC #EnergyFirst #TexasStrong", "url": "https://x.com/DissLandman/status/2107387322773696989", "lane": "radical_opponent_culture_attacks", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107471067216527500", "t": "2026-10-06T14:00:32+00:00", "views": 40120, "likes": 218, "reposts": 45, "handle": "MarcGravely", "name": "Marc Gravely", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAYAAADAQEAAAAAAAAAAAAAAAAFBgcEAf/EABkBAQEAAwEAAAAAAAAAAAAAAAMEAAIFAf/aAAwDAQACEAMQAAABmdQQ  flaring, continuous monitors, tighter setbacks, higher bonds. That’s their list. The Permian still doesn’t have enough pipe. Those rules don’t lay any. They shut wells in and leave the oil in the ground. Landowners, counties, and the state lose the money that comes with it.\n\nHe's a puppet of the \"green energy\" blob and doesn't have the expertise to understand the consequences of their policies.\n\nIN CONTRAST\n\nBo French actually comes out of the Permian. He was raised in Midland. His family has been in the oil business there for more than 80 years and still runs the Midland-based French Oil Company. His father was an All-American Wildcatter. His grandfather helped start the Permian Basin Oil Show back in 1940 and served as its first president.\n\nThat is not a Houston equipment resume. He grew up around the basin that produces the oil the Railroad Commission actually regulates. He spent about a decade as an energy trader starting in the mid-1990s, so he has seen how Permian barrels and the gas that comes with them clear the market. He's also a rancher and mineral owner. Operators have worked his land. He's been on the royalty side of the lease, which is where bad rules show up first as shut-in wells and smaller checks.\n\nThe Railroad Commission’s job is Texas oil and gas, and most of that is Permian. French’s background is the family company, the trading desk, and the mineral interest. That is closer to the work than designing subsea gear for a service company and then taking policy cues from the Sierra Club.\n\nWith his family operating company, he understands EXACTLY what it is to be regulated by the RRC and, as a rancher and mineral owner, understands how RRC regulation protects him.\n\nHe has experience on both sides of the ledger, which uniquely qualifies him for the role.", "url": "https://x.com/DissLandman/status/2107532382110667129", "lane": "expertise_and_competence", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107917139944567179", ater_flaring_environment", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108513303274152388", "t": "2026-10-09T11:02:00+00:00", "views": 1951, "likes": 84, "reposts": 41, "handle": "MQSullivan", "name": "Michael Quinn Sullivan 🇺🇸", "avatar": "", "followers": 93389, "text": "The @PUCTX wants to keep data center locations secret … and the Democrats’ candidate for the Railroad  Commission thinks Satanists and Wiccans should offer prayers in the TxLege.\n\nThose stories, plus the invisible James Talarico, in the 5/9/2026 edition of the TEXAS MINUTE. https://t.co/n8OiwFP7Dh", "url": "https://x.com/MQSullivan/status/2108513303274152388", "lane": "radical_opponent_culture_attacks", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108542015440883946", "t": "2026-10-09T12:56:05+00:00", "views": 1561, "likes": 16, "reposts": 0, "handle": "OwenGregorian", "name": "Owen Gregorian", "avatar": "", "followers": 170541, "text": "New US plant to turn wastewater into 3,000 tons of lithium for batteries | Georgina Jedikovska, Interesting Engineering\n\nThe US has reportedly launched its first new lithium mining plant in the last five decades, which is expected to produce at least 3,000 tons of the critical mineral annually from oilfield wastewater.\n\nThe site is located in Midland, Texas. It started commercial operations in February, 2026. This marked the first time a new US lithium mining project had reached the market since the late 1960s.\n\nBuilt by clean-tech firm Element3, it relies on technology from the Department of Energy’s Oak Ridge National Laboratory (ORNL) to extract lithium from wastewater generated during oil and gas production.\n\nAccording to ORNL, the plant’s annual production capacity is equivalent to nearly half of current US lithium output. The country currently produces approximately 5,000 to 6,000 metric tons of lithium per year. “We can produce our own starting materials, like for battery manufacturing for example,” Parans Paranthaman, PhD, a materials scientist and corporate fellow at ORNL, said.\n\nLithium from oilfield brines\n\nThe facility extracts lithium from produced water, a type of wastewater generated during oil and gas extraction in the Permian Basin.. Data shows that the US oil and gas industry generates approximately 25.9 billion barrels of wastewater, known as produced water or brine, each year. That amounts to roughly 1.09 trillion gallons annually, or nearly three billion gallons per day.\n\nAlthough this water contains lithium, it also carries numerous other elements that must be separated before the mineral can be used in batteries. These can include dissolved and suspended salts, heavy metals, hydrocarbons, as well as radioactive materials.\n\nParanthaman highlighted the difficulty of separating lithium from other elements. “The feedstock contains all kinds of elements, so you need to selectively extract the element of interest with high efficiency and low cost as you scale up,” he continued.\n\nCl) from the wastewater before converting it into battery-grade lithium carbonate powder. This feat also reflects the work of the DOE’s Minerals to Materials Supply Chain Research Facility (METALLIC).\n\nLaunched in April 2025, the project brings together nine DOE national labs across four research centers. Its aim is to boost mineral extraction, separation, refining as well as manufacturing technologies. Element3 licensed ORNL’s lithium recovery technology in 2024. The process has since moved from research to commercial use.\n\nSecuring domestic lithium supplies\n\nAccording to ORNL, the technology could reduce reliance on overseas processing and create a domestic source of materials necessary for battery production. “You need lithium hydroxide or lithium carbonate, and we are producing those chemicals at the Texas site,” Paranthaman said.\n\nHe added that this could make it possible for the US to produce its own lithium. “This is a domestic supply chain,” he continued. For reference, the US produces less than one percent of the world’s lithium and relies heavily on imports.\n\nThe nation’s domestic output is estimated at up to 4,000 metric tons per year. Yet, most of the imported lithium comes from countries such as Chile and Argentina, which together account for 95 percent of the US lithium imports.\n\n“We want to optimize material processing methods, reduce environmental impact and recover more value from materials,” Paranthaman noted in a press statement.\n\nMETALLIC allows companies and universities to test their technologies ahead of their commercial deployment. The initiative could strengthen US critical mineral supply chains. “The success of Element3 is what METALLIC’s innovation ecosystem aims to emulate with keystone companies,” Paranthaman concluded.\n\nhttps://t.co/aDfRwbgy55", "url": "https://x.com/OwenGregorian/status/2108542015440883946", "lane": "produced_water_flaring_environment", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108567350253334778", "t": "2026-10-09T14:36:46+00:00", "views": 1471, "likes": 85, "reposts": 33, "handle": "ITContractorsUS", "name": "IT Contractors Union", "avatar": "", "followers": 7046, "text": "Are You A SalesForce Developer In Austin Looking For Work?\n\nPedigo Consulting just got a 1 Year contract with renewals to 31 August 2030 for $102.00 per hour, for Srikanth Talluri over at the Texas Railroad Commission.\n\nTotal Contract Value: $918,000.\n\nThe IT Contractors Union STRONGLY encourages you to protest the the award of this contract IMMEDIATELY since it is still fresh.\n\nContract# DIR-CPO-5738\nSolicitation # 455-27-29516\n\nIf you are a SalesForce Developer, or are otherwise interested, contact The IT Contractors Union to help you file a Bid Protest:\n\nITContractorsUnion@ITContractorsUnion.com\n\nYou can contact Debbie Pedigo at: 512 256 5434\nDebbieP@PedigoStaffing.com\n\nI called Miss Pedigo, per her request, and when she called back, I asked if it was OK to record the ca opies": 0}, {"id": "2110350895116423243", "t": "2026-10-14T12:43:56+00:00", "views": 1776, "likes": 19, "reposts": 2, "handle": "OwenGregorian", "name": "Owen Gregorian", "avatar": "", "followers": 170540, "text": "Texas oilfield wastewater could help cool data centers without draining freshwater | Muskanbhatia, Interesting Engineering\n\nCan waste water from the oil and energy industry quench the thirst of data centers? Researchers at The University of Texas in Austin are betting it can.\n\nThey suggest that established desalination technologies could allow data centers to use salty or contaminated water to meet their cooling needs, reducing their reliance on freshwater.\n\nAlthough there are various ways to separate salt from water, researchers said reverse osmosis, which uses pressure to push water through a semipermeable membrane, is more energy-efficient. However, the technology has one drawback: it struggles to treat water saltier than seawater.\n\nHeating water into vapor and then condensing it back into freshwater is another viable solution, but this method requires more energy.\n\nTurning wastewater into coolant\n\nAccording to the Environmental and Energy Study Institute, large data centers can consume up to 5 million gallons of water per day. The waste water generated by certain oil fields in Texas is over thousand fold higher than this amount.\n\nData centers can become more efficient in their water usage if they reduce stress on local water resources without drastically increasing costs or overall energy demand, according to a recently published study in Water Research.\n\n“We’re not waiting for a futuristic technology to come along and solve this problem for us,” said Vaibhav Bahadur, who is a professor at the University’s Cockrell School of Engineering’s Walker Department of Mechanical Engineering and is one of the leaders of the research.\n\nBahudur noted that though the desalinations methods are available but they incur a cost. These costs, however, will be a small fraction of a data center’s total energy footprint when compared even with the most energy-intensive water treatment.\n\nTexas oilfields offer alternatives\n\nHe proposed turning attention to the Permian Basin. This geological region in West Texas generates approximately 8 billion gallons of produced water per day during oil and gas extraction.\n\nThe researcher said this water could be put to better use instead of being transported elsewhere for disposal, where it could pose long-term risks.\n\n“The Permian (Basin) puts out 1,200 Olympic-sized swimming pools per day, and right now this water is transported over long distances and injected underground. This is problematic in many ways including the risk of seismic activity,” Bahadur said. “We’re also running out of space to bury that water, by as early as 2030. We need to find a way to use it, and cleaning it up for data centers is a great way to do that.”\n\nThe research finding becomes significant given that only less than 4 percent of Earth’s water is freshwater, and only a fraction of it, just 0.5 percent, is accessible and safe for human consumption. Additionally, by 2028, water consumption by data centers is expected to reach approximately 33 billion gallons, filling nearly 50,000 Olympic-sized pools, according to Lawrence Berkeley National Laboratory.\n\nRead more:\n\nhttps://t.co/MHYVlaUupo", "url": "https://x.com/OwenGregorian/status/2110350895116423243", "lane": "produced_water_flaring_environment", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110385147367309373", "t": "2026-10-14T15:00:02+00:00", "views": 2407, "likes": 6, "reposts": 3, "handle": "RBNEnergy", "name": "RBN Energy (A Novi Labs Company)", "avatar": "", "followers": 11398, "text": "U.S. #LNG #feedgas demand moved higher last week as #Freeport and #CovePoint returned from maintenance and #GoldenPass intake hit a record over the weekend.  Read the full story here: https://t.co/7qlB6oYRga https://t.co/0p7UqXy2rj" FxkYGhwfH/2gAIAQEAAT8hp36sYkeb6SpM/ZW3eBGULls7TgZk7GskIAVBcG8bgeSUbYzV1L/WA4KI9ZQIawl04uj0WN0ozmc6pi9IyBouzNOql1Et76gDqK1Q8kMLGvgqeDKit/2UoQ5R4IaAyW2dftx7aVtgRuYfUSVcMPceYoV9CN6x9Ri3G3wwQtwXQtvyFtVVTKGXXqFB3ZTqUsWGg9o+I4ftL8VsNU6fdRFSZdG7KjCKfQuJgPRn/9oADAMBAAIAAwAAABDjCl6ZcyKP/8QAGxEAAwACAwAAAAAAAAAAAAAAAAERITGBkeH/2gAIAQMBAT8QWCMOmeS9GhVraIR8E3eW+yjWmmNeo//EABwRAQADAAIDAAAAAAAAAAAAAAEAESExQVGRsf/aAAgBAgEBPxAKUwz8im2Snwc7i18pjLHHqVBC5INTP//EACEQAQACAgMBAAIDAAAAAAAAAAERIQAxQVFhgXGxkaHR/9oACAEBAAE/EFrnc4bMRrEjyOUIgn9YpKYcSHrjBWKsLihG6Ywu0OlFKnoiYHWCjYzJ+WkZyWjn4jOxy7fuLoJqQoNtL4YJIlsCiL2t/wBYRMNMSiK7bxgCJDKuOM2Bnmx0E69wIcE31ebRF4zYrCA5oSTe+s3ycIMBaLPtuF9KNWhsd5wRwFZBFnjBDGJNZmLZ8MmYhBILKJYgXxh2N8TLL4SpMEOGq1B/CHRtjCcF1lhWI5wn61hSwPGkVlvPkQHwwpkGyR56x+4IuyIekhl5kOlg2M+BCOceZo2w9Yd5sMC9uFN6na8YbbcTlsFNf6whlUXJgn4knqcrGgwQFL8/WNA+Fp+kZGFsEc//2SAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg", "followers": 31145, "text": "\"Conflict of interest\" Interesting phrase, isn't it? 🤠\n\nEspecially when people are so QUICK to question everyone else's motives.\n\nOr perhaps the more interesting words are MONEY, BUSINESS, LOYALTY and REVENGE.\n\nWelcome to West Texas.\n\nIf you've watched Taylor Sheridan's LANDMAN, starring Billy Bob Thornton, you'll appreciate why I find the politics of the oil business, fascinating (and want nothing to do with it).\n\nIn smaller sized places like Midland, Texas, business relationships can span generations. Families know families. Competitors become partners. Partners become adversaries. And yesterday's commercial dispute can cast a long shadow over tomorrow's relationships. Reminds me the birthplace of Vendettas, ancient Greece (Crete and Mani).\n\nCrete has a deep-rooted vendetta tradition, although “birthplace” is more poetic than historically precise. Blood feuds arose in multiple societies, including Crete and Mani (located South of Sparta).\n\nThe distinctly Cretan mechanism was collective honour: an injury to one person could be treated as an injury to the entire family. Responsibility, and the OBLIGATION to retaliate, could then pass across generations, with families alternating between victim and perpetrator. Anthropological research on mountainous Crete documents precisely that pattern.\n\nNow, here's something worth examining.\n\nMeet the Slocums.\n\nIn February 2022, Texas news outlets reported that Tom Slocum Jr., then running for Texas Railroad Commissioner, was a cousin of John Harvey Slocum, who was running for Texas House District 14.\n\nInteresting family connection.\n\nNow consider the historical court records involving VON Directional Services and VON Energy Services.\n\nFederal litigation filed in April 2017 by Scientific Drilling International named both companies as defendants.\n\nThe docket subsequently recorded bankruptcy notices involving VON Directional in July 2018 and VON Energy in February 2019.\n\nAnother federal case identifies a John H. Slocum in litigation involving the VON businesses.\n\nThese are matters of public record.\n\nAnd then we have Tom Slocum, who has been particularly vocal in his criticism of Greg McCabe, a central figure in the Next Bridge Hydrocarbons and $MMTLP story.\n\nHere's where the conversation becomes educational.\n\nWhen evaluating someone's commentary about a business dispute, I believe there are three important questions:\n\n1. FOLLOW THE MONEY.\nWho stands to gain or lose financially from the outcome?\n\n2. FOLLOW THE RELATIONSHIPS.\nAre there previous business dealings, professional associations, family connections or financial interests that might provide useful context?\n\n3. FOLLOW THE HISTORY.\nHave the parties previously been involved in commercial disputes, litigation or failed ventures?\n\nThese questions do not presume wrongdoing.\n\nThey help distinguish independent analysis from commentary/trolls/opinions that might be influenced by interests the audience cannot see.\n\nAnd there's a fourth question that's sometimes overlooked:\n\nWHEN DOES A COMMERCIAL DISAGREEMENT BECOME PERSONAL?\n\nAnyone who has spent time building businesses knows that money and reputation can provoke powerful emotions.\n\nA failed deal can destroy a friendship. A lawsuit can leave lasting resentment. A bankruptcy can affect an entire network of business relationships.\n\nOccasionally, business disagreements can become personal vendettas, especially in smaller places like Sicily, Crete, Sparta, Midland Texas.\n\nThat doesn't establish that this has happened here. But it is precisely why understanding the historical relationships matters.\n\nSo, Tom, I have just a couple straightforward questions:\n\n1. Are there any historical business dealings, financial interests or personal relationships relevant to your criticism of Greg McCabe that shareholders should understand?\n\n2. Can we establish the complete history between the relevant businesses and individuals, rather than relying on selectively presented narratives? Specifically, is Mr J H Slocum your cousin (1st or other degree) by blood? Are you aware if G McCabe was one of the 99+ creditors that formed the committee to take Mr Slocum down? \n\nRemember, i am not passing judgement here, just want to understand where you are all coming from. \n\nIf the answer and the data reveals no \"conflict of interest\", excellent! I will be more than happy to take this post down and issue an apology when requested. \n\nTHE BIGGER LESSON FOR SHAREHOLDERS:\n\nDon't confuse opinions with credibility.\nDon't mistake confidence for independence.\n\nAnd never assume that the loudest person in the room is necessarily the one with the least at stake.\n\nInvestigate the incentives. Examine the documents. Understand the relationships.\n\nBecause sometimes the most important part of a story isn't what somebody is saying.\n\nIt's what they may have experienced LONG before they started saying it.\n\nAs for West Texas?\n\nThey've already made a television series about what happens when oil, money, family, POLITICS and business rivalries collide.\n\nIt's called LANDMAN.\n\nAnd sometimes the real business world has more complicated relationships than anything Hollywood could ever write. 🍿\n\nI'll leave just three public records and sources below (there is plenty more for those who want to look further).\n\n1.https://t.co/bSrflPd8zB\n\n2. KBTX reported during the 2022 Texas Railroad Commission Republican primary that “Tom Slocum, Jr.” was an engineering consultant and added that he was “the cousin of John Harvey Slocum,” who at the time was running for Texas House District 14. https://t.co/4FgkjoCSfd\n\n3. the bankruptcy chronology is quite specific. VON Directional Services filed a voluntary Chapter 11 petition on July 9, 2018 in the Southern District of Texas, case 18-33794. It was converted to Chapter 7 on September 25, 2018 after the unsecured creditors' committee sought appointment of a Chapter 11 trustee and the parties instead agreed to conversion. Public docket summaries show the case as an asset case and record its eventual termination in April 2025: https://t.co/KOGij8t2iv\n\n#MMTLP #MMAT #MarketIntegrity #BlueLedgerAI", "url": "https://x.com/palikaras/status/2110431332958711920", "lane": "industry_money_and_capture", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110449812705300957", "t": "2026-10-14T19:17:00+00:00", "views": 225442, "likes": 2122, "reposts": 401, "handle": "unusual_whales", "name": "unusual_whales", "avatar": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAPYElEQVRoQ9VYeXBc9X3/vfvt8XZXu9pdrW7Zki3JMsQ2mEvYDsSlIcQFXJIJxKFJKf2jTE2HlrTTtJkpPZLiYUKT5qCdpGmStjEmA6RQp9gQE8em2NguQvIhybbu1WpXex/v7vf7211ZkgVIoE6bz8zbt7vvd3zPz/f7e4xt2+RXGcxqKmBaFmfapsQQxhI4vrT4+f8GVkWBRD4d8UjO2Z9ffGvP8dj5veuUhhd2tl//tG7ozjpv7cji8auJFSsA41mGYazh+PhmjmVLEsun/rH/4KE17rqXS6a2aczK3NYjhb8ylp3ZmrHUtr1b7t3qcyjxxeusFlakgEVsloXwKKol+Zn+l1+bLWa7w7bzZxnJ/Bhr2GJQ8UtOVmBKheIR0y3smEjPRHt9HY9u69jyHMdy1uL1VgPs4j/eC6Aso5uG0Dc1tDOWTv  "t": "2026-10-14T21:25:30+00:00", "views": 3587, "likes": 158, "reposts": 22, "handle": "bofrench", "name": "Bo French", "avatar": "", "followers": 119523, "text": "FERC just opened more scoping on Gulf South's Texas Gateway: about 155 miles of pipe moving 1.8 Bcf/d from Carthage toward southeast Texas and southwest Louisiana, tying Permian, Eagle Ford, and Haynesville gas to LNG. Production without takeaway is stranded. I want the Railroad Commission saying yes to the molecules that fill these lines.", "url": "https://x.com/bofrench/status/2110482152135835667", "lane": "permits_pipelines_buildout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110483123389493729", "t": "2026-10-14T21:29:22+00:00", "views": 1732, "likes": 79, "reposts": 15, "handle": "DissLandman", "name": "Dissident Landman", "avatar": "", "followers": 2369, "text": "Texas, this is one of the most important races on the ballot.\n\nThe Texas Railroad Commission is the most powerful oil and gas regulatory agency in the nation.\n\nAllowing an anti-fossil fuel extremist at the helm of this agency would be catastrophic for the Texas economy and for U.S. national security. \n\nGO VOTE!", "url": "https://x.com/DissLandman/status/2110483123389493729", "lane": "energy_security_and_prices", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110503294997250412", "t": "2026-10-14T22:49:31+00:00", "views": 4898, "likes": 598, "reposts": 59, "handle": "bofrench", "name": "Bo French", "avatar": "", "followers": 119523, "text": "Want cheap power for your rig and cheap gas for your truck? That starts with producing more Texas oil and gas, not taxing it. That's my job on the Railroad Commission. Early voting starts Monday, Oct. 19.", "url": "https://x.com/bofrench/status/2110503294997250412", "lane": "energy_security_and_prices", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110512169905430709", "t": "2026-10-14T23:24:47+00:00", "views": 6865, "likes": 1098, "reposts": 139, "handle": "bofrench", "name": "Bo French", "avatar": "", "followers": 119523, "text": "SpaceX wants up to 456 Starship launches a year from Starbase, and the FAA opened the environmental review. The current cap is 25. South Texas is building the future. That takes power, fuel, and a Railroad Commission that backs American energy, not red tape. Early voting Monday.", "url": "https://x.com/bofrench/status/2110512169905430709", "lane": "permits_pipelines_buildout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110516388251210238", "t": "2026-10-14T23:41:33+00:00", "views": 3583, "likes": 184, "reposts": 20, "handle": "bofrench", "name": "Bo French", "avatar": "", "followers": 119523, "text": "Port of Galveston greenlit Power LNG on Pelican Island: production, storage, and fueling for ships. Plans start at about 200K gallons a day, with capacity to 400K and room to 800K. Texas Gulf Coast gas fuels ships and trade. I want a Railroad Commission that clears that path, not slows it.", "url": "https://x.com/bofrench/status/2110516388251210238", "lane": "permits_pipelines_buildout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110517680512045220", "t": "2026-10-14T23:46:41+00:00", "views": 4288, "likes": 235, "reposts": 25, "handle": "bofrench", "name": "Bo French", "avatar": "", "followers": 119523, "text": "Crescent agreed to pay Devon $4.2 billion for about 90,000 net acres in Karnes, DeWitt, and Gonzales Counties. Capital is still betting on the Eagle Ford. The Railroad Commission should keep South Texas the best place in the world to invest. Early voting starts Monday, Oct. 19.", "url": "https://x.com/bofrench/status/2110517680512045220", "lane": "permits_pipelines_buildout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110552066838167770", "t": "2026-10-15T02:03:19+00:00", "views": 30044, "likes": 4307, "reposts": 350, "handle": "bofrench", "name": "Bo French", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4g     const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
