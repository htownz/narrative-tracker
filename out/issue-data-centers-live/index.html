CAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAg", "followers": 1097088, "text": "\"At the end of 2024, Texas' grid operator had 63 GW of large new customers in its queue. By this June, that figure reached 474 GW, more than five times record peak demand.\"\n\n\"Then Texas hit pause.\"\n\n\"Developers routinely spam requests across several sites, and many are speculative builds with no customer yet.\"\n\n\"Planners can't tell which are real, and they don't want ratepayers covering upgrades built for projects that never show up.\"\n\n\"Fully connecting a large data center can take 5 to 10 years... Idle GPUs cost far more than the electricity to run them, so speed matters most... That's why developers are planning to bring their own power on site.\"\n\n\"Full reliability for these power islands is very, very hard, but some labs and hyperscalers have shown that, forced to choose between reliability and speed, they'll pick speed.\"\n\n\"Every site I'm aware of intends to connect to the grid as soon as it can, chiefly because on-site power almost always costs more.\"\n\n\"AI companies have pledged to pay their way, and most would rather connect to the grid than avoid it. It seems ideal for everyone that we let them do so instead of driving that spending into private islands.\"\n\n\"Texas created the energy fast lane first; now it has the opportunity to show us a better one, and I expect it will. Power is where America finds out whether it can still build.\"\n\na16z's @rmcentush on why Texas is making data centers wait: https://t.co/TobsqsZJq9", "url": "https://x.com/a16z/status/2107859784594767982", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107864598510465157", "t": "2026-10-07T16:04:17+00:00", "views": 3398, "likes": 13, "reposts": 10, "handle": "Newsweek", "name": "Newsweek", "avatar": "", "followers": 3407304, "text": "The Public Utility Commission of Texas says releasing data center location information could pose a national security risk. https://t.co/HeWGkytskl", "url": "https://x.com/Newsweek/status/2107864598510465157", "lane": "secrecy_oversight_failure", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107865249412243961", "t": "2026-10-07T16:06:52+00:00", "views": 1303, "likes": 36, "reposts": 10, "handle": "HopfJames", "name": "James Hopf", "avatar": "", "followers": 8300, "text": "Blue Energy is applying to get access to the Texas power grid.  Its plan is to power a TX data center with a hybrid power plant that will consist of 1.0 GW of gas generation and 1.5 GW of nuclear generation.  Article link in reply.\n\nThe 1.5 GW of nuclear will come from five BWR-300 SMRs.  The nuclear part isn't licensed yet, but the gas generators will be ready sooner.  Hence, the need to apply for grid access now, given that grid access in the US is in short supply.\n\nThe gas plants are expetced to start up in 2030 and 2031.  The first SMR is expected to start in 2033.", "url": "https://x.com/HopfJames/status/2107865249412243961", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107873596509208914", "t": "2026-10-07T16:40:02+00:00", "views": 322245, "likes": 572, "reposts": 92, "handle": "a16z", "name": "a16z", "avatar": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAADAAAAAwCAYAAABXAvmHAAAABGdBTUEAALGPC/xhBQAAAAFzUkdCAK7OHOkAAAAgY0hSTQAAeiYAAICEAAD6AAAAgOgAAHUwAADqYAAAOpgAABdwnLpRPAAADFFJREFUaEO9WQlwldUV/t6SnRASkxCyB0ggECKLUWRR0SpUreNCpVPF6lRsq1LakVZF2+nQDrZDLU5b61bGGWtFx72OC9VqXUFlMQiyhYQ1gFiUJdtL8tJzzr33/+9/33sodqb35/Lfe/Zz7rnn3v8ltKiqcQDUQtR5YN5uc+E852ZgZi6wAYKGQj4PzUM0d/lt3lS6XT0uLMzCWWGcleoxvwMdGi4sCsb0Ni2PTTfiPTzPDL+h1+MT6tYyXF5bd9ioUypNF/F+Z1pPGBBPoE/ShScZTMvWeNMUjXlcGb5eV3fYZ9IPGxkQZh4tUEfjpB6RaZ4U3Do4yfG+XhcbtpfeE6ANVW9r7gn7sm7JEz4Xb9PobswL8Fq0SWXICmjGBN+SzV1YqsemTcVj67Vp3LmBJX/8FTCMCVHRb5lb4wCP7rZBNt6F2TqS6Xb1enwujb0CrjAPZitW/yXy6MfMPfoUMKiWKCeFXo/PpaEVUIIMItXj0/QH6HwjlBy/KaxLa2Asx8an0p3IH5zzCgyowsRv9trDDDBMve 4423193", "lane": "secrecy_oversight_failure", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107895809006330035", "t": "2026-10-07T18:08:18+00:00", "views": 3824, "likes": 30, "reposts": 1, "handle": "HunterAllen4", "name": "THE GAP FATHER", "avatar": "", "followers": 21498, "text": "$HUT \n\nDon’t sleep. Don’t blink. $150 PT can come fast if this setup breaks the right way. 👀\n\nHut 8 is no longer simply a Bitcoin miner. The bigger story is becoming a power-first AI data-center infrastructure company locking up scarce power, building the infrastructure around it, and putting the highest-value compute workloads on top.\n\nQ2 2026 revenue hit $74.9M, up 81% YoY, with roughly $72.5M still coming from compute. \n\nBut the potential re-rating comes from what hasn’t fully hit revenue yet: 949 MW of contracted IT capacity and roughly $26.6B of base-term contract value across River Bend and Beacon Point.\n\nRiver Bend is a 245 MW Louisiana campus with roughly $7B of base-term value, while Beacon Point in Texas is a 1 GW campus with two 352 MW leases worth roughly $9.8B each. Management is pointing toward approximately $1.75B of average annual NOI once the current contracted portfolio is stabilized, with rents escalating around 3% annually.\n\nAnd then there’s the pipeline. Hut 8 has roughly 8.7 GW of additional development potential across 11 sites. \n\nConsensus has digital-infrastructure revenue moving from about $5M in 2026 → $239M in 2027 → ~$1.2B in 2028.\n\nThe timing is what makes this interesting. River Bend targets initial hall delivery in Q2 2027, while Beacon Point targets Q3 2027. Hut 8 also closed a roughly $1.07B parent revolver, while project-level financing is already supporting the major developments.\n\nMichael Ho’s 1.5M-share prepaid variable forward also wasn’t an open-market insider dump. He received roughly $58.3M upfront, with a $40 floor and $221 cap, while retaining ownership/voting rights until the May 2027 settlement. I wouldn’t call it bullish by itself, but I also wouldn’t treat it as some massive insider-confidence warning.\n\nTechnically, this is where things get fun. HUT has been compressing inside a large structure, with roughly $82–83 as an important area and $59–60 as the deeper shelf. \n\nIf HUT reclaims the upper trendline with volume, the previous $150–175 zone becomes very interesting. Lose the lower structure and those lower supports come back into play.\n\nThe risk is execution power delivery, construction timelines, financing, tenants and Bitcoin volatility. \n\nBut if River Bend and Beacon Point come online close to schedule, the market eventually has to value HUT on something much larger than Bitcoin mining.\n\n$150 doesn’t sound nearly as crazy to me as it would have a year ago.\n\nRip Salad pending.", "url": "https://x.com/HunterAllen4/status/2107895809006330035", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107903227618279471", "t": "2026-10-07T18:37:47+00:00", "views": 2968, "likes": 36, "reposts": 2, "handle": "crulge", "name": "Kill Tim Faust 💀", "avatar": "", "followers": 57399, "text": "interesting contrast in dem approaches to the data center issue between texas and wisconsin. hinojosa is  hitting abbott *hard* on his support; in WI, where the Dem supports continuing subsidies to fund data centers, the attacks are coming from the other direction", "url": "https://x.com/crulge/status/2107903227618279471", "lane": "paxton_vs_talarico_money", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107912202116325702", "t": "2026-10-07T19:13:26+00:00", "views": 3976, "likes": 21, "reposts": 8, "handle": "MilkRoadAI", "name": "Milk Road AI", "avatar": "", "followers": 49602, "text": "Texas just exposed the real AI bottleneck and it will  make already powered data centers dramatically more valuable.\n\nERCOT’s large load queue exploded from 63 GW to 474 GW in only 18 months, more than five times Texas’ record peak demand and around 90% of the requests involve data centers. But most of that capacity is not close to operating. Only 9.5 GW has been approved and roughly 4.3 GW is running. The rest includes duplicates, speculative applications and developers requesting power at multiple sites.\n\nTexas has paused new data center approvals while ERCOT audits the queue. The state wants to identify credible, financed projects before forcing customers to fund billions of dollars in grid upgrades for campuses that may never exist. This makes secured power more valuable than available land or announced capacity. A developer can own GPUs and property but still wait five to ten years for transmission lines, substations and grid approval.\n\nGalaxy Digital is one of the clearest beneficiaries. Its Helios campus already has more than 1.6 GW of ERCOT approved and utility-contracted power, placing it far ahead of speculative projects still waiting in the queue. $GLXY has already delivered 133 MW of critical IT capacity to CoreWeave under a 15 year lease. CoreWeave has committed to 526 MW across the first three phases, which Galaxy expects to produce more than $1 billion in average annual revenue.The company also has an additional 830 MW of approved Helios capacity available for future tenants and a Texas development pipeline exceeding 5.7 GW.\n\nApplied Digital, TeraWulf and Cipher Mining could benefit for similar reasons. Their former crypto infrastructure provides land, grid relationships and high-power facilities that can be converted into AI campuses faster than completely new developments. The second group of winners sells the equipment needed to solve the shortage. GE Vernova and Siemens Energy supply generation equipment, while Eaton, Schneider Electric, Hubbell and Quanta Services benefit from spending on switchgear, transformers, substations and transmission. Tesla and other storage providers benefit as batteries help stabilize volatile AI workloads.\n\nBullish on already powered data centers. If you want to see which names I’m investing in around the AI power bottleneck, check out my full Milk Road Pro portfolio below:  https://t.co/thIhK9ZH4E", "url": "https://x.com/MilkRoadAI/status/2107912202116325702", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107916947379585046", "t": "2026-10-07T19:32:18+00:00", "views": 1164, "likes": 11, "reposts": 3, "handle": "TexasScorecard", "name": "Texas Scorecard", "avatar": "", "followers": 80288, "text": "A group of data center developers, energy companies, and infrastructure firms have formed a new coalition to make their case for large-scale development in Texas, even as public opposition and state scrutiny grow. https://t.co/JXrrsfMEuc", "url": "https://x.com/TexasScorecard/status/2107916947379585046", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107920431454073344", "t": "2026-10-07T19:46:08+00:00", "views": 7907, "likes": 72, "reposts": 10, "handle": "rmcentush", "name": "Ryan McEntush", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9 AgICAgICAgICAgICAg", "followers": 21441, "text": "selected takes:\n\n- texas paused data center development for generally good reasons\n\n- some developers are behaving badly/not transparently; it's also a nightmare for grid operators\n\n- texas has a some ideas on how to accelerate interconnection\n\n- behind the meter is real and not going away, but every campus will eventually connect to the grid\n\n- lots of opportunity for OEMs, but worth being careful not to get caught in boom/bust cycle\n\n- flexibility help make existing infra more efficient, but we still need more wires/gen. near term, i'm bullish gas, solar, and batteries\n\n- it would be great to have AI companies pay for grid upgrades that we need anyway. generational opportunity to prepare for an abundant future without spreading costs across ratepayers or playing catch up later\n\n- everything about this is complicated and will take a broad consensus to truly unlock rapid deployment", "url": "https://x.com/rmcentush/status/2107920431454073344", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107935356502880267", "t": "2026-10-07T20:45:27+00:00", "views": 2149, "likes": 62, "reposts": 34, "handle": "IamtheGlitch_TX", "name": "JennMackforTexas", "avatar": "", "followers": 3548, "text": "Farmers & Ranchers in West Texas are Suffering\n\nThese Data Centers are affecting them most of all.\n\nDraining resources, affecting the lands and wildlife, etc.\n\nWhat people don't take in to account is that many farmers and ranchers don't really turn a profit.\n\nYet these Hyper-scale AI Data Centers are getting massive government tax abatements and state sales tax incentives but provide no economic yield.\n\nWhy not shift these incentives to the people that feed us? That provide real food to sustain everyday life.\n\nWhy are our hardworking farmers and ranchers facing bankruptcy year after year while these big tech giants get handouts?\n\nThis is wrong. This is why many city, residential rates went down by 40 bps.\"\n\n\"You should think about it as a power grid is a shared fixed cost base: poles, wires, substations. A large stable customer, like a data center, can help spread those costs across more units of electricity. Simply put, more demand across a shared system is a positive.\"\n\n\"Investment in shared infrastructure can also improve the economics for the households and businesses connected to it.\"\n\n\"There's real examples of that today. It's not just lip service.\"\n\nStill, 56% of Texas voters say more data centers would raise their power bills.\n\nThe catch is it depends on who pays. When developers cover their own grid upgrades instead of pushing them onto everyone else's bills, the savings are real.\n\na16z's @rmcentush on how to get that right: https://t.co/TobsqsZJq9\n\n@aleximm @DavidGeorge83 @sarahdingwang", "url": "https://x.com/a16z/status/2107954263767081092", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108111460685459697", "t": "2026-10-08T08:25:13+00:00", "views": 5509, "likes": 68, "reposts": 9, "handle": "perspez", "name": "Perspez", "avatar": "", "followers": 2486, "text": "$SLNH | Kati 2: A New $472M Construction Filing in Texas\n\nAn interesting development for Soluna's Project Kati 2.\n\nAccording to Rio Grande Valley Business Journal, a new filing was registered with the Texas Department of Licensing and Regulation on October 7, outlining a privately funded AI data center in Willacy County.\n\nThe reported figures are substantial:\n\n- $471.8 million in estimated construction costs\n- 471,884 sq. ft. of planned data center space\n- 112 MW of critical IT capacity\n- October 8, 2026 scheduled construction start\n- October 8, 2027 scheduled completion\n\nWhat stands out to me is how much more defined the physical development has become.\n\nSoluna and Metrobloks have spent much of 2026 advancing the campus design, negotiating with prospective tenants and developing the power infrastructure. We now have a reported state registration identifying the building footprint, estimated construction cost and a specific construction schedule.\n\nThe 112 MW critical IT figure is particularly interesting, providing another reference point for the scale of the first AI development phase.\n\nThis also follows Soluna's completion of the 83 MW Kati 1 facility and ERCOT's conditional Base Load classification for the full 166 MW Kati campus.\n\nThe registration itself is not a construction permit or confirmation of financing, and the scheduled start date does not establish that physical construction has begun.\n\nStill, I see this as another encouraging development. The project continues to take shape through increasingly concrete engineering and administrative milestones while the commercial process advances.\n\nFor us shareholders watching Kati 2 closely, this is meaningful progress ahead of the next major announcements.\n\nSource: Rio Grande Valley Business Journal, October 7, 2026.", "url": "https://x.com/perspez/status/2108111460685459697", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 2}, {"id": "2108138425467507061", "t": "2026-10-08T10:12:22+00:00", "views": 1242, "likes": 13, "reposts": 2, "handle": "Ziven_io", "name": "Ziven", "avatar": "", "followers": 3779, "text": ".@NUAI_IR Secured a $116M letter of credit from Macquarie Bank 💵 for the Texas Critical Data Center project, collateralized with $118.3M cash and 413,055 warrants, while shifting to a direct hyperscale tenant model over the prior joint venture plan. $NUAI https://t.co/oLBHXAlVGd", "url": "https://x.com/Ziven_io/status/2108138425467507061", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108177944384315824", "t": "2026-10-08T12:49:24+00:00", "views": 3333, "likes": 24, "reposts": 0, "handle": "AtlasShrug1", "name": "John Galt", "avatar": "", "followers": 8596, "text": "$NUAI\n\nWell, no Lease Agreement today.  Instead just got the LOC as well as ability to draw down tranches 2 & 3. \n\nThere is also some new language that I find interesting:\n\nThe company has begun pursuing leases with hyperscale tenants for its Texas Critical Data Center project (the “TCDC Project), rather than seeking to develop the TCDC project through a joint venture with a data center developer. The Company believes that its ownership of the TCDC Project site and the contracted power for Phase 1 under the PPA position it to negotiate leases directly with such prospective hyperscale tenants.\n\nPositives:  \n\nThey got the liquidity they needed from Macquarie, bulls will say ability to draw on term loans is sign of Macquarie’s faith in the project.  Also, it specifies “hyperscale tenants”, no mention of a neocloud, so unless they are blatantly lying here, the whole Anthropic thing is a no go.  \n\nNegatives:  \n\nNo signed lease.  Failure to deliver the goods on time for investors.\n\nThe language would indicate that they are no longer working with Stream, that that relationship is in fact over.  We don’t know why, however…\n\nWe can reasonably surmise from this that the initial hyperscale tenant they had in hand that  made them boot PDI and replace PDI with Stream is perhaps no longer in the mix.  That is very concerning to me.  I always viewed this as a “when”, not an “if”, and that is a very material change in circumstance, which is why this was listed under “Other Events” and got its own separate blurb in the 8-K.  This is further reinforced by the fact that they now say they have “BEGUN to negotiate”…what???!!!  The lease was supposed to be done.  The negotiation w/ the bird in the hand began several months ago, and now they are saying (my interpretation) that they are basically starting this up again from scratch.  \n\nAdditionally, not having an “execution partner” may or may not improve their economics in TCDC, but it most certainly meaningfully increases the risk of actually building this behemoth out.  \n\nThat is JG’s take on this.  I need to see where it trades to and how it trades and will then reassess if I find the current risk/reward as adjusted for this 8-K compelling or not.", "url": "https://x.com/AtlasShrug1/status/2108177944384315824", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108183040111550839", "t": "2026-10-08T13:09:39+00:00", "views": 1166, "likes": 14, "reposts": 3, "handle": "kratos_harmony", "name": "kratos.crazy.one 💙", "avatar": "", "followers": 24304, "text": "JUST IN: @SolunaHoldings | Kati 2: A New $472M Construction Filing in Texas\n\nCc: $SLNH $NBIS $CRWV $IREN $CIFR $KEEL $WULF $HUT $RIOT $ASST\n\n“An interesting development for Soluna's Project Kati 2.\n\nAccording to Rio Grande Valley Business Journal, a new filing was registered with the Texas Department of Licensing and Regulation on October 7, outlining a privately funded AI data center in Willacy County.\n\nThe reported figures are substantial:\n\n- $471.8 million in estimated construction costs\n- 471,884 sq. ft. of planned data center space\n- 112 MW of critical IT capacity\n- October 8, 2026 scheduled construction start\n- October 8, 2027 scheduled completion\n\nWhat stands out to me is how much more defined the physical development has become.\n\nSoluna and Metrobloks have spent much of 2026 advancing the campus design, negotiating with prospective tenants and developing the power infrastructure. We now have a reported state registration identifying the building footprint, estimated construction cost and a specific construction schedule.\n\nThe 112 MW critical IT figure is particularly interesting, providing another reference point for the scale of the first AI development phase.\n\nThis also follows Soluna's completion of the 83 MW Kati 1 facility and ERCOT's conditional Base Load classification for the full 166 MW Kati campus.“\n\nCc: @perspez", "url": "https://x.com/kratos_harmony/status/2108183040111550839", "lane": "ai_power_boom_opportunity", "copy_origin": "2108111460685459697", "in_dataset": 1, "copies": 0}, {"id": "2108190744896754166", "t": "2026-10-08T13:40:16+00:00", "views": 2097, "likes": 41, "reposts": 3, "handle": "davidclowery", "name": "David C Lowery", "avatar": "", "followers": 17584, "text": "I bet for most people the $1.99 tier of gmail gives them everything they need from AI. Most people aren’t coding software. Most people want some basic reminders, some control over their inbox and an occasional cake recipe. That’s it. Not sure that’s 450GW of data centers in Texas. I assume that is what this AI info op is about. Getting an IPO before the public figures it out.", "url": "https://x.com/davidclowery/status/2108190744896754166", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108225921312534661", "t": "2026-10-08T16:00:03+00:00", "views": 1158, "likes": 10, "reposts": 3, "handle": "ThisWeeknAI", "name": "This Week in AI", "avatar": "", "followers": 16465, "text": "The grid has room for far more AI data centers if they slow down, even just a few days a year.\n\nVarun Sivaram of Emerald AI joins Jason to discuss a London data center that powered down at halftime of a big soccer match, how China is adding power ten times faster than the US, and why even Texas has paused new data center hookups. PLUS, Vibhav Viswanathan of Pascal AI shows us how his software gives AI agents working for hedge funds an institutional memory.\n\n@jason @vsiv @EmeraldAI_ @pascalailabs\n\n0:00 Why data centers suddenly became unpopular\n2:46 Batteries vs. throttling GPUs vs. moving workloads\n4:11 Why utilities still pick up the phone\n4:52 The London teakettle test at football halftime\n5:56 Throttling AI workloads without users noticing\n10:40 How much spare room the grid really has\n13:32 The grand bargain, a fast pass onto the grid\n17:23 Why America can't out-build China on power\n20:39 Why off-grid and space data centers worry Varun\n27:37 Are state data center moratoriums performative?\n29:45 Pascal AI, AI agents for hedge funds and asset managers\n35:12 How Pascal differs from ChatGPT and Claude\n38:54 The proprietary data frontier models can't see\n42:20 Will AI replace hedge fund analysts?\n\n🎥 Watch the full episode here 👇", "url": "https://x.com/ThisWeeknAI/status/2108225921312534661", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108241024577662977", "t": "2026-10-08T17:00:04+00:00", "views": 203353, "likes": 465, "reposts": 49, "handle": "DeItaone", "name": "*Walter Bloomberg", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAbAAACAwEBAQAAAAAAAAAAAAAFBgMEBwIAAf/EABgBAAMBAQAAAAAAAAAAAAAAAAECBAMF/9oADAMBAAIQAxAAAAHJTkLOWvZzrOeSXLnw1L0OWx1TaLPq9I8cOdDVx622NhO0ALPanm7zQUA9BCQH/8QAIRAAAgICAQUBAQAAAAAAAAAAA fter the local SPCA pulled out, partnered on a $12.6 million skilled trades training facility, and handed over seven land parcels so power lines could be routed without eminent domain.\n\nThe company's campus now employs roughly 900 people across 10 data center buildings, a Schneider Electric manufacturing plant, and a training center — on top of thousands of construction workers over the past five years. Crosby told Fox News Digital that developers should be asking towns what they actually need: fire trucks, schools, baseball fields. The model is simple — if you want to build in a community, build for the community too.\n\nFull story here https://t.co/HFAf4QGRdz", "url": "https://x.com/foxnewspolitics/status/2108498727942115422", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108513303274152388", "t": "2026-10-09T11:02:00+00:00", "views": 1950, "likes": 84, "reposts": 41, "handle": "MQSullivan", "name": "Michael Quinn Sullivan 🇺🇸", "avatar": "", "followers": 93383, "text": "The @PUCTX wants to keep data center locations secret … and the Democrats’ candidate for the Railroad  Commission thinks Satanists and Wiccans should offer prayers in the TxLege.\n\nThose stories, plus the invisible James Talarico, in the 5/9/2026 edition of the TEXAS MINUTE. https://t.co/n8OiwFP7Dh", "url": "https://x.com/MQSullivan/status/2108513303274152388", "lane": "secrecy_oversight_failure", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108569325133349249", "t": "2026-10-09T14:44:37+00:00", "views": 1372, "likes": 13, "reposts": 1, "handle": "kratos_harmony", "name": "kratos.crazy.one 💙", "avatar": "", "followers": 24304, "text": "JUST IN: @SolunaHoldings | Kati 2: A 🆕 $472M Construction Filing in Texas 🇺🇸 \n\nCc: $SLNH $NBIS $CRWV $IREN $CIFR $KEEL $WULF $HUT $RIOT $ASST\n\nDevelopment for Soluna's Project Kati 2.\n\n“According to Rio Grande Valley Business Journal, a new filing was registered with the Texas Department of Licensing and Regulation on October 7, outlining a privately funded AI data center in Willacy County.\n\nThe reported figures are substantial:\n\n- $471.8 million in estimated construction costs\n- 471,884 sq. ft. of planned data center space\n- 112 MW of critical IT capacity\n- October 8, 2026 scheduled construction start\n- October 8, 2027 scheduled completion\n\nWhat stands out to me is how much more defined the physical development has become.\n\nSoluna and Metrobloks have spent much of 2026 advancing the campus design, negotiating with prospective tenants and developing the power infrastructure. We now have a reported state registration identifying the building footprint, estimated construction cost and a specific construction schedule.\n\nThe 112 MW critical IT figure is particularly interesting, providing another reference point for the scale of the first AI development phase.\n\nThis also follows Soluna's completion of the 83 MW Kati 1 facility and ERCOT's conditional Base Load classification for the full 166 MW Kati campus.“\n\nCc: @perspez", "url": "https://x.com/kratos_harmony/status/2108569325133349249", "lane": "ai_power_boom_opportunity", "copy_origin": "2108111460685459697", "in_dataset": 1, "copies": 0}, {"id": "2108595520008802772", "t": "2026-10-09T16:28:42+00:00", "views": 2510, "likes": 14, "reposts": 5, "handle": "KatusaResearch", "name": "Katusa Research", "avatar": "", "followers": 52514, "text": "Paper Gigawatts\n\nBook a restaurant for Saturday and you have a reservation.\n\nIf the place is popular, you book a second one down the street. \n\nNeither booking costs you a cent, and both kitchens are buying fish for you on Friday.\n\nA demand forecast is a stack of reservations added up by someone who never checks who showed up.\n\nThe power models take reservations from the same kind of customer, and this booking is free too.\n\nA data center developer files an interconnection request with a utility. \n\nBecause the request costs nothing.\n\nTe developer files several, in several states, and waits to see which grid answers first.\n\nTexas publishes the most honest count. \n\n▪️ At the end of 2024, its grid operator had 63 gigawatts of large-load requests in the queue. \n\n▪️ By June of this year, it had 474, and about nine in ten of those came from data centers.\n\nThe most power Texas has ever used in a single hour, set on July 22, was 91 GW.\n\nOf that 474, the operator had cleared 9.5 GW to connect, and in July it could see 4.4 GW actually drawing power.\n\nCase in point:\n\nTexas has over a hundred GW on paper for every one that is drawing power. \n\nThose are Paper Gigawatts.", "url": "https://x.com/KatusaResearch/status/2108595520008802772", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108596522505937070", "t": "2026-10-09T16:32:41+00:00", "views": 1037, "likes": 13, "reposts": 5, "handle": "TexasScorecard", "name": "Texas Scorecard", "avatar": "", "followers": 80288, "text": "In an effort to block the release of records indicating the location of data centers, the Texas Public Utility Commission is suing Attorney General Ken Paxton’s office. https://t.co/pWsn8OSPnz", "url": "https://x.com/TexasScorecard/status/2108596522505937070", "lane": "secrecy_oversight_failure", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108612309811666997", "t": "2026-10-09T17:35:25+00:00", "views": 1762, "likes": 18, "reposts": 2, "handle": "GoodRanchers", "name": "Good Ranchers", "avatar": "", "followers": 53168, "text": "1/15 A Texas rancher found out in April that a $700 million data center was going up less than five miles from land his family has farmed since the 1870s. He’s spent the months since trying to figure out whether his cattle can live next to it.", "url": "https://x.com/GoodRanchers/status/2108612309811666997", "lane": "rural_water_land_costs", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108631198729990487", "t": "2026-10-09T18:50:28+00:00", PboowVnJ9TY1TOd58QRjQ+rqGYKpXRn0iyLCB/F6f//aAAwDAQACAAMAAAAQp7+lUhIVE//EACARAQABBAICAwAAAAAAAAAAAAERACExQVGhcYFhsfD/2gAIAQMBAT8QQnLgOX9mprAcYds91N5CB977pWUrF4hH7nxUwtJtWvHxdNYTKUuA5vhYtaaC8NHXALm9r7dar//EABwRAQEBAAEFAAAAAAAAAAAAAAERAEEQITGB8P/aAAgBAgEBPxCI+92NtwE8YIPJML4YgyfTNAQOiGYR3//EACAQAQEAAgIDAAMBAAAAAAAAAAERACExQVFhcRCBkbH/2gAIAQEAAT8QwagFVYGIyw1yD+8PG6iCnuOFSJwjp/Ahjql8H+/ow8Mki/WaQSJIFmkhiWJc5wB9kRwS51kfCIcLTc66xtCxTnXEwVmBeNnmR8JMdcRE2mxrF4B45y64zuYBQAMVEtPrrNroRsnneV+byg0KGWjcd3vDAnHVjZqbGiKnjO/WBhpGTwDt5mIy15Zla/V7N1EAdT5mhHmlA0eartx+YRIbE9N10Pb/ADBxpAKABD23/uN/hmZ8BF5GDyd4V3ZHEUnmH5iSyx0B6TUcJyP4/9kgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=", "followers": 7521, "text": "I sold my $NVDA.\n\nHere's where the money went:\n\n1/7 $VST: nuclear and gas power in Texas, right in the middle of the data center boom. https://t.co/GVRgb8SY2R", "url": "https://x.com/marco__reed/status/2108644607143616947", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 2}, {"id": "2108658720209268940", "t": "2026-10-09T20:39:50+00:00", "views": 2410, "likes": 24, "reposts": 0, "handle": "mathburn666", "name": "MB 🦇🔊", "avatar": "", "followers": 4137, "text": "Here is a $GLXY breakdown for 2026 so far based on what I remember\n\nThe good:\n\n- 830MW of approved power by ERCOT in Q1 for Helios II\n- Helios I Phase I was delivered on time, on budget to $CRWV during Q2\n- Acquired additional sites, bringing their total power pipeline to 5.7 GW (1.6GW approved)\n- operating business reached break-even on adjusted basis (digital assets gross profit rose 34% quarter over quarter even though industry trading volumes fell)\n- $3.5B senior note secured. Some say interest rate was high, but that is mostly because of $CRWV imo. Today that rate looks good\n- BNY partnership agreement (bottom line impact still unknown)\n- Good VC investments (etched in particular, should show up in Q3)\n\nThe bad: \n\n- no tenant for Helios II announced by end of summer (but power still exists)\n- ERCOT putting a hold on data centers in Texas\n- Caspian not getting base load as expected\n\nPlease comment on anything significant I am missing", "url": "https://x.com/mathburn666/status/2108658720209268940", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108674108573516114", "t": "2026-10-09T21:40:59+00:00", "views": 2854, "likes": 45, "reposts": 4, "handle": "perspez", "name": "Perspez", "avatar": "", "followers": 2489, "text": "$SLNH | Dorothy 3 Takes Shape: A 300 MW AI Campus Built Around Flexibility and Available Power\n\nSoluna recently published photos on LinkedIn from its Open House in Silverton, Texas, where the company introduced Project Dorothy 3 to the local community.\n\nOne of the presentation boards caught my attention. It shows a more detailed development plan for Dorothy 3 than what I've seen in the company's earlier public materials.\n\nThe proposed 300 MW AI campus is divided into three phases:\n\n- Phase 1: 75 MW\n- Phase 2: 75 MW\n- Phase 3: 150 MW\n\nThe board also appears to contain information about expected completion, although the relevant details are obscured in the photograph.\n\nThe significance here isn't simply the 300 MW figure, which Soluna has discussed for some time. It's how the company appears to be planning its development.\n\nAn interesting shift in AI infrastructure demand\n\nTwo reports from September make this particularly relevant.\n\nOn September 18, CNBC reported that OpenAI and Anthropic were exploring smaller data center deployments of approximately 20–30 MW, alongside their existing commitments to much larger AI campuses.\n\nA day earlier, The Wall Street Journal reported that Crusoe, the developer behind OpenAI's massive Abilene data center, was expanding into smaller, factory-built modular facilities that can be transported to locations with available electricity.\n\nCrusoe's strategy reflects growing demand for faster capacity delivery, particularly as AI inference expands. Large training campuses remain essential, but not every computing workload requires a facility with hundreds of megawatts available from day one.\n\nThat distinction matters for Dorothy 3.\n\nAn initial 75 MW phase could allow Soluna to match construction and capital requirements more closely to contracted demand, bring capacity online in stages and expand as additional power becomes available.\n\nThis isn't confirmation that Dorothy 3 will use Crusoe-style prefabricated modules. However, its proposed phase structure is consistent with the industry's increasing emphasis on flexible capacity deployment.\n\nDorothy 3 already has an important foundation\n\nUnlike developers starting with undeveloped land and no nearby generating assets, Soluna has spent much of 2026 consolidating its position around Dorothy.\n\nThe company now owns the adjacent 150 MW Briscoe Wind Farm, has consolidated ownership of Dorothy 1 and completed the purchase of 397 acres for Dorothy 3.\n\nThe Briscoe substation sits directly across from the newly acquired property, providing an important starting point for the planned behind-the-meter development.\n\nSoluna also has approximately 98 MW of existing operating infrastructure at Dorothy 1 and 2.\n\nIn September, ERCOT conditionally classified 100 MW at the existing Dorothy campus as Base Load under Batch Zero, while a separate 50 MW interconnection request remained under study. This does not constitute approval for Dorothy 3's new phases, but it highlights the value of developing alongside an established, energized campus.\n\nThere is also an important distinction between Soluna's approach and a conventional wind-only data center.\n\nThe company's strategy involves combining renewable generation with grid access and additional power resources. Soluna has discussed evaluating onsite gas generation and clustering nearby energy assets to support larger AI campuses.\n\nThat combination could be especially valuable for a phased project where power requirements increase as new data halls are developed.\n\nThe Open House photographs reveal more than the capacity plan\n\nAnother presentation board addresses the project's expected noise and nearby residences.\n\nThe material appears to reference approximately 55 dB at the facility fence, along with a map identifying one residence about 1.5 miles northeast and three residences at least 1.8 miles west of the site.", "url": "https://x.com/perspez/status/2108674108573516114", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108679649379094956", "t": "2026-10-09T22:03:00+00:00", "views": 5465, "likes": 122, "reposts": 119, "handle": "NancyH_60", "name": "NancyH", "avatar": "", "followers": 92357, "text": "Willie Nelson endorsed James Talarico for U.S. Senate today. 🎸 In a video given to the Houston Chronicle, he said he has gotten to know Talarico, called him a good man, and asked Texans to vote for him. The endorsement is tied to a new “Rural Texans for Talarico” push on data centers, rural health workers, and internet access. The two already shared a stage at Nelson’s Fourth of July Picnic in Austin.\nTalarico is the Democratic state representative in that race, a former middle school teacher and Presbyterian seminarian. Nelson is 93, lives on the road, and has backed Democrats for years. A country legend on a picnic stage is not the same thing as a voter in a farm county who has to live with the result. 🤠\nThis clip is commentary, not a poll. 🚫 The sign, the wrong exit, and the man in the hat are the point: an Austin endorsement does not speak for the rest of the state. Texas voters still pick the senator. A guitar and a bandana do not cast a ballot, and neither does a picnic photo. 🗳️ Name on the ballot is James Talarico.", "url": "https://x.com/NancyH_60/status/2108679649379094956", "lane": "paxton_vs_talarico_money", "copy_o ft, SpaceX, Meta, Amazon, Google.\n➡️ Who gets hosed: the smaller neoclouds that still need financing to build.\n✅ BofA's read: the money sorts, it doesn't stop.\n😇 Zero chance of a federal pause.\n🚨 The risk: this isn't settled on election night. The Texas grid audit lands Dec 10 and the final answer is a 2027 story. If real projects get cut, the build slows.\n➡️ Bottom line: the pause squeezes the little guys and hands the giants pricing power.", "url": "https://x.com/realMeetKevin/status/2108988433519743010", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108995982872494398", "t": "2026-10-10T19:00:00+00:00", "views": 6248, "likes": 18, "reposts": 5, "handle": "WillCainShow", "name": "The Will Cain Show", "avatar": "", "followers": 72451, "text": "Gov. Greg Abbott explains why Texas hit pause on new data centers\n\nGov. @GregAbbott_TX says Texas is temporarily pausing the permitting process for new data centers while the state evaluates their impact on the electric grid and water supply.\n\nAbbott says future projects must meet new \"guardrails,\" including lowering electricity costs, avoiding added strain on the grid, protecting water resources, and minimizing impacts on rural communities.", "url": "https://x.com/WillCainShow/status/2108995982872494398", "lane": "grid_queue_speculation", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109004697906335961", "t": "2026-10-10T19:34:38+00:00", "views": 13137, "likes": 265, "reposts": 15, "handle": "mattforney", "name": "Matt Forney", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACb fBpjAHgD5nf1COQA6tvb/cxX5jgTfmYQiUF+CWqiW85/Iy4JV6SpvDP/9kgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=", "followers": 46346, "text": "Who cares about his position on something he has no ability to control?\n\nYou might as well be asking his position on mining green cheese from the moon.", "url": "https://x.com/mattforney/status/2109004697906335961", "lane": "pushback", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2109021168233750969", "t": "2026-10-10T20:40:04+00:00", "views": 5289, "likes": 311, "reposts": 189, "handle": "jacobwlong87", "name": "Jacob Long", "avatar": "", "followers": 7957, "text": "This is revisionist history because he knows he’s losing rural voters.\n\nAbbott accepted $22.5 million in campaign cash from the data center industry and welcomed them to Texas with massive tax breaks that now cost the state $1 billion a year.\n\nNo flip flop changes that record. https://t.co/8wOv58EPah", "url": "https://x.com/jacobwlong87/status/2109021168233750969", "lane": "abbott_donor_sellout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109057033571893425", "t": "2026-10-10T23:02:35+00:00", "views": 2696, "likes": 36, "reposts": 2, "handle": "Colosteve2000", "name": "Steven Martin", "avatar": "", "followers": 1054, "text": "$CIFR 𝗥𝗘𝗦𝗘𝗔𝗥𝗖𝗛\n𝗢𝗖𝗧𝗢𝗕𝗘𝗥 𝟭𝟬, 𝟮𝟬𝟮𝟲\n𝗠𝗬 𝗥𝗘𝗔𝗗\n\nCipher has 700 gross MW under HPC leases, but management said 477 gross MW is available to lease today: Odessa 207 MW, Reveille 70 MW, and Ulysses 200 MW.\n\nThat is the next demand test. Odessa is still mining Bitcoin and in conversion talks. Reveille and Ulysses have approved interconnections and are targeted for 2027. All figures here are gross MW, not critical IT load.\n\n𝗖𝗔𝗧𝗔𝗟𝗬𝗦𝗧𝗦 𝗜𝗡 𝗧𝗛𝗘 𝗟𝗔𝗦𝗧 𝟭𝟬 𝗗𝗔𝗬𝗦\n\nCipher appeared at the KBW Virtual AI Summit on October 6. No announcements made.\n\nA Bitfury 13D/A filed October 7 disclosed a 1.84 million share transfer to a dealer on October 5 under a previously arranged forward contract. That could add share supply, but it was not an open market sale.\n\nMorgan Stanley lowered its target to $51.50 from $54 on October 9 and kept an Overweight rating.\n\n𝗣𝗥𝗜𝗖𝗘 𝗔𝗖𝗧𝗜𝗢𝗡\n\nCIFR closed at $13.50 on October 8, down 7.28% on 57.35 million shares. It closed at $13.52 on October 9, up 0.15%. From the October 1 close of $15.46, shares were down about 12.6% through October 9.\n\nThursday’s decline came as other data center stocks fell and Treasury yields rose. Higher borrowing costs matter to companies that need large amounts of capital to build.\n\n𝗣𝗢𝗪𝗘𝗥 𝗔𝗡𝗗 𝗔𝗣𝗣𝗥𝗢𝗩𝗔𝗟𝗦\n\nCipher’s 907 gross MW of operating and contracted capacity includes 207 MW of Bitcoin mining and 700 MW under HPC leases. The additional 477 MW management described as available to lease overlaps with capacity in that broader portfolio.\n\nAnother 3.2 GW has conditional ERCOT classifications: 1.1 GW Base Load and 2.1 GW Studied Load. Of the studied load, 1.6 GW at Mikeska, Apollo, and Stingray Phase II has PCLR status, which may allow earlier operation subject to ERCOT requirements and curtailment.\n\nThe eligibility verification report is due December 10, with final inclusion or exclusion expected in December. \n\nStudied Load still needs system study and capacity allocation. Please keep in mind these are not guarentee's of approval.\n\n𝗕𝗔𝗥𝗕𝗘𝗥 𝗟𝗔𝗞𝗘\n\nThe September 25 agreement keeps the existing Fluidstack term at 10 years and adds a binding commitment from an unnamed AI lab to enter a separate 10-year lease afterward.\n\nCipher says this takes expected contracted revenue from about $3.8 billion to more than $9 billion. It adds no MW. Data halls are scheduled for delivery from Q4 2026 through Q1 2027, with rent starting as each hall becomes operational.\n\nSources: Cipher Q2 earnings call and business update, August 4; Cipher KBW Summit, October 6; Bitfury Schedule 13D/A, October 7; Cipher ERCOT update and ERCOT Batch Zero report; Barber Lake amendment, September 25; CIFR historical prices; Morgan Stanley target update, October 9.", "url": "https://x.com/Colosteve2000/status/2109057033571893425", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109275324491964426", "t": "2026-10-11T13:30:00+00:00", "views": 1726, "likes": 47, "reposts": 28, "handle": "IamtheGlitch_TX", "name": "JennMackforTexas", "avatar": "", "followers": 3548, "text": "I Speak About the Data Center Crisis\n\n\"It's about economic growth!\"\n\nWhat value are they providing for the economy?\n\nData Centers hold between $1.3-$1.6 trillion in debt for the US.\n\nBut what recurring value do they put out the recoups that investment to avoid it being passed on to the American/Texan taxpayer?\n\nThis is not sustainable and We The People do not have to stand for it.\n\nSo stand for your rights, your Republic, and your free will.\n\nVote for Jenn Mack via Write-In on November 3rd for Governor of Texas.\n\nA Constitutional Independent not beholden to either establishment who will break the Uniparty control of our Great Republic.\n\n#texas #democrat #republican #txlege #jennmack", "url": "https://x.com/IamtheGlitch_TX/status/2109275324491964426", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 2}, {"id": "2109276437551149117", "t": "2026-10-11T13:34:25+00:00", "views": 298, "likes": 17, "reposts": 11, "handle": "DerekAyala1987", "name": "Derek Ayala", "avatar": "", "followers": 9252, "text": "\"Data Centers hold between $1.3-$1.6 trillion in debt for the US.  \n\nBut what recurring value do they put out the recoups that investment to avoid it being passed on to the American/Texan taxpayer?  \n\nThis is not sustainable and We The People do not have to stand for it.\"\n\nJenn Mack for Texas!\n#JennMack", "url": "https://x.com/DerekAyala1987/status/2109276437551149117", "lane": "pushback", "copy_origin": "2109275324491964426", "in_dataset": 1, "copies": 0}, {"id": "2109281989056475459", "t": "2026-10-11T13:56:29+00:00", "views": 1385, "likes": 11, "reposts": 2, "handle": "l_m_s15", "name": "Lukas Spang", "avatar": "", "followers": 3899, "text": "More pieces of the puzzle are falling into place around 2G Energys US data-center business.\n\nAt its Capital Markets Day, 2G Energy disclosed 675 MW of data-center orders across Ohio, Texas and New Mexico:\n\n• 50 MW in Ohio\n• 350 MW across three projects in Texas\n• 275 MW in New Mexico for Energy Vault\n\nManagement also stated that the first units for the 50 MW Ohio project were already being shipped.\n\nOur research strongly suggests that this Ohio order is linked to PowerConneX’s large behind-the-meter power project in Ashville, Pickaway County.\n\nThe evidence:\n1️⃣ PowerConneX’s public project filings list 26 mtu 20V4000 gas engines with a combined capacity of 65 MW.\n2️⃣ 2G’s avus 2000e is based on the same mtu 20V4000 engine family and delivers approximately 2.5 MW per unit.\n3️⃣ 2G disclosed a 50 MW order in Ohio—equivalent to exactly 20 × 2.5 MW units.\n4️⃣ Most importantly, 2G is recruiting dedicated service technicians in Ashville, Ohio. Similar job postings have appeared for Fort Stockton and Cedar Creek, Texas—the other locations corresponding to 2G’s disclosed US data-center pipeline.\n\nTaken together, the evidence strongly indicates that 2G is supplying the first 50 MW engine tranche for PowerConneX’s Ashville project.\n\nThe difference between the 20 engines implied by 2G’s disclosed order and the 26 engines included in the permit is also interesting. The additional six units could represent redundancy, future expansion or optional capacity. However, there is currently no public evidence that all 26 units have already been ordered from 2G.\n\nThe wider Ashville energy center is designed at an entirely different scale: alongside the 65 MW of mtu engines, the filings include 424 MW of Wärtsilä reciprocating engines and approximately 465 MW of GE LM6000 gas turbines. The project is therefore a major hybrid on-site power platform rather than a small backup-power installation.\n\nPowerConneX is closely linked to EdgeConneX, the global data-center operator backed and majority-owned by EQT Infrastructure. Sixth Street also holds a minority stake.\n\nThat matters. EQT is one of the world’s largest infrastructure investors, giving the project a financially powerful sponsor with the ability to finance and replicate multi-hundred-megawatt data-center developments globally.\n\nFor 2G, Ashville could therefore be far more important than the initial 50 MW order suggests:\n• a major US reference project\n• proof that 2.5 MW gas engines can complement much larger Wärtsilä engines and GE turbines\n• long-term service revenue starting with commissioning\n• potential expansion from 20 to 26 units\n• follow-on opportunities across EdgeConneX’s global data-center platform\n\nThe project also validates the broader investment case: data-center developers are no longer waiting several years for grid connections. They are building their own modular power infrastructure—and reciprocating gas engines are becoming a core part of these behind-the-meter systems.\n\nThis is exactly why 2G Energy is the largest position in our fund.\n\n...\n\nDisclosure: 2G Energy is held in the Tigris Small & Micro Cap Growth Fund. No guarantee of completeness or accuracy. This is not investment advice.", "url": "https://x.com/l_m_s15/status/2109281989056475459", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109300448867864662", "t": "2026-10-11T15:09:50+00:00", "views": 237, "likes": 10, "reposts": 7, "handle": "cptxorg", "name": "Constitution Party Texas", "avatar": "", "followers": 343, "text": "“Data Centers hold between $1.3-$1.6 trillion in debt for the US.\n\nBut what recurring value do they put out the recoups that investment to avoid it being passed on to the American/Texan taxpayer?\n\nThis is not sustainable and We The People do not have to stand for it.\n\nSo stand for your rights, your Republic, rning Americans against data centers; the post got 3.2m views, the bots none. X said the bot farm comprised some 200,000 accounts, 200 (one in a thousand) of which had posted about American AI and energy policy. It was \"a massive story\", said Ted Cruz, the Texas senator. \"China could not be happier with this anti Data Center movement\", posted President Donald Trump.\n\nThe post, however, did not name the accounts or say how many people had seen their posts. So Darren Linvill, who co-directs Clemson University's Media Forensics Hub, consulted an archive his lab keeps of suspended X accounts. He found at least 59 of the 200. They had made 90 posts, all in the span of a few days in January, two or three per account before suspension, and they received no engagement at all. \"No real humans saw these posts about data centers,\" said Linvill, calling it a \"non-story\". OpenAI had already reported the same small campaign, in June. Mr Linvill does not downplay the Chinese threat. \"China runs robust influence operations,\" he said. But \"Chinese bots try to suppress narratives, not promote them\".\n\nIf Mr Linvill's lab had not kept the archive, X's announcement would have been the only word on the matter. Almost everyone else that used to keep an eye on this stuff has stopped. Meta discontinued CrowdTangle, a research tool, in 2024; X ended free access for researchers in 2023. The State Department office that monitored foreign propaganda was allowed to lapse on December 23rd, 2024, and Secretary of State Marco Rubio closed its replacement on April 16th, 2025, saying it cost \"more than $50 million a year\". The FBI dismantled a task force on foreign influence. Tulsi Gabbard, director of national intelligence, abolished the Foreign Malign Influence Center, along with more than 40% of her staff.\n\nIn an article in Foreign Affairs on October 5th, Renée DiResta and Josh Goldstein argued that Washington is cutting out its own ability to monitor propaganda just as the advent of AI is making propaganda substantially cheaper. Leaked 2026 plans show that the Social Design Agency, a Kremlin propaganda contractor, is building a copy of German Wikipedia of over 200,000 pages, in part so that AIs will learn from it, and repeat their version of history.\n\nImages (cropped and graded): Tillman Hall — Indies1, CC BY 4.0; Renée DiResta — Knight Foundation, CC BY-SA 2.0; Kremlin — Юрий Д.К., CC BY 4.0 (Wikimedia Commons).", "url": "https://x.com/szuchans/status/2109358377939948005", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109371199814021392", "t": "2026-10-11T19:50:58+00:00", "views": 8726, "likes": 69, "reposts": 3, "handle": "patientinvestor", "name": "Patient Investor", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAbAAACAgMBAAAAAAAAAAAAAAAEBQECAwYHAP/EABkBAQEBAAMAAAAAAAAAAAAAAAIDBAABBf/aAAwDAQACE Mt390ZABoiv/EAB8RAAIBAwUBAAAAAAAAAAAAAAERACFRYRAxcYGxof/aAAgBAgEBPxAgDO0MEGwqVXzSpdVtsU8NdqJhITIAfDU25KLLpxcdH4oQCEYxCYp5DDITmf/EACEQAQEAAQQCAgMAAAAAAAAAAAERACFBUWExgRAgMJGh/9oACAEBAAE/EPut24gnBuFKjHpWHRwDPSLVm+n0Qos5NcJ2GK80wRAQmIr5vXnCo0K2ydqoF3Ex4kfkagetT18sIU1CwJuFRnWKqksQjQPNFPeJWBuaneolM20xEC1fdH+DP2+VEXUA9mW4WreubqHsx0TVEryswslwJjhQs/B//9kgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA=", "followers": 7901, "text": "In 2024, the West zone in #ERCOT experienced a total curtailment of 5.3 TWh of renewable energy \n\nThat's power already generated, then thrown away because the grid couldn't move it.\n\nBuilding compute at the source changes the math. Producers earn revenue on power they'd otherwise lose. AI workloads get power faster. Ratepayers carry less of the cost of new transmission.\n\nThis isn't a sustainability story. It's grid economics.\n\nIt's the model behind Project Dorothy, our data center co-located with a 150 MW wind farm in West Texas.\n\n$SLNH", "url": "https://x.com/SolunaHoldings/status/2109978034480566620", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110007746879991930", "t": "2026-10-13T14:00:23+00:00", "views": 2026, "likes": 20, "reposts": 12, "handle": "MarcGravely", "name": "Marc Gravely", "avatar": "", "followers": 16414, "text": "59 American data centers now plan to build their own power plants.\n\nAbout 90 gigawatts' worth, led by Texas. Roughly 2 of those gigawatts are running today.\n\nThe numbers come from Cleanview, which tracks the projects. Together they make up more than a quarter of all planned data center capacity in the country. More than nine in ten were announced since the start of 2025. The Texas lead is built on Permian Basin gas.\n\nThe reason is the wait. Cleanview puts the time to connect a data center to the grid at as long as seven years. An AI company cannot wait seven years, so it builds a power plant of its own and connects to the grid later, or never.\n\nMost of it runs on gas. In an earlier count, about three-quarters of the generating equipment Cleanview could identify was natural gas.\n\nBut announced is a press release. Energized is a construction project.\n\nIn April, Oracle's Project Jupiter campus in New Mexico swapped its planned gas turbines and diesel generators for up to 2.45 gigawatts of fuel cells. Cleanview now says the project is likely to miss its target of coming online in 2027.\n\nSomewhere between 90 gigawatts announced and 2 running sit the contracts, the turbines on back order, the permits and the pipelines. When a project stalls between announced and energized, the first question is who was responsible for which of those.\n\nA technology company that builds its own power plant has become a power company, with a power company's construction risk.", "url": "https://x.com/MarcGravely/status/2110007746879991930", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110013608625394138", "t": "2026-10-13T14:23:41+00:00", "views": 37862, "likes": 4998, "reposts": 1099, "handle": "SholdonDaniels", "name": "Sholdon Daniels", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZg ool data centers without draining freshwater | Muskanbhatia, Interesting Engineering\n\nCan waste water from the oil and energy industry quench the thirst of data centers? Researchers at The University of Texas in Austin are betting it can.\n\nThey suggest that established desalination technologies could allow data centers to use salty or contaminated water to meet their cooling needs, reducing their reliance on freshwater.\n\nAlthough there are various ways to separate salt from water, researchers said reverse osmosis, which uses pressure to push water through a semipermeable membrane, is more energy-efficient. However, the technology has one drawback: it struggles to treat water saltier than seawater.\n\nHeating water into vapor and then condensing it back into freshwater is another viable solution, but this method requires more energy.\n\nTurning wastewater into coolant\n\nAccording to the Environmental and Energy Study Institute, large data centers can consume up to 5 million gallons of water per day. The waste water generated by certain oil fields in Texas is over thousand fold higher than this amount.\n\nData centers can become more efficient in their water usage if they reduce stress on local water resources without drastically increasing costs or overall energy demand, according to a recently published study in Water Research.\n\n“We’re not waiting for a futuristic technology to come along and solve this problem for us,” said Vaibhav Bahadur, who is a professor at the University’s Cockrell School of Engineering’s Walker Department of Mechanical Engineering and is one of the leaders of the research.\n\nBahudur noted that though the desalinations methods are available but they incur a cost. These costs, however, will be a small fraction of a data center’s total energy footprint when compared even with the most energy-intensive water treatment.\n\nTexas oilfields offer alternatives\n\nHe proposed turning attention to the Permian Basin. This geological region in West Texas generates approximately 8 billion gallons of produced water per day during oil and gas extraction.\n\nThe researcher said this water could be put to better use instead of being transported elsewhere for disposal, where it could pose long-term risks.\n\n“The Permian (Basin) puts out 1,200 Olympic-sized swimming pools per day, and right now this water is transported over long distances and injected underground. This is problematic in many ways including the risk of seismic activity,” Bahadur said. “We’re also running out of space to bury that water, by as early as 2030. We need to find a way to use it, and cleaning it up for data centers is a great way to do that.”\n\nThe research finding becomes significant given that only less than 4 percent of Earth’s water is freshwater, and only a fraction of it, just 0.5 percent, is accessible and safe for human consumption. Additionally, by 2028, water consumption by data centers is expected to reach approximately 33 billion gallons, filling nearly 50,000 Olympic-sized pools, according to Lawrence Berkeley National Laboratory.\n\nRead more:\n\nhttps://t.co/MHYVlaUupo", "url": "https://x.com/OwenGregorian/status/2110350895116423243", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110367865241207082", "t": "2026-10-14T13:51:22+00:00", "views": 11571, "likes": 181, "reposts": 109, "handle": "rebekahallen", "name": "Rebekah Allen", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAAB 606718757412909", "t": "2026-10-15T05:40:29+00:00", "views": 3057, "likes": 131, "reposts": 55, "handle": "ErinEpley", "name": "ErinEpley", "avatar": "", "followers": 1436, "text": "Texas is doing an audit on the impact of MAGA policy as to data centers & impact on Texas water and grid. Then Abbott appointed PUC refused to release it before midterms.\nPunchline: It’s devastating\n\nTexas did a report on the increase in maternal deaths after MAGA’s total abortion ban. Abbot refuses to release it before midterms.\nPunchline: It’s devastating\n\nTrump doesn’t want you to see the impact of his One Big Beautiful Bill until after the midterms. \nPunchline: Bottom 80%’s tax breaks end but permanent for top 10% at about $4T. It’s devastating.", "url": "https://x.com/ErinEpley/status/2110606718757412909", "lane": "secrecy_oversight_failure", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110630141294682447", "t": "2026-10-15T07:13:33+00:00", "views": 5307, "likes": 191, "reposts": 15, "handle": "nextbigfuture", "name": "nextbigfuture", "avatar": "", "followers": 20239, "text": "New SpaceX Minihard data centers in Texas", "url": "https://x.com/nextbigfuture/status/2110630141294682447", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110696926454939776", "t": "2026-10-15T11:38:56+00:00", "views": 4924, "likes": 55, "reposts": 17, "handle": "rohanpaul_ai", "name": "Rohan Paul", "avatar": "", "followers": 159993, "text": "Bloomberg published a piece on the estimated expenses to construct an AI data center in Texas\n\n> Servers make up at least half the bill, and demand has more than doubled their average price in 2 years while DRAM costs over 5 times last year’s price.\n\n> Grids rarely have a spare gigawatt in one place, so developers either pay $584K per megawatt for grid-connected land or build their own gas generation, whose cost has tripled in recent years.\n\n> About $750B of hyperscaler capex this year chases the same turbines, steel, copper and fiber, so power-gear backlogs run past 2030 and a 1GW site may need nearly $3B for overruns.\n\n> GPU racks run hot enough to need liquid cooling, which makes merely installing the servers and cooling units in a 1GW site cost about $1.2B.", "url": "https://x.com/rohanpaul_ai/status/2110696926454939776", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110716239635259497", "t": "2026-10-15T12:55:41+00:00", "views": 6748, "likes": 49, "reposts": 6, "handle": "Dennis_Porter_", "name": "Dennis Porter", "avatar": "", "followers": 228383, "text": "I am here once again to tell you that rural communities are LIVID about data centers and it is messaging and policy like this which will drive rural voters to elect a Democrat statewide in Texas for the first time in decades. https://t.co/H8c0fiCCuP", "url": "https://x.com/Dennis_Porter_/status/2110716239635259497", "lane": "rural_water_land_costs", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110732482647904391", "t": "2026-10-15T14:00:14+00:00", "views": 1525, "likes": 17, "reposts": 10, "handle": "MarcGravely", "name": "Marc Gravely", "avatar": "", "followers": 16414, "text": "For 15 years, America used about the same amount of electricity every year.\n\nThis year it will use more than it ever has.\n\nThat is the Energy Information Administration's forecast from earlier this month: 4,135 billion kilowatthours in 2026, a record, rising to 4,211 billion in 2027. The agency names two drivers. Data centers, and manufacturing.\n\nThe turn came quickly. After a decade and a half of nearly flat consumption, demand has grown 2.1% a year over the last five. In January, EIA noted it was the first time since 2007 that power demand had risen four years in a row.\n\nTexas felt it first. On July 22, ERCOT set a new all-time peak of about 91 gigawatts, clearing the old record from August 2023 by more than 5 gigawatts.\n\nIn 2021 I gave a talk called A Ruins to Renaissance Playbook, about reframing America's infrastructure. One of the last slides carried three words. Resilient Electrical Grids.\n\nAt the time, demand had been flat for over a decade and the grid was treated as a finished system.\n\nRoads, ports, water and rail each had a moment when the country chose to build ahead of demand. Electricity has reached that moment again.", "url": "https://x.com/MarcGravely/status/2110732482647904391", "lane": "ai_power_boom_opportunity", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110735429695877154", "t": "2026-10-15T14:11:56+00:00", "views": 4331, "likes": 267, "reposts": 135, "handle": "jacobwlong87", "name": "Jacob Long", "avatar": "", "followers": 7957, "text": "No one is buying this. Greg Abbott could’ve done anything in the 11 years since he gave data centers the largest tax breaks in the nation. Instead he gave them the keys to the kingdom, took $22 million in data center donations, and now only acts concerned since it’s election time https://t.co/0om4gOY4Y0", "url": "https://x.com/jacobwlong87/status/2110735429695877154", "lane": "abbott_donor_sellout", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110740313023394249", "t": "2026-10-15T14:31:20+00:00", "views": 2391, "likes": 110, "reposts": 39, "handle": "TXAG", "name": "Texas Attorney General", "avatar": "", "followers": 147314, "text": "Attorney General Ken Paxton Sends Letters to Data Center Developments Across Texas to Ensure Reporting of Water Use and Compliance with Texas Law: https://t.co/P07l1WtIIU", "url": "https://x.com/TXAG/status/2110740313023394249", "lane": "secrecy_oversight_failure", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110740323181682791", "t": "2026-10-15T14:31:23+00:00", "views": 2811, "likes": 99, "reposts": 40, "handle": "bwaltens", "name": "Brandon Waltens", "avatar": "", "followers": 12326, "text": "AG @KenPaxtonTX has sent letters to 156 data center developments acro <script>
(async function () {
  let DATA = window.__DATA__;
  if (!DATA) {
    try { DATA = await (await fetch('data.json')).json(); }
    catch (e) { document.getElementById('app').textContent = 'No data.json found next to this page.'; return; }
  }
  const { meta, lanes, posts, edges, stats } = DATA;
  const markets = (DATA.markets || []).filter(m => (m.points || []).length > 1);
  const TZ = (meta.window && meta.window.tz) || 'UTC';
  const laneByKey = Object.fromEntries(lanes.map(l => [l.key, l]));
  const PUSHBACK = 'pushback', OTHER = 'other';
  const isMobile = window.innerWidth < 560;
  const isVideo = /[?&]video=1/.test(location.search) || document.body.classList.contains('video');
  if (isVideo) document.body.classList.add('video');

  // ---- derived ------------------------------------------------------------
  posts.forEach(p => { p.ts = +new Date(p.t); p.isCopy = !!p.copy_origin; });
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  // range: ?days=N shows the last N days of the window; long windows default to 14 so the dots stay readable
  const allMax = d3.max(posts, p => p.ts) || Date.now(), allMin = d3.min(posts, p => p.ts) || allMax;
  const windowDays = (allMax - allMin) / 864e5;
  const daysParam = (location.search.match(/[?&]days=(\d+|all)/) || [])[1];
  const rangeDays = daysParam === 'all' ? 0 : daysParam ? +daysParam : windowDays > 21 ? 14 : 0;
  const rangeStart = rangeDays ? allMax - rangeDays * 864e5 : -Infinity;
  const drawn = posts.filter(p => laneByKey[p.lane] && p.ts >= rangeStart);           // 'other' lane is not drawn
  if (!drawn.length) {
    const a = d3.select('#app');
    a.append('h1').text(meta.title);
    a.append('p').attr('class', 'sub').text(lanes.length > 1 ? 'No posts in any lane yet — run classify, then export and render again.' : 'No lanes yet — run discover (or write lanes into the incident YAML), then classify, export, render.');
    return;
  }
  const drawnIds = new Set(drawn.map(p => p.id));
  const links = edges.filter(e => drawnIds.has(e.src) && drawnIds.has(e.dst));
  const tMin = d3.min(drawn, p => p.ts), tMax = d3.max(drawn, p => p.ts);
  const span = Math.max(1, tMax - tMin);
  const vMin = Math.max(1, Math.min(meta.min_views || 1, d3.max(drawn, p => p.views) || 1)), vMax = Math.max(vMin + 1, d3.max(drawn, p => p.views) || 1);   // copies under the threshold sit at the lane floor

  const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtAxis = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);
  hl.append('p').attr('class', 'sub').text(meta.subtitle);
