<title>Texas property tax, 13 days of posts</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0b0c;
    --surface: #141416;
    --surface-2: #1d1d21;
    --line: #2a2a30;
    --ink: #f2f2f0;
    --ink-2: #b9b9b3;
    --ink-3: #7c7c78;
    --copy: #ffffff;
    --accent: #e08a2e;

    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  :root:not([data-theme="light"]) { color-scheme: dark; }
  :root[data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { padding: 16px 16px 48px; max-width: 1200px; margin: 0 auto; -webkit-text-size-adjust: 100%; }
  /* video mode (?video=1): fixed 1600x1000 frame captured by tracker/video.py */
  body.video { max-width: 1600px; width: 1600px; height: 1080px; padding: 18px 24px; overflow: hidden; box-sizing: border-box; }
  body.video .sub { max-width: 120ch; }
  body.video .row .bar { height: 10px; }
  body.video .controls, body.video .banner { display: none; }
  body.video header { margin-bottom: 4px; }
  body.video .stats { margin: 4px 0 8px; }
  body.video .ticker { margin-top: 6px; }
  body.video .bars { margin-top: 10px; gap: 30px; }
  body.video .row { margin: 2px 0; }
  body.video footer { margin-top: 8px; }
  a { color: inherit; }

  .banner { background: #3b2a06; color: #ffd98a; border: 1px solid #7a5a15; border-radius: 8px;
            padding: 8px 12px; font-size: 13px; margin-bottom: 12px; }
  header { display: grid; grid-template-columns: 1fr auto; gap: 12px 20px; align-items: start; margin-bottom: 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-3); font-size: 11.5px; line-height: 1.35; max-width: 70ch; margin: 0; }
  .range { font-size: 11.5px; color: var(--ink-3); margin: 4px 0 0; } .range a { color: var(--ink-2); text-decoration: none; } .range a.on { color: var(--accent); font-weight: 600; } .range a:hover { color: var(--ink); }
  .clock { text-align: right; white-space: nowrap; }
  .clock .date { font-size: 11px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }
  .clock .time { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .clock .speed { font-size: 11px; color: var(--ink-3); }

  .stats { display: flex; gap: 22px; margin: 10px 0 8px; flex-wrap: wrap; }
  .stat .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
  .stat .l { font-size: 11px; color: var(--ink-3); margin-top: 3px; }
  .stat.push .n { color: var(--accent); }
  .stat.rep .n { color: var(--ink); }
  .stat.back .n { color: #2fbf8c; }

  .controls { display: flex; align-items: center; gap: 10px; margin: 6px 0 10px; }
  .controls button { background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
                     border-radius: 999px; width: 40px; height: 40px; font-size: 16px; cursor: pointer; }
  .controls input[type=range] { flex: 1; accent-color: var(--accent); height: 28px; }
  .controls .spd { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .controls .spd button { width: auto; height: 26px; padding: 0 9px; font-size: 11px; margin-left: 4px; }

  .chartwrap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
               overflow: hidden; }
  svg { display: block; width: 100%; height: auto; }
  .axis text { fill: var(--ink-3); font-size: 10px; font-family: var(--mono); }
  .axis line { stroke: var(--line); }
  .axis .major line { stroke: #3a3a42; }
  .lane-rule { stroke: var(--line); stroke-width: 1; }
  .lane-label .t { font-size: 11.5px; font-weight: 700; }
  .lane-label .c { font-size: 10px; fill: var(--ink-2); font-family: var(--mono); }
  .lane-label .d { font-size: 9px; fill: var(--ink-3); }
  .lane-label rect { fill: rgba(11,11,12,.72); }
  .link { fill: none; stroke-width: .9; opacity: .32; }
  .link.copy { stroke: var(--copy); stroke-width: 1.1; opacity: .55; }
  .dot { stroke: var(--bg); stroke-width: .8; cursor: pointer; }
  .dot.copy { stroke: var(--copy); stroke-width: 1.2; }
  .dot.ref { opacity: .55; }
  .pill rect { fill: rgba(20,20,22,.92); stroke: #4a4a52; stroke-width: .6; }
  .pill text { fill: var(--ink); font-size: 9.5px; font-weight: 600; }
  .pill text.s { fill: var(--ink-3); font-weight: 400; font-size: 8.5px; }
  .playhead { stroke: var(--ink-2); stroke-width: 1; stroke-dasharray: 2 3; }
  .hidden { display: none; }

  .ticker { font-size: 12.5px; color: var(--ink-2); min-height: 18px; margin: 10px 2px 0; font-variant-numeric: tabular-nums; }
  .ticker b { color: var(--ink); }

  .bars { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; }
  @media (max-width: 560px) { .bars { grid-template-columns: 1fr; } header { grid-template-columns: 1fr; } .clock { text-align: left; } }
  .bars h3 { font-size: 12px; margin: 0 0 8px; color: var(--ink-2); font-weight: 600; }
  .bars h3 span { color: var(--ink-3); font-weight: 400; font-size: 10.5px; margin-left: 6px; }
  .row { display: grid; grid-template-columns: 118px 1fr 56px; align-items: center; gap: 8px; margin: 4px 0; font-size: 11px; }
  .row .lbl { color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .row .bar { height: 12px; border-radius: 3px; transition: width .25s ease; min-width: 2px; }
  .row .val { color: var(--ink-2); font-family: var(--mono); }

  .tip { position: fixed; z-index: 10; max-width: min(360px, calc(100vw - 32px)); background: var(--surface-2);
         border: 1px solid #3a3a42; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.4;
         box-shadow: 0 8px 30px rgba(0,0,0,.6); display: none; }
  .tip .h { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-3); font-size: 11px; margin-bottom: 4px; }
  .tip .lane { font-weight: 700; }
  .tip .x { position: absolute; top: 6px; right: 8px; color: var(--ink-3); cursor: pointer; }
  .tip .txt { white-space: pre-wrap; word-break: break-word; }
  .tip a { color: var(--ink-2); font-size: 11px; }
  footer { margin-top: 18px; font-size: 10.5px; color: var(--ink-3); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
</style>

ertops that most buyers would immediately gut. The upstairs carpet is stained, filthy, and ruined. The entire interior needs a full paint job.\n\nWith today's interest rates, a mortgage on a home in this price tier is easily going to run you between $3,000 and $4,000 a month. Add that to the $1,000 a month tax bill, and you are easily dumping six figures into this house just to make it livable. That is the real cost of a \"deal.\" \n\n👇 Would you take on a project with these neighborhood dynamics, or is it an immediate pass? Let me know below.\n#ForeclosureReality #TexasRealEstate #FixerUpper #HousingMarket #CostOfHomeownership #RealEstateInvesting #anttsinc", "url": "https://x.com/anttsinc/status/2107872058835190263", "lane": "affordability_housing_burden", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107906077060735169", "t": "2026-10-07T18:49:06+00:00", "views": 239503, "likes": 509, "reposts": 44, "handle": "KPRC2", "name": "KPRC 2 Houston", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVER ataset": 1, "copies": 0}, {"id": "2107919435067728059", "t": "2026-10-07T19:42:11+00:00", "views": 3378, "likes": 27, "reposts": 6, "handle": "christensen2023", "name": "Seth W. Christensen", "avatar": "", "followers": 2208, "text": "@KPRC2 Has @KPRC2 not been listening when this question has been asked & answered? The State of Texas will be responsible for fully funding public education.\n\nFor those interested in the facts - here is background information on Governor Abbott's Plan to overhaul the Texas Property Tax System: https://t.co/rNKnXt9cKt", "url": "https://x.com/christensen2023/status/2107919435067728059", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107923117293162691", "t": "2026-10-07T19:56:49+00:00", "views": 1490, "likes": 26, "reposts": 3, "handle": "DennisPaulTexas", "name": "Dennis Paul", "avatar": "", "followers": 5494, "text": "Out Now Across SD11:\n\nLast session, I helped pass the largest property tax cut in Texas history. But too often, wasteful Democrat-controlled local governments like Harris County have erased that relief.\n\nAs your next state senator, I’ll fight for lasting property tax relief and use my proven business experience to cut waste and slash unnecessary regulations.\n\nFind out more at https://t.co/CtAx7YjePd\n\n#Txlege #SD11", "url": "https://x.com/DennisPaulTexas/status/2107923117293162691", "lane": "local_governments_to_blame", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107923529232752878", "t": "2026-10-07T19:58:27+00:00", "views": 2948, "likes": 22, "reposts": 4, "handle": "MiMiLooLooTx", "name": "MiMi ♥️🇺🇸", "avatar": "", "followers": 2182, "text": "@DemocraticWins Hinojosa lied and said Abbott raised property\nTaxes. \n\nIn Texas, there is no state income or property tax. \n\nShe really should know that the Governor has no say on property taxes. The county assesses and collects property taxes. \n\nOnly idiots who want a a Texas state income tax and death and inheritance taxes will vote for Hinojosa.  \n\nHinojosa supports defunding police and prisons. \n\nTexans don’t support her values.", "url": "https://x.com/MiMiLooLooTx/status/2107923529232752878", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107935687186043027", "t": "2026-10-07T20:46:46+00:00", "views": 3172, "likes": 12, "reposts": 4, "handle": "TexasTribune", "name": "Texas Tribune", "avatar": "", "followers": 299716, "text": "At a Texas Tribune event, state Rep. Nicole Collier and Fort Worth Mayor Mattie Parker warned that further reducing property tax caps would hurt local services, like parks, community centers and healthcare programs. https://t.co/hJNlliJz9Y", "url": "https://x.com/TexasTribune/status/2107935687186043027", "lane": "cuts_hurt_local_services", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107961671293829498", "t": "2026-10-07T22:30:01+00:00", "views": 3577, "likes": 39, "reposts": 5, "handle": "DavidLowe4Texas", "name": "State Representative David Lowe", "avatar": "", "followers": 7879, "text": "Texas should not routinely collect billions more than it needs. Instead of using excess revenue to grow spending, we should focus on collecting less from taxpayers in the first place.\n\nMy Texas Working Families Tax Relief Act is one piece of that strategy. It would eliminate sales taxes on everyday necessities families actually need, including car seats, school supplies, children’s clothing, safety equipment, and other essentials.\n\nProperty tax relief remains critically important, but not every Texan owns a home. Texans who rent pay taxes too, and they should also benefit when the state has the ability to reduce the tax burden.\n\nThis bill is not intended to compete with property tax relief. It is about reducing the amount of money flowing into the Texas state budget by letting working families keep more of their own money.\n\nThe current list is only a starting point. I’m willing to accept amendments on the House floor to expand this bill and provide additional tax relief.\n\nTexas doesn’t need to find new ways to spend every available dollar. We need to collect less in the first place.", "url": "https://x.com/DavidLowe4Texas/status/2107961671293829498", "lane": "gop_tax_relief_record", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108141592922255551", "t": "2026-10-08T10:24:57+00:00", "views": 1287, "likes": 68, "reposts": 9, "handle": "skumWgmi", "name": "skumm🧊", "avatar": "", "followers": 19889, "text": "NOW I UNDERSTAND WHY PEOPLE ARE LEAVING TEXAS…\n\nMoved here thinking I was escaping expensive states.\n\nNo state income tax. Lower cost of living. No state income tax.\n\nThen came the homeowners insurance.\n\nThen the property taxes.\n\nThen the HOA fees.\n\nThen groceries, car insurance, rent, literally EVERYTHING.\n\nAt this point, Texas isn’t “cheap.”\n\nIt’s just charging you in different places.\n\nWHERE EXACTLY IS THE LOW TAXES PART?", "url": "https://x.com/skumWgmi/status/2108141592922255551", "lane": "affordability_housing_burden", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108180762709074164", "t": "2026-10-08T13:00:36+00:00", "views": 3763, "likes": 65, "reposts": 20, "handle": "LeighForTexas", "name": "Leigh Wambsganss", "avatar": "", "followers": 5925, "text": "As a working mom, I know rising costs impact working families. \n\nAs your Senator, I will keep fighting to cut property tax and create better-paying jobs so all Texas families can thrive. \n\nEarly Voting: Oct. 19-30\nElection Day: Tuesday, Nov. 3 https://t.co/ZsegE6PNMY", "url": "https://x.com/LeighForTexas/status/2108180762709074164", "lane": "affordability_housing_burden", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108181250385088651", "t": "2026-10-08T13:02:32+00:00", "views": 1415, "likes": 48, "reposts": 8, "handle": "TimothyOHare", "name": "Tim O'Hare", "avatar": "", "followers": 7322, "text": "Judge Tim O’Hare has a record Tarrant County residents can measure.\n\n✅ Property Taxes cut 4 years in a row.\n✅ More than $1.1 BILLION in Property Tax Relief.\n✅ $70 MILLION cut from operating budget without cutting services.\n✅ Crime Rate Down 3 years in a row.\n✅ Lowest urban county Crime Rate in Texas.\n✅ A growing local economy. \n\nPromises Made. Promises Kept. \n\nElect County Judge Tim O’Hare. Early Voting Oct 19-30. Election Day Nov 3.", "url": "https://x.com/TimothyOHare/status/2108181250385088651", "lane": "gop_tax_relief_record", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108196306875224548", "t": "2026-10-08T14:02:22+00:00", "views": 17941, "likes": 445, "reposts": 178, "handle": "KatrinaPierson", "name": "Katrina Pierson", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAaAAACAwEBAAAAAAAAAAAAAAAEBgEFBwMC/8QAGQEAAgMBAAAAAAAAAAAAAAAABAUAAQMC/9oADAMBAAIQAxAAAAFAKiL6EuOmij CAgICAg", "followers": 68773, "text": "High Tax Hinojosa only grandstands when she’s “going down in flames”. Her political grandstanding is just a sad attempt to distract from her own record in the Texas Legislature. \n\nThe facts are clear: Gina voted 40 times to increase property taxes and opposed a ban on a state income tax. She can try to rewrite her record, but she can’t erase it.", "url": "https://x.com/GovHotWheels_TX/status/2108564991099990083", "lane": "gop_tax_relief_record", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108592852846485650", "t": "2026-10-09T16:18:06+00:00", "views": 1793, "likes": 12, "reposts": 1, "handle": "BlackLabelAdvsr", "name": "Jon Elder", "avatar": "", "followers": 39709, "text": "“It’s the economy, stupid.” \n\nTrump seems to have forgotten this famous quote by Ronald Reagan.  \n\nAs I look at the past couple years and assess the costs of everything, literally everything has gone up.  \n\nEven Hulu prices are going up.  \n\nInsurance, utilities, groceries, furniture, interest rates, health insurance, property taxes, car prices, all up! \n\nI actually can’t think of a single thing that has gotten cheaper under Trump. \n\nI’m a hardcore conservative Republican but between Trump and our incompetent Congress, not a whole lot in America has changed.\n\nI’m not posting this to discourage you from voting. You should still go out and vote this month.  \n\nI just like to assess results from time to time and Trump seems to have gotten lazy in many ways.  \n\nIf I’m being honest, after Charlie Kirk was assassinated, it felt like our country stalled.  \n\nHeck, even the job market is a snooze fest.  Things are stable but overall, everyone is paying more including gas.  And I live in Texas!  Prices should be $2.50 by now.  \n\nAm I missing anything? Or am I spot on with Trump’s performance?", "url": "https://x.com/BlackLabelAdvsr/status/2108592852846485650", "lane": "affordability_housing_burden", "copy_origin": null, "in_data   const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : t === 'trump' ? '#ff6b6b' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
