s wrote in 1798, that our Constitution was made only for moral people, and that it is wholly inadequate to the government of any other. What are good morals? Good moral people are ones that do not lie, steal, or harm their neighbors. Yet the teachings in the Quran give permission to lie. It commands those that follow it to enslave and harm those that do not. Free people tell the truth, keep contracts, and live under one law. They do not live under a scripture that a private tribunal treats as superior to the courts of this state.\n\nThat is not history for its own sake. It is already here.\n\nNot quite a year ago, Governor Abbott wrote the district attorneys and sheriff’s offices of both Collin and Dallas counties AND copied the Attorney General and the Department of Public Safety. In these letters he stated that entities in those counties may be posing as courts and issuing orders under Islamic codes. He named the Islamic Tribunal in Dallas. He cited its claim that its decisions are final under Islamic jurisprudence, and that this body of law, by the tribunal’s own description, includes stoning adulterers and cutting off hands. Stoning and amputation are not Texas sentences. A body that calls its rulings final under a religious code, and that points people away from American courts, is not a church social. It is a rival jurisdiction. Dallas is about an hour from this courthouse.\n\nThe scale of this topic is not small, and it is not far. Current directories show that about 116 mosques or Islamic centers are within an 80-mile radius of Van Zandt, with two being just across the county line in Tyler. Where just earlier this year a Muslim city similar to that of Epic City was looking to build at our county line in Kaufman and was shut down by our Attorney General. The growth is on our line, not in another state.\n\nWorship is protected. I am not asking this court to police anyone’s prayers. I am asking it to be clear about the line the Constitution already draws. One law governs this county. It is not Sharia. A private tribunal does not get to issue orders, call them final, or carry punishments our Constitution forbids. That system is not compatible with this republic, and the governor’s own letter shows it is already being attempted in the counties next to us.\n\nTo be clear I understand that there is no confirmed mosques or operating tribunals in Van Zandt County, however it costs nothing to stand with our Constitution today and make it known that our county stands with the founders of this Country and the laws that govern it, before any such day may potentially arrive.", "url": "https://x.com/Nancy4Thinking/status/2107890678978191641", "lane": "sharia_islam_crackdown", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107899154634551516", "t": "2026-10-07T18:21:35+00:00", "views": 3614, "likes": 78, "reposts": 29, "handle": "rebekahallen", "name": "Rebekah Allen", "avatar": "", "followers": 9674, "text": "Where are all the debates? This is shaping up to be the first time since 2000 that TX voters won't get a U.S. Senate debate.\nGreg Abbott has debated each of his previous 3 Democratic rivals, but won't meet Gina Hinojosa on the stage. via @kaylaguo_ \nhttps://t.co/Z33jxj2qk7", "url": "https://x.com/rebekahallen/status/2107899154634551516", "lane": "abbott_hiding_dodging", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107903227618279471", "t": "2026-10-07T18:37:47+00:00", "views": 2968, "likes": 36, "reposts": 2, "handle": "crulge", "name": "Kill Tim Faust 💀", "avatar": "", "followers": 57407, "text": "interesting contrast in dem approaches to the data center issue between texas and wisconsin. hinojosa is  hitting abbott *hard* on his support; in WI, where the Dem supports continuing subsidies to fund data centers, the attacks are coming from the other direction", "url": "https://x.com/crulge/status/2107903227618279471", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 1, "copies": 0} https://x.com/GovAbbottPress/status/2108625140233670965", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108627993161847195", "t": "2026-10-09T18:37:44+00:00", "views": 1623, "likes": 20, "reposts": 5, "handle": "billscher", "name": "Bill Scher", "avatar": "", "followers": 27696, "text": "“Under Greg Abbott … taxes: through the roof”", "url": "https://x.com/billscher/status/2108627993161847195", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108628392635490456", "t": "2026-10-09T18:39:19+00:00", "views": 48372, "likes": 391, "reposts": 76, "handle": "Moms4Liberty", "name": "Moms for Liberty", "avatar": "", "followers": 218922, "text": "Parents know their children best. They deserve access to the curriculum, school libraries, and what their children are being taught.\n\nThank you, Governor Abbott, for bringing that message to the Moms for Liberty National Summit today and for sharing your passion for parental rights! 🇺🇸\n\n#m4lsummit26 #moms4liberty #bootsontheground", "url": "https://x.com/Moms4Liberty/status/2108628392635490456", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108628680016613627", "t": "2026-10-09T18:40:28+00:00", "views": 2997, "likes": 76, "reposts": 24, "handle": "lynnsdavenport", "name": "Lynn Davenport", "avatar": "", "followers": 6840, "text": "“The governor, she said, is a “globalist. Which to me is scarier than a communist, a socialist or a Marxist, because what Abbott is imposing is technocracy. He’s giving the tech giants carte blanche in Texas.” So she decided not just to support Hinojosa’s bid for governor, but to do it publicly. “Gina is someone that I can work with, whereas Abbott doesn’t care what I think,” she told me.”  @michelleinbklyn @nytimes \n\nhttps://t.co/ziQ5NKbcOg", "url": "https://x.com/lynnsdavenport/status/2108628680016613627", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108631581866774938", "t": "2026-10-09T18:52:00+00:00", "views": 12780, "likes": 1468, "reposts": 156, "handle": "ElectionTime_", "name": "Election Time", "avatar": "", "followers": 39051, "text": "🚨BREAKING: Incumbent Greg Abbott is still several points ahead of Gina Hinojosa in the Texas governor's election.\n\nTexas - 2026 Governor\n🟥Greg Abbott* 48% (+4) \n🟦Gina Hinojosa 44%\n\nSee all TX Governor polls @Pollsmax.\n\nTexas has not elected a Democratic governor since 1990, and Abbott previously won re-election in 2022 by 11 points. \n\nIf Abbott is re-elected and serves until the end of his fourth term, he will become the state's longest-serving governor, topping his predecessor Rick Perry.\n\nUniversity of Massachusetts Lowell | September 28, 2026 | 850 LV", "url": "https://x.com/ElectionTime_/status/2108631581866774938", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108636048523665427", "t": "2026-10-09T19:09:45+00:00", "views": 6590, "likes": 290, "reposts": 92, "handle": "Hunter_Eagleman", "name": "Hunter Eagleman™", "avatar": "", "followers": 251226, "text": "FACTS: Parents know their kids best! \n\nFull stop and thank you, @GregAbbott_TX. 🇺🇸", "url": "https://x.com/Hunter_Eagleman/status/2108636048523665427", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108644974526869919", "t": "2026-10-09T19:45:13+00:00", "views": 19103, "likes": 1353, "reposts": 365, "handle": "GinaHinojosaTX", "name": "Gina Hinojosa", "avatar": "", "followers": 81760, "text": "In Texas, food, gas, healthcare and housing should be affordable. My plan is to secure the American Dream by saving Texas schools and putting money in your pocket. https://t.co/2jzg3dgEw3", "url": "https://x.com/GinaHinojosaTX/status/2108644974526869919", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108647902222430389", "t": "2026-10-09T19:56:51+00:00", "views": 6408, "likes": 465, "reposts": 96, "handle": "RebeccaKKatz", "name": "Rebecca Katz", "avatar": "", "followers": 30113, "text": "“If you’re not man enough to debate me, you don’t deserve to be the governor of Texas, Greg Abbott.”", "url": "https://x.com/RebeccaKKatz/status/2108647902222430389", "lane": "abbott_hiding_dodging", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108652550572441749", "t": "2026-10-09T20:15:19+00:00", "views": 20156, "likes": 237, "reposts": 62, "handle": "GuntherEagleman", "name": "Gunther Eagleman™", "avatar": "", "followers": 1769220, "text": "🚨 GOVERNOR ABBOTT JUST TOLD MOMS FOR LIBERTY EXACTLY WHAT TEXAS PARENTS WANT TO HEAR.\n\nPARENTS KNOW THEIR KIDS BEST.\n\nThey deserve access to the CURRICULUM. They deserve access to the SCHOOL LIBRARY. They deserve to know what their children are being taught.\n\nNo bureaucrat, no teachers' union, and no school board gets to cut a mom and dad out of their own child's education.\n\nThank you, Governor Abbott, for standing up for parental rights.\n\nFULL STOP", "url": "https://x.com/GuntherEagleman/status/2108652550572441749", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108653176471642377", "t": "2026-10-09T20:17:48+00:00", "views": 1148, "likes": 64, "reposts": 17, "handle": "jacobwlong87", "name": "Jacob Long", "avatar": "", "followers": 7952, "text": "🔥🔥 @nytimes: \"Mary Lowe, an education activist and a self-described “fundamental Christian,” told me that Abbott is “a globalist. He’s a tyrant. He’s a great deceiver.” And though she’s voted Republican... since 1979, she’s voting for Hinojosa.\"\nhttps://t.co/mjTp5iI2p8", "url": "https://x.com/jacobwlong87/status/2108653176471642377", "lane": "abbott_fails_texans", "copy_origin": "2108525818653667838", "in_dataset": 1, "copies": 0}, {"id": "2108660786705121614", "t": "2026-10-09T20:48:03+00:00", "views": 4896, "likes": 343, "reposts": 126, "handle": "juliejohnsonTX", "name": "Julie Johnson for Texas", "avatar": "", "followers": 29732, "text": "Ask yourself one question: is Texas more affordable than when Greg Abbott took office? 🛒 Groceries? Nope. ⛽ Gas? Nope. 🏠 Rent? Nope. \n\nEven @bucees brisket is a luxury item now. \n\n@GinaHinojosaTX's plan: Save public schools. Put money in your pocket. Free the brisket.", "url": "https://x.com/juliejohnsonTX/status/2108660786705121614", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108671232660865280", "t": "2026-10-09T21:29:33+00:00", "views": 29796, "likes": 33, "reposts": 7, "handle": "WillCainShow", "name": "The Will Cain Show", "avatar": "", "followers": 72413, "text": "\"She's further left than Talarico.\" Gov. Abbott unloads on Gina Hinojosa.\n\n@GregAbbott_TX argues Democratic challenger Gina Hinojosa represents the far-left wing of Texas politics, criticizing her record on taxes, policing, and other issues while making the case that voters will reject her agenda.", "url": "https://x.com/WillCainShow/status/2108671232660865280", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 1, "copies": 1}, {"id": "2108672010578440663", "t": "2026-10-09T21:32:39+00:00", "views": 1412, "likes": 15, "reposts": 3, "handle": "WillCainShow", "name": "The Will Cain Show", "avatar": "", "followers": 72413, "text": "\"She's further left than Talarico.\" Gov. Abbott unloads on Gina Hinojosa.\n\nGov. @GregAbbott_TX you argues Democratic challenger Gina Hinojosa represents the far-left wing of Texas politics, criticizing her record on taxes, policing, and other issues while making the case that voters will reject her agenda.", "url": "https://x.com/WillCainShow/status/2108672010578440663", "lane": "abbott_strong_hinojosa_radical", "copy_origin": "2108671232660865280", "in_dataset": 1, "copies": 0}, {"id": "2108674915649925426", "t": "2026-10-09T21:44:11+00:00", "views": 23428, "likes": 553, "reposts": 104, "handle": "jacobwlong87", "name": "Jacob Long", "avatar": "", "followers": 7952, "text": "Greg Abbott whining that his race “should not be as close as it is” sounds more like an admission that blowing $146 million on lies isn’t working!!!\n\nMaybe the problem is you my man.", "url": "https://x.com/jacobwlong87/status/2108674915649925426", "lane": "abbott_hiding_dodging", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108676782031339715", "t": "2026-10-09T21:51:36+00:00", "views": 15541, "likes": 268, "reposts": 73, "handle": "MakeTexasBlue22", "name": "TexasBlue", "avatar": "", "followers": 46067, "text": "NYT Today:\nRepublicans Are Worried About Gina Hinojosa. In Texas, I Saw Why. https://t.co/YyvdyIPjVU \nRepublicans Are Worried About Gina Hinojosa. In Texas, I Saw Why.\n\nLynn Davenport, a lifelong conservative, metTrump backstage at a Texas rally in 2016. On Jan. 6, 2021, she was at his Stop the Steal rally in Washington, though she left before the Capitol was sacked. In 2024 she was a delegate to Texas’ Republican convention and a Republican precinct chair.\n\nAnd in May she filmed an ad for Gina Hinojosa, the Democrat running a surprisingly competitive race to become governor of Texas.\nThe two women have been friends for years, since Hinojosa, a state representative from Austin, helped lead opposition to a crusade by the Republican governor, Greg Abbott, to privatize Texas’ public school system. Abbott’s agenda was bitterly opposed by some conservative Texans, particularly rural ones in places where public schools are the center of the community. (Think “Friday Night Lights.”) Davenport was impressed by Hinojosa’s willingness to listen to her and by her mastery of education policy. Still, as a committed Republican, she didn’t think she’d ever vote for her.\nThe premise of Hinojosa’s surprisingly competitive campaign is that there’s a critical mass of voters like Davenport in Texas. The opportunity for Democrats, Hinojosa believes, lies not with moderate, affluent Republicans put off by Trump’s norm-smashing vulgarity but with disappointed MAGA populists. “The conventional political wisdom is that it is those country club Republicans who will swing over,” she told me before I traveled to Texas. “I think it’s always been MAGA.”\n\nI was skeptical of this analysis then, and after seeing her campaign last week, I’m still not wholly convinced. Trump’s appeal has never been only or even primarily economic; he taps into fear and rage about a country growing less white, less Christian and less deferential to male authority. And Hinojosa seems, at least on paper, ill suited to appeal to Trump’s base. A Latina and a former labor lawyer, she comes from the heart of Texas’ Democratic establishment: Her father led the state Democratic Party from 2012 until 2025. Though she now calls herself a “populist” rather than a “progressive,” she’s one of the more liberal members of the Texas House.\n\nStill, Hinojosa has a group of supporters like Davenport, people furious at Abbott over school privatization and data centers. Mary Lowe, an education activist and a self-described “fundamental Christian,” told me that Abbott is “a globalist. He’s a tyrant. He’s a great deceiver.” And though she has voted Republican in almost every primary and every general election since 1979, she’s voting for Hinojosa in November. “She’s a good human,” said Lowe. “She’s one of us.”\nBut Davenport has grown increasingly disgusted with Abbott, over both schools and the data centers he invited into Texas. The governor, she said, is a “globalist, which to me is scarier than a communist, a socialist or a Marxist, because what Abbott is imposing is technocracy. He’s giving the tech giants carte blanche in Texas.” So she decided not just to support Hinojosa’s bid for governor but to do it publicly. “Gina is someone that I can work with, whereas Abbott doesn’t care what I think,” she told me.", "url": "https://x.com/MakeTexasB cios https://t.co/052hv0OrxI", "url": "https://x.com/Carlos__Turcios/status/2108933444567024039", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108936341249794502", "t": "2026-10-10T15:03:00+00:00", "views": 15825, "likes": 2674, "reposts": 588, "handle": "karlykingsley", "name": "Karly Kingsley", "avatar": "", "followers": 95283, "text": "If you didn’t care where Mitch McConnell was for over three months while his staff refused to let anyone know, I don’t want to hear a word about James Talarico, who made everyone aware, during a live virtual event, that he is recovering from the flu.", "url": "https://x.com/karlykingsley/status/2108936341249794502", "lane": "pushback", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108943121279062096", "t": "2026-10-10T15:29:57+00:00", "views": 4796, "likes": 63, "reposts": 7, "handle": "KalshiPolitics", "name": "Kalshi Politics", "avatar": "", "followers": 65396, "text": "Greg Abbott has a 79% chance to win the Texas Governor race https://t.co/FNnBsvgRqb", "url": "https://x.com/KalshiPolitics/status/2108943121279062096", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108946306550968643", "t": "2026-10-10T15:42:36+00:00", "views": 26470, "likes": 2850, "reposts": 863, "handle": "GinaHinojosaTX", "name": "Gina Hinojosa", "avatar": "", "followers": 81760, "text": "Greg Abbot has had 12 years to invest in Texas public education. He hasn’t. Across the state, schools are struggling. 150 districts operate 4 days a week because they can’t afford 5. \n\nYou don't get four more years to do what you wouldn't do in 12.\n\nJoin our movement to save our schools: https://t.co/o3r2qBCuY1", "url": "https://x.com/GinaHinojosaTX/status/2108946306550968643", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108956751953576230", "t": "2026-10-10T16:24:06+00:00", "views": 2610, "likes": 36, "reposts": 25, "handle": "TxEdHouston", "name": "Houston Parents & Teachers United", "avatar": "", "followers": 4494, "text": "@GinaHinojosaTX Greg Abbott thinks stealing\nyour tax dollars is A-Okay. \n\nHand-selected by Abbott/Morath,\nthis person (Mike Miles) has still NOT\nyet been removed from running the\nlargest school district in the state of Texas. \n https://t.co/sUrSFOid2j", "url": "https://x.com/TxEdHouston/status/2108956751953576230", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108958707430412680", "t": "2026-10-10T16:31:53+00:00", "views": 2189, "likes": 117, "reposts": 34, "handle": "McNutt2A", "name": "Chris McNutt 🇺🇸", "avatar": "", "followers": 13370, "text": "Gina Hinojosa supported a State Income tax.\n\nGina Hinojosa supported expanding payroll taxes.\n\nGina Hinojosa supported a DEATH TAX. \n\nGina will literally tax you after you die.", "url": "https://x.com/McNutt2A/status/2108958707430412680", "lane": "abbott_strong_hinojosa_radical", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108971732698579166", "t": "2026-10-10T17:23:38+00:00", "views": 31060, "likes": 1712, "reposts": 822, "handle": "PlumbNick", "name": "Nick Plumb", "avatar": "", "followers": 24223, "text": "PART TWO: THE TEXAS EDUCATION MONEY TRAIL LEADS BACK TO INDIA.\n\nI’ve been investigating Imagine Learning, the American education giant hiring workers in INDIA to develop curriculum for American schoolchildren.\n\nNow I’ve traced its history through the Texas Education Agency, millions in taxpayer funding and a company once run regionally by JAMES TALARICO.\n\nIn 2018, under Greg Abbott’s education commissioner Mike Morath, the TEA approved just FOUR math software products for its Math Innovation Zones program.\n\nImagine Math, Reasoning Mind, IXL Math and ST Math. Participating districts were required to choose from that approved list.\n\nThen Imagine Learning acquired Reasoning Mind in July 2018. \n\nTWO OF THE FOUR STATE-APPROVED OPTIONS WERE NOW OWNED BY THE SAME CORPORATE GROUP.\n\nAnd who was Reasoning Mind’s Central Texas executive director?\n\nJAMES TALARICO.\n\nBefore becoming a state legislator, Talarico publicly promoted Reasoning Mind.\n\nTexas then appropriated $17.5 MILLION specifically for Reasoning Mind across the 2012–13, 2014–15 and 2016–17 budget cycles.\n\nAnd what were taxpayers getting?\n\nDallas ISD’s 2017–18 evaluation classified between 87% and 100% of participating campuses as LOW IMPLEMENTATION, depending on grade.\n\nParticipation in its centrally funded program fell from 29,714 students in 2016–17 to just 2,267 in 2018–19, largely amid district budget cuts.\n\nA separate randomized study of Reasoning Mind’s fifth-grade curriculum, published in 2019 and subsequently reviewed by the federal What Works Clearinghouse, found NO statistically significant positive effect on mathematics achievement.\n\nThat’s one curriculum and one study, not proof that every product failed, but it certainly raises questions about the value taxpayers were receiving.\n\nAnd the offshore development history goes back even further.\n\nA 2013 Texas Observer investigation reported that Reasoning Mind’s tax filings showed $1.6 MILLION spent on computer programming and product testing in MOSCOW, RUSSIA.\n\nThink about the progression.\n\nTexas appropriated millions for Reasoning Mind.\n\nTEA later placed Reasoning Mind and Imagine Math on its approved vendor list.\n\nImagine Learning acquired Reasoning Mind, consolidating two of those four approved products.\n\nAnd now - Imagine Learning is building American K–12 curriculum-development operations in INDIA.\n\nIts Bengaluru teams work on English Language Arts, mathematics and other instructional content. Straive LearningMate identifies Imagine Learning as a client for AI-assisted curriculum production and Infosys has disclosed additional India-based delivery operations.\n\nMeanwhile, Imagine Learning markets TEXAS HISTORY, U.S. HISTORY, AMERICAN GOVERNMENT and ENGLISH LANGUAGE ARTS courses to Texas schools.\n\nI’ve now identified more than $8.5 MILLION in additional Texas district purchasing records and authorizations involving Imagine Learning across multiple years.\n\nI still don’t have an audited statewide payment total but it’s substantial.\n\nSo here’s what I want to know.\n\nWho reviewed the consolidation of two state-approved software products under one corporate owner?\n\nWhat evidence justified their selection and continued public spending?\n\nHow much taxpayer-funded curriculum production now happens overseas?\n\nAnd what safeguards protect Texas students’ educational records?\n\nThe Texas education software industry didn’t appear overnight - we helped finance it.\n\nAnd now we need to examine where that investment is going.", "url": "https://x.com/PlumbNick/status/2108971732698579166", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108974046411141543", "t": "2026-10-10T17:32:50+00:00", "views": 45139, "likes": 1157, "reposts": 402, "handle": "JimGBoyle", "name": "Jim Boyle", "avatar": "", "followers": 3510, "text": "KNOCKOUT AD for Hinojosa. Tim Buchanan coached the Aledo Bearcats to 8 state football championships. He is perhaps the most celebrated high school coach in Texas. He voted for Abbott 3 times but he is supporting Hinojosa because Abbott is wrecking public schools. https://t.co/euFYLSpiaz", "url": "https://x.com/JimGBoyle/status/2108974046411141543", "lane": "abbott_fails_texans", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108976198327914511", "t": "2026-10-10T17:41:23+00:00", "views": 24069, "likes": 374, "reposts": 62, "handle": "ryanjhiggins", "name": "Ryan J Higgins, Ed.D.", "avatar": "", "followers": 3420, "text": "If you’re a high school football coach in Texas, I can guarantee you that your life will get better if @GinaHinojosaTX, not Greg Abbott, is our governor. \n\nYou’ll have less pointless PDs, less testing, higher   const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);

  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------

  const speeds = [20, 40, 80];      // seconds for the whole window
  let speedIdx = 1;
  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.
  const band = isMobile ? 30 : isVideo ? 28 : 42;
  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;
  const stripH = markets.length ? (isMobile ? 54 : isVideo ? 62 : 72) : 0;
  const top = 22 + stripH, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
