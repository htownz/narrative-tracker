jaADTaGlZ2ZwIGAspR2er4zyFmgFCUGu1fEyI9VACARqLXodYEBlMP0QVqfRMbmd8+eDWoJP5h/wC2IZ0DVvBqfGMJmLIgClt9Xm5VzDA8G/tTtveIl0W0AaPkETqMA9HQqciF0cb8zFVpVpBQvjt5XxleFx8gLPR49b1clJG9gK/BxlhJFppEO0rEDP/ZICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgIA==", "followers": 48318, "text": "@BernieSanders Bernie.\n\nA list of percentages is not a lesson plan.\n\nI read your post. Then I read it again. Then I did what I do every single time a student hands me a lab report full of numbers: I looked for the source.\n\nThere isn't one.\n\nNo pollster. No date. No sample size. No margin of error. No question wording. Just five percentages floating in space like dust in a sunbeam, and a guy behind a desk telling us the \"establishment\" is out of touch. Senator, if one of my sophomores turned this in, I'd hand it back with one word written across the top in red: CITATION.\n\nYou're a weather report with no weather. A recipe with no ingredients. A lab report with a conclusion and no lab.\n\nAnd before anything else, I have to talk about the poster.\n\nBehind you, in your video, there's a red poster with a raised fist and the words \"For the Many, Not the Few.\" Bernie, do you know where that slogan comes from? That was Jeremy Corbyn's campaign slogan for the British Labour Party in 2017. Corbyn ran on the exact same playbook you're running on right now. Nationalize this. Tax that. Free everything for everybody.\n\nAnd then in 2019, British voters handed Labour its worst defeat since 1935.\n\nSo you hung the losing team's jersey on your wall and filmed a five-minute video in front of it about how popular your ideas are. That's like a guy giving a lecture on how to win at poker while sitting in front of a framed photo of his own repossessed truck. Bernie, your set decorator hates you.\n\nNow. Let's talk about your polls.\n\n\"59% want Medicare for All.\"\n\nSure, Bernie. Ask people if they want free health care, and a lot of them say yes. Ask people if they want a free puppy, and you'll get the same kind of number. Then ask the follow-up question. The one you always leave out.\n\nBack when the Kaiser Family Foundation polled this, support for Medicare for All was in the mid-50s. Then they told people it would eliminate private health insurance. Support dropped into the 30s. Then they told people it would require higher taxes. Support dropped into the 30s again. The second people heard what it actually COSTS them, the majority evaporated like a puddle in July.\n\nThat's not public opinion, Bernie. That's a sugar high. Everybody loves the cake until somebody hands them the bill for the bakery.\n\nAnd here's my favorite part. If 59 percent of Americans want Medicare for All, why couldn't your own party pass it?\n\nWhat's next, Democrats running the House, the Senate, AND the White House with a golden chance to pass Medicare for All... wait. I'm being told that happened in 2021 and 2022. It never even got a vote. Kamala Harris co-sponsored your Medicare for All bill back in 2019, then spent her 2024 campaign running away from it like it was on fire. Bernie, if your \"popular\" idea is so popular, why do the people in your own party treat it like a live grenade the second they have to put their names on a ballot?\n\nYou're a salesman bragging about how much everybody loves the free sample, while nobody ever buys the product.\n\n\"57% want a $20 minimum wage.\"\n\nThis one makes me mad, Bernie. Genuinely mad. Because I teach the kids this hurts.\n\nSixteen years old. Seventeen. No diploma yet. Nothing on the resume. Some of them have never lived in a house where an adult had a steady job. What they need more than anything in the world is a FIRST job. One manager willing to take a chance on them. One summer of showing up on time and learning how to deal with a cranky customer without quitting.\n\nWhen the Congressional Budget Office looked at a $15 minimum wage back in 2019, it estimated about 1.3 million people would lose their jobs, and possibly as many as 3.7 million. Fifteen dollars. You want twenty.\n\nAsk people \"Do you want workers to make more money?\" and of course they say yes. I say yes! Now ask them \"Do you want 1.3 million fewer jobs, mostly for teenagers and people without a diploma?\" Watch that 57 percent shrink faster than a cheap sweater in a hot dryer.\n\nYou're not raising that kid's wage, Bernie. You're locking the front door and hanging a sign on it that says \"fairness.\" And then you're flying home on a chartered jet feeling good about yourself while my student sits on the curb wondering why nobody will hire him.\n\nQuinn's Law Number Twenty-Four: every time a liberal tries to fix something, somebody somewhere loses their job. With your $20 minimum wage, that somebody is seventeen years old and sitting in the second row of my classroom.\n\n\"61% want a billionaire wealth tax.\"\n\nOf course they do. It's a tax on somebody else. Ask 100 people if they want somebody ELSE to pay more, and you'll get a landslide every time. I could get 61 percent of people to vote for a tax on left-handed accordion players.\n\nAnd we already know how wealth taxes end, because Europe ran the experiment. France had one, and money and wealthy people left in such numbers that Macron scrapped most of it in 2018. Sweden dumped theirs. Germany stopped collecting theirs. Norway's still got one, and wealthy Norwegians have been packing up for Switzerland. Your idea has been tried, Bernie. It has a return label on it in four languages.\n\n\"63% want to pause AI development.\"\n\nBernie, you posted that video on a phone, through a cell tower, onto servers in a data center, with captions running across the bottom of the screen that were very likely made with the same kind of technology you want to pause. You're using the internet to tell everybody the internet is too dangerous. That's like a guy driving to a rally to protest cars.\n\nAnd while you \"pause,\" China doesn't. China is building computing hubs as fast as they can pour concrete. Pausing AI in America doesn't stop AI. It just changes who's in charge of it. You're asking America to sit out the race and call it safety.\n\n\"66% want the wealthy to pay more into Social Security.\"\n\nOkay, Bernie, let's talk about Social Security, since your party has been in charge of \"protecting\" it for my entire life.\n\nThe government's own Social Security trustees have been warning for years that the trust fund is headed for a cliff in the early 2030s, when benefits could get cut across the board if Congress does nothing. You've been in Congress since 1991. Thirty-five years. You've had decades to fix it. You've had a Democratic president, a Democratic House, and a Democratic Senate at the same time. And what did you do? Gave speeches. Wrote books. Posted polls.\n\nThat's not protecting Social Security, Bernie. That's standing on the dock waving at the Titanic.\n\nNow. Let me name what you actually did in this post, because I teach this too.\n\nIt's called an appeal to popularity. Latin name, argumentum ad populum. \"Lots of people believe it, so it must be right.\" It's one of the oldest fallacies in the book.\n\nDo you know what else was popular once? Prohibition. So popular they put it in the Constitution. Fourteen years later they had to rip it back out because it was a disaster. Majorities have been wrong before, Bernie. Many, many times.\n\nAnd that's exactly why the Founders built a constitutional republic, not a democracy. James Madison warned in Federalist No. 10 about majorities using their numbers to take the property of everybody else. He had a word for it. He called it a \"wicked project.\" The Founders put up guardrails so that a poll, or a mob, or a mood, couldn't just vote away somebody else's paycheck because 61 percent of a survey thought it sounded nice.\n\nThe Constitution doesn't say \"unless Bernie has a poll.\"\n\nAnd let me show you how polls work, Senator. If I polled my classroom tomorrow, I already know exactly what I'd get:\n\n100% of my students want no homework. 97% want pizza every Friday. 94% want school to start at 10 AM. 89% want their phones back during tests. And 100% want a \"fair\" grading system where my A students donate some of their points to the kids who skipped half the semester.\nBy your logic, Bernie, I'm \"out of touch\" for still giving a final exam.\nThat's Quinn's Law Number Nine: to a liberal, intentions are more significant than outcomes. The intention is \"everybody gets free stuff.\" The outcome is a country that runs out of other people's money. Every poll in your post is the intention. Every single one leaves out the outcome.\nAnd \"maybe it's the establishment that's out of touch.\"\nBernie. Who do you think the establishment IS?\n\nYou've been in Congress since 1991. You've been in Washington longer than half the people reading this have been alive. You've had a Senate parking spot since before smartphones existed. You chaired the Budget Committee. You ARE the establishment, Senator. You're the furniture. You're the carpet. You're the slightly yellowed ceiling tile in the corner that nobody's replaced since the Clinton administration. You just keep talking like an outsider so nobody notices.\n\nAnd the \"fringe\" label? Bernie, Republicans aren't the ones calling your ideas fringe. Your own party is. The Democrats who ran from Medicare for All. The ones who stripped the minimum wage out of the COVID bill. The ones who cleared the field for Hillary in 2016 and for Biden in 2020 and left you standing in the rain both times. You're not mad at the establishment, Bernie. You're mad at your own party, and you're taking it out on the rest of us.\n\nSo here's my standing offer, Senator, because I make it every time and you never take it. I keep hearing Democrats demand that \"the wealthy pay more\" while they ARE the wealthy. Three houses. $221,000 on chartered jets in one quarter of 2025. Millions in book money. So go first. File with the standard deduction only. No itemizing. Pay DOUBLE what the IRS says you owe. Post the return. Then, and only then, tell me what 66 percent of a poll thinks rich people should pay.\n\nQuinn's Law Number Twenty-Five: liberals are great at giving away other people's money. Never their own.\n\nYou know what you are, Bernie? You're a carnival barker standing in front of a ride that's been shut down for safety violations, yelling about how much everybody loves roller coasters.\n\nYou're a toddler with a calculator. Lots of buttons pushed. No idea what any of the numbers mean.\n\nYou've got the economic instincts of a raccoon at a buffet. Grab everything, worry about who's paying later, and leave a mess for somebody else to clean up.\n\nYour arguments are like a screen door in a hurricane. Lots of flapping. Zero protection.\n\nYou're a one-trick pony, and the trick is complaining.\n\nYou're so far behind the times, Senator, you think \"streaming\" is something that happens to a creek.\n\nAnd if brains were taxed, Bernie, you'd finally be getting the refund you've always wanted.\n\nBut what do I know? I'm only a physics teacher who makes teenagers cite their sources, label their units, and finish the experiment before they announce the result, which is apparently three more steps than a 35-year senator takes before he hits post.\n\n@TPUSA @JoJoFromJerz @atrupar\n\n#MAGA #Trump #Veterans", "url": "https://x.com/BskiMike22802/status/2105815400634028412", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106010098099216833", "t": "2026-10-02T13:15:09+00:00", "views": 3421, "likes": 15, "reposts": 6, "handle": "HoustonChron", "name": "Houston Chronicle", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkA  an attorney working for an unknown entity put a recall election Granbury was ready to schedule on hold.\n\nAt a Granbury City Council meeting on Tuesday night, city leaders were set to schedule a recall election for May 2027.\n\nBefore they could schedule the meeting, attorney Andy Taylor announced he was suing the City of Granbury to stop the recall election.\n\nTaylor said he believes the petition that brought about the recall is invalid due to procedural issues and signature issues.\n\nGranbury City Attorney Jeremy SoRelle advised city leaders to stop the process of scheduling the recall election after Taylor's announcement.\n\nIt is unclear who Andy Taylor, who is based in Houston, filed the suit on behalf of. FOX 4 has not found any online filings of the lawsuit Taylor mentioned.\n\nFOX 4's David Sentendrey attempted to speak to Taylor as he was leaving the city council meeting, but Taylor ignored his request for comment.\n\n\"We don’t know who he’s working for. It just looks kind of fishy,\" Granbury resident Dan Fauber told Sentendrey.\n\nGranbury leaders were ready to schedule the recall election that could potentially cost them their elected positions over residential concerns over a lack of information disclosed about a data center project in the city.\n\nEarlier in 2026, Granbury City Council voted to annex 2,200 acres of land near Meadow Wood Road, and has received concept plans for a data center to be built on the land.\n\nSome Granbury residents believe their city's leaders didn't disclose enough information about the potential data center before the land was annexed.\n\nThose concerns led to 15% of the city's registered voters signing a petition to recall Granbury Mayor Jim Jarratt and four city council members, with over 1,300 signatures on the petition.\n\nResidents walked out of last week's Granbury City Council meeting when Jarratt and city council members defended their previous actions and declined to resign.\n\nWith the lawsuit canceling a potential May 2027 recall election, we will wait and see when that recall may end up being scheduled.\n\nCity officials say any official development plans for the data center would go through the city's normal review process, and would need to meet zoning and development standards before approval.", "url": "https://x.com/DavidSFOX4/status/2107689878066479456", "lane": "local_control_oversight", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2107840902739972468", "t": "2026-10-07T14:30:07+00:00", "views": 22093, "likes": 22, "reposts": 15, "handle": "Forbes", "name": "Forbes", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAbAAABBQEBAAAAAAAAAAAAAAAAAQIGBwgDBP/EABUBAQEAAAAAAAAAAAAAAAAAAAAB/9oADAMBAAIQAxAAAAGq0WRyxs1NRiQxbhp4OnPouoqC0BR6Q/zKgSCPvXV+X/ExGgL/AP/EACAQAAEEAQUBAQAAAAAAAAAAAAQBAgMFEAAGERMzIDH/2gAIAQEAAQUCxymuU+KOymCJMZFEGzch6LYHDWe0sRetpytXR05Bx s - Some of the Granbury city leaders who are subject to a recall petition are behind a lawsuit filed against the city, one that has halted plans to schedule the recall election.\n\nIn a court filing obtained and reviewed by FOX 4, several Granbury city leaders are behind a lawsuit filed on Tuesday that put plans to schedule a recall election on hold.\n\nThe suit, filed by Houston-based attorney Andy Taylor, claims a recall petition signed by registered voters in Granbury is invalid due to \"fraud, forgery and other non-accidental defects on the part of one or more persons gathering signatures.\"\n\nGranbury Mayor Jim Jarratt, Granbury Mayor Pro Tem Bruce Wadley, and Granbury City Councilman Skip Overdier are listed as plaintiffs in the suit. All three are subject to a potential recall election.\n\nThe lawsuit seeks to stop the recall election entirely.\n\nThe recall elections were brought to city council after a petition was signed by 15% of Granbury's registered voters, totaling over 1,300 signatures.\n\nThose residents expressed concern that city leaders did not disclose enough information after receiving data center concept plans that could be built on 2,200 acres of land annexed by the city earlier this year.\n\nPer the city's charter, \"Such petition shall contain a statement of the specific acts of misfeasance and/or malfeasance for which the removal is sought, and one of the signers of each petition paper shall make an affidavit as prescribed below.\"\n\nAt Tuesday's Granbury City Council meeting, city leaders were set to schedule the recall elections before Taylor announced the lawsuit. Following Taylor's announcement, Granbury City Attorney Jeremy SoRelle advised city leaders to stop the process of scheduling the recall election.\n\nNone of Jarratt, Wadley, or Overdier disclosed their involvement in the lawsuit on Tuesday night. The lawsuit was filed 30 minutes before the meeting began.\n\nResidents walked out of last week's Granbury City Council meeting when Jarratt and city council members defended their previous actions and declined to resign.\n\nWhat they're saying: \"A lot of people are mad.\"\n\nCraig Jackson, a Granbury resident who volunteers with Voices of Granbury, the group that organized the recall petition. He disagrees with what the lawsuit states.\n\n\"It’s been blatantly disrespectful how they’ve treated citizens,\" Jackson tells FOX 4's David Sentendrey.\n\nJackson still expects the recall election to move forward, and says Voices of Granbury will continue to fight.\n\n\"A lot of these city council members ran on transparency. Our mayor ran on transparency. And now we’re seeing his name on a lawsuit.\"\n\nTaylor ignored Sentendrey when asked for comment following the meeting. FOX 4 has emailed all plaintiffs in the lawsuit, but has not heard back at this time.", "url": "https://x.com/DavidSFOX4/status/2108040176274411999", "lane": "neighbors_oppose_nuisance", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108099352421937300", "t": "2026-10-08T07:37:06+00:00", "views": 1851, "likes": 0, "reposts": 0, "handle": "KPRC2", "name": "KPRC 2 Houston", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZA ingly unpopular. Our water belongs to the communities that depend on it.\n\nAs Governor, it is critical not to let people like Chris Caldwell, who has spent his career in politics and lobbying rather than in the actual work force, decide what happens to Arkansas resources. The government’s job is to protect the liberties, infrastructure, and long-term interests of Arkansans, not to facilitate deals that benefit outsiders and connected insiders.\n\nPut Arkansas first. Protect our way of life. Yes, I am a not in my back yard guy, especially when it's getting stolen from within.", "url": "https://x.com/Colt_Shelby/status/2110690414160195731", "lane": "incentives_who_pays", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110725946437189993", "t": "2026-10-15T13:34:15+00:00", "views": 279, "likes": 2, "reposts": 0, "handle": "ShelMcDougall", "name": "Sheldon McDougall", "avatar": "", "followers": 4743, "text": "I am rural, & thoroughly understand the fear of losing your land or having it become unlivable and unsellable due to data centers being built‼️\nUnderstand, however, that it is your STATE government and your COUNTY commissioners who make decisions that affect your land. Trump’s opinion on data centers isn’t relevant. For God’s sake, VOTE RED‼️Who cares about data centers if we end up living under Sharia Law & wearing a hajib‼️🤬🤬🤬https://t.co/UHQLwETrdO", "url": "https://x.com/ShelMcDougall/status/2110725946437189993", "lane": "local_control_oversight", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110737496401133951", "t": "2026-10-15T14:20:09+00:00", "views": 15129, "likes": 175, "reposts": 44, "handle": "amuse", "name": "@amuse", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRj rs. That includes his private New York dinners with CEO Trent Vichie, which his expense claims didn't properly disclose, and EverWind's lobbying for federal money and tax breaks. They broke that EverWind's provincial lobbyists came from Enterprise Canada. Its Atlantic lead was a senior strategist on Houston's 2021 campaign. The firm registered to lobby MLAs for EverWind in May 2022. Five months later, the government passed Bill 207, which lets hydrogen producers buy power wholesale.\n\nAdding on to their work, after today's announcement, I did some more digging, and basically got to the point that Timmy H almost definitely lied to all Nova Scotians on June 18th. Here's a quick look at the whole EverWind green energy/data center scam they have going on:\n\nFeb 19: Newfoundland refuses to renew EverWind's Crown land wind reserve. Its energy minister cites companies \"not being able to move their projects forward and not paying their bills.\" Companies had a total of $34.5 million in overdue land fees, EverWind among them. (CP/CTV)\n\nMar 4: EverWind announces a US$175M investment from Nuveen for its Nova Scotia projects. (EverWind)\n\nApr 13: Vichie tells Forbes Australia the Point Tupper site could eventually hold US$7–10B in assets. (Forbes AU)\n\nJun 18: The Dishonorable Tim says there's no active data centre proposal, that data centres aren't a priority, and that he wouldn't back one unless the energy supply was there. (CP/CTV)\n\nJun 26: Nova Scotia's grid operator publishes its 10-year outlook. It shows grid studies already underway for a 95 MW load and a 325 MW load in Richmond County, where Point Tupper is. (IESO-NS outlook, Table 😎\n\nOct 16: EverWind announces a $10B data centre at Point Tupper. Phase 1 is 95 MW in late 2027, phase 2 is 325 MW in 2028, and the tenant is an unnamed AI company. (GlobeNewswire, CBC)\n\nThe June 26th report is what I'm highlighting here. Same county, same two load sizes, same timing. Grid studies like these don't start overnight. So what did the Premier's office know on June 18?\n\nHere are some straight numbers to make it easy to understand how bad this is for us.\n\nThe grid: The full build is 420 MW, about 17% of the province's 2026 peak demand. The same outlook forecasts only 37 MW of firm capacity to spare above the reserve target in winter 2027/28, which is exactly when phase 1 is supposed to come online.That 37 MW doesn't even include phase 1. The grid operator told the Energy Board it hasn't studied how these loads affect supply.\n\nHouston said in June that a data centre would need new generation like offshore wind running first. That's years away. Just yesterday Canada announced $100 mil for offshore wind development with a call for bids in a year's time and a goal of first operation by 2033.\n\nOur bills: When a single customer needs this much new generation and transmission, someone has to pay for it. Right now the only commitment is a voluntary federal pledge. We already get shafted by NS Power rates. Timmy wants us to deal with this if it goes ahead, while his buddies rake in the cash.\n\nJobs: EverWind says 215 permanent jobs. That's about $46M of investment per job. Back in 2023, the hydrogen project promised 3,300+ permanent jobs and hydrogen production by 2025. Neither has happened.\n\nWater: It would draw up to 500,000 litres a day from Landrie Lake. Who pays for the water infrastructure, and what happens in a drought year? Closed loop datacenters are all lies, just ask communities in the US where these have gone and opened.", "url": "https://x.com/DavidWall_/status/2111511029108834332", "lane": "incentives_who_pays", "copy_origin": "2111506749614072150", "in_dataset": 1, "copies": 0}, {"id": "2111624446566130152", "t": "2026-10-18T01:04:34+00:00", "views": 112, "likes": 1, "reposts": 0, "handle": "siotomorrow_", "name": "sio 🌹 || mouring nqh!ubhi", "avatar": "", "followers": 1357, "text": "\"Where's the waters?!\" -chat\n\nhumble one person in chat: \"data centers\"\n\n <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script>
(async function () {
  let DATA = window.__DATA__;
  if (!DATA) {
    try { DATA = await (await fetch('data.json')).json(); }
    catch (e) { document.getElementById('app').textContent = 'No data.json found next to this page.'; return; }
  }
  const { meta, lanes, posts, edges, stats } = DATA;
  const markets = (DATA.markets || []).filter(m => (m.points || []).length > 1);
  const TZ = (meta.window && meta.window.tz) || 'UTC';
  const laneByKey = Object.fromEntries(lanes.map(l => [l.key, l]));
  const PUSHBACK = 'pushback', OTHER = 'other';
  const isMobile = window.innerWidth < 560;
  const isVideo = /[?&]video=1/.test(location.search) || document.body.classList.contains('video');
  if (isVideo) document.body.classList.add('video');

  // ---- derived ------------------------------------------------------------
  posts.forEach(p => { p.ts = +new Date(p.t); p.isCopy = !!p.copy_origin; });
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  // range: ?days=N shows the last N days of the window; long windows default to 14 so the dots stay readable
  const allMax = d3.max(posts, p => p.ts) || Date.now(), allMin = d3.min(posts, p => p.ts) || allMax;
  const windowDays = (allMax - allMin) / 864e5;
  const daysParam = (location.search.match(/[?&]days=(\d+|all)/) || [])[1];
  const rangeDays = daysParam === 'all' ? 0 : daysParam ? +daysParam : windowDays > 21 ? 14 : 0;
  const rangeStart = rangeDays ? allMax - rangeDays * 864e5 : -Infinity;
  const drawn = posts.filter(p => laneByKey[p.lane] && p.ts >= rangeStart);           // 'other' lane is not drawn
  if (!drawn.length) {
    const a = d3.select('#app');
    a.append('h1').text(meta.title);
    a.append('p').attr('class', 'sub').text(lanes.length > 1 ? 'No posts in any lane yet — run classify, then export and render again.' : 'No lanes yet — run discover (or write lanes into the incident YAML), then classify, export, render.');
    return;
  }
  const drawnIds = new Set(drawn.map(p => p.id));
  const links = edges.filter(e => drawnIds.has(e.src) && drawnIds.has(e.dst));
  const tMin = d3.min(drawn, p => p.ts), tMax = d3.max(drawn, p => p.ts);
  const span = Math.max(1, tMax - tMin);
  const vMin = Math.max(1, Math.min(meta.min_views || 1, d3.max(drawn, p => p.views) || 1)), vMax = Math.max(vMin + 1, d3.max(drawn, p => p.views) || 1);   // copies under the threshold sit at the lane floor

  const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtAxis = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);
  hl.append('p').attr('class', 'sub').text(meta.subtitle);
  if (windowDays > 10 && !isVideo) {
    const r = hl.append('p').attr('class', 'range');
    r.append('span').text('Showing ');
    [[7, 'last 7 days'], [14, 'last 14 days'], [30, 'last 30 days'], [0, 'the whole window']].filter(([d]) => !d || d < windowDays + 1).forEach(([d, label], i, arr) => {
      const on = rangeDays === d;
      r.append('a').attr('href', '?days=' + (d || 'all')).attr('class', on ? 'on' : '').text(label);
      if (i < arr.length - 1) r.append('span').text(' · ');
    });
  }
  const clock = head.append('div').attr('class', 'clock');
  const clockDate = clock.append('div').attr('class', 'date');
  const clockTime = clock.append('div').attr('class', 'time');
  const clockSpeed = clock.append('div').attr('class', 'speed');

  const statsEl = app.append('div').attr('class', 'stats');
  const stat = (cls, label) => { const s = statsEl.append('div').attr('class', 'stat ' + cls); const n = s.append('div').attr('class', 'n'); s.append('div').attr('class', 'l').text(label); return n; };
  const sPush = stat('push', 'posts pushing the story');
  const sRep = stat('rep', 'repeated posts');
  const sBack = stat('back', 'posts pushing back');

  const ctl = app.append('div').attr('class', 'controls');
  const playBtn = ctl.append('button').attr('aria-label', 'Play').text('▶');
  const slider = ctl.append('input').attr('type', 'range').attr('min', 0).attr('max', 1000).attr('value', 1000);
  const spd = ctl.append('div').attr('class', 'spd');
  spd.append('span').text(isMobile ? '' : 'speed');
  const speeds = [20, 40, 80];      // seconds for the whole window
  let speedIdx = 1;
  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.
  const band = isMobile ? 30 : isVideo ? 28 : 42;
  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;
  const stripH = markets.length ? (isMobile ? 54 : isVideo ? 62 : 72) : 0;
  // events (incidents/events.yaml) inside the drawn span, grouped when they share a moment; they get a band under the axis
  const evMap = new Map();
  (DATA.events || []).forEach(e => { const t = Date.parse(e.at); if (!(t >= tMin - span * 0.015 && t <= tMax + span * 0.02)) return; const g = evMap.get(t) || { t, labels: [], types: [] }; g.labels.push(e.label + (e.all_day ? ' (all day)' : '')); g.types.push(e.type); evMap.set(t, g); });
  const events = [...evMap.values()].sort((a, b) => a.t - b.t);
  const evBand = events.length && !isMobile ? 26 : events.length ? 10 : 0;
  const top = 22 + stripH + evBand, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : t === 'trump' ? '#ff6b6b' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
