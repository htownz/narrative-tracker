: 2494, "likes": 23, "reposts": 7, "handle": "WHPressPool", "name": "White House Press Pool Reports", "avatar": "", "followers": 23099, "text": "President Trump Is Putting American Industry, Jobs, and Paychecks Back on the Map\n\nFOR IMMEDIATE RELEASE\n\nPresident Donald J. Trump is delivering on his promise to the American worker: build it here, power it here, and put paychecks back in the communities Washington left behind. In a matter of weeks, President Trump has locked in a run of steel, nuclear, gas, shipbuilding, and medical manufacturing commitments that will hire American workers and strengthen American security.\n• President Trump announced that Mesabi Metallics will build a $15 billion steel complex in Iowa the largest steel plant ever built in the United States. Fed by American iron ore and driven by the Trump Administration’s steel tariffs, the fully integrated mine-to-mill complex will create 1,750 new, permanent jobs, support up to 6,000 construction jobs, and generate an estimated $95 billion in economic output.\n\n• President Trump and Anduril announced Arsenal-2, the biggest new American shipyard push since World War II, now moving forward in Maryland. The yard will produce critical Virginia-class components and large assemblies, create about 3,100 direct jobs, and support more than 11,000 indirect jobs. Anduril is investing $3.7 billion in private capital; the Navy is putting up to $2.9 billion behind it as part of the Trump Administration’s push to reshore America’s defense industrial base.\n\n• President Trump unveiled a South Korean energy investment package of up to $200 billion in the United States. The package includes as much as $120 billion to build eight large-scale nuclear plants, $54 billion tied to the Alaska LNG pipeline, and $22.3 billion for a six-gigawatt natural gas power facility in Texas.\n\n• Vice President Vance announced that the Department of Energy will invest $150 million to advance a major new transmission line in Alaska. The project includes 223 miles linking the Beluga power station on the southern coast with Healy in the Interior, a corridor serving ports and nearly three-quarters of the state’s population.\n\n• Becton Dickinson announced a $19 billion U.S. investment under a landmark partnership with the Trump Administration, including $3 billion to expand American manufacturing. BD will produce 100% of the needles it sells in America with American-made steel and expand domestic output of essential products.\n\n• AstraZeneca announced a $1 billion investment in Massachusetts under the $50 billion investment commitment it made in its Most Favored Nation agreement with the Trump Administration. The company is expanding its domestic research and manufacturing operation and growing its domestic workforce.\n\nOctober 8th, 2026.", "url": "https://x.com/WHPressPool/status/2108283352444792844", "lane": "texas_deliverables_affordability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108561160455032941", "t": "2026-10-09T14:12:10+00:00", "views": 11549, "likes": 127, "reposts": 28, "handle": "cbs11jack", "name": "Jack Fink", "avatar": "", "followers": 8560, "text": "NEW: @RNC announces Vice President JD Vance will headline a rally this coming Tuesday in Tyler, Texas. It will be his third visit to Texas in little over a month. @CBSNewsTexas", "url": "https://x.com/cbs11jack/status/2108561160455032941", "lane": "gop_alarm_tight_race", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108584038713737679", "t": "2026-10-09T15:43:05+00:00", "views": 1201, "likes": 28, "reposts": 2, "handle": "math3usof", "name": "Matheus Silva", "avatar": "", "followers": 3600, "text": "🇺🇸 Depois de Trump, chegou a vez de JD Vance ir ao Texas.\n\nO Texas está recebendo uma grande atenção do partido, fazendo com que eles gastam em um estado que já é “seguro”.", "url": "https://x.com/math3usof/status/2108584038713737679", "lane": "gop_alarm_tight_race", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108591079838630241", "t": "2026-10-09T16:11:03+00:00", "views": 3751, "likes": 10, "reposts": 0, "handle": "PollTracker2024", "name": "Politics & Poll Tracker 📡", "avatar": "", "followers": 68599, "text": "The Hill: JD Vance set to visit Texas for second time in 2 weeks\n\nVice President Vance will campaign in Tyler, Texas, on Tuesday, marking his second stop to the Lone Star state in a two-week period as Democrats gain ground in the polls. \n\nhttps://t.co/ZYJVQlayjr", "url": "https://x.com/PollTracker2024/status/2108591079838630241", "lane": "gop_alarm_tight_race", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108603806690976166", "t": "2026-10-09T17:01:38+00:00", "views": 1046, "likes": 19, "reposts": 6, "handle": "polyfactual", "name": "Polyfactual", "avatar": "", "followers": 15277, "text": "Republicans need 3 of 7 Senate races to keep control. Democrats need 5 of them\n\nThat math is right. It also counts Kansas as safe\n\nRepublican control is priced at 36.5% on @trylimitless \n\nRepublicans already have 31 seats that aren't up this year\nThe 7 are Alaska, Iowa, Maine, Michigan, New Hampshire, Ohio and Texas\nGive them every race outside the 7 where they're favored, and they're at 47\nWinning 3 of the 7 gets them to 50, with Vance breaking the tie\n\nRun today's odds race by race, and they win 3 or more of the 7 almost half the time\n\nSo 36.5% looks cheap\nUntil you check the seats that math calls safe\n\nIn Kansas, Roger Marshall's odds slid from 70.5% to 61.5% in a week. He's still favored, but that's about as tight as Ohio and Texas\nIn Nebraska, independent Dan Osborn is at 28.5% against Pete Ricketts\nSouth Carolina is 84.5% Republican, not a lock\nAnd New Hampshire, one of those 7, is 89.5% Democratic\n\nCount all 35 races and Republicans average about 48 seats, 2 short of 50\nIf each race moves on its own, they keep the Senate about 25% of the time\n\nThe real Republican case is that the races move together\nOne polling error in their favor could flip several races at once\n\nBy rough math, the tighter that link, the better their odds, from about 25% up to about 40%\n\n36.5% sits in the upper half of that range\n\nWill this map move as one, or will Republicans have to win it state by state?", "url": "https://x.com/polyfactual/status/2108603806690976166", "lane": "gop_alarm_tight_race", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108624547687838093", "t": "2026-10-09T18:24:03+00:00", "views": 1337, "likes": 72, "reposts": 3, "handle": "Pat_RickUSA", "name": "Patrick 🇺🇸🇻🇦", "avatar": "", "followers": 703, "text": "With the Talarico thing now LibET has there excuse for when Paxton inevitably wins by 4-5 points\n\n“Well Talarico would’ve won if he didn’t take that break from campaigning!”", "url": "https://x.com/Pat_RickUSA/status/2108624547687838093", "lane": "pushback", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2108655396718055730", "t": "2026-10-09T20:26:38+00:00", "views": 1218, "likes": 17, "reposts": 8, "handle": "TexasScorecard", "name": "Texas Scorecard", "avatar": "", "followers": 80288, "text": "Tala-Freak-Out!\n\nCatch your Daily Headlines with @bwaltens ⬇️\n\n-Paxton Campaign Launches 'Tala-Freak-Out Tip Line' to Find Missing Talarico\n-JD Vance Returning to Texas for Midterm Rally in Tyler\n-Report: Texas Schools May Have an Islamist Problem\n\n(0:00) - Paxton Campaign Launches 'Tala-Freak-Out Tip Line' to Find Missing Talarico\n(1:17) - JD Vance Returning to Texas for Midterm Rally in Tyler\n(2:53) - Report: Texas Schools May Have an Islamist Problem", "url": "https://x.com/TexasScorecard/status/2108655396718055730", "lane": "talarico_freak_smear", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108808749008003328", "t": "2026-10-10T06:36:00+00:00", "views": 7526, "likes": 18, "reposts": 7, "handle": "thehill", "name": "The Hill", "avatar": "", "followers": 4195537, "text": "Vance set to visit Texas for second time in two weeks\nhttps://t.co/pEZMuUS23I", "url": "https://x.com/thehill/status/2108808749008003328", "lane": "gop_alarm_tight_race", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2109048603155239240", "t": "2026-10-10T22:29:05+00:00", "views": 1049, "likes": 20, "reposts": 8, "handle": "EdwardMaduh", "name": "Edward Maduh, PhD", "avatar": "", "followers": 16472, "text": "BREAKING: Can Democrats flip the Senate on Nov 3? It's closer than it's been in years, and Democrats are now slight favorites.\n\n🔢 THE MATH\nRepublicans hold 53 seats. Democrats need a net gain of 4 to reach 51, because Vice President Vance breaks a 50–50 tie. Forecasters give Democrats a 54% (Call the Map) to 56% (Decision Desk HQ) chance of control.\n\n🔵 BEST PICKUP CHANCE\n• North Carolina: Roy Cooper leads Michael Whatley by about 10 points. This is Democrats' likeliest flip.\n\n⚖️ THE TOSS-UPS THAT DECIDE IT\n• Ohio: Sherrod Brown vs. Sen. Jon Husted\n• Maine: Troy Jackson vs. Sen. Susan Collins\n• Texas: James Talarico vs. Ken Paxton\n• Iowa: Josh Turek vs. Ashley Hinson\n• Alaska: Mary Peltola vs. Sen. Dan Sullivan\nTrump won Ohio, Texas, Iowa and Alaska by double digits in 2024, and Democrats are competitive in all four anyway.\n\n🔥 THE MAP IS EXPANDING\n• Kansas: Adam Hamilton vs. Sen. Roger Marshall (Cook rates it a Toss Up)\n• South Carolina: Annie Andrews vs. Sen. Darline Graham\n• Florida: Angie Nixon vs. Sen. Ashley Moody\n• Nebraska: independent Dan Osborn vs. Sen. Pete Ricketts\n\n🛡 SEATS DEMOCRATS MUST HOLD\n• Michigan: Dr. Abdul El-Sayed vs. Mike Rogers, the GOP's top target\n• Georgia: Sen. Jon Ossoff leads by about 9\n• New Hampshire: Chris Pappas\n• Minnesota: Peggy Flanagan\n\nTHE PATH: Hold Michigan, flip North Carolina, then win 3 of the 5 toss-ups. A blue wave could add Kansas, South Carolina or Florida on top of that.\n\n24 days left. Every race counts. 🗳️ #Senate2026 #Midterms2026", "url": "https://x.com/EdwardMaduh/status/2109048603155239240", "lane": "go efense. It Gave The @ENERGY Department Power To Provide Financial Support, Purchases & Other Help Under The Cold War-Era Defense Production Act. The Goal Was To Prevent Shortages That Could Hurt The Military, Industry & The Economy.\n\nU.S. Refineries Have Been Running Near Full Capacity. Diesel Prices Have Climbed Above $6 A Gallon At Times Amid Global Supply Concerns Linked To The Iran Conflict.\n\nRefiners Have Told Officials That Money Is Better Spent Improving & Expanding Existing Plants Than Waiting Years For Completely New Ones.\n\nThe Tyler Expansion Is One Concrete Example Of That Strategy. It Puts Federal Tools To Work Right Here In East Texas. The Result Should Be More Fuel Made At Home, More Local Jobs & Greater Protection Against Sudden Price Spikes. Families Who Fill Up Trucks Or Heat Homes Can Feel The Difference. The Military Gets A More Secure Supply Of Spec Fuel. America Gets Another Step Toward Energy Strength.\n\nOfficials Have Not Yet Released Exact Capacity Numbers Or Dollar Amounts For The Tyler Project. Details Are Expected To Follow The Announcement. The Broader Authority Has Already Been In Place For Months. This Rally Speech Marks A Clear Public Step Forward On Using It For Refining. https://t.co/84pbrApVnf", "url": "https://x.com/JohnBasham/status/2110061486055866739", "lane": "texas_deliverables_affordability", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110061902365602114", "t": "2026-10-13T17:35:35+00:00", "views": 267171, "likes": 15767, "reposts": 1533, "handle": "townhallcom", "name": "Townhall.com", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBja ext": "🚨 BOOM! JD Vance just dropped this line and walked off stage in Texas:\n\n\"Will you vote for the future we want to leave for our children here in Texas? Are we going to vote to send KEN PAXTON to the United States Senate? My friends, Texas has NEVER voted for somebody else to fight its battles!\"\n\n\"So this November, let's send KEN PAXTON to Washington and let's get back to work for the United States of America. God bless you, Texas!\" 🇺🇸\n\nTexas went DEEP RED in 2024 and voters are NOT suddenly pro-socialist and pro-trans in less than 2 years.\n\nThat is ALL Talarico would be. A rubber stamp for Hakeem Jeffries, Chuck Schumer and all the socialist BS they put up for a vote!\n\nTX might decide who controls the US Senate. VOTING RED IS THE ONLY WAY.", "url": "https://x.com/EricLDaugh/status/2110062373834772899", "lane": "rally_strength_paxton_boost", "copy_origin": null, "in_dataset": 1, "copies": 1}, {"id": "2110062479380267352", "t": "2026-10-13T17:37:52+00:00", "views": 16106, "likes": 148, "reposts": 21, "handle": "Republicans", "name": "Republicans", "avatar": "", "followers": 3456140, "text": ".@JDVance: James Talarico bends the knee to the far-Left\n\n\"[James Talarico] will NEVER fight for Texas.\" https://t.co/NcZyXfYbs1", "url": "https://x.com/Republicans/status/2110062479380267352", "lane": "talarico_freak_smear", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110062529888068018", "t": "2026-10-13T17:38:04+00:00", "views": 2873, "likes": 12, "reposts": 3, "handle": "WHPressPool", "name": "White House Press Pool Reports", "avatar": "", "followers": 23104, "text": "VP travel pool report #4 - Vance remarks\n\nVance concluded his remarks at 12:26 CT with a wave to the crowd and he headed back behind thr stage.\n\nPool is waiting for Vance under the wing of AF2. Pool walked by Vance talking to staff while members of congress and Brooke Rollins mingled with people backstage, near what looked like a photo line.\n\nThe rally was standing room only just outside the hanger, with all seats taken. (Pooler asked for a crowd estimate). There’s at least several hundred seats. Crowd waved “defend our future” signs, along with the Texas flag and American flag. Many wore Make America Great Again hats. One woman held a portrait of Vance up.\n\nA woman was taken out a few minutes after Vance began speaking for disrupting the crowd. Vance told her to get the hell out, we are trying to save this country.\n\nVance talked about Paxton’s record, and Paxton’s lawsuits against the Biden administration:\n“Now you all know the saying better than I do. You don’t mess with Texas. And you know why you don’t mess with Texas? Because if you do, Ken Paxton's going to kick your ass.”\n\nOn bringing energy prices down:\nVance announced that the administration was using the Defense Productiom Act to expand the refinery there.\n“We are going to expand the refinery right here in Tyler Texas”\n“Here's what we want to do, ladies and gentlemen. We want millions of gallons of commercial grade and military spec fuel to come out of this refinery, in addition to what it's already producing.”\n\nOn Talerico:\n“Ladies and gentleman, this guy’s a freak. Don’t elect him, pick Ken Paxton”\n“James Talarico needs to take a week or two to get his own head examined because he's lost his damn mind”\n\nNatalie Andrews\nThe Wall Street Journal\nTue. Oct. 13, 1:34 PM", "url": "https://x.com/WHPressPool/status/2110062529888068018", "lane": "rally_strength_paxton_boost", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110062621743272241", "t": "2026-10-13T17:38:26+00:00", "views": 7582, "likes": 271, "reposts": 38, "handle": "RedWavePress", "name": "RedWave Press", "avatar": "", "followers": 250405, "text": "Vice President JD Vance TORCHES radical RACIST progressive James Talarico: “There's so much material. He said, and I quote, ‘racism is a virus that white people spread simply by virtue of their skin color.’ You know, I come from a political movement. I know Ken Paxton agrees with me, where we believe that everybody, rich or poor, black or white, is welcome. You just got to love this country.”\n\n“While we're on the subject of barbecue, sir, somebody just shouted out barbecue. That guy with the American flag shirt. Now, Talarico, sir, his views on barbecue are that it is, quote, ‘existential that Texas stopped eating so much meat.’  “He proudly announced, I can't believe this is real. His campaign was in his words about, quote, ‘buying vegan products from local vegan businesses.’ Now, our wonderful secretary of agriculture, Brooke [Rollins], I'm sure you love that one.”\n\nTexas WILL NEVER elect a man who doesn’t believe in eating meat.", "url": "https://x.com/RedWavePress/status/2110062621743272241", "lane": "talarico_freak_smear", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110063316684939491", "t": "2026-10-13T17:41:12+00:00", "views": 9461, "likes": 483, "reposts": 48, "handle": "AuntSassyAss", "name": "Auntie Smartassy", "avatar": "", "followers": 25740, "text": "What is wrong with JD Vance?", "url": "https://x.com/AuntSassyAss/status/2110063316684939491", "lane": "vance_homophobic_smear", "copy_origin": null, "in_dataset": 0, "copies": 0}, {"id": "2110063417889616005", "t": "2026-10-13T17:41:36+00:00", "views": 34497, "likes": 1537, "reposts": 241, "handle": "theblaze", "name": "TheBlaze", "avatar": "", "followers": 1041467, "text": "JD Vance: \"James Talarico was asked what he loves in life besides his own family and friends and he responded without skipping a beat and said trans children. Ladies and gentlemen, this guy is a freak! Don't elect him. Elect Ken Paxton!\" https://t.co/SkCyHymUCX", "url": "https://x.com/theblaze/status/2110063417889616005", "lane": "talarico_freak_smear", "copy_origin": "2110057092224856552", "in_dataset": 1, "copies": 0}, {"id": "2110063839844921520", "t": "2026-10-13T17:43:17+00:00", "views": 1833, "likes": 14, "reposts": 3, "handle": "ClaroyDi <script>
(async function () {
  let DATA = window.__DATA__;

    try { DATA = await (await fetch('data.json')).json(); }
    catch (e) { document.getElementById('app').textContent = 'No data.json found next to this page.'; return; }
  }
  const { meta, lanes, posts, edges, stats } = DATA;
  const markets = (DATA.markets || []).filter(m => (m.points || []).length > 1);
  const TZ = (meta.window && meta.window.tz) || 'UTC';
  const laneByKey = Object.fromEntries(lanes.map(l => [l.key, l]));
  const PUSHBACK = 'pushback', OTHER = 'other';
  const isMobile = window.innerWidth < 560;
  const isVideo = /[?&]video=1/.test(location.search) || document.body.classList.contains('video');
  if (isVideo) document.body.classList.add('video');

  // ---- derived ------------------------------------------------------------
  posts.forEach(p => { p.ts = +new Date(p.t); p.isCopy = !!p.copy_origin; });
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  // range: ?days=N shows the last N days of the window; long windows default to 14 so the dots stay readable
  const allMax = d3.max(posts, p => p.ts) || Date.now(), allMin = d3.min(posts, p => p.ts) || allMax;
  const windowDays = (allMax - allMin) / 864e5;
  const daysParam = (location.search.match(/[?&]days=(\d+|all)/) || [])[1];
  const rangeDays = daysParam === 'all' ? 0 : daysParam ? +daysParam : windowDays > 21 ? 14 : 0;
  const rangeStart = rangeDays ? allMax - rangeDays * 864e5 : -Infinity;
  const drawn = posts.filter(p => laneByKey[p.lane] && p.ts >= rangeStart);           // 'other' lane is not drawn
  if (!drawn.length) {
    const a = d3.select('#app');
    a.append('h1').text(meta.title);
    a.append('p').attr('class', 'sub').text(lanes.length > 1 ? 'No posts in any lane yet — run classify, then export and render again.' : 'No lanes yet — run discover (or write lanes into the incident YAML), then classify, export, render.');
    return;
  }
  const drawnIds = new Set(drawn.map(p => p.id));
  const links = edges.filter(e => drawnIds.has(e.src) && drawnIds.has(e.dst));
  const tMin = d3.min(drawn, p => p.ts), tMax = d3.max(drawn, p => p.ts);
  const span = Math.max(1, tMax - tMin);
  const vMin = Math.max(1, Math.min(meta.min_views || 1, d3.max(drawn, p => p.views) || 1)), vMax = Math.max(vMin + 1, d3.max(drawn, p => p.views) || 1);   // copies under the threshold sit at the lane floor

  const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtAxis = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);

    [[7, 'last 7 days'], [14, 'last 14 days'], [30, 'last 30 days'], [0, 'the whole window']].filter(([d]) => !d || d < windowDays + 1).forEach(([d, label], i, arr) => {
      const on = rangeDays === d;
      r.append('a').attr('href', '?days=' + (d || 'all')).attr('class', on ? 'on' : '').text(label);

    });
  }
  const clock = head.append('div').attr('class', 'clock');
  const clockDate = clock.append('div').attr('class', 'date');

  const statsEl = app.append('div').attr('class', 'stats');
  const stat = (cls, label) => { const s = statsEl.append('div').attr('class', 'stat ' + cls); const n = s.append('div').attr('class', 'n'); s.append('div').attr('class', 'l').text(label); return n; };
  const sPush = stat('push', 'posts pushing the story');
  const sRep = stat('rep', 'repeated posts');

  const ctl = app.append('div').attr('class', 'controls');

  spd.append('span').text(isMobile ? '' : 'speed');
  const speeds = [20, 40, 80];      // seconds for the whole window

  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.

  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;

  // events (incidents/events.yaml) inside the drawn span, grouped when they share a moment; they get a band under the axis
  const evMap = new Map();
  (DATA.events || []).forEach(e => { const t = Date.parse(e.at); if (!(t >= tMin - span * 0.015 && t <= tMax + span * 0.02)) return; const g = evMap.get(t) || { t, labels: [], types: [] }; g.labels.push(e.label + (e.all_day ? ' (all day)' : '')); g.types.push(e.type); evMap.set(t, g); });
  const events = [...evMap.values()].sort((a, b) => a.t - b.t);
  const evBand = events.length && !isMobile ? 26 : events.length ? 10 : 0;
  const top = 22 + stripH + evBand, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
