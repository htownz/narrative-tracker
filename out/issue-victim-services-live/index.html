8nIzuXWliLoqCpb+QrWRPObMs6gGh7ZnORF4mCkAUcRLoYNVLj8VjmvBuUSBF6E0Q4KCClgDpIohBgqyolbj4AKQN68v2JZKHcHpNQFyoDOgj65gpm0nQdMpXHa0CTjomTd25dlHcGISDSc9pe5jeoXWf5BtIrVA5AV8uD9tcwKCOObgM+CqM6q3ihmwSnHd/TGiViSCgi7oviFoA2eW6YxCKuVl1opt6Znjh0cDy8zItCIgvjy9x54ZOGJArSXTqJ8zECQoQfYHF/Vi3JM2p2sH82NuP/9kgICAgICAgICAgICAgICAgICAgICAgICAgICA=", "followers": 170538, "text": "CAIR Scandal: Which Islamist Groups Received Biden Administration Funding? | Antonio Graceffo, The Gateway Pundit\n\nThe Department of Health and Human Services (HHS) is reviewing whether the Council on American-Islamic Relations (CAIR) misused federal grants intended for Afghan refugees. HHS Secretary Robert F. Kennedy Jr. announced the review on June 9, 2026. It covers CAIR National and its California and Washington affiliates.\n\nThe review followed an April 27 letter from Rep. Chip Roy (R-TX) and 13 other House Republicans urging HHS to suspend CAIR and begin debarment proceedings to bar it from federal grants government-wide. Under federal regulations, debarment generally lasts no more than three years, though the debarring official may impose a longer period if circumstances warrant.\n\nCAIR describes itself as the nation’s largest Muslim civil rights and advocacy organization. Concerns about the group stem largely from the federal prosecution of the Holy Land Foundation, a Texas charity accused of funneling more than $12 million to Hamas, a U.S.-designated terrorist organization. In 2008, five former officials were convicted on 108 counts.\n\nProsecutors named CAIR an unindicted co-conspirator. U.S. District Judge Jorge Solis denied its request to remove its name from the list. In a July 2009 order, he wrote that the government had produced “ample evidence” establishing CAIR’s associations with the Holy Land Foundation, the Islamic Association for Palestine, and Hamas. Ghassan Elashi, a CAIR-Texas figure, was among those convicted and was sentenced to 65 years for financing terrorism.\n\nIn April 2009, the FBI said it had suspended formal contacts with CAIR and would not treat it as a liaison partner until it could resolve whether the group or its executives remained connected to Hamas. CAIR denies any ties to terrorism.\n\nCAIR is not the only Islamist organization to receive HHS funding. A July 2026 Middle East Forum audit identified 14 organizations it describes as Islamist or terror-linked that received $79 million in HHS funding since 2010. According to the audit, 87 percent, about $68.5 million, was awarded between 2022 and 2025. Federal award records show that at least eight received funding during the Biden administration, while four foreign recipients received money through awards signed before 2021. Each of the 14 groups is examined below.\n\nCAIR chapters received about $42.2 million in HHS-funded Afghan resettlement grants through state agencies and private organizations since July 2022. This included $40.7 million for CAIR-California and about $1.5 million for chapters in Washington and Oklahoma.\n\nIn March 2025, the Intelligent Advocacy Network filed a DOJ complaint alleging that CAIR-California redirected $3.6 million of a $7.2 million HHS grant to itself and affiliated chapters, failed to deliver promised services, and omitted the funding from its tax forms.\n\nThe United Arab Emirates designated CAIR a terrorist organization in 2014. The governors of Texas and Florida issued state designations in late 2025. A federal judge blocked Florida’s order in March 2026.\n\nThe Dar al-Hijrah Islamic Center in Falls Church, Virginia, received nearly $860,000 in HHS sub-grants through the Virginia Department of Social Services in 2024, mostly for Afghan support services. From 2021 to 2023, it received about $340,000 for COVID-19 and influenza vaccine outreach, including funds to “dispel myths” about vaccination.\n\nAnwar al-Awlaki, who later became an al-Qaeda recruiter and was killed in a 2011 U.S. drone strike, served as the mosque’s imam in 2001. The 9/11 Commission Report describes how a mosque member helped two hijackers, Nawaf al-Hazmi and Hani Hanjour, find an apartment.\n\nAccording to the Middle East Forum, Department of Homeland Security records obtained through a Freedom of Information Act request described the mosque as a front for Hamas operatives. Ismail Elbarasse, who helped found the mosque, was an assistant to Hamas political leader Mousa Abu Marzook.\n\nShaker Elsayed, a former imam, resigned in 2017 after advocating female genital mutilation and later described COVID-19 as divine punishment.\n\nICNA Relief, the domestic humanitarian arm of the Islamic Circle of North America (ICNA), received $10.6 million from HHS, including an $819,000 grant in 2024 for refugee cash and medical assistance. The Middle East Forum links ICNA to Jamaat-e-Islami, a South Asian Islamist movement whose Kashmiri wing, Hizbul Mujahideen, is a U.S.-designated terrorist organization.\n\nAshrafuzzaman Khan, who helped establish ICNA and served as vice president, was convicted in absentia in Bangladesh of murdering 18 intellectuals during the 1971 war. Erick Jamal Hendricks, a former ICNA youth coordinator, is serving a 15-year sentence for conspiring to support the Islamic State.\n\nThe Islamic Center of Detroit, located in Dearborn, Michigan, received $40,000 from HHS in 2022 for mosque renovations. Two additional HHS-funded sub-grants of $500,000 each were obligated in 2024 and 2025 through the Michigan Department of Labor and Economic Opportunity for refugee job placement services.\n\nExecutive director Sufian Nabhan served on the board of the Islamic Association of Palestine, which shut down after a civil court found it financially liable for Hamas violence. He later served on the board of American Muslims for Palestine, which faces a Senate HELP Committee investigation into alleged Hamas ties.\n\nImran Salha, the center’s head imam, told a Dearborn rally on October 10, 2023, that Israel’s past actions had put “fire in our hearts that will burn that state” until its demise.\n\nTrending: REVEALED: American Airlines Msturbator Identified – Drunk Woman Caught on Camera Touching Herself\n\nThe Inner City Muslim Action Network (IMAN), with branches in Chicago and Atlanta, received $6,443,783 from HHS, mostly for health center upgrades and expanded access to COVID-19 vaccines.\n\nThe Middle East Forum reports that IMAN’s donors include the Barzinji and Mirza family foundations, which it describes as successors to the SAAR Network, a group of businesses and nonprofits accused of financial connections to al-Qaeda, Hamas, and Palestinian Islamic Jihad. IMAN has also partnered with the Islamic Society of North America, an unindicted co-conspirator in the Holy Land Foundation case.\n\nSameera Fazili, a former deputy director of the National Economic Council under President Biden, chairs IMAN-Atlanta’s advisory committee.\n\nLeaders Advancing and Helping Communities (LAHC), a Lebanese Shi’a community organization in Dearborn, received a $616,184.90 HHS grant beginning in December 2020 to combat substance abuse. It later received a $200,000 HHS award, of which $150,000 has been paid, to prevent underage drinking, and two HHS-funded sub-grants of $71,717 each in 2025 to combat opioid addiction.\n\nAccording to the Middle East Forum, senior LAHC leaders and board members have defended Hezbollah in public statements and appeared at rallies supporting the group. Allegations linking founder Ali Jawad to Hezbollah originated with blogger Debbie Schlussel, who provided no sources. Jawad left John McCain’s 2008 presidential campaign after the allegations surfaced.\n\nWayne County Commissioner Sam Baydoun, then an LAHC board member, spoke at a Dearborn rally on September 25, 2024, where participants chanted “Death to Israel.”\n\nThe Muslim American Society (MAS) in Sacramento received $90,000 in HHS funds for a reproductive health literacy program with the University of California-Irvine for Afghan and Syrian refugees.\n\nIn a 2008 sentencing opinion, the U.S. Court of Appeals for the Fourth Circuit stated that MAS was founded as the overt arm of the Muslim Brotherhood in America. The United Arab Emirates designated MAS a terrorist organization in 2014. In January 2026, the Trump administration designated the Egyptian and Jordanian branches of the Muslim Brotherhood as Specially Designated Global Terrorists.\n\nThe Muslim Community Center in Silver Spring, Maryland, received a $250,000 earmark through HHS in 2022 to expand its health clinic. In January 2000, it held a fundraiser for the Benevolence International Foundation, which the Treasury Department later designated for funding al-Qaeda. Nidal Hasan, who killed 13 people at Fort Hood in 2009, attended Friday prayers at the center. Its imam at the time, Faizul Khan, was a senior leader of the Islamic Society of North America.\n\nPeace in the Home Family Services, formerly the Texas Muslim Women’s Foundation, received at least $1.6 million from HHS, mostly to combat domestic violence and provide shelter and counseling. According to the Middle East Forum, it received more than $11 million in public funds between 2015 and 2025. The group hosted Imam Omar Suleiman as the keynote speaker at its 2017 fundraising dinner, partnered with MAS, and promoted a Students for Justice in Palestine event in 2011.\n\nIslamic Relief Worldwide, headquartered in the United Kingdom, received $270,000 in HHS funds through a consortium sub-grant for an infectious disease preparedness project in Kenya. Israel banned the group in 2014, stating it financed Hamas, and the United Arab Emirates designated it a terrorist entity that year. Germany ended all projects with the group in 2020 over its Muslim Brotherhood ties.\n\nIn January 2021, the U.S. State Department cut ties with the organization, citing antisemitism and glorification of violence among senior leaders. In March 2026, its American branch, Islamic Relief USA, filed suit to sever its corporate relationship with the parent organization.\n\nThe Nigerian Supreme Council of Islamic Affairs received $80,387 in HHS funds through Cincinnati Children’s Hospital in 2021 to study sickle cell anemia treatments. Its secretary-general, Ishaq Oloyede, has said claims of a Christian genocide in Nigeria are driven by far-right and pro-Israeli actors. The council has also sought to establish Sharia panels in Christian-majority southern states.\n\nThe Palestinian Center for Policy and Survey Research in Ramallah received $128,800 in HHS funds through the University of Notre Dame in 2023 for research on a family support program. Its director, Khalil Shikaki, is the brother of Fathi Shikaki, a founder and the first commander of Palestinian Islamic Jihad. Testimony before the House Financial Services Committee and exhibits from the Sami Al-Arian terrorism case link Khalil Shikaki to money transfers among suspected Palestinian Islamic Jihad members in the early 1990s. He is currently a professor at Brandeis University.\n\nAligarh Muslim University in India received $389,810 in HHS funds through a Boston hospital in 2016 and 2017 for cancer research. Indian authorities arrested several students and alumni in 2023 and 2024 for alleged Islamic State links. The Students Islamic Movement of India, which India banned after 9/11, was founded at the university.\n\nCheikh Anta Diop University in Dakar, Senegal, received $3.59 million in HHS sub-grants from U.S. universities, mostly for HIV research. This included $110,000 from the University of Rochester to study gay Muslim men living with HIV. The Middle East Forum reports growing Salafi influence on campus, and a human rights group counted 10 incidents of student mobs pursuing men suspected of being gay between 2012 and 2016.\n\nhttps://t.co/SvvZinHzVy", "url": "https://x.com/OwenGregorian/status/2108176235595469310", "lane": "grant_misuse_scrutiny", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2108650141250945   const sPush = stat('push', 'posts pushing the story');

  const events = [...evMap.values()].sort((a, b) => a.t - b.t);

  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);

  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');

    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };

  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };

  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
