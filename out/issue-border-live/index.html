rZhowRH3WLqewolIm7WCuGWUaBI5m9bmc9O8AUqQ4eMBmqWBB3zh6x/pEzisnjawzWyYpF0PpyD/AOPMF/cMA6FBt2X/AJlTuGWAlX719TN6wIO5DNSQ6EAbrAHg7Mp8SI918Z2dVH1HwHM63xj2ugUkh/mLMSKhAeHbWE94MaOlAAFPVMogAF5wfsUJJStuOjWK1atAQtNbYT85aOJTkPThyZwI352frNhHAYJRCdZ//9kgICAgICAgICAg", "followers": 203076, "text": "ALERT: 🚨  Federal court blocks Trump administration border wall in Texas’ Big Bend region. \n\nOn Friday, October 2, 2026, U.S. District Judge Kathleen Cardone of the Western District of Texas in El Paso granted a preliminary injunction in a case filed by the Center for Biological Diversity, Friends of the Ruidosa Church, and a local river guide and landowner. \n\nThe order says the Department of Homeland Security, Secretary Markwayne Mullin, and Customs and Border Protection may not build border barriers or related infrastructure, or do construction or ground-disturbing work, in the Big Bend sector unless they comply with all applicable laws.\n\nCardone found the plaintiffs are likely to succeed on at least one claim, that they would face serious, irreparable harm without a pause, and that the balance of equities and the public interest favor the injunction. The order stays in place while the court decides the full case, which was filed in April.\n\nThe dispute centers on DHS waivers, issued under a 1996 border-infrastructure statute, that set aside a long list of environmental, historic-preservation, and park laws so work could move faster. \n\nChallengers say those waivers were used improperly inside and around Big Bend National Park and Big Bend Ranch State Park. Clearing near Santa Elena Canyon began in early August; after public and bipartisan criticism, CBP Commissioner Rodney Scott briefly paused work, and activity later resumed in parts of the region. \n\nPlanned projects in the park have been described as roads, vehicle barriers, and surveillance rather than the taller steel walls used elsewhere.The Big Bend sector covers more than 500 miles of the Rio Grande frontier in remote West Texas. \n\nThe work is part of a much larger southern-border infrastructure program. A separate suit tied to flooding concerns near Presidio had earlier failed to win an injunction after a related waiver was issued.\n\nThe administration has said it stands by its assessment and remains confident in its legal authority to secure the border while accounting for the region’s landscape. \n\nThe injunction does not end the broader wall program; it blocks this sector’s construction unless the government follows the laws the waivers sought to suspend, pending a final ruling.\n\nSources: reporting from the Associated Press, Reuters, The New York Times, and the Center for Biological Diversity (October 2–3, 2026).", "url": "https://x.com/911NewsBreaks/status/2106256895983968425", "lane": "activist_judges_block_wall", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106265540385808534", "t": "2026-10-03T06:10:12+00:00", "views": 1073, "likes": 10, "reposts": 0, "handle": "SreeIyer1", "name": "Sree Iyer", "avatar": "", "followers": 39800, "text": "Federal Court Temporarily Blocks Trump Administration's Border Wall in Texas' Big Bend Region - \nhttps://t.co/hAAE7Z5emI", "url": "https://x.com/SreeIyer1/status/2106265540385808534", "lane": "big_bend_wall_win", "copy_origin": "at://did:plc:cvgjuh3a42ina33yol2znsnq/app.bsky.feed.post/3mwwb3y374h27", "in_dataset": 1, "copies": 0}, {"id": "2106315917869101169", "t": "2026-10-03T09:30:22+00:00", "views": 5469, "likes": 24, "reposts": 5, "handle": "JustTheNews", "name": "Just the News", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtb agle_pass_biden_invasion", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106533517794435253", "t": "2026-10-03T23:55:02+00:00", "views": 3940, "likes": 338, "reposts": 105, "handle": "GovHotWheels_TX", "name": "Governor Hot Wheels", "avatar": "", "followers": 68783, "text": "Texans will never forget what happened at our southern border under the Biden Administration, and we will not go back.\n\nWhen Washington failed to secure the border, Governor Abbott stepped up and launched Operation Lone Star to protect Texans.\n\nNo more open borders.\nNo more unchecked illegal crossings.\nNo more deadly drugs pouring into our communities.", "url": "https://x.com/GovHotWheels_TX/status/2106533517794435253", "lane": "lone_star_vindicated_reimbursement", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106729641566187633", "t": "2026-10-04T12:54:22+00:00", "views": 2834, "likes": 11, "reposts": 0, "handle": "OwenGregorian", "name": "Owen Gregorian", "avatar": "", "followers": 170531, "text": "Federal Judge Pauses Trump's Border Infrastructure Project in Big Bend National Park | Randy Clark, Breitbart\n\nUnited States District Judge Kathleen Cardone issued an emergency injunction blocking the Trump administration from continuing work to construct vehicle barriers, patrol roads, and accompanying lighting in the West Texas Big Bend Sector. The ruling, handed down in El Paso on Friday, also halts any construction or ground disturbance within Big Bend National Park in remote West Texas.\n\nCardone issued the order after considering witness testimony in a case brought against Department of Homeland Security Secretary Markwayne Mullin by Friends of the Ruidosa Church et al. The case challenges the federal government’s use of waiver authority related to environmental law to speed completion of the project.\n\nLaiken Jordahl, national public lands advocate for the Center for Biological Diversity, a plaintiff in the lawsuit, issued a statement on the injunction, saying, “This is a historic victory for Big Bend and everyone who loves this wild corner of Texas. No administration has the right to destroy a crown-jewel national park for political theatre. With a federal court ordering the bulldozers to stop, Big Bend gets to breathe. But this fight is far from over. We won’t rest until Big Bend’s environmental protections are fully restored and the illegal waiver that allowed so much destruction is gone for good.”\n\nAnother plaintiff in the lawsuit is a Big Bend river guide and landowner. The lawsuit challenges the federal government’s waiver process used to construct border security infrastructure within Big Bend National Park, Big Bend Ranch State Park, and throughout the Big Bend Region.\n\nIn her ruling, Judge Cardone wrote, “The Court finds that Plaintiffs are likely to succeed on the merits of at least one of the claims in suit, that there is a likelihood that they will suffer serious, irreparable harm without an injunction, and that the balance of the equities and the public interest weigh in their favor.”\n\nCardone’s instruction to the federal government included the following: “Effective immediately and until the Court orders otherwise, Defendants SHALL NOT build border barrier or related infrastructure, or engage in any construction or ground-disturbing activities, in the Big Bend Sector until and unless Defendants comply with all applicable laws.”\n\nAs Breitbart Texas reported, in mid-August, U.S. Customs and Border Protection Commissioner Rodney Scott paused the infrastructure projects underway within Big Bend National Park.\n\nPoliticians on both sides of the aisle had been closely scrutinizing the projects, Breitbart Texas reported. Senator John Cornyn (R-TX) joined local politicians and James Talarico, the Democratic nominee in Texas’s 2026 U.S. Senate race, in opposing the border security enhancements.\n\nThe installation of physical barriers within the state has also proven unpopular with ranchers outside the park. Many private landowners have met the projects with skepticism, and many hold large tracts of land and worry about losing access to parts of their property because of border barrier construction. Ranchers also worry that increased federal presence on their property will affect livestock and hunting.\n\nCBP has clarified that its infrastructure plans within Big Bend National Park would involve only constructing one new access road, improving existing roads, installing detection technology, and placing vehicle barriers in limited, strategic locations.\n\nAccording to CBP, the work would not include building a 30-foot border wall in the park.\n\nPresident George W. Bush appointed Judge Cardone as a district judge in the Western District of Texas in 2003.\n\nThe case is styled “Friends of the Ruidosa Church et al. v. Mullin et al. (Case No. 3:26-cv-01099-KC)” in the U.S. District Court for the Western District of Texas.\n\nhttps://t.co/c0dfL1u1EU", "url": "https://x.com/OwenGregorian/status/2106729641566187633", "lane": "activist_judges_block_wall", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2106768281042591989", "t": "2026-10-04T15:27:54+00:00", "views": 43476, "likes": 1382, "reposts": 204, "handle": "merissahansen17", "name": "Merissa Hansen", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAA  "https://x.com/TexasTribune/status/2110760164047429918", "lane": "abbott_emergency_overreach", "copy_origin": "2110678671790907560", "in_dataset": 1, "copies": 0}, {"id": "2110773091580432486", "t": "2026-10-15T16:41:35+00:00", "views": 1709, "likes": 139, "reposts": 44, "handle": "jacquie_rn", "name": "Jacquie_RN 🇨🇦🩺🌸🌷", "avatar": "", "followers": 14037, "text": "It really is that simple. \nThere’s a video of Trump and Abbott \nWalking and talking outside in Texas\nAt the border \nAnd they’re both being mauled by flies\nNo one else is getting mauled by them\nJust the 2 guys who sit in 💩 all day. \n🦟💩🦟💩", "url": "https://x.com/jacquie_rn/status/2110773091580432486", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2110773585644011930", "t": "2026-10-15T16:43:33+00:00", "views": 4560, "likes": 21, "reposts": 2, "handle": "PollTracker2024", "name": "Politics & Poll Tracker 📡", "avatar": "", "followers": 69603, "text": "Texas Tribune: Greg Abbott Keeps Renewing Border Emergency Order\n\nLast month, Texas Governor Greg Abbott repeated a claim he’s made for the past five years. He stated that the number of people crossing the Texas-Mexico border illegally “posed an ongoing and imminent threat” across the state. In doing so, he renewed a border security disaster proclamation that has greatly expanded his powers without going through the state Legislature.\n\nhttps://t.co/0k6jOJFStW", "url": "https://x.com/PollTracker2024/status/2110773585644011930", "lane": "abbott_emergency_overreach", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111087258321162453", "t": "2026-10-16T13:29:59+00:00", "views": 1840, "likes": 17, "reposts": 3, "handle": "OwenGregorian", "name": "Owen Gregorian", "avatar": "", "followers": 170634, "text": "National Border Patrol Union SLAMS Talarico for Lying About Supporting Border Security – “He Labeled Border Security Funding as Wasted Money” | Jim Hoft, The Gateway Pundit\n\nThe National Border Patrol Union slammed Democrat-socialist James Talarico for lying about his support for border security.\n\nThe BP Union pointed out that James Talarico is lying about calling out the Biden regime for failing on the border.\n\nThis is the same far-left extremist James Talarico who said border security funding was “wasting money on dumb things.” Talarico instead supported diverting $800 million in funds away from protecting our US borders.\n\nThe Border Patrol Union added, “At least 25 million illegal aliens invaded the US during the 4 years of the disastrous Biden Administration and openly advocating for pathways to citizenship is NOT putting America First and will lead to the destruction of America as we know it. We CANNOT afford another disaster on our borders!”\n\nRachel Ann Palmer Hooper posted Talarico’s voting record on border security. The guy is a liar.\n\nFACT CHECK: James Talarico says, “I’m a border security democrat.”\n\nIs it true? Look at how he voted in the Texas House.\n\n2021: NO on HB 9, $1.8 billion for border security.\n\n2023: NO on HB 7, which created the Texas Border Protection Unit and funded border infrastructure.\n\n2023: NO on SB 4, tougher penalties for human smuggling and stash houses.\n\n2023: NO on SB 3, funding for border barriers and border security operations.\n\n2025: NO on SB 8, letting local law enforcement help with federal deportations.\n\nIn 2023, while Texas was putting up barriers to stop the Biden border crisis, Talarico said Greg Abbott was “hunting people” and committing “atrocities.”\n\nAnd in the same Fox interview where he called himself a border security democrat, he called for a pathway to citizenship for illegal immigrants.\n\nTalarico found border security the year he needed statewide votes. His record was written before that.\n\nVerdict: He said it. His votes say otherwise.\n\nhttps://t.co/WYwwWHrxLP", "url": "https://x.com/OwenGregorian/status/2111087258321162453", "lane": "border_counties_midterm_politics", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111088024784187503", "t": "2026-10-16T13:33:01+00:00", "views": 2621, "likes": 65, "reposts": 38, "handle": "TexasTribune", "name": "Texas Tribune", "avatar": "", "followers": 299726, "text": "Since Gov. Greg Abbott first declared a border emergency in 2021, he’s renewed or amended the proclamation at least 69 times. The proclamation has greatly expanded his powers.\n\nWith @propublica: https://t.co/2iDeNpvMM1", "url": "https://x.com/TexasTribune/status/2111088024784187503", "lane": "abbott_emergency_overreach", "copy_origin": "2110678671790907560", "in_dataset": 1, "copies": 0}, {"id": "2111094703168876726", "t": "2026-10-16T13:59:34+00:00", "views": 1332, "likes": 117, "reposts": 94, "handle": "StoriesBySammi", "name": "Sammi🦋", "avatar": "", "followers": 15480, "text": "While Big Bend's border wall is tied up in a major legal fight right now, there's a bigger story hiding behind it: millions of acres of Texas public land.\n\nThe Texas General Land Office owns a massive checkerboard of parcels across the exact border counties, Hudspeth, Presidio, and Brewster, where the wall and vehicle barriers are planned. This isn't just any state land, it's Permanent School Fund (PSF) land, over 13 million acres constitutionally dedicated to funding Texas public schools.\n\nIt's leased out in scattered pieces, acre by acre, mostly to ranchers and oil and gas. Ranchers depend on it for water access. River guides depend on it for their livelihoods. Billy Miller, a river guide and landowner, testified at the October 2 hearing. Asked what Big Bend means to him, he said: \"The wilderness of Big Bend saved my life.\"\n\nSo who's supposed to be protecting this land? Commissioner Dawn Buckingham runs the @TXGLO She spoke out once in July, after contractors cleared GLO land without permission. Since then, silence.\n\nTurns out there's a reason. A reporter requested GLO's communications with the federal agency building the wall. GLO tried to keep it secret, but Texas law required them to show their own excuse to the reporter. It backfired: the letter admitted GLO's been in \"regular contact\" with CBP the whole time.\n\nThis isn't a neutral official caught in the middle. Buckingham publicly pledged to help Trump's deportation push by donating state land. Trump has endorsed her. She calls herself a \"staunch defender of the Trump agenda.\" Her biggest donors are oil, gas, and ranching interests, the same industries leasing this land. Her July objection wasn't about protecting ranchers. It was lip service.\n\nA wall that disrupts these leases doesn't just hurt ranchers, it threatens money meant for Texas kids. This administration has already cut Medicaid, SNAP, and school meal funding. Vanity projects over kids. That's the pattern.\n\nThe land, the water, the schools, all of it's on the table. I don't think many Texans voted for this.\n\n#DemsUnited", "url": "https://x.com/StoriesBySammi/status/2111094703168876726", "lane": "big_bend_wall_win", "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111152296042299459", "t": "2026-10-16T17:48:25+00:00", "views": 5778, "likes": 145, "reposts": 120, "handle": "TheFloridaMike", "name": "Florida Mike", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAA "copy_origin": null, "in_dataset": 1, "copies": 0}, {"id": "2111450408841285688", "t": "2026-10-17T13:33:00+00:00", "views": 3286, "likes": 49, "reposts": 40, "handle": "TexasTribune", "name": "Texas Tribune", "avatar": "", "followers": 299734, "text": "Since Gov. Greg Abbott first declared a border emergency in 2021, he’s renewed or amended the proclamation at least 69 times. The proclamation has greatly expanded his powers.\n\nWith @propublica: https://t.co/2iDeNpvMM1", "url": "https://x.com/TexasTribune/status/2111450408841285688", "lane": "abbott_emergency_overreach", "copy_origin": "2110678671790907560", "in_dataset": 1, "copies": 0}, {"id": "2111464781399904315", "t": "2026-10-17T14:30:07+00:00", "views": 10103, "likes": 194, "reposts": 114, "handle": "propublica", "name": "ProPublica", "avatar": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gKgSUNDX1BST0ZJTEUAAQEAAAKQbGNtcwQwAABtbnRyUkdCIFhZWiAAAAAAAAAAAAAAAABhY3NwQVBQTAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA9tYAAQAAAADTLWxjbXMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAtkZXNjAAABCAAAADhjcHJ0AAABQAAAAE53dHB0AAABkAAAABRjaGFkAAABpAAAACxyWFlaAAAB0AAAABRiWFlaAAAB5AAAABRnWFlaAAAB+AAAABRyVFJDAAACDAAAACBnVFJDAAACLAAAACBiVFJDAAACTAAAACBjaHJtAAACbAAAACRtbHVjAAAAAAAAAAEAAAAMZW5VUwAAABwAAAAcAHMAUgBHAEIAIABiAHUAaQBsAHQALQBpAG4AAG1sdWMAAAAAAAAAAQAAAAxlblVTAAAAMgAAABwATgBvACAAYwBvAHAAeQByAGkAZwBoAHQALAAgAHUAcwBlACAAZgByAGUAZQBsAHkAAAAAWFlaIAAAAAAAAPbWAAEAAAAA0y1zZjMyAAAAAAABDEoAAAXj///zKgAAB5sAAP2H///7ov///aMAAAPYAADAlFhZWiAAAAAAAABvlAAAOO4AAAOQWFlaIAAAAAAAACSdAAAPgwAAtr5YWVogAAAAAAAAYqUAALeQAAAY3nBhcmEAAAAAAAMAAAACZmYAAPKnAAANWQAAE9AAAApbcGFyYQAAAAAAAwAAAAJmZgAA8qcAAA1ZAAAT0AAACltwYXJhAAAAAAADAAAAAmZmAADypwAADVkAABPQAAAKW2Nocm0AAAAAAAMAAAAAo9cAAFR7AABMzQAAmZoAACZmAAAPXP/bAEMABQMEBAQDBQQEBAUFBQYHDAgHBwcHDwsLCQwRDxISEQ8RERMWHBcTFBoVEREYIRgaHR0fHx8TFyIkIh4kHB4fHv/bAEMBBQUFBwYHDggIDh4UERQeHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHv/CABEIADAAMAMBIgACEQEDEQH/xAAaAAEAAgMBAAAAAAAAAAAAAAAABQcBAgYE/8QAFQEBAQAAAAAAAAAAAAAAAAAAAAH/2gAMAwEAAhADEAAAAamEZxesCVQko0AvXn+ipk9EMAF70RtqAf/EACEQAAAFBAIDAAAAAAAAAAAAAAECBAUGAxARIAcSFCI2/9oACAEBAAEFArYHaNe0SiAkdKTol8JwvF/juPi9Dvakqx2vFRxEKy5XVo6RgMRPXI6f/8QAFBEBAAAAAAAAAAAAAAAAAAAAMP/aAAgBAwEBPwEf/8QAFBEBAAAAAAAAAAAAAAAAAAAAMP/aAAgBAgEBPwEf/8QAKRAAAgAEAwYHAAAAAAAAAAAAAQIAAwQREyAhIjFRcZHBBRASMkFSgf/aAAgBAQAGPwLy3GNcrOwUsizADbheKqi8QVZ4ADKSNR+xPpb3w2tfJM5Te8VlU+zLVACx3RUVKex32eWSYR8YveMF6h8L6DRemUyyQHcTPSL8b5t565P/xAAiEAEAAQQBAwUAAAAAAAAAAAABEQAgITFREDCxYXGRocH/2gAIAQEAAT8h6cHwUiMBH1ti6ksyGChanPz4Y24pFcuORs+m2qdBhkDMvivz1AQeLE3IIpJklMmT2YtmEmQi6KRGHfZ5/9oADAMBAAIAAwAAABATogCKBDYD/8QAFBEBAAAAAAAAAAAAAAAAAAAAMP/aAAgBAwEBPxAf/8QAFBEBAAAAAAAAAAAAAAAAAAAAMP/aAAgBAgEBPxAf/8QAIRABAAIBAwQDAAAAAAAAAAAAAREhACAxURBBYYFxkaH/2gAIAQEAAT8Q6DgqHZGzhJC2Ai/ekuEJFylia7fGRIWHdIgAuRdXzj8wrbxivmCfM6TFS2ZkSaWqJPEnOTiKVpEgb2S96HoBsQYRRTTgI2ojckRPlNLjEr5QcLUyRPOIAQMI9nSAACGwID9xtlZev//ZICAgICAgICAgICAgIA==", "followers": 1081090, "text": "Texas Gov. Greg Abbott has used executive orders and disaster declarations to shift funds, suspend regulations and award no-bid contracts without going through the state Legislature.\n\nHe declared a border emergency for the 69th time in September. \nhttps://t.co/OcupDB9t2h", "url": "https://x.com/propublica/status/2111464781399904315", "lane": "abbott_emergency_overreach", "copy_origin": "2110713612390076749", "in_dataset": 1, "copies": 0}, {"id": "2111502961746850231", "t": "2026-10-17T17:01:50+00:00", "views": 2233, "likes": 28, "reposts": 10, "handle": "BskiMike22802", "name": "mike bski", "avatar": "", "followers": 48313, "text": "@repdeliaramirez Congresswoman Ramirez, your card says protesters can photograph \"anything\" from \"any public space.\" Federal criminal courtrooms are public. Rule 53 bans cameras in them. I graded all six points on your card like a lab report. Two pass. Four can get your followers arrested.\n\nBefore anybody in the replies calls me anti-protest... I'm a medically retired Army medic. I swore an oath to defend your right to stand on a sidewalk and call the President anything you want. I also think a member of Congress handing out legal advice ought to hand out ALL of it. Slight oversight!\n\nEvery case and statute below is real. Look them up yourself. That's the assignment.\n\nPOINT 1: \"You don't need a permit to protest in response to breaking news and you don't need a permit to march in the streets or along sidewalks, as long as you're not obstructing traffic.\"\n\nGrade: D.\n\nCongresswoman, a march IN THE STREET is the traffic obstruction. That's what streets are for.\n\nYour own city disagrees with your card. Chicago Municipal Code 10-8-330 requires a parade permit when a march needs a street closed or traffic stopped. Chicago fast-tracks it for breaking news, but fast-tracked is still a permit. Section 10-8-334 requires advance notice for some sidewalk assemblies. Los Angeles Municipal Code 103.111 waives the filing deadline for breaking news, not the permit. National Park Service land, 36 C.F.R. 2.51: permit required unless your group is 25 or fewer in a designated area.\n\nThe Supreme Court has upheld fair permit systems since Cox v. New Hampshire (1941). In Thomas v. Chicago Park District (2002), it upheld permits for park events over 50 people. That case has YOUR city's name on it.\n\nTo be fair, D.C. Code 5-331.05 really does exempt spontaneous protests. So your card is accurate in Washington and a coin flip in Chicago.\n\nBy the same logic, I'm printing a card for drivers: you don't need a license to drive in response to breaking news, as long as you don't hit anybody. It's just common sense.\n\nThis card couldn't pour water out of a boot with the instructions printed on the heel.\n\nPOINT 2: \"You have the right to photograph anything in plain view, including federal buildings and the police.\"\n\nGrade: C-.\n\nThe core is right. Recording police in public is protected: Glik v. Cunniffe (1st Cir. 2011), ACLU of Illinois v. Alvarez (7th Cir. 2012, your circuit), Fields v. City of Philadelphia (3d Cir. 2017). The Second Circuit joined in August with Massimino v. Benoit, No. 25-1104, and wrote that the right is \"not limitless.\" Mr. Massimino won the right... and still lost his case.\n\n\"Anything\" and \"any public space\" are where your card writes checks your followers can't cash. Federal Rule of Criminal Procedure 53 covers the courtroom. Inside federal buildings, 41 C.F.R. 102-74.420 generally allows lobbies and hallways, but an agency's office space needs that agency's permission. Under 18 U.S.C. 795, photographing designated military installations without permission is a federal crime. And Alvarez, the case from your own circuit, says officers can still keep you back to protect a scene. A camera doesn't make you a ghost.\n\nAs a legal shield, that word \"anything\" is about as useful as a screen door on a submarine.\n\nPOINT 3: Write everything down, get witnesses, photograph injuries.\n\nGrade: A-.\n\nI'd give my own students this advice. The minus is what you left out. Evidence is not a lawsuit. In Egbert v. Boule (2022), the Supreme Court refused to let a man sue a federal agent for damages over First Amendment retaliation. If the badge is federal, your notebook might get you a story. Maybe not a check.\n\nPOINT 4: Ask if you're free to go. If yes, calmly walk away.\n\nGrade: B.\n\nGood advice. Now what happens when the officer says no?\n\nTerry v. Ohio (1968) allows a brief detention on reasonable suspicion. In your own state, 725 ILCS 5/107-14 lets an officer demand your name, your address, and an explanation of what you're doing during a lawful stop. Refusing alone isn't automatically obstruction, per People v. Fernandez, 2011 IL App (2d) 100473. Giving a FAKE name is its own crime under 720 ILCS 5/31-4.5.\n\nOther states go further. Nevada's NRS 171.123 requires a detained person to give a name, and the Supreme Court upheld that in Hiibel v. Sixth Judicial District Court (2004). My state, Ohio, has R.C. 2921.29. Texas has Penal Code 38.02 after an arrest. The stop itself has to be justified, Brown v. Texas (1979), but \"say nothing at all\" can buy you a night in a cell in a lot of America.\n\nPOINT 5: If arrested, ask why, say you wish to remain silent, ask for a lawyer, don't sign or say anything.\n\nGrade: C+.\n\nYou can ASK why. In Devenpeck v. Alford (2004), the Supreme Court said it has never held that an officer must tell you the reason on the spot. Some states require it by statute, like California Penal Code 841. Most of your followers don't live in California.\n\n\"Say you wish to remain silent\" is close. Close gets people convicted. In Berghuis v. Thompkins (2010), a suspect sat mostly silent for nearly three hours, answered one question, and the answer came in at trial. Silence alone doesn't invoke anything. In Davis v. United States (1994), \"Maybe I should talk to a lawyer\" didn't count as asking for one. The words that work: \"I am invoking my right to remain silent. I want a lawyer.\" Then actually stop talking.\n\nLight travels faster than sound, which is why some rights cards look bright until you read them.\n\n\"Don't say anything\" also skips two details. Routine booking questions fall outside Miranda (Pennsylvania v. Muniz, 1990), and the Fifth Amendment protects your words, not your blood or your fingerprints (Schmerber v. California, 1966). And you left the most useful case off the card entirely. Riley v. California (2014): police generally need a warrant to search your phone after an arrest. That one belongs in big yellow letters.\n\nPOINT 6: Stopped by the military or law enforcement at a protest, you can stay silent \"no matter your citizenship or immigration status.\"\n\nGrade: D+.\n\nThe core is true. Wong Wing v. United States (1896) gave noncitizens on American soil criminal-procedure protections. Here's the rest of the page you tore out:\n\no 8 U.S.C. 1304(e): adult noncitizens must carry their registration documents. Staying quiet doesn't cover leaving them at home.\n\no 8 U.S.C. 1362: in removal proceedings you may have a lawyer \"at no expense to the Government.\" The kid reading your card thinks a lawyer is on the way. In immigration court, nobody is sending one.\n\no 18 U.S.C. 1001: staying silent is legal. Lying to a federal agent is a felony.\n\no The Posse Comitatus Act, 18 U.S.C. 1385, and 10 U.S.C. 275 keep federal troops out of ordinary policing, except where Congress carved out exceptions like 10 U.S.C. 252-253. Your card warns about soldiers stopping protesters and never mentions the law that limits exactly that.\n\nThat is not a rights card. That is a scare card. Only a snollygoster (a shrewd, unprincipled politician, look it up) prints one of those with a congressional seal behind it.\n\nNow the part that actually matters. When your card is wrong, who goes to jail?\n\nNot you.\n\nWhat's next, a member of Congress charged with assaulting federal officers outside an ICE facility... wait, I'm being told that already happened. Your colleague Rep. LaMonica McIver pleaded not guilty to three federal counts from Delaney Hall in Newark in May 2025. On August 26, the Third Circuit refused to throw the case out. She faces up to 17 years. She also has a congressional salary, a former U.S. Attorney as her lawyer, and a fundraising page. The 19-year-old holding your card outside Broadview has a phone at 9 percent.\n\nSalt Lake City, June 14, 2025, the very first No Kings day. According to the widow's lawsuit, Utah organizers recruited armed volunteer \"peacekeepers,\" some less than 24 hours before the march. One of them, Matthew Alder, fired three shots at a man carrying a rifle and killed a bystander, Afa Ah Loo, a fashion designer and father of two. Prosecutors charged Alder with manslaughter. His lawyer calls it a tragedy, not a crime. The national movement disowned the Utah chapter. And today, the No Kings rallies are back in Salt Lake City.\n\nPortland, March 28, 2026, No Kings night. Protesters broke through the gates at the ICE facility and burned flags.\n\nI've written about this pattern before. The people at the top hand out the slogans. The people at the bottom absorb the consequences. Then the fundraising email goes out. Quinn's First Law of Liberalism: liberalism always generates the exact opposite of its stated intent. A \"know your rights\" card that leaves out the rules is how a peaceful Saturday ends with a mugshot. All hat and no cattle, Congresswoman, and your followers are the ones paying for the hat.\n\nAnd \"our democracy\"? The word democracy appears zero times in the Constitution. Article IV, Section 4 guarantees every state a republican form of government. You swore an oath to that document. It's only four pages.\n\nHere's the card I'd hand my own students. Free. No logo required.\n\no Small group, public sidewalk, people can still get by: usually no permit. Street, park, stage, sound system, or a big crowd: check your city's permit rules first.\n\no Record police from where you're allowed to stand. Stay back. Hands to yourself. No cameras in courtrooms.\n\no Stopped? \"Am I free to go?\" If not, many states require your name. Never give a fake one.\n\no Arrested? \"I am invoking my right to remain silent. I want a lawyer.\" Then stop talking.\n\no Don't unlock your phone for them. Riley v. California says they need a warrant.\n\no Not a citizen? You can stay silent, but carry your papers and never lie to a federal agent.\n\no Police order the crowd to disperse? Leave. Argue it in court, not on the curb.\n\nSomewhere out there a tree is producing oxygen for your communications staff, and it owes itself an apology.\n\nBut what do I know, I'm only a teacher who read the case law before handing it to a teenager.\n\nHow they use their own followers, the long version: https://t.co/cSJEXCbqgq", "url": "https://x.com/BskiMike22802/status/2111502961746850231", "lane": "pushback", "copy_origin": null, "in_dataset": 1, "copies": 0}], "edges": [{"src": "2105703900313420274", "dst": "2105644437216821321", "type": "quote"}, {"src": "2105742548023300368", "dst": "2105741559484620824", "type": "reply"}, {"src": "2106065334142632200", "dst": "2105747803817259230", "type": "quote"}, {"src": "2106143073160097825", "dst": "2106139516230672569", "type": "copy"}, {"src": "2106150291204964763", "dst": "2106139516230672569", "type": "copy"}, {"src": "2106315926119289214", "dst": "2106315917869101169", "type": "copy"}, {"src": "2107951235709948153", "dst": "2107690467743736286", "type": "quote"}, {"src": "2109183645617668568", "dst": "2109059637131772172", "type": "copy"}, {"src": "2109683754461741082", "dst": "2109664920543650260", "type": "quote"}, {"src": "2109725349932110254", "dst": "2109616967678345314", "type": "quote"}, {"src": "2109774074071413112", "dst": "2109647394572784094", "type": "quote"}, {"src": "2110745075823313089", "dst": "2110739605536538661", "type": "quote"}, {"src": "2110760164047429918", "dst": "2110678671790907560", "type": "copy"}, {"src": "2111087258321162453", "dst": "2110559215974859038", "type": "quote"}, {"src": "2111088024784187503", "dst": "2110678671790907560", "type": "copy"}, {"src": "2111154262881255551", "dst": "2111152296042299459", "type": "quote"}, {"src": "2111450408841285688", "dst": "2110678671790907560", "type": "copy"}, {"src": "2111464781399904315", "dst": "2110713612390076749", "type": "copy"}], "stats": {"pushing": 66, "repeated": 13, "pushback": 6, "total": 86}};</script>

<script>
(async function () {
  let DATA = window.__DATA__;
  if (!DATA) {
    try { DATA = await (await fetch('data.json')).json(); }
    catch (e) { document.getElementById('app').textContent = 'No data.json found next to this page.'; return; }
  }
  const { meta, lanes, posts, edges, stats } = DATA;
  const markets = (DATA.markets || []).filter(m => (m.points || []).length > 1);
  const TZ = (meta.window && meta.window.tz) || 'UTC';
  const laneByKey = Object.fromEntries(lanes.map(l => [l.key, l]));
  const PUSHBACK = 'pushback', OTHER = 'other';
  const isMobile = window.innerWidth < 560;
  const isVideo = /[?&]video=1/.test(location.search) || document.body.classList.contains('video');
  if (isVideo) document.body.classList.add('video');

  // ---- derived ------------------------------------------------------------
  posts.forEach(p => { p.ts = +new Date(p.t); p.isCopy = !!p.copy_origin; });
  const byId = Object.fromEntries(posts.map(p => [p.id, p]));
  // range: ?days=N shows the last N days of the window; long windows default to 14 so the dots stay readable
  const allMax = d3.max(posts, p => p.ts) || Date.now(), allMin = d3.min(posts, p => p.ts) || allMax;
  const windowDays = (allMax - allMin) / 864e5;
  const daysParam = (location.search.match(/[?&]days=(\d+|all)/) || [])[1];
  const rangeDays = daysParam === 'all' ? 0 : daysParam ? +daysParam : windowDays > 21 ? 14 : 0;
  const rangeStart = rangeDays ? allMax - rangeDays * 864e5 : -Infinity;
  const drawn = posts.filter(p => laneByKey[p.lane] && p.ts >= rangeStart);           // 'other' lane is not drawn
  if (!drawn.length) {
    const a = d3.select('#app');
    a.append('h1').text(meta.title);
    a.append('p').attr('class', 'sub').text(lanes.length > 1 ? 'No posts in any lane yet — run classify, then export and render again.' : 'No lanes yet — run discover (or write lanes into the incident YAML), then classify, export, render.');
    return;
  }
  const drawnIds = new Set(drawn.map(p => p.id));
  const links = edges.filter(e => drawnIds.has(e.src) && drawnIds.has(e.dst));
  const tMin = d3.min(drawn, p => p.ts), tMax = d3.max(drawn, p => p.ts);
  const span = Math.max(1, tMax - tMin);
  const vMin = Math.max(1, Math.min(meta.min_views || 1, d3.max(drawn, p => p.views) || 1)), vMax = Math.max(vMin + 1, d3.max(drawn, p => p.views) || 1);   // copies under the threshold sit at the lane floor

  const fmtDate = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric' });
  const fmtTime = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', minute: '2-digit' });
  const fmtAxis = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', month: 'short', day: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat('en-US', { timeZone: TZ, month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fmtN = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M' : n >= 1e3 ? (n / 1e3).toFixed(n >= 1e4 ? 0 : 1).replace(/\.0$/, '') + 'K' : String(n);
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return ((h >>> 0) % 10000) / 10000; };

  // ---- layout -------------------------------------------------------------
  const app = d3.select('#app');
  if (meta.synthetic) app.append('div').attr('class', 'banner').text('SYNTHETIC SAMPLE — every account here is sample_acct_NNN and no post is real. This page exists to develop the chart; run the pull to replace it with live data.');

  const head = app.append('header');
  const hl = head.append('div');
  hl.append('h1').text(meta.title);
  hl.append('p').attr('class', 'sub').text(meta.subtitle);
  if (windowDays > 10 && !isVideo) {
    const r = hl.append('p').attr('class', 'range');
    r.append('span').text('Showing ');
    [[7, 'last 7 days'], [14, 'last 14 days'], [30, 'last 30 days'], [0, 'the whole window']].filter(([d]) => !d || d < windowDays + 1).forEach(([d, label], i, arr) => {
      const on = rangeDays === d;
      r.append('a').attr('href', '?days=' + (d || 'all')).attr('class', on ? 'on' : '').text(label);
      if (i < arr.length - 1) r.append('span').text(' · ');
    });
  }
  const clock = head.append('div').attr('class', 'clock');
  const clockDate = clock.append('div').attr('class', 'date');
  const clockTime = clock.append('div').attr('class', 'time');
  const clockSpeed = clock.append('div').attr('class', 'speed');

  const statsEl = app.append('div').attr('class', 'stats');
  const stat = (cls, label) => { const s = statsEl.append('div').attr('class', 'stat ' + cls); const n = s.append('div').attr('class', 'n'); s.append('div').attr('class', 'l').text(label); return n; };
  const sPush = stat('push', 'posts pushing the story');
  const sRep = stat('rep', 'repeated posts');
  const sBack = stat('back', 'posts pushing back');

  const ctl = app.append('div').attr('class', 'controls');
  const playBtn = ctl.append('button').attr('aria-label', 'Play').text('▶');
  const slider = ctl.append('input').attr('type', 'range').attr('min', 0).attr('max', 1000).attr('value', 1000);
  const spd = ctl.append('div').attr('class', 'spd');
  spd.append('span').text(isMobile ? '' : 'speed');
  const speeds = [20, 40, 80];      // seconds for the whole window
  let speedIdx = 1;
  const spdBtn = spd.append('button').text('1×');

  const wrap = app.append('div').attr('class', 'chartwrap');
  const W = Math.max(360, wrap.node().getBoundingClientRect().width);
  // Each lane = a label band (title, counts, description) on top of a plot band for the dots.
  const band = isMobile ? 30 : isVideo ? 28 : 42;
  // video: lanes share a fixed plot height so the whole frame fits 1600x1000 with bars below
  const laneH = isMobile ? 100 : isVideo ? Math.max(70, Math.floor((1080 - 215 - 205 - (markets.length ? 62 : 0)) / Math.max(1, lanes.length))) : 122;
  const stripH = markets.length ? (isMobile ? 54 : isVideo ? 62 : 72) : 0;
  // events (incidents/events.yaml) inside the drawn span, grouped when they share a moment; they get a band under the axis
  const evMap = new Map();
  (DATA.events || []).forEach(e => { const t = Date.parse(e.at); if (!(t >= tMin - span * 0.015 && t <= tMax + span * 0.02)) return; const g = evMap.get(t) || { t, labels: [], types: [] }; g.labels.push(e.label + (e.all_day ? ' (all day)' : '')); g.types.push(e.type); evMap.set(t, g); });
  const events = [...evMap.values()].sort((a, b) => a.t - b.t);
  const evBand = events.length && !isMobile ? 26 : events.length ? 10 : 0;
  const top = 22 + stripH + evBand, bottom = 8;
  const H = top + lanes.length * laneH + bottom;
  const svg = wrap.append('svg').attr('viewBox', `0 0 ${W} ${H}`).attr('width', W).attr('height', H);
  const x = d3.scaleLinear().domain([tMin - span * 0.015, tMax + span * 0.02]).range([6, W - 6]);
  const vNorm = v => Math.max(0, (Math.log10(Math.max(1, v)) - Math.log10(vMin)) / Math.max(1e-9, (Math.log10(vMax) - Math.log10(vMin))));
  const r = d3.scaleSqrt().domain([vMin, vMax]).range([2.2, isMobile ? 10 : 13]).clamp(true);
  const laneTop = key => top + laneByKey[key].order * laneH;
  const plotTop = key => laneTop(key) + band + 4, plotH = laneH - band - 10;
  // views are log-scaled then eased (pow 0.6) so the 1–10K bulk uses the lane's height instead of hugging the floor
  const cy = p => plotTop(p.lane) + 10 + (1 - Math.pow(vNorm(p.views), 0.6)) * (plotH - 16) * 0.88 + (hash(p.id) - 0.5) * (plotH - 16) * 0.22;
  const cx = p => x(p.ts);
  drawn.forEach(p => { p.x = cx(p); p.y = cy(p); });

  // axis: every 6 local hours, majors at local midnight (walk the domain hour by hour in the incident's tz)
  const hourOf = t => { const parts = new Intl.DateTimeFormat('en-US', { timeZone: TZ, hour: 'numeric', hour12: false }).formatToParts(new Date(t)); return +parts.find(p => p.type === 'hour').value % 24; };
  const ticks = [];
  { const t0 = Math.floor(x.domain()[0] / 36e5) * 36e5; for (let t = t0; t <= x.domain()[1]; t += 36e5) { const hr = hourOf(t); const every = span > 12 * 864e5 ? 24 : span > 4 * 864e5 ? 12 : 6; if (hr % every === 0 && t >= x.domain()[0]) ticks.push({ t, major: hr === 0 }); } }
  const axis = svg.append('g').attr('class', 'axis');
  const tick = axis.selectAll('g').data(ticks).join('g').attr('class', d => d.major ? 'major' : 'minor').attr('transform', d => `translate(${x(d.t)},0)`);
  tick.append('line').attr('y1', 14).attr('y2', H - bottom);
  const fmtAxisShort = new Intl.DateTimeFormat('en-US', { timeZone: TZ, weekday: 'short', day: 'numeric' });
  const pxPerDay = x(tMin + 864e5) - x(tMin); const fmtDayNum = new Intl.DateTimeFormat('en-US', { timeZone: TZ, day: 'numeric' });
  tick.filter(d => d.major).append('text').attr('y', 11).attr('x', 3).text(d => (pxPerDay < 46 ? fmtDayNum : isMobile || pxPerDay < 90 ? fmtAxisShort : fmtAxis).format(new Date(d.t)));
  const pxPer12h = x(tMin + 12 * 36e5) - x(tMin);
  tick.filter(d => !d.major && !isMobile && hourOf(d.t) === 12 && pxPer12h > 120).append('text').attr('y', 11).attr('x', 2).text('noon');

  // event markers: a dashed rule through the lanes, a dot and a label in the events band (two rows, greedy placement)
  const evG = svg.append('g').attr('class', 'events');
  const evColor = t => t === 'poll' ? '#8fb4ff' : t === 'calendar' ? '#e08a2e' : t === 'rally' || t === 'campaign' ? '#f0b06a' : t === 'trump' ? '#ff6b6b' : '#f2f2f0';
  const bandY = 22 + stripH, rowEnd = [-1e9, -1e9];
  events.forEach(e => {
    const px = x(e.t), label = e.labels.length > 1 ? e.labels.length + ' events: ' + e.labels.join(' · ') : e.labels[0];
    const g = evG.append('g').attr('transform', `translate(${px},0)`);
    g.append('line').attr('y1', bandY + 4).attr('y2', H - bottom).attr('stroke', evColor(e.types[0])).attr('stroke-opacity', .3).attr('stroke-dasharray', '2,4');
    g.append('circle').attr('cy', bandY + 4).attr('r', 3).attr('fill', evColor(e.types[0]));
    g.append('title').text(label);
    if (isMobile) return;
    const short = label.length > 38 ? label.slice(0, 37) + '…' : label, w = short.length * 5.4 + 8;
    const row = px - rowEnd[0] > 8 ? 0 : px - rowEnd[1] > 8 ? 1 : -1;
    if (row < 0) return;
    rowEnd[row] = px + w;
    g.append('text').attr('x', 5).attr('y', bandY + 9 + row * 11).attr('fill', '#b9b9b3').attr('font-size', 9).attr('font-family', 'var(--mono)').text(short);
  });

  // lanes
  const laneG = svg.append('g');
  lanes.forEach(l => {
    const g = laneG.append('g').attr('class', 'lane-label').attr('transform', `translate(0,${laneTop(l.key)})`);
    g.append('rect').attr('x', 0).attr('y', 0).attr('width', W).attr('height', band).attr('fill', 'rgba(11,11,12,.55)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', laneH).attr('y2', laneH);
    g.append('rect').attr('x', 6).attr('y', 5).attr('width', 3).attr('height', band - 10).attr('fill', l.color).attr('rx', 1.5);
    g.append('text').attr('class', 't').attr('x', 14).attr('y', 15).attr('fill', l.color).text(l.label);
    g.append('text').attr('class', 'c').attr('x', 14).attr('y', 27).attr('data-lane', l.key).text('');
    if (!isMobile && !isVideo) g.append('text').attr('class', 'd').attr('x', 14).attr('y', 38).text((l.description || '').slice(0, 110) + ((l.description || '').length > 110 ? '…' : ''));
  });

  // prediction-market strip: price (¢) of the first market over the same time axis
  let priceAt = null;
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    if (pts.length < 2) markets.length = 0;   // nothing in range: no strip (layout already reserved it; harmless)
  }
  if (markets.length) {
    const m = markets[0];
    const sy0 = 22 + 8, sy1 = 22 + stripH - 14;
    const pts = m.points.filter(q => q.t >= x.domain()[0] && q.t <= x.domain()[1]);
    const pmin = Math.min(...pts.map(q => q.p)), pmax = Math.max(...pts.map(q => q.p));
    const pad = Math.max(2, (pmax - pmin) * 0.25);
    const y = d3.scaleLinear().domain([pmin - pad, pmax + pad]).range([sy1, sy0]);
    const g = svg.append('g').attr('class', 'strip');
    g.append('rect').attr('x', 0).attr('y', 22).attr('width', W).attr('height', stripH - 4).attr('fill', 'rgba(255,255,255,0.025)');
    g.append('line').attr('class', 'lane-rule').attr('x1', 0).attr('x2', W).attr('y1', 22 + stripH - 4).attr('y2', 22 + stripH - 4);
    const area = d3.area().x(q => x(q.t)).y0(sy1).y1(q => y(q.p)).curve(d3.curveStepAfter);
    const line = d3.line().x(q => x(q.t)).y(q => y(q.p)).curve(d3.curveStepAfter);
    g.append('path').attr('d', area(pts)).attr('fill', 'rgba(224,138,46,0.12)');
    g.append('path').attr('d', line(pts)).attr('fill', 'none').attr('stroke', '#e08a2e').attr('stroke-width', 1.4);
    g.append('text').attr('x', 10).attr('y', 22 + 12).attr('fill', '#e08a2e').attr('font-size', 11).attr('font-weight', 700).text(m.label);
    g.append('text').attr('x', 10).attr('y', 22 + 24).attr('fill', 'var(--ink-3)').attr('font-size', 9.5).attr('font-family', 'var(--mono)').text(`${m.source} · hourly · ${pmin}¢ – ${pmax}¢`);
    const dot = g.append('circle').attr('r', 3.5).attr('fill', '#e08a2e').attr('stroke', 'var(--bg)');
    const lbl = g.append('text').attr('fill', 'var(--ink)').attr('font-size', 11).attr('font-weight', 700).attr('font-family', 'var(--mono)');
    priceAt = t => { let q = pts[0]; for (const r of pts) { if (r.t <= t) q = r; else break; } return q; };
    window.__priceCursor = t => { const q = priceAt(t); const px = Math.min(x(q.t), x(t)); dot.attr('cx', px).attr('cy', y(q.p)); lbl.attr('x', Math.min(W - 44, px + 6)).attr('y', y(q.p) - 6).text(q.p + '¢'); };
  }

  // links (drawn before dots)
  const linkPath = e => { const a = byId[e.dst], b = byId[e.src]; const dx = b.x - a.x; return `M${a.x},${a.y} C${a.x + dx * 0.55},${a.y} ${b.x - dx * 0.55},${b.y} ${b.x},${b.y}`; };
  const linkSel = svg.append('g').selectAll('path').data(links).join('path')
    .attr('class', e => 'link ' + e.type).attr('d', linkPath)
    .attr('stroke', e => e.type === 'copy' ? null : (laneByKey[byId[e.src].lane] || {}).color || '#888');

  // dots + avatars
  const defs = svg.append('defs');
  const dotSel = svg.append('g').selectAll('g.p').data(drawn, p => p.id).join('g').attr('class', 'p').attr('transform', p => `translate(${p.x},${p.y})`);
  dotSel.append('circle').attr('class', p => 'dot' + (p.isCopy ? ' copy' : '') + (p.in_dataset ? '' : ' ref'))
    .attr('r', p => r(p.views)).attr('fill', p => p.isCopy ? '#ffffff' : laneByKey[p.lane].color);
  const topAvatars = new Set(drawn.filter(p => p.avatar).sort((a, b) => b.views - a.views).slice(0, 40).map(p => p.id));
  dotSel.filter(p => topAvatars.has(p.id)).each(function (p) {
    const rr = r(p.views);
    if (rr < 5) return;
    defs.append('clipPath').attr('id', 'c' + p.id).append('circle').attr('r', rr - 1);
    d3.select(this).append('image').attr('href', p.avatar.replace('_normal', '_bigger')).attr('x', -rr + 1).attr('y', -rr + 1)
      .attr('width', 2 * rr - 2).attr('height', 2 * rr - 2).attr('clip-path', `url(#c${p.id})`).attr('preserveAspectRatio', 'xMidYMid slice')
      .on('error', function () { this.remove(); });
  });

  // "same words ×N" pills on cluster origins
  const originCounts = {};
  drawn.forEach(p => { if (p.copy_origin && drawnIds.has(p.copy_origin)) originCounts[p.copy_origin] = (originCounts[p.copy_origin] || 0) + 1; });
  const pillData = Object.entries(originCounts).filter(([, n]) => n >= 3).map(([id, n]) => { const accts = new Set(drawn.filter(q => q.copy_origin === id).map(q => q.handle)); return { p: byId[id], n, accts: accts.size }; });
  const pillSel = svg.append('g').selectAll('g').data(pillData).join('g').attr('class', 'pill')
    .attr('transform', d => {
      const px = Math.min(W - 96, Math.max(2, d.p.x + r(d.p.views) + 4));
      const lo = plotTop(d.p.lane), hi = plotTop(d.p.lane) + plotH - 26;
      const py = Math.max(lo, Math.min(hi, d.p.y - 12));
      return `translate(${px},${py})`;
    });
  pillSel.append('rect').attr('width', 92).attr('height', 24).attr('rx', 4);
  pillSel.append('text').attr('x', 6).attr('y', 10.5).text(d => `same words ×${d.n}`);
  pillSel.append('text').attr('class', 's').attr('x', 6).attr('y', 20).text(d => d.accts === 1 ? 'all from 1 account' : `from ${d.accts} accounts`);

  const playhead = svg.append('line').attr('class', 'playhead').attr('y1', top - 6).attr('y2', H - bottom);

  // ticker + bars
  const ticker = app.append('div').attr('class', 'ticker');
  const bars = app.append('div').attr('class', 'bars');
  const barBlock = (title, note) => { const b = bars.append('div'); b.append('h3').text(title).append('span').text(note); return b.append('div'); };
  const bPosts = barBlock('Posts so far', '');
  const bViews = barBlock('Views so far', 'each post’s views at pull time, counted when it went up');

  const foot = app.append('footer');
  foot.append('span').text(`${meta.pulled_at ? 'Views as of ' + fmtFull.format(new Date(meta.pulled_at)) + ' ' + TZ.split('/').pop().replace('_', ' ') + '. ' : ''}${meta.source}.${meta.partial ? ' Pull still in progress — counts will grow on the next run.' : ''}`);
  foot.append('span').html((meta.credit ? meta.credit + ' · ' : '') + '<a href="accounts.html" style="color:var(--ink-2)">Who moved it →</a> · <a href="analysis.html" style="color:var(--ink-2)">Timing &amp; pushback →</a> · <a href="claims.html" style="color:var(--ink-2)">What is claimed →</a> · <a href="review.html" style="color:var(--ink-2)">Review lanes →</a>');

  // tooltip
  const tip = d3.select('#tip');
  const showTip = (ev, p) => {
    const lane = laneByKey[p.lane] || {};
    tip.style('display', 'block').html(
      `<span class="x">✕</span><div class="h"><span>@${esc(p.handle)}${p.name ? ' · ' + esc(p.name) : ''}</span><span>${fmtFull.format(new Date(p.ts))}</span></div>` +
      `<div class="h"><span class="lane" style="color:${lane.color}">${esc(lane.label || p.lane)}</span><span>${fmtN(p.views)} views · ${fmtN(p.likes)} likes</span></div>` +
      `<div class="txt">${esc(p.text)}</div>` +
      (p.copy_origin ? `<div class="h"><span>same words as an earlier post</span></div>` : '') +
      (p.url && !meta.synthetic && /^https:\/\//.test(p.url) ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">open on X ↗</a>` : ''));
    const bw = tip.node().getBoundingClientRect();
    const px = Math.min(window.innerWidth - bw.width - 12, Math.max(12, ev.clientX - bw.width / 2));
    const py = ev.clientY + 18 + bw.height > window.innerHeight ? ev.clientY - bw.height - 14 : ev.clientY + 18;
    tip.style('left', px + 'px').style('top', py + 'px');
    tip.select('.x').on('click', () => tip.style('display', 'none'));
  };
  dotSel.on('click', (ev, p) => { ev.stopPropagation(); showTip(ev, p); });
  document.addEventListener('click', e => { if (!tip.node().contains(e.target)) tip.style('display', 'none'); });

  // ---- time scrub ---------------------------------------------------------
  let cur = tMax, playing = false, raf = null, lastTick = 0;
  const visible = () => drawn.filter(p => p.ts <= cur);
  function update() {
    dotSel.classed('hidden', p => p.ts > cur);
    linkSel.classed('hidden', e => byId[e.src].ts > cur);
    pillSel.classed('hidden', d => d.p.ts > cur || drawn.filter(q => q.copy_origin === d.p.id && q.ts <= cur).length < 3);
    playhead.attr('x1', x(cur)).attr('x2', x(cur)).classed('hidden', cur >= tMax);
    if (window.__priceCursor) window.__priceCursor(cur);
    const vis = visible();
    sPush.text(vis.filter(p => p.lane !== PUSHBACK && p.in_dataset).length);
    sRep.text(vis.filter(p => p.isCopy && p.in_dataset).length);
    sBack.text(vis.filter(p => p.lane === PUSHBACK && p.in_dataset).length);
    const d = new Date(cur);
    clockDate.text(fmtDate.format(d) + '  ·  T+' + (() => { const h = (cur - tMin) / 36e5; return h >= 24 ? Math.floor(h / 24) + 'd ' + Math.floor(h % 24) + 'h' : Math.floor(h) + 'h ' + Math.floor((h % 1) * 60) + 'm'; })());
    clockTime.text(fmtTime.format(d));
    clockSpeed.text(playing ? Math.round(span / 6e4 / speeds[speedIdx]) + ' minutes per second' : (cur >= tMax ? 'end of window' : 'paused'));
    const byLane = {}; lanes.forEach(l => byLane[l.key] = { n: 0, v: 0 });
    vis.forEach(p => { byLane[p.lane].n++; byLane[p.lane].v += p.views; });
    laneG.selectAll('text.c').text(function () { const s = byLane[this.dataset.lane]; return `${s.n} posts, ${fmtN(s.v)} views`; });
    const row = (host, key) => {
      const data = lanes.map(l => ({ l, v: byLane[l.key][key] })).sort((a, b) => b.v - a.v);
      const max = Math.max(1, d3.max(data, d => d.v));
      host.selectAll('div.row').data(data, d => d.l.key).join(enter => { const g = enter.append('div').attr('class', 'row'); g.append('div').attr('class', 'lbl'); g.append('div').attr('class', 'bar'); g.append('div').attr('class', 'val'); return g; })
        .style('order', (d, i) => i)
        .each(function (d) { const g = d3.select(this); g.select('.lbl').text(d.l.label).style('color', d.l.color); g.select('.bar').style('width', (100 * d.v / max) + '%').style('background', d.l.color); g.select('.val').text(key === 'v' ? fmtN(d.v) : d.v); });
    };
    bPosts.style('display', 'flex').style('flex-direction', 'column'); bViews.style('display', 'flex').style('flex-direction', 'column');
    row(bPosts, 'n'); row(bViews, 'v');
    const last = vis[vis.length - 1];
    ticker.html(last ? `<b>@${esc(last.handle)}</b> · <span style="color:${laneByKey[last.lane].color}">${esc(laneByKey[last.lane].label)}</span> · ${fmtN(last.views)} views${last.isCopy ? ' · <b>same words</b> as an earlier post' : ''}` : '');
  }
  function setCur(t, fromSlider) { cur = Math.max(tMin, Math.min(tMax, t)); if (!fromSlider) slider.property('value', Math.round(1000 * (cur - tMin) / span)); update(); }
  slider.on('input', function () { stop(); setCur(tMin + span * (+this.value / 1000), true); });
  function step(now) {
    if (!playing) return;
    if (now - lastTick > 50) { const dt = (now - lastTick) / 1000; lastTick = now; setCur(cur + span * dt / speeds[speedIdx]); if (cur >= tMax) { stop(); return; } }
    raf = requestAnimationFrame(step);
  }
  function play() { if (cur >= tMax) setCur(tMin); playing = true; playBtn.text('❚❚'); lastTick = performance.now(); raf = requestAnimationFrame(step); update(); }
  function stop() { playing = false; playBtn.text('▶'); if (raf) cancelAnimationFrame(raf); update(); }
  playBtn.on('click', () => playing ? stop() : play());
  spdBtn.on('click', () => { speedIdx = (speedIdx + 1) % speeds.length; spdBtn.text(['2×', '1×', '½×'][speedIdx]); update(); });
  document.addEventListener('keydown', e => { if (e.code === 'Space' && e.target.tagName !== 'INPUT') { e.preventDefault(); playing ? stop() : play(); } });
  setCur(tMax);
  window.__tracker = {
    tMin, tMax, span,
    setTime: t => setCur(t),
    setProgress: f => setCur(tMin + span * Math.max(0, Math.min(1, f))),
    setPlaying: v => { playing = !!v; clockSpeed.text(v ? '' : (cur >= tMax ? 'end of window' : 'paused')); },
    setSpeedLabel: txt => clockSpeed.text(txt),
  };
})();
</script>
</body>
</html>
