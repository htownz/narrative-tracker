name: Daily pull and publish

on:
  schedule:
    - cron: "17 11 * * *"      # 06:17 CT (11:17 UTC) every day; shifted off the hour to avoid the queue
  workflow_dispatch:            # run it by hand from the Actions tab
    inputs:
      incidents:
        description: "Space-separated incident YAMLs (default: every incidents/*-live.yaml)"
        default: ""
  push:
    paths: [".run"]             # committing a change to .run (its lines = incident paths, or 'live') also triggers a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the incidents
        id: pick
        run: |
          LIVE=$(ls incidents/*-live.yaml | tr '\n' ' ')
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.incidents }}" ]; then
            INC="${{ github.event.inputs.incidents }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -f .run ]; then
            INC=$(grep -v '^\s*#' .run | grep -v '^\s*$' | tr '\n' ' ')
            case " $INC " in *" live "*) INC="$LIVE ${INC/live/}";; esac
          fi
          INC="${INC:-$LIVE}"
          echo "incidents=$INC" >> "$GITHUB_OUTPUT"
          echo "running: $INC"

      - name: Pull, classify, dedup, export, render (each incident)
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set +e; FAILED=""
          for inc in ${{ steps.pick.outputs.incidents }}; do
            echo "::group::$inc"
            python run.py all "$inc" || FAILED="$FAILED $inc"
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::warning::failed:$FAILED"; fi

      - name: Commit data and output
        run: |
          git config user.name "narrative-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ out/ incidents/
          git diff --cached --quiet || git commit -m "pull $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push

      - name: Assemble site
        run: |
          mkdir -p site
          for d in out/*/; do
            slug=$(basename "$d")
            [ -f "$d/index.html" ] || continue
            mkdir -p "site/$slug" && cp "$d/index.html" "site/$slug/index.html"
          done
          python -m tracker.hub site

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
