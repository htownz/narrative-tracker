name: Daily pull and publish

on:
  schedule:
    - cron: "17 11 * * *"      # 06:17 CT (11:17 UTC) every day; shifted off the hour to avoid the queue
  workflow_dispatch:            # run it by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull, classify, dedup, export, render
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py all incidents/governor-race-live.yaml

      - name: Commit data and output
        run: |
          git config user.name "narrative-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/governor-race-live.sqlite out/governor-race-live/ incidents/governor-race-live.yaml
          git diff --cached --quiet || git commit -m "daily pull $(date -u +%Y-%m-%d)"
          git push

      - name: Assemble site
        run: |
          mkdir -p site
          cp out/governor-race-live/index.html site/index.html
          cp out/governor-race-live/data.json site/data.json
          for d in out/*/; do
            slug=$(basename "$d")
            [ "$slug" = "governor-race-live" ] && continue
            [ -f "$d/index.html" ] && mkdir -p "site/$slug" && cp "$d/index.html" "site/$slug/index.html"
          done

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
