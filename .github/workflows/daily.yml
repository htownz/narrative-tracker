name: Daily pull and publish

on:
  schedule:
    - cron: "17 11 * * *"      # 06:17 CT (11:17 UTC) every day; shifted off the hour to avoid the queue
  workflow_dispatch:            # run it by hand from the Actions tab
    inputs:
      incident:
        description: "Incident YAML to run"
        default: incidents/governor-race-live.yaml
  push:
    paths: [".run"]             # committing a change to .run (its first line = incident path) also triggers a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the incident
        id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then INC="${{ github.event.inputs.incident }}";
          elif [ "${{ github.event_name }}" = "push" ] && [ -f .run ]; then INC="$(head -1 .run | tr -d '[:space:]')";
          else INC="incidents/governor-race-live.yaml"; fi
          echo "incident=${INC:-incidents/governor-race-live.yaml}" >> "$GITHUB_OUTPUT"
          echo "running $INC"

      - name: Pull, classify, dedup, export, render
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python run.py all "${{ steps.pick.outputs.incident }}"

      - name: Commit data and output
        run: |
          git config user.name "narrative-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ out/ incidents/
          git diff --cached --quiet || git commit -m "pull $(date -u +%Y-%m-%d): ${{ steps.pick.outputs.incident }}"
          git pull --rebase --autostash origin main
          git push

      - name: Assemble site
        run: |
          mkdir -p site
          for d in out/*/; do
            slug=$(basename "$d")
            [ -f "$d/index.html" ] || continue
            mkdir -p "site/$slug" && cp "$d/index.html" "site/$slug/index.html"
          done
          if [ -f out/governor-race-live/index.html ]; then
            cp out/governor-race-live/index.html site/index.html
          else
            { echo '<!doctype html><meta charset="utf-8"><title>Narrative Tracker</title><body style="font-family:sans-serif;background:#0b0b0c;color:#eee;padding:24px"><h1>Narrative Tracker</h1><ul>';
              for d in site/*/; do s=$(basename "$d"); echo "<li><a style=\"color:#8cf\" href=\"$s/\">$s</a></li>"; done;
              echo '</ul></body>'; } > site/index.html
          fi

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
