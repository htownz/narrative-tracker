name: Pull and publish

on:
  schedule:
    - cron: "17 3 * * 1"   # weekly: Monday 03:17 UTC = Sunday ~9-10 PM CT, ahead of the Monday social scan email
  workflow_dispatch:            # run it by hand from the Actions tab
    inputs:
      incidents:
        description: "Space-separated incident YAMLs (default: every incidents/*-live.yaml)"
        default: ""
  push:
    paths: [".run"]             # committing a change to .run (its lines = incident paths, or 'live') also triggers a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 300     # a backfill run pulls and classifies weeks of posts; progress is committed even if this is hit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Oct 29, 2026: the Railway bucket is no longer used. The client trackers' stores are small and live in git
      # (data/<slug>.sqlite, force-added below); the older statewide stores stay in the bucket, untouched.

      - name: Pick the incidents
        id: pick
        run: |
          # a tracker with `paused: true` in its YAML keeps its pages but is left out of the scheduled runs
          unpaused() { for f in "$@"; do grep -q '^paused: true' "$f" || printf '%s ' "$f"; done; }
          RACES="$(unpaused $(ls incidents/*-live.yaml | grep -v '/issue-'))"
          ISSUES="$(unpaused $(ls incidents/issue-*-live.yaml 2>/dev/null))"
          LIVE="$RACES $ISSUES"   # weekly schedule: every unpaused tracker each run
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.incidents }}" ]; then
            INC="${{ github.event.inputs.incidents }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -f .run ]; then
            INC=$(grep -v '^\s*#' .run | grep -v '^\s*$' | grep -v '^budget=' | grep -v '^lookup=' | grep -vx 'brief' | grep -vx 'relabel' | tr '\n' ' ' || true)
            LOOKUP=$(grep -o '^lookup=[0-9,]*' .run | head -1 | cut -d= -f2 || true)       # lookup=<id,id>: print those posts (text, counts, links) in the log
            BUDGET=$(grep -o '^budget=[0-9]*' .run | head -1 | cut -d= -f2 || true)     # a backfill run can ask for a longer pull per incident
            grep -qx 'brief' .run && BRIEF=true || true                                  # a line saying `brief` writes the weekly brief this run
            grep -qx 'relabel' .run && RELABEL=--relabel || true                         # a line saying `relabel` re-sorts every stored post (after a subject or lane edit)
            case " $INC " in *" live "*) INC="$LIVE $(echo " $INC " | sed 's/ live / /g')";; esac
          fi
          case " $INC " in *" none "*) INC="";; *) INC="${INC:-$LIVE}";; esac
          echo "incidents=$INC" >> "$GITHUB_OUTPUT"
          echo "budget=${BUDGET:-780}" >> "$GITHUB_OUTPUT"
          [ "$(date -u +%u%H)" = "111" ] && BRIEF=true || true                          # Monday 11:17 UTC (6:17 AM CT): the weekly brief
          echo "brief=${BRIEF:-false}" >> "$GITHUB_OUTPUT"
          echo "lookup=${LOOKUP:-}" >> "$GITHUB_OUTPUT"
          echo "relabel=${RELABEL:-}" >> "$GITHUB_OUTPUT"
          echo "running: ${INC:-<deploy only>} (pull budget ${BUDGET:-780}s per incident)"
          echo "paused: $(grep -l '^paused: true' incidents/*-live.yaml 2>/dev/null | tr '\n' ' ')"

      - name: Check secrets
        if: ${{ steps.pick.outputs.incidents != '' }}
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$TWITTERAPI_IO_KEY" ] || { echo "::error::TWITTERAPI_IO_KEY secret is not set (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY secret is not set (Settings > Secrets and variables > Actions)"; exit 1; }

      - name: Look up posts named in .run (lookup=<id,id>)
        if: ${{ steps.pick.outputs.lookup != '' }}
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: python run.py lookup "${{ steps.pick.outputs.lookup }}"

      - name: Pull, classify, dedup, export, render (each incident)
        if: ${{ steps.pick.outputs.incidents != '' }}
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}               # optional: a Bluesky account + app password lets the pull sign in (public endpoint 403s datacenter IPs)
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}       # optional: YouTube Data API v3 key; the pull runs once a day per tracker when set
          PULL_BUDGET: ${{ steps.pick.outputs.budget }}     # seconds of pulling per incident per run (780 unless .run says budget=N); a paused pull resumes next run
        run: |
          set +e; FAILED=""; OK=0
          WEEKLY=$([ "$(date -u +%u%H)" = "711" ] && echo 1 || echo 0)   # Sunday 11:17 UTC run: also refresh view counts
          python run.py registry || true      # account reliability from last run's claims, so this run's feature rows can carry it
          python run.py mistruth || true      # the mistruth-at-first-sight model from every verified claim; scores decide half of what gets verified this run
          python run.py growth || true        # the growth model from the feature tables; features() ranks by it once it beats the heuristic, logs it in shadow before
          for inc in ${{ steps.pick.outputs.incidents }}; do
            echo "::group::$inc"
            [ "$WEEKLY" = "1" ] && python run.py refresh-views "$inc"
            if python run.py all "$inc" --budget "$PULL_BUDGET" ${{ steps.pick.outputs.relabel }}; then OK=$((OK+1)); else FAILED="$FAILED $inc"; fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::warning::failed:$FAILED"; fi
          # one failing incident still publishes the others; every incident failing fails the run
          [ "$OK" -gt 0 ] || { echo "::error::every incident failed"; exit 1; }

      - name: Weekly brief
        if: ${{ !cancelled() && steps.pick.outcome == 'success' && steps.pick.outputs.brief == 'true' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python run.py brief || echo "::warning::brief failed"

      - name: Commit the stores and outputs
        if: ${{ always() && steps.pick.outcome == 'success' }}   # save pull progress even on failure or timeout
        run: |
          git config user.name "narrative-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          STORES=""
          for inc in ${{ steps.pick.outputs.incidents }}; do      # only the stores of the trackers this run touched
            f="data/$(basename "$inc" .yaml).sqlite"; [ -f "$f" ] && STORES="$STORES $f"
          done
          git add out/ incidents/ data/features/ data/usage.csv 2>/dev/null || true
          [ -n "$STORES" ] && git add -f $STORES
          git diff --cached --quiet || git commit -m "pull $(date -u +%Y-%m-%dT%H:%MZ)"
          # binary stores can't merge: on conflict keep this run's version (the newest pull)
          git pull --rebase -X theirs --autostash origin "${{ github.ref_name }}" || { git rebase --abort 2>/dev/null; git reset --hard "origin/${{ github.ref_name }}"; echo "::warning::could not rebase; this run's data was not pushed"; exit 0; }
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Assemble site
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          mkdir -p site
          python -m tracker.status site || true
          python run.py accounts --all || true
          python run.py mistruth || true       # refresh the verify-first queue from this run's verdicts (the hub and insights read it)
          python run.py growth || true         # refresh the growth model report with this run's outcomes (insights section 12)
          python run.py insights || true       # cross-tracker correlations page, from out/ and the feature tables
          python run.py clients || true        # the client desk, from incidents/clients.yaml and the trackers' outputs
          python -m tracker.site site      # copies every tracker's pages, puts the navigation bar on each, builds the hub

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        with:
          path: site

      - id: deployment
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        uses: actions/deploy-pages@v4
