name: Pull and publish

on:
  schedule:
    - cron: "17 5,11,17,23 * * *"   # 12:17a, 6:17a, 12:17p, 6:17p CT — early warning needs more than one look a day
  workflow_dispatch:            # run it by hand from the Actions tab
    inputs:
      incidents:
        description: "Space-separated incident YAMLs (default: every incidents/*-live.yaml)"
        default: ""
  push:
    paths: [".run"]             # committing a change to .run (its lines = incident paths, or 'live') also triggers a run

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pick the incidents
        id: pick
        run: |
          LIVE="$(ls incidents/*-live.yaml | grep -v '/issue-' | tr '\n' ' ') $(ls incidents/issue-*-live.yaml 2>/dev/null | tr '\n' ' ')"   # candidates first, issues after
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.incidents }}" ]; then
            INC="${{ github.event.inputs.incidents }}"
          elif [ "${{ github.event_name }}" = "push" ] && [ -f .run ]; then
            INC=$(grep -v '^\s*#' .run | grep -v '^\s*$' | tr '\n' ' ' || true)
            case " $INC " in *" live "*) INC="$LIVE $(echo " $INC " | sed 's/ live / /g')";; esac
          fi
          INC="${INC:-$LIVE}"
          echo "incidents=$INC" >> "$GITHUB_OUTPUT"
          echo "running: $INC"

      - name: Check secrets
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          [ -n "$TWITTERAPI_IO_KEY" ] || { echo "::error::TWITTERAPI_IO_KEY secret is not set (Settings > Secrets and variables > Actions)"; exit 1; }
          [ -n "$ANTHROPIC_API_KEY" ] || { echo "::error::ANTHROPIC_API_KEY secret is not set (Settings > Secrets and variables > Actions)"; exit 1; }

      - name: Pull, classify, dedup, export, render (each incident)
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PULL_BUDGET: "780"     # seconds of pulling per incident per run; a paused pull resumes next run
        run: |
          set +e; FAILED=""; OK=0
          for inc in ${{ steps.pick.outputs.incidents }}; do
            echo "::group::$inc"
            if python run.py all "$inc" --budget "$PULL_BUDGET"; then OK=$((OK+1)); else FAILED="$FAILED $inc"; fi
            echo "::endgroup::"
          done
          if [ -n "$FAILED" ]; then echo "::warning::failed:$FAILED"; fi
          # one failing incident still publishes the others; every incident failing fails the run
          [ "$OK" -gt 0 ] || { echo "::error::every incident failed"; exit 1; }

      - name: Commit data and output
        if: ${{ always() && steps.pick.outcome == 'success' }}   # save pull progress even on failure or timeout
        run: |
          git config user.name "narrative-tracker bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ out/ incidents/
          git diff --cached --quiet || git commit -m "pull $(date -u +%Y-%m-%dT%H:%MZ)"
          # binary stores can't merge: on conflict keep this run's version (the newest pull)
          git pull --rebase -X theirs --autostash origin "${{ github.ref_name }}" || { git rebase --abort 2>/dev/null; git reset --hard "origin/${{ github.ref_name }}"; echo "::warning::could not rebase; this run's data was not pushed"; exit 0; }
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Assemble site
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        env:
          TWITTERAPI_IO_KEY: ${{ secrets.TWITTERAPI_IO_KEY }}
        run: |
          mkdir -p site
          python -m tracker.status site || true
          python run.py accounts --all || true
          for d in out/*/; do
            slug=$(basename "$d")
            [ -f "$d/index.html" ] || continue
            mkdir -p "site/$slug" && cp "$d/index.html" "site/$slug/index.html"
            [ -f "$d/accounts.html" ] && cp "$d/accounts.html" "site/$slug/accounts.html"
            [ -f "$d/analysis.html" ] && cp "$d/analysis.html" "site/$slug/analysis.html"
            [ -f "$d/review.html" ] && cp "$d/review.html" "site/$slug/review.html"
          done
          python -m tracker.hub site

      - uses: actions/configure-pages@v5
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        with:
          path: site

      - id: deployment
        if: ${{ !cancelled() && steps.pick.outcome == 'success' }}
        uses: actions/deploy-pages@v4
